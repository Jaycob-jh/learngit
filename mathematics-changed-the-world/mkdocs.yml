site_name: 数学如何改变世界
site_description: 数学思想史 × 核心原理 × 现实应用 × Python 实验
theme:
  name: material
  language: zh

markdown_extensions:
  - admonition
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首页: index.md
  - 学习路线: learning-paths.md
  - 知识图谱: knowledge-graph.md
  - 课程体系:
      - 北大最优化体系（文再文）: courses/optimization-pku-wenzw.md
      - optbook 电子讲义索引: courses/optimization-pku-wenzw-lectures.md
      - 系统学习路线: courses/optimization-pku-wenzw-study-roadmap.md
      - 学习单元:
          - 01 基础语言: courses/optimization-pku-wenzw-study-units/01-foundations.md
          - 02 优化建模: courses/optimization-pku-wenzw-study-units/02-modeling.md
  - 九个核心:
      - 01 微积分: core/01-calculus.md
      - 02 Taylor: core/02-taylor.md
      - 03 Euler: core/03-euler.md
      - 04 Fourier: core/04-fourier.md
      - 05 散度定理: core/05-divergence.md
      - 06 留数定理: core/06-residue.md
      - 07 Bayes: core/07-bayes.md
      - 08 素数与 Riemann: core/08-prime-number-theorem.md
      - 09 Lebesgue: core/09-lebesgue.md
  - 数学主干:
      - 拓扑: branches/01-topology.md
      - 微分几何: branches/02-differential-geometry.md
      - 泛函分析: branches/03-functional-analysis.md
      - 图论: branches/04-graph-theory.md
      - 博弈论: branches/05-game-theory.md
      - 控制论: branches/06-control-theory.md
      - 小波: branches/07-wavelets.md
      - 随机过程: branches/08-stochastic-processes.md
      - 数值分析: branches/09-numerical-analysis.md
      - Transformer 数学: branches/10-transformer-math.md
      - 复数: branches/11-complex-numbers.md
      - 线性代数: branches/12-linear-algebra.md
      - 微分方程: branches/13-differential-equations.md
      - 非欧几何: branches/14-non-euclidean-geometry.md
      - 群论与对称: branches/15-group-symmetry.md
      - 信息论: branches/16-information-theory.md
      - 可计算性: branches/17-computability.md
      - 混沌: branches/18-chaos.md
      - 凸优化: branches/19-convex-optimization.md
      - 概率论: branches/20-probability.md
  - 历史时间线: 03-timeline-applications.md
  - 核心参考: 04-references.md
  - 现代参考: 05-modern-references.md
