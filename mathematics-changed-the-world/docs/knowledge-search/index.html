xt":"## 3. 为什么定理会成立？\n\n把一个大区域切成很多小盒子。\n\n每个小盒子都有六个面。两个相邻盒子共享的内部面：\n\n- 对左盒子是“向外”；\n- 对右盒子却是“向内”。\n\n因此内部面通量两两抵消。最终只剩整个区域最外层的边界。\n\n这就是“局部守恒累积成全局守恒”的几何原因。\n","resources":[]},{"heading":"4. 它与微积分基本定理是一回事吗？","line":59,"end":86,"text":"## 4. 它与微积分基本定理是一回事吗？\n\n在结构上非常接近。\n\n一维：\n\n$$\n\\int_a^b f'(x)\\,dx=f(b)-f(a).\n$$\n\n三维：\n\n$$\n\\int_{\\Omega}\\nabla\\cdot F\n\\mathrel{=}\n\\int_{\\partial\\Omega}F\\cdot n.\n$$\n\n更高层次上，Green 定理、Stokes 定理、散度定理都可以统一进广义 Stokes 定理：\n\n$$\n\\int_M d\\omega\n\\mathrel{=}\n\\int_{\\partial M}\\omega.\n$$\n\n这条结构是现代微分几何的重要桥梁。\n","resources":[]},{"heading":"5. 历史为什么不能只写“高斯定理”？","line":87,"end":92,"text":"## 5. 历史为什么不能只写“高斯定理”？\n\n今天它常叫 Gauss theorem、Gauss–Ostrogradsky theorem 或 divergence theorem。\n\n历史上二维 Green 定理、Gauss 对三维特殊形式的工作、Ostrogradsky 的推广以及更早的流体/力学研究共同构成了发展脉络。数学定理的形成经常不是某一天由单一人物完整写出。\n","resources":[]},{"heading":"6. 现实应用 › 电磁学","line":95,"end":103,"text":"### 电磁学\nGauss law：\n\n$$\n\\nabla\\cdot\\mathbf E=\\rho/\\varepsilon_0\n$$\n\n积分后把体内电荷与边界电通量联系起来。\n","resources":[]},{"heading":"6. 现实应用 › 流体","line":104,"end":106,"text":"### 流体\n质量守恒可以从积分形式转成局部连续性方程。\n","resources":[]},{"heading":"6. 现实应用 › 热传导","line":107,"end":109,"text":"### 热传导\n控制体积方法通过边界热流和内部能量变化建立数值模型。\n","resources":[]},{"heading":"6. 现实应用 › CFD / 有限体积法","line":110,"end":112,"text":"### CFD / 有限体积法\n工程软件把空间分成许多 control volume，直接利用“流入 - 流出 = 内部变化”。\n","resources":[]},{"heading":"7. 一个重要思想：积分形式 vs 微分形式","line":113,"end":121,"text":"## 7. 一个重要思想：积分形式 vs 微分形式\n\n物理定律常有两种写法：\n\n- **积分形式**：适合控制体积、全局守恒；\n- **微分形式**：适合描述每一点的局部变化。\n\n散度定理负责在二者之间转换。\n","resources":[]},{"heading":"8. 动手实验","line":122,"end":129,"text":"## 8. 动手实验\n\n\\`\\`\\`bash\npython labs/05_divergence_flux.py\n\\`\\`\\`\n\n示例使用二维向量场做可视化类比：比较内部离散散度求和和边界通量。\n","resources":[]},{"heading":"参考","line":130,"end":134,"text":"## 参考\n\n- Encyclopedia of Mathematics, Divergence theorem: https://encyclopediaofmath.org/wiki/Divergence_theorem\n- Spivak, *Calculus on Manifolds*.\n- Griffiths, *Introduction to Electrodynamics*.","resources":[{"label":"https://encyclopediaofmath.org/wiki/Divergence_theorem","url":"https://encyclopediaofmath.org/wiki/Divergence_theorem"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/core/05-divergence.md"},{"path":"mathematics-changed-the-world/docs/core/06-residue.md","module":"九个核心专题","role":"数学专题","title":"06｜留数定理：为什么一整圈积分只“读取”奇点附近的一个系数","sections":[{"heading":"06｜留数定理：为什么一整圈积分只“读取”奇点附近的一个系数","line":1,"end":4,"text":"# 06｜留数定理：为什么一整圈积分只“读取”奇点附近的一个系数\n\n> **一句话**：复函数沿闭曲线的积分，在许多情况下由曲线内部少数奇点决定，而每个奇点只需要读取 Laurent 展开的 $(z-z_0)^{-1}$ 系数。\n","resources":[]},{"heading":"1. 从 Cauchy 定理开始","line":5,"end":20,"text":"## 1. 从 Cauchy 定理开始\n\n若 $f(z)$ 在闭曲线 $\\gamma$ 及其内部全纯，则\n\n$$\n\\oint_\\gamma f(z)\\,dz=0.\n$$\n\n这件事与实变积分的直觉非常不同。复可微比实可微强得多；全纯函数受到极强约束。\n\n于是自然问题变成：\n\n> 闭路积分什么时候不为零？\n\n答案往往是：曲线内部出现了奇点。\n","resources":[]},{"heading":"2. Laurent 展开","line":21,"end":40,"text":"## 2. Laurent 展开\n\n在孤立奇点 $z_0$ 附近，函数可能写成\n\n$$\nf(z)=\n\\cdots+\n\\frac{a_{-2}}{(z-z_0)^2}\n+\n\\frac{a_{-1}}{z-z_0}\n+\na_0+a_1(z-z_0)+\\cdots.\n$$\n\n系数 $a_{-1}$ 就叫\n\n$$\n\\operatorname{Res}(f,z_0).\n$$\n","resources":[]},{"heading":"3. 为什么只有 $a_{-1}$ 留下来？","line":41,"end":60,"text":"## 3. 为什么只有 $a_{-1}$ 留下来？\n\n沿小圆 $z-z_0=re^{i\\theta}$：\n\n$$\n\\oint (z-z_0)^n dz.\n$$\n\n除了 $n=-1$ 外，其余整数次幂的闭路积分都为 0；而\n\n$$\n\\oint\\frac{dz}{z-z_0}\n\\mathrel{=}\n2\\pi i.\n$$\n\n因此一整串 Laurent 系数中，闭路积分只“读取” $a_{-1}$。\n\n这就是“留数”一词非常形象的地方：复杂局部结构经过积分后，真正留下的是一个系数。\n","resources":[]},{"heading":"4. 留数定理","line":61,"end":74,"text":"## 4. 留数定理\n\n若闭曲线内部的孤立奇点为 $z_1,\\dots,z_m$：\n\n$$\n\\oint_\\gamma f(z)\\,dz\n\\mathrel{=}\n2\\pi i\n\\sum_{k=1}^{m}\n\\operatorname{Res}(f,z_k).\n$$\n\n这是一种极强的局部—全局关系。\n","resources":[]},{"heading":"5. 如何算留数？ › 简单极点","line":77,"end":94,"text":"### 简单极点\n\n若\n\n$$\nf(z)=\\frac{g(z)}{h(z)},\n\\quad\nh(z_0)=0,\\quad h'(z_0)\\ne0,\n$$\n\n则\n\n$$\n\\operatorname{Res}(f,z_0)\n\\mathrel{=}\n\\frac{g(z_0)}{h'(z_0)}.\n$$\n","resources":[]},{"heading":"5. 如何算留数？ › $m$ 阶极点","line":95,"end":105,"text":"### $m$ 阶极点\n\n$$\n\\operatorname{Res}(f,z_0)\n\\mathrel{=}\n\\frac{1}{(m-1)!}\n\\lim_{z\\to z_0}\n\\frac{d^{m-1}}{dz^{m-1}}\n\\left[(z-z_0)^m f(z)\\right].\n$$\n","resources":[]},{"heading":"6. 一个经典用途：算实积分","line":106,"end":135,"text":"## 6. 一个经典用途：算实积分\n\n例如\n\n$$\n\\int_{-\\infty}^{\\infty}\\frac{dx}{x^2+1}.\n$$\n\n把实变量 $x$ 扩展到复平面，考虑\n\n$$\nf(z)=\\frac{1}{z^2+1}\n\\mathrel{=}\n\\frac{1}{(z-i)(z+i)}.\n$$\n\n上半平面只有极点 $z=i$。其留数为\n\n$$\n\\operatorname{Res}(f,i)=\\frac{1}{2i}.\n$$\n\n于是半圆轮廓积分给出\n\n$$\n2\\pi i\\cdot\\frac{1}{2i}=\\pi.\n$$\n\n实轴积分因此等于 $\\pi$。\n","resources":[]},{"heading":"7. 现实应用","line":136,"end":146,"text":"## 7. 现实应用\n\n- Fourier / Laplace 逆变换；\n- 线性系统的 poles 与稳定性；\n- Green function；\n- 波传播与辐射条件；\n- 量子场论中的 contour integration；\n- 统计物理配分函数的渐近分析。\n\n尤其在系统理论里，“极点”并不只是抽象奇点，它常直接决定系统的衰减、振荡和稳定性。\n","resources":[]},{"heading":"8. 常见误解","line":147,"end":154,"text":"## 8. 常见误解\n\n**留数不是奇点处的函数值。**  \n函数在奇点处往往根本没有普通意义下的值。\n\n**不是所有复积分都该用留数。**  \n留数定理适用于闭合轮廓和合适解析结构；选轮廓本身往往才是技巧所在。\n","resources":[]},{"heading":"9. 动手实验","line":155,"end":168,"text":"## 9. 动手实验\n\n\\`\\`\\`bash\npython labs/06_residue_numeric.py\n\\`\\`\\`\n\n脚本用数值积分沿圆周计算\n\n$$\n\\oint \\frac{dz}{z-z_0}\n$$\n\n并观察其趋近 $2\\pi i$。\n","resources":[]},{"heading":"10. 向外延伸","line":169,"end":172,"text":"## 10. 向外延伸\n\nEuler 公式 → Fourier → 复分析 → 留数 → Laplace / transfer function / Green function。\n","resources":[]},{"heading":"参考","line":173,"end":177,"text":"## 参考\n\n- MacTutor, Cauchy's theorem: https://mathshistory.st-andrews.ac.uk/Diagrams/CauchyTheorem/\n- Ahlfors, *Complex Analysis*.\n- Stein & Shakarchi, *Complex Analysis*.","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/Diagrams/CauchyTheorem/","url":"https://mathshistory.st-andrews.ac.uk/Diagrams/CauchyTheorem/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/core/06-residue.md"},{"path":"mathematics-changed-the-world/docs/core/07-bayes.md","module":"九个核心专题","role":"数学专题","title":"07｜Bayes 公式：把“看到新证据后该怎么改主意”写成数学","sections":[{"heading":"07｜Bayes 公式：把“看到新证据后该怎么改主意”写成数学","line":1,"end":4,"text":"# 07｜Bayes 公式：把“看到新证据后该怎么改主意”写成数学\n\n> **一句话**：Bayes 定理不是“相信主观先验”，而是一条条件概率恒等式；Bayesian inference 则把它扩展成持续更新不确定性的建模框架。\n","resources":[]},{"heading":"1. 从条件概率直接推导","line":5,"end":36,"text":"## 1. 从条件概率直接推导\n\n定义：\n\n$$\nP(A|B)=\\frac{P(A\\cap B)}{P(B)},\n$$\n\n$$\nP(B|A)=\\frac{P(A\\cap B)}{P(A)}.\n$$\n\n所以\n\n$$\nP(A\\cap B)\n\\mathrel{=}\nP(B|A)P(A)\n\\mathrel{=}\nP(A|B)P(B).\n$$\n\n整理得\n\n$$\nP(A|B)\n\\mathrel{=}\n\\frac{P(B|A)P(A)}{P(B)}.\n$$\n\n公式本身并不神秘；真正困难的是如何建立合理模型、选择变量以及计算高维后验。\n","resources":[]},{"heading":"2. 历史脉络","line":37,"end":44,"text":"## 2. 历史脉络\n\nThomas Bayes 的相关论文在他去世后由 Richard Price 整理发表，讨论从观察结果反推未知概率的问题。\n\nPierre-Simon Laplace 随后大幅推广“逆概率”方法，把它应用到天文学、人口统计和误差问题。现代 Bayesian inference 因此不能简单写成“Bayes 一个人创建了一整套现代统计”。\n\n20 世纪概率论经 Kolmogorov 测度公理化后，条件概率、随机变量和期望获得严格统一基础。\n","resources":[]},{"heading":"3. 统计版本","line":45,"end":69,"text":"## 3. 统计版本\n\n参数 $\\theta$，数据 $D$：\n\n$$\np(\\theta|D)\n\\mathrel{=}\n\\frac{p(D|\\theta)p(\\theta)}{p(D)}.\n$$\n\n通常写成\n\n$$\n\\text{posterior}\n\\propto\n\\text{likelihood}\\times\\text{prior}.\n$$\n\n其中：\n\n- prior：观察当前数据前对参数的不确定性；\n- likelihood：不同参数产生当前数据的能力；\n- posterior：结合数据后的更新结果；\n- evidence：归一化常数，同时在模型比较中很重要。\n","resources":[]},{"heading":"4. 为什么医学检测最能体现它？","line":70,"end":96,"text":"## 4. 为什么医学检测最能体现它？\n\n假设：\n\n- 患病率 1%；\n- 灵敏度 99%；\n- 特异度 95%。\n\n即便测试很“灵敏”，阳性后患病概率仍不是 99%。\n\n$$\nP(D|+)\n\\mathrel{=}\n\\frac{P(+|D)P(D)}\n{P(+|D)P(D)+P(+|\\neg D)P(\\neg D)}.\n$$\n\n代入：\n\n$$\n\\frac{0.99\\times0.01}\n{0.99\\times0.01+0.05\\times0.99}\n\\approx16.7\\%.\n$$\n\n原因是基准率很低，大量健康人中的少数假阳性也会形成可观数量。\n","resources":[]},{"heading":"5. 顺序更新","line":97,"end":110,"text":"## 5. 顺序更新\n\nBayesian 方法天然适合连续学习。\n\n第一批数据得到 posterior 后，它可以作为下一批数据的 prior：\n\n$$\np(\\theta|D_1,D_2)\n\\propto\np(D_2|\\theta)p(\\theta|D_1).\n$$\n\n这让“学习”成为数学上的信息累积。\n","resources":[]},{"heading":"6. 共轭先验：为什么有些 Bayes 可以手算？","line":111,"end":135,"text":"## 6. 共轭先验：为什么有些 Bayes 可以手算？\n\n若\n\n$$\np\\sim\\operatorname{Beta}(\\alpha,\\beta),\n$$\n\n观察 Bernoulli 数据中成功 $s$ 次、失败 $f$ 次，则\n\n$$\np|D\n\\sim\n\\operatorname{Beta}(\\alpha+s,\\beta+f).\n$$\n\n后验仍属于 Beta family，这叫 conjugacy。\n\n现代复杂模型往往不再有解析后验，需要：\n\n- MCMC；\n- variational inference；\n- sequential Monte Carlo；\n- Laplace approximation。\n","resources":[]},{"heading":"7. 现实应用","line":136,"end":146,"text":"## 7. 现实应用\n\n- 医疗诊断；\n- 传感器融合和机器人定位；\n- A/B testing；\n- 科学参数估计；\n- Gaussian processes；\n- Bayesian neural networks；\n- 风险分析与决策；\n- spam filtering 和分类。\n","resources":[]},{"heading":"8. 与机器学习的关系","line":147,"end":167,"text":"## 8. 与机器学习的关系\n\n监督学习常求\n\n$$\n\\theta_{\\text{MLE}}\n\\mathrel{=}\n\\arg\\max_\\theta p(D|\\theta).\n$$\n\n若加入 prior：\n\n$$\n\\theta_{\\text{MAP}}\n\\mathrel{=}\n\\arg\\max_\\theta\np(D|\\theta)p(\\theta).\n$$\n\n许多正则化可以解释成 MAP 中的先验结构。例如高斯 prior 常对应 $L_2$ penalty。\n","resources":[]},{"heading":"9. 常见误解","line":168,"end":178,"text":"## 9. 常见误解\n\n**先验不等于随便猜。**  \n它可以来自历史数据、物理约束、层级模型或弱信息分布。\n\n**Bayes 不能自动消除模型错误。**  \n若 likelihood 建模错了，后验也可能非常自信地错。\n\n**Bayesian 不等于永远比 frequentist 好。**  \n两套框架解决问题的哲学和工具不同，具体方法应按任务选择。\n","resources":[]},{"heading":"10. 动手实验","line":179,"end":186,"text":"## 10. 动手实验\n\n\\`\\`\\`bash\npython labs/07_bayes_update.py\n\\`\\`\\`\n\n观察抛硬币数据一批批进入后，Beta posterior 如何逐渐集中。\n","resources":[]},{"heading":"参考","line":187,"end":191,"text":"## 参考\n\n- MacTutor, Thomas Bayes: https://mathshistory.st-andrews.ac.uk/Biographies/Bayes/\n- MacTutor, Laplace: https://mathshistory.st-andrews.ac.uk/Biographies/Laplace/\n- Gelman et al., *Bayesian Data Analysis*.","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Bayes/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Bayes/"},{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Laplace/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Laplace/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/core/07-bayes.md"},{"path":"mathematics-changed-the-world/docs/core/08-prime-number-theorem.md","module":"九个核心专题","role":"数学专题","title":"08｜对数积分、素数定理与 Riemann：无规则的素数为什么有统计规律","sections":[{"heading":"08｜对数积分、素数定理与 Riemann：无规则的素数为什么有统计规律","line":1,"end":4,"text":"# 08｜对数积分、素数定理与 Riemann：无规则的素数为什么有统计规律\n\n> **一句话**：单个素数出现得像“不规则事件”，但整体密度却高度规律；解析数论的重大突破是把整数问题转换为复函数问题。\n","resources":[]},{"heading":"1. 素数最早的问题不是“分布”，而是“有多少”","line":5,"end":42,"text":"## 1. 素数最早的问题不是“分布”，而是“有多少”\n\nEuclid 早已证明素数有无穷多个。\n\n但更难的问题是：\n\n> 小于 $x$ 的素数到底有多少？\n\n定义\n\n$$\n\\pi(x)=\\#\\{p\\le x:p\\text{ 是素数}\\}.\n$$\n\nGauss、Legendre 等通过计算观察到\n\n$$\n\\pi(x)\n\\approx\n\\frac{x}{\\log x}\n$$\n\n以及更精细的\n\n$$\n\\pi(x)\\approx \\operatorname{li}(x),\n$$\n\n其中\n\n$$\n\\operatorname{li}(x)\n\\mathrel{=}\n\\operatorname{PV}\\int_0^x\\frac{dt}{\\log t}\n$$\n\n需注意 $t=1$ 的奇点，严格定义要做适当处理。\n","resources":[]},{"heading":"2. 素数定理说的是什么？","line":43,"end":64,"text":"## 2. 素数定理说的是什么？\n\n$$\n\\pi(x)\\sim\\frac{x}{\\log x},\n$$\n\n意思是\n\n$$\n\\lim_{x\\to\\infty}\n\\frac{\\pi(x)}\n{x/\\log x}\n\\mathrel{=}\n1.\n$$\n\n这不是说每个区间都平均分布，而是说在非常大的尺度上，素数密度大约为\n\n$$\n\\frac{1}{\\log x}.\n$$\n","resources":[]},{"heading":"3. Euler 的关键桥梁","line":65,"end":89,"text":"## 3. Euler 的关键桥梁\n\nEuler 发现 zeta function 的乘积结构：\n\n$$\n\\zeta(s)\n\\mathrel{=}\n\\sum_{n=1}^{\\infty}\\frac1{n^s}\n\\mathrel{=}\n\\prod_{p}\n\\frac{1}{1-p^{-s}}\n\\quad\n(\\Re s>1).\n$$\n\n左边对所有正整数求和，右边却对所有素数做乘积。\n\n这就是解析数论最深刻的原型之一：\n\n$$\n\\text{整数加法结构}\n\\longleftrightarrow\n\\text{素数乘法结构}.\n$$\n","resources":[]},{"heading":"4. Riemann 1859：把素数放进复平面","line":90,"end":99,"text":"## 4. Riemann 1859：把素数放进复平面\n\nRiemann 研究 $\\zeta(s)$ 在复平面的解析延拓和零点，并建立素数计数与这些零点之间的联系。\n\n这一步的思想极具代表性：\n\n> 为了理解整数里的离散结构，把问题搬到连续的复分析世界里。\n\nHadamard 和 de la Vallée Poussin 于 1896 年独立证明素数定理，关键是证明 zeta 在 $\\Re s=1$ 上没有零点。\n","resources":[]},{"heading":"5. Riemann 假设究竟控制什么？","line":100,"end":121,"text":"## 5. Riemann 假设究竟控制什么？\n\n非平凡零点写成\n\n$$\n\\rho=\\beta+i\\gamma.\n$$\n\nRiemann hypothesis 猜测：\n\n$$\n\\beta=\\frac12\n$$\n\n对所有非平凡零点成立。\n\n它不是“证明素数有规律”——素数定理已经做到了。RH 更深地约束：\n\n> $\\pi(x)$ 围绕主趋势波动得有多厉害。\n\n也就是控制素数分布误差项。\n","resources":[]},{"heading":"6. 为什么 $\\operatorname{li}(x)$ 往往比 $x/\\log x$ 更准？","line":122,"end":139,"text":"## 6. 为什么 $\\operatorname{li}(x)$ 往往比 $x/\\log x$ 更准？\n\n直觉上素数在尺度 $t$ 附近的“局部密度”约为\n\n$$\n\\frac1{\\log t}.\n$$\n\n把这种密度从 2 累积到 $x$：\n\n$$\n\\int_2^x\\frac{dt}{\\log t},\n$$\n\n自然得到对数积分近似。\n\n这与“局部密度累积成总数量”的微积分思想遥相呼应。\n","resources":[]},{"heading":"7. 与密码学的真实关系","line":140,"end":153,"text":"## 7. 与密码学的真实关系\n\nRSA 确实需要大素数，但不能简单说：\n\n> “RSA 是素数定理的直接应用。”\n\n更准确：\n\n- 素数定理告诉我们大数附近素数的平均密度，因此随机找到素数并不会极端困难；\n- 实际密钥生成依赖高效 primality testing；\n- RSA 安全性主要关联大整数分解困难性，而不是“素数稀少”。\n\n椭圆曲线密码学又使用了另一套代数与数论结构。\n","resources":[]},{"heading":"8. 动手实验","line":154,"end":169,"text":"## 8. 动手实验\n\n\\`\\`\\`bash\npython labs/08_prime_counting.py\n\\`\\`\\`\n\n比较：\n\n$$\n\\pi(x),\\qquad\nx/\\log x,\\qquad\n\\operatorname{li}(x)\n$$\n\n随 $x$ 增大时的逼近效果。\n","resources":[]},{"heading":"9. 向外延伸","line":170,"end":173,"text":"## 9. 向外延伸\n\n素数 → Euler product → complex analysis → Riemann zeta → spectral ideas → analytic number theory。\n","resources":[]},{"heading":"参考","line":174,"end":179,"text":"## 参考\n\n- MacTutor, Prime numbers: https://mathshistory.st-andrews.ac.uk/HistTopics/Prime_numbers/\n- Clay Mathematics Institute, Riemann manuscript: https://www.claymath.org/collections/riemanns-1859-manuscript/\n- Clay Mathematics Institute, Riemann Hypothesis: https://www.claymath.org/millennium/Riemann-Hypothesis/\n- Apostol, *Introduction to Analytic Number Theory*.","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/HistTopics/Prime_numbers/","url":"https://mathshistory.st-andrews.ac.uk/HistTopics/Prime_numbers/"},{"label":"https://www.claymath.org/collections/riemanns-1859-manuscript/","url":"https://www.claymath.org/collections/riemanns-1859-manuscript/"},{"label":"https://www.claymath.org/millennium/Riemann-Hypothesis/","url":"https://www.claymath.org/millennium/Riemann-Hypothesis/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/core/08-prime-number-theorem.md"},{"path":"mathematics-changed-the-world/docs/core/09-lebesgue.md","module":"九个核心专题","role":"数学专题","title":"09｜Lebesgue 单调收敛定理：什么时候“先取极限再积分”等于“先积分再取极限”","sections":[{"heading":"09｜Lebesgue 单调收敛定理：什么时候“先取极限再积分”等于“先积分再取极限”","line":1,"end":4,"text":"# 09｜Lebesgue 单调收敛定理：什么时候“先取极限再积分”等于“先积分再取极限”\n\n> **一句话**：现代分析的难点常常不是把某个积分算出来，而是证明无穷极限、求和、积分这些操作能否安全交换。\n","resources":[]},{"heading":"1. Fourier 把旧积分理论逼到了边界","line":5,"end":22,"text":"## 1. Fourier 把旧积分理论逼到了边界\n\n19 世纪的分析越来越多地遇到：\n\n- 不连续函数；\n- 函数列；\n- Fourier series；\n- pointwise limit；\n- 无穷求和和积分交换。\n\nRiemann 积分非常成功，但对于“坏函数”和极限问题不够灵活。\n\nLebesgue 的革命性想法可以粗略描述为：\n\n> 与其按 $x$-轴把定义域切成小区间，不如研究函数取值落在哪些集合上，并给这些集合赋予“大小”。\n\n于是 measure theory 与 Lebesgue integration 结合起来。\n","resources":[]},{"heading":"2. 从简单函数开始","line":23,"end":45,"text":"## 2. 从简单函数开始\n\n若\n\n$$\n\\phi\n\\mathrel{=}\n\\sum_{k=1}^{m}a_k\\mathbf 1_{E_k},\n\\qquad a_k\\ge0,\n$$\n\n定义\n\n$$\n\\int\\phi\\,d\\mu\n\\mathrel{=}\n\\sum_{k=1}^{m}a_k\\mu(E_k).\n$$\n\n对一般非负可测函数 $f$，用越来越好的简单函数从下方逼近，定义其积分为这些简单积分的 supremum。\n\n因此 Lebesgue 积分天生适合“单调逼近”。\n","resources":[]},{"heading":"3. 单调收敛定理","line":46,"end":74,"text":"## 3. 单调收敛定理\n\n若\n\n$$\n0\\le f_1\\le f_2\\le\\cdots\n$$\n\n且\n\n$$\nf_n(x)\\to f(x),\n$$\n\n则\n\n$$\n\\int f\\,d\\mu\n\\mathrel{=}\n\\lim_{n\\to\\infty}\n\\int f_n\\,d\\mu.\n$$\n\n常写作\n\n$$\nf_n\\uparrow f.\n$$\n","resources":[]},{"heading":"4. 为什么它如此重要？","line":75,"end":85,"text":"## 4. 为什么它如此重要？\n\n“函数逐点收敛”一般**不足以**推出积分也收敛。\n\nMCT 提供一种非常干净的充分条件：\n\n- 非负；\n- 单调增加。\n\n在这两个条件下，极限可以安全地穿过积分号。\n","resources":[]},{"heading":"5. 与另外两个核心收敛定理 › Fatou lemma","line":88,"end":97,"text":"### Fatou lemma\n\n对非负 $f_n$：\n\n$$\n\\int\\liminf f_n\\,d\\mu\n\\le\n\\liminf\\int f_n\\,d\\mu.\n$$\n","resources":[]},{"heading":"5. 与另外两个核心收敛定理 › Dominated Convergence Theorem","line":98,"end":119,"text":"### Dominated Convergence Theorem\n\n若\n\n$$\nf_n\\to f\n$$\n\n几乎处处，且存在可积 $g$ 使\n\n$$\n|f_n|\\le g,\n$$\n\n则\n\n$$\n\\int f_n\\to\\int f.\n$$\n\n现代分析中这三者是一组极重要工具。\n","resources":[]},{"heading":"6. 为什么概率论本质上是测度论？","line":120,"end":155,"text":"## 6. 为什么概率论本质上是测度论？\n\n现代概率空间写成\n\n$$\n(\\Omega,\\mathcal F,P),\n$$\n\n其中 $P$ 是一个 measure。\n\n随机变量\n\n$$\nX:\\Omega\\to\\mathbb R\n$$\n\n是可测函数，而期望\n\n$$\nE[X]\n\\mathrel{=}\n\\int_\\Omega X\\,dP\n$$\n\n就是 Lebesgue integral。\n\n因此概率论中的：\n\n- 期望；\n- 条件期望；\n- 几乎处处收敛；\n- $L^p$ 收敛；\n- martingale；\n\n都直接生活在测度论语言中。\n","resources":[]},{"heading":"7. 与 Fourier 的深层关系","line":156,"end":169,"text":"## 7. 与 Fourier 的深层关系\n\nFourier 问题迫使数学家研究：\n\n- 什么叫函数相等？\n- 什么叫积分存在？\n- 什么叫级数收敛？\n- 可否逐项积分？\n- 函数空间应该怎样定义距离？\n\n最终形成 $L^1,L^2,L^p$ 空间。尤其 $L^2$ 是 Hilbert space，Fourier analysis 因而可以理解为无限维正交投影。\n\n这直接通向 functional analysis。\n","resources":[]},{"heading":"8. 现实应用","line":170,"end":183,"text":"## 8. 现实应用\n\nLebesgue theory 很少以“某设备直接调用 MCT”的方式出现，它更像基础设施：\n\n- stochastic processes；\n- Bayesian integration；\n- signal theory；\n- PDE weak solutions；\n- Sobolev spaces；\n- quantum mechanics Hilbert spaces；\n- statistical learning theory。\n\n就像操作系统内核：普通用户可能看不见，但高层工具依赖它。\n","resources":[]},{"heading":"9. 常见误解","line":184,"end":191,"text":"## 9. 常见误解\n\n**Lebesgue 积分不是单纯“能积更多奇怪函数”。**  \n更大的优势是极限操作更稳定。\n\n**measure 不等于 length。**  \n概率就是一种 measure；Dirac measure 等对象甚至不对应普通几何长度。\n","resources":[]},{"heading":"10. 动手实验","line":192,"end":199,"text":"## 10. 动手实验\n\n\\`\\`\\`bash\npython labs/09_monotone_convergence.py\n\\`\\`\\`\n\n构造一列从下方逼近目标函数的阶梯函数，观察积分随 $n$ 单调趋近目标积分。\n","resources":[]},{"heading":"11. 向外延伸","line":200,"end":203,"text":"## 11. 向外延伸\n\nLebesgue → $L^p$ spaces → Hilbert/Banach spaces → functional analysis → PDE / probability / quantum theory / wavelets。\n","resources":[]},{"heading":"参考","line":204,"end":208,"text":"## 参考\n\n- MacTutor, Henri Lebesgue: https://mathshistory.st-andrews.ac.uk/Biographies/Lebesgue/\n- Royden & Fitzpatrick, *Real Analysis*.\n- Folland, *Real Analysis*.","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Lebesgue/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Lebesgue/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/core/09-lebesgue.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-lectures.md","module":"最优化课程","role":"课程与讲义","title":"文再文 optbook 电子讲义索引","sections":[{"heading":"文再文 optbook 电子讲义索引","line":1,"end":8,"text":"# 文再文 optbook 电子讲义索引\n\n> 来源状态（2026-09-26）：本页依据用户提供并确认可访问的 optbook 讲义清单建立。ChatGPT 当前网页抓取通道访问 `faculty.bicmr.pku.edu.cn` 时仍可能得到 502 或 timeout，因此**工具侧抓取失败不等同于讲义失效**。\n>\n> 上位课程页：[北大文再文最优化学习体系](optimization-pku-wenzw.md)\n>\n> 目录入口：http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/contents/contents.html\n","resources":[{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/contents/contents.html","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/contents/contents.html"}]},{"heading":"1. 讲义总表","line":9,"end":42,"text":"## 1. 讲义总表\n\n当前收录 **27 个教学主题、33 个 PDF 讲义链接**。同一主题若有“北大课程版 / 简略版 / 合并版”，均保留，不互相覆盖。\n\n| # | 主题 | 协助准备 | 讲义 |\n|---:|---|---|---|\n| 01 | 简介 | 邓展望 | [01-opt-dzw.pdf](http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/01-opt-dzw.pdf) |\n| 02 | 凸集 | 丁思哲 | [02-convex-set.pdf](http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/02-convex-set.pdf) |\n| 03 | 凸函数 | 华奕轩 | [03_functions_newhyx.pdf](http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/03_functions_newhyx.pdf) |\n| 04 | 数值代数基础 | 张轩熙 | [04-num_lin_alg-newl.pdf](http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/04-num_lin_alg-newl.pdf) |\n| 05 | 优化建模 | 华奕轩 | [05-lect1-model.pdf](http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/05-lect1-model.p culty.bicmr.pku.edu.cn/~wenzw/optbook/lect/07-lect-theory1.pdf"},{"label":"07-lect-theory2.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/07-lect-theory2.pdf"},{"label":"08-lect-gradient.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/08-lect-gradient.pdf"},{"label":"09-lect-sg.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/09-lect-sg.pdf"},{"label":"10-lect-sgm.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/10-lect-sgm.pdf"},{"label":"次梯度+算法合并版","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/09-lect-sg-meth.pdf"},{"label":"11-lect-newton.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/11-lect-newton.pdf"},{"label":"13_trustregion_newdzw.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/13_trustregion_newdzw.pdf"},{"label":"牛顿法+信赖域合并版","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/lect-newton-TR.pdf"},{"label":"12-lect-QN.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/12-lect-QN.pdf"},{"label":"14-lsp-new-zxx.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/14-lsp-new-zxx.pdf"},{"label":"15-lect-penalty.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/15-lect-penalty.pdf"},{"label":"16-lect-alm.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/16-lect-alm.pdf"},{"label":"简略版","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/16-lect-alm-pku.pdf"},{"label":"17-lp_ipm-new-zxx-xzl.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/17-lp_ipm-new-zxx-xzl.pdf"},{"label":"18-lect-prox_map.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/18-lect-prox_map.pdf"},{"label":"19-lect-proxg.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/19-lect-proxg.pdf"},{"label":"20-lect-nesterov-ch.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/20-lect-nesterov-ch.pdf"},{"label":"21-lect-prox_point.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/21-lect-prox_point.pdf"},{"label":"22-lect-BCD.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/22-lect-BCD.pdf"},{"label":"简略版","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/22-lect-BCD-pku.pdf"},{"label":"23-lect-DualAlgo.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/23-lect-DualAlgo.pdf"},{"label":"24-lect-admm-chhyx.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/24-lect-admm-chhyx.pdf"},{"label":"25-lect-sto-ch.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/25-lect-sto-ch.pdf"},{"label":"slides-ssm-dzw.pdf","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/slides-ssm-dzw.pdf"},{"label":"简略版","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/lect/slides-ssm-dzw-pku.pdf"}]},{"heading":"2. 与教材章节对齐","line":43,"end":46,"text":"## 2. 与教材章节对齐\n\n建议按教材的知识结构而不是文件编号机械学习。\n","resources":[]},{"heading":"2. 与教材章节对齐 › A. 预备知识与凸分析","line":47,"end":55,"text":"### A. 预备知识与凸分析\n\n- 简介；\n- 凸集；\n- 凸函数；\n- 数值代数基础。\n\n对应教材：第一章、第二章与附录 B。\n","resources":[]},{"heading":"2. 与教材章节对齐 › B. 建模与问题分类","line":56,"end":62,"text":"### B. 建模与问题分类\n\n- 优化建模；\n- 典型优化问题。\n\n对应教材：第三章“优化建模”、第四章“典型优化问题”。\n","resources":[]},{"heading":"2. 与教材章节对齐 › C. 最优性理论","line":63,"end":69,"text":"### C. 最优性理论\n\n- 凸优化最优性理论；\n- 非凸优化最优性理论。\n\n对应教材：第五章。\n","resources":[]},{"heading":"2. 与教材章节对齐 › D. 无约束光滑 / 非光滑算法","line":70,"end":80,"text":"### D. 无约束光滑 / 非光滑算法\n\n- 梯度下降；\n- 次梯度与次梯度算法；\n- Newton；\n- 拟 Newton；\n- 信赖域；\n- 非线性最小二乘。\n\n对应教材：第六章。\n","resources":[]},{"heading":"2. 与教材章节对齐 › E. 约束优化","line":81,"end":88,"text":"### E. 约束优化\n\n- 罚函数；\n- 增广 Lagrangian；\n- 线性规划内点法。\n\n对应教材：第七章。\n","resources":[]},{"heading":"2. 与教材章节对齐 › F. 复合、大规模与随机优化","line":89,"end":102,"text":"### F. 复合、大规模与随机优化\n\n- 近似点算子；\n- 近似点梯度；\n- Nesterov / FISTA；\n- 近似点算法；\n- 分块坐标下降；\n- 对偶算法；\n- ADMM；\n- 随机优化；\n- 半光滑 Newton。\n\n对应教材：第八章及第二版扩展内容。\n","resources":[]},{"heading":"3. 第二版教材对齐提醒","line":103,"end":114,"text":"## 3. 第二版教材对齐提醒\n\n本次用户提供的《最优化：建模、算法与理论》第二版 PDF 前言署于 **2025 年 2 月**。第二版明确说明：\n\n- 新增**流形约束优化**；\n- 新增**半光滑牛顿算法**；\n- 完善代码整理、网页、习题答案与电子教案讲义。\n\n第二版目录还把“流形约束优化算法”列为第 7.4 节，把“半光滑牛顿算法”列为第 8.8 节。\n\n当前这批 27 个讲义主题已经明确包含半光滑 Newton，但**没有单独列出流形约束优化 PDF**。因此自动巡检应把“流形约束优化电子讲义”作为明确的待发现项，而不是自行猜测文件名。\n","resources":[]},{"heading":"4. 推荐学习顺序 › 第一轮：建立可用框架","line":117,"end":130,"text":"### 第一轮：建立可用框架\n\n```text\n简介\n→ 凸集\n→ 凸函数\n→ 数值代数\n→ 优化建模\n→ 典型优化问题\n→ 凸优化最优性理论\n→ 梯度下降\n→ Newton / 拟 Newton / 信赖域\n```\n","resources":[]},{"heading":"4. 推荐学习顺序 › 第二轮：非光滑与复合优化","line":131,"end":144,"text":"### 第二轮：非光滑与复合优化\n\n```text\n次梯度\n→ 次梯度算法\n→ 近似点算子\n→ 近似点梯度\n→ Nesterov / FISTA\n→ 近似点算法\n→ BCD\n→ 对偶\n→ ADMM\n```\n","resources":[]},{"heading":"4. 推荐学习顺序 › 第三轮：约束、随机与高级算法","line":145,"end":157,"text":"### 第三轮：约束、随机与高级算法\n\n```text\n非凸最优性\n→ 非线性最小二乘\n→ 罚函数\n→ 增广 Lagrangian\n→ 线性规划内点法\n→ 随机优化\n→ 半光滑 Newton\n→ （第二版补充）流形约束优化\n```\n","resources":[]},{"heading":"5. 每节学习模板","line":158,"end":171,"text":"## 5. 每节学习模板\n\n每个讲义不只“看完”，至少产出：\n\n1. **问题类**：目标函数与约束长什么样；\n2. **核心假设**：凸性、光滑性、Lipschitz、强凸、约束品性等；\n3. **算法更新式**：写清每一步实际计算；\n4. **收敛结论**：结论成立所需条件；\n5. **复杂度 / 局部速度**：若讲义给出则记录；\n6. **一个数值实验**：Python/NumPy 实现；\n7. **一个失败案例**：破坏关键假设后观察算法表现；\n8. **与教材页码/章节对应**；\n9. **与本知识库已有专题链接**。\n","resources":[]},{"heading":"6. 巡检规则","line":172,"end":183,"text":"## 6. 巡检规则\n\n每小时巡检时优先检查：\n\n- 目录页；\n- 本页 33 个 PDF URL；\n- 是否出现新电子讲义；\n- 是否出现流形约束优化讲义；\n- 现有 PDF 是否发生版本替换或文件名变化；\n- optbook 程序页是否增加与讲义对应的代码。\n\n如果自动抓取通道返回 502/timeout，但 URL 仍由用户确认可以正常访问，则记录“**自动抓取不可达**”，不得自动改成“资源失效”或删除链接。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-lectures.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-master.md","module":"最优化课程","role":"课程与讲义","title":"北京大学文再文最优化资源体系：单文件完整总览（已完成 + 待完成）","sections":[{"heading":"北京大学文再文最优化资源体系：单文件完整总览（已完成 + 待完成）","line":1,"end":13,"text":"# 北京大学文再文最优化资源体系：单文件完整总览（已完成 + 待完成）\n\n> 仓库：Jaycob-jh/math-atlas（原 Jaycob-jh/learngit）\n>\n> 分支：math-changed-world\n>\n> 路径：mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-master.md\n>\n> 整合时间：2026-09-27（UTC+8）\n>\n> 原总览基线提交：bde35947006ea65ce2902830318624ae24869e6d；Unit 06 草稿基于后续 a2edd95976e17072809974c9ec7fdfc92af22f39\n\n","resources":[]},{"heading":"1. 文档定位与证据规则","line":14,"end":17,"text":"## 1. 文档定位与证据规则\n\n这是一份**单文件总览**：把 Unit 01–06、Unit 07–10 的独立页面、电子讲义索引、教材/课程/代码/形式化资源、实验、验收标准和维护规则放在同一份 Markdown 中。Unit 09 三个项目已有来源页码和单一种子的基线/压力运行；Unit 07–08 新脚本与其他来源仍待核验。\n","resources":[]},{"heading":"1. 文档定位与证据规则 › 1.1 当前权威来源","line":18,"end":25,"text":"### 1.1 当前权威来源\n\n- 课程资源总页：docs/courses/optimization-pku-wenzw.md\n- 电子讲义索引：docs/courses/optimization-pku-wenzw-lectures.md\n- 系统路线：docs/courses/optimization-pku-wenzw-study-roadmap.md\n- 已完成 Unit：optimization-pku-wenzw-study-units/01 至 05\n- 第二版教材：用户提供的 opt2.pdf，仅用于结构、版本和内容校核，不重新发布完整 PDF。\n","resources":[]},{"heading":"1. 文档定位与证据规则 › 1.2 关键版本事实","line":26,"end":33,"text":"### 1.2 关键版本事实\n\n第二版《最优化：建模、算法与理论》前言署于 **2025 年 2 月**，已确认新增：\n\n- 流形约束优化；\n- 半光滑 Newton；\n- 更完善的代码整理、网页、习题答案和电子讲义。\n","resources":[]},{"heading":"1. 文档定位与证据规则 › 1.3 访问状态规则","line":34,"end":42,"text":"### 1.3 访问状态规则\n\nfaculty.bicmr.pku.edu.cn 在自动抓取通道可能出现 502 / timeout。对于用户已经确认可访问的具体 optbook 讲义 URL：\n\n- 只记录“自动抓取不可达”；\n- 不判定资源不存在；\n- 不删除 URL；\n- 不根据命名规律猜新文件。\n","resources":[]},{"heading":"1. 文档定位与证据规则 › 1.4 technical-docs 保真规则","line":43,"end":56,"text":"### 1.4 technical-docs 保真规则\n\n继续遵循 Jaycob-jh/editorial-agent-framework：\n\n- Fidelity before fluency；\n- URL、ISBN、课程号、学分、版本、协助准备者严格保护；\n- 必要/充分/充要不能互换；\n- 局部/全局结论不能互换；\n- 理论前提不得在改写时消失；\n- 来源不可读不能改写成来源不存在；\n- 所有待发现资源必须真实页面确认。\n\n\n","resources":[]},{"heading":"2. 资源总入口 › 2.1 教材","line":59,"end":79,"text":"### 2.1 教材\n\n**详细版**\n\n- 刘浩洋、户将、李勇锋、文再文：《最优化：建模、算法与理论》\n- 高等教育出版社\n- ISBN：9787040550351\n\n**简明版**\n\n- 刘浩洋、户将、李勇锋、文再文：《最优化计算方法》\n- ISBN：978-7-04-055841-8\n\n**更新/进阶教材**\n\n- 文再文、袁亚湘：《最优化方法与理论》\n- ISBN：978-7-04-062561-5\n- 高等教育出版社页面记录出版时间：2025-01-16\n- 版次：1\n- 北大 101 计划入口：https://math101.pku.edu.cn/hxjc/qb/3489f4fc70974d0da96ce949939fd3b8.htm\n","resources":[{"label":"https://math101.pku.edu.cn/hxjc/qb/3489f4fc70974d0da96ce949939fd3b8.htm","url":"https://math101.pku.edu.cn/hxjc/qb/3489f4fc70974d0da96ce949939fd3b8.htm"}]},{"heading":"2. 资源总入口 › 2.2 北京大学课程","line":80,"end":99,"text":"### 2.2 北京大学课程\n\n**《最优化方法》**\n\n- https://math.pku.edu.cn/bks/sykc/148761.htm\n- 课程号：00130630\n- 秋季\n- 学分：3\n- 先修：数学分析、数值代数\n- 华文慕课：https://www.chinesemooc.org/web/course_detail.php?courseid=5063\n\n**《大数据分析中的算法》**\n\n- https://math.pku.edu.cn/bks/sykc/148668.htm\n- 课程号：00136720\n- 秋季\n- 学分：3\n- 先修：数学分析、数值代数\n- 华文慕课：https://www.chinesemooc.org/web/course_detail.php?courseid=4974\n","resources":[{"label":"https://math.pku.edu.cn/bks/sykc/148761.htm","url":"https://math.pku.edu.cn/bks/sykc/148761.htm"},{"label":"https://www.chinesemooc.org/web/course_detail.php?courseid=5063","url":"https://www.chinesemooc.org/web/course_detail.php?courseid=5063"},{"label":"https://math.pku.edu.cn/bks/sykc/148668.htm","url":"https://math.pku.edu.cn/bks/sykc/148668.htm"},{"label":"https://www.chinesemooc.org/web/course_detail.php?courseid=4974","url":"https://www.chinesemooc.org/web/course_detail.php?courseid=4974"}]},{"heading":"2. 资源总入口 › 2.3 optbook 入口","line":100,"end":105,"text":"### 2.3 optbook 入口\n\n- 主入口：http://faculty.bicmr.pku.edu.cn/~wenzw/optbook.html\n- 讲义目录：http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/contents/contents.html\n- 程序页：http://bicmr.pku.edu.cn/~wenzw/optbook/pages/index.html\n","resources":[{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook.html","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook.html"},{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/contents/contents.html","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/contents/contents.html"},{"label":"http://bicmr.pku.edu.cn/~wenzw/optbook/pages/index.html","url":"http://bicmr.pku.edu.cn/~wenzw/optbook
