sterov / FISTA；\n- 近似点算法；\n- 分块坐标下降；\n- 对偶算法；\n- ADMM；\n- 随机优化；\n- 半光滑 Newton。\n\n对应教材：第八章及第二版扩展内容。\n","resources":[]},{"heading":"4. 电子讲义完整索引 › 3. 第二版教材对齐提醒","line":257,"end":268,"text":"### 3. 第二版教材对齐提醒\n\n本次用户提供的《最优化：建模、算法与理论》第二版 PDF 前言署于 **2025 年 2 月**。第二版明确说明：\n\n- 新增**流形约束优化**；\n- 新增**半光滑牛顿算法**；\n- 完善代码整理、网页、习题答案与电子教案讲义。\n\n第二版目录还把“流形约束优化算法”列为第 7.4 节，把“半光滑牛顿算法”列为第 8.8 节。\n\n当前这批 27 个讲义主题已经明确包含半光滑 Newton，但**没有单独列出流形约束优化 PDF**。因此自动巡检应把“流形约束优化电子讲义”作为明确的待发现项，而不是自行猜测文件名。\n","resources":[]},{"heading":"4. 电子讲义完整索引 › 4. 推荐学习顺序 › 第一轮：建立可用框架","line":271,"end":284,"text":"#### 第一轮：建立可用框架\n\n```text\n简介\n→ 凸集\n→ 凸函数\n→ 数值代数\n→ 优化建模\n→ 典型优化问题\n→ 凸优化最优性理论\n→ 梯度下降\n→ Newton / 拟 Newton / 信赖域\n```\n","resources":[]},{"heading":"4. 电子讲义完整索引 › 4. 推荐学习顺序 › 第二轮：非光滑与复合优化","line":285,"end":298,"text":"#### 第二轮：非光滑与复合优化\n\n```text\n次梯度\n→ 次梯度算法\n→ 近似点算子\n→ 近似点梯度\n→ Nesterov / FISTA\n→ 近似点算法\n→ BCD\n→ 对偶\n→ ADMM\n```\n","resources":[]},{"heading":"4. 电子讲义完整索引 › 4. 推荐学习顺序 › 第三轮：约束、随机与高级算法","line":299,"end":311,"text":"#### 第三轮：约束、随机与高级算法\n\n```text\n非凸最优性\n→ 非线性最小二乘\n→ 罚函数\n→ 增广 Lagrangian\n→ 线性规划内点法\n→ 随机优化\n→ 半光滑 Newton\n→ （第二版补充）流形约束优化\n```\n","resources":[]},{"heading":"4. 电子讲义完整索引 › 5. 每节学习模板","line":312,"end":328,"text":"### 5. 每节学习模板\n\n每个讲义不只“看完”，至少产出：\n\n1. **问题类**：目标函数与约束长什么样；\n2. **核心假设**：凸性、光滑性、Lipschitz、强凸、约束品性等；\n3. **算法更新式**：写清每一步实际计算；\n4. **收敛结论**：结论成立所需条件；\n5. **复杂度 / 局部速度**：若讲义给出则记录；\n6. **一个数值实验**：Python/NumPy 实现；\n7. **一个失败案例**：破坏关键假设后观察算法表现；\n8. **与教材页码/章节对应**；\n9. **与本知识库已有专题链接**。\n\n\n\n","resources":[]},{"heading":"5. 已完成 Unit 01–05：完整内容","line":329,"end":337,"text":"## 5. 已完成 Unit 01–05：完整内容\n\n下面直接整合当前仓库已经完成的学习单元。为避免“总览”和原单元发生语义漂移，本节以仓库现有 Unit 文档为正文来源，仅提升标题层级。\n\n\n\n\n---\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数","line":338,"end":345,"text":"## Unit 01｜最优化的基础语言：问题、凸性与数值代数\n\n> 对应电子讲义：01 简介、02 凸集、03 凸函数、04 数值代数基础。\n>\n> 对应教材：第 1 章“最优化简介”、第 2 章“基础知识”以及附录 B.2“数值代数基础”。\n>\n> 本页是学习导引与练习设计，不复刻教材或讲义正文。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 1. 学完后应该会什么？","line":346,"end":360,"text":"### 1. 学完后应该会什么？\n\n完成本单元后，应当能：\n\n1. 把一个优化问题写成\n   $$\n   \\min_x f(x),\\qquad x\\in X;\n   $$\n2. 说明目标函数、决策变量、可行域分别代表什么；\n3. 区分约束/无约束、连续/离散、凸/非凸、确定性/随机问题；\n4. 用定义判断简单集合是否凸；\n5. 用定义、一阶条件或 Hessian 判断常见函数的凸性；\n6. 解释为什么矩阵分解、线性方程组、特征值和 SVD 是优化算法的计算底座；\n7. 识别“数学上收敛”与“数值上算得稳定”不是同一件事。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 2. 第一层：优化问题到底是什么？","line":361,"end":381,"text":"### 2. 第一层：优化问题到底是什么？\n\n一般形式：\n\n$$\n\\min_{x\\in X} f(x).\n$$\n\n其中：\n\n- $x$：决策变量；\n- $f(x)$：目标函数；\n- $X$：可行域。\n\n学习时不要只盯公式，要反复问：\n\n- 谁是变量？\n- 什么东西越小/越大越好？\n- 什么条件不能违反？\n- 这是模型本身的限制，还是为了让算法更容易而人为加入的结构？\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 2. 第一层：优化问题到底是什么？ › 快速分类","line":382,"end":393,"text":"#### 快速分类\n\n| 维度 | 两侧 |\n|---|---|\n| 是否有约束 | unconstrained / constrained |\n| 变量空间 | continuous / discrete |\n| 几何性质 | convex / nonconvex |\n| 信息来源 | deterministic / stochastic |\n| 光滑性 | smooth / nonsmooth |\n\n同一个现实问题经过不同建模，可能落入完全不同的类别，因此问题分类本身就是算法选择的一部分。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 3. 第二层：凸集","line":394,"end":403,"text":"### 3. 第二层：凸集\n\n集合 $C$ 是凸集，如果对任意 $x,y\\in C$ 与 $0\\le\\theta\\le1$，\n\n$$\n\\theta x+(1-\\theta)y\\in C.\n$$\n\n几何直觉：集合中任意两点之间的整条线段仍留在集合内。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 3. 第二层：凸集 › 必会例子","line":404,"end":419,"text":"#### 必会例子\n\n通常是凸集：\n\n- 仿射空间；\n- 半空间；\n- 范数球；\n- 多面体；\n- 半正定锥。\n\n典型非凸结构：\n\n- 两个彼此分离区域的并集；\n- 单位球面 $\\{x:\\|x\\|_2=1\\}$；\n- 一般整数点集合。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 3. 第二层：凸集 › 自检","line":420,"end":423,"text":"#### 自检\n\n不要把“边界弯曲”与“非凸”等同。圆盘是凸的，圆周不是凸的。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 4. 第三层：凸函数","line":424,"end":435,"text":"### 4. 第三层：凸函数\n\n函数 $f$ 在凸定义域上是凸函数，如果\n\n$$\nf(\\theta x+(1-\\theta)y)\n\\le\n\\theta f(x)+(1-\\theta)f(y).\n$$\n\n直观上，弦在函数图像之上。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 4. 第三层：凸函数 › 可微函数的一阶判别","line":436,"end":445,"text":"#### 可微函数的一阶判别\n\n对可微凸函数，\n\n$$\nf(y)\\ge f(x)+\\nabla f(x)^T(y-x).\n$$\n\n因此切平面是一个全局下界，这也是许多一阶算法能够工作的几何基础。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 4. 第三层：凸函数 › 二阶判别","line":446,"end":457,"text":"#### 二阶判别\n\n在相应可微性与凸定义域条件下，\n\n$$\n\\nabla^2 f(x)\\succeq 0\n$$\n\n是凸性的核心二阶判据。\n\n需要特别记住：Hessian 判据有前提。不要把“某一点 Hessian 半正定”误写成“函数全局凸”。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 5. 第四层：范数、梯度、Hessian › 范数","line":460,"end":469,"text":"#### 范数\n\n范数用于表达“大小”或“距离尺度”。优化中高频出现：\n\n- $\\ell_1$：稀疏建模；\n- $\\ell_2$：欧氏几何、least squares；\n- $\\ell_\\infty$：最大偏差；\n- Frobenius norm：矩阵误差；\n- nuclear norm：低秩凸松弛。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 5. 第四层：范数、梯度、Hessian › 梯度","line":470,"end":475,"text":"#### 梯度\n\n梯度回答：在当前点附近，哪个方向让函数增长最快？\n\n负梯度因此给出最基本的下降方向。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 5. 第四层：范数、梯度、Hessian › Hessian","line":476,"end":486,"text":"#### Hessian\n\nHessian 描述局部曲率。它同时进入：\n\n- 凸性判断；\n- Newton 法；\n- conditioning；\n- 二阶 Taylor 模型。\n\n这也是本知识库 [Taylor 展开](../core/02-taylor.md) 与 [凸优化](../branches/19-convex-optimization.md) 的直接连接点。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 6. 第五层：为什么要学数值代数？","line":487,"end":490,"text":"### 6. 第五层：为什么要学数值代数？\n\n优化算法的“数学公式”最终要变成矩阵计算。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 6. 第五层：为什么要学数值代数？ › 线性方程组","line":491,"end":500,"text":"#### 线性方程组\n\nNewton 类算法的核心步骤常形如\n\n$$\nH_k p_k=-g_k.\n$$\n\n这里不是“求逆矩阵”三个字就结束了：实际计算需要选择合适的线性系统求解方法。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 6. 第五层：为什么要学数值代数？ › 矩阵分解","line":501,"end":510,"text":"#### 矩阵分解\n\n需要建立以下基本对应：\n\n- LU：一般线性系统；\n- Cholesky：对称正定系统；\n- QR：least squares；\n- eigen-decomposition：谱结构；\n- SVD：秩、伪逆、低秩近似、conditioning。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 6. 第五层：为什么要学数值代数？ › 条件数","line":511,"end":526,"text":"#### 条件数\n\n同一个数学问题，数值条件差时可能出现：\n\n- 小输入误差被放大；\n- 迭代显著变慢；\n- 理论上合理的停止准则在浮点计算中表现不佳。\n\n所以优化学习必须同时问：\n\n> 这个算法收敛吗？\n\n以及：\n\n> 这个线性代数步骤算得稳吗？\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 7. 本单元实验","line":527,"end":541,"text":"### 7. 本单元实验\n\n运行：\n\n```bash\npython labs/13_optimization_convexity.py\n```\n\n实验包含两个部分：\n\n1. 对 PSD 二次函数与不定二次函数随机检查凸性不等式；\n2. 比较不同条件数二次问题上的梯度下降收敛。\n\n实验不是凸性的证明。它的用途是把“凸性”和“conditioning”变成可观察现象。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 7. 本单元实验 › 故意破坏条件","line":542,"end":551,"text":"#### 故意破坏条件\n\n至少改一次：\n\n- 把 PSD 矩阵改成含负特征值；\n- 把梯度下降步长改大到超过稳定范围；\n- 把条件数从 $10$ 提高到 $10^4$。\n\n观察“理论条件变化 → 数值行为变化”。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 8. 练习 › 练习 1｜分类","line":554,"end":557,"text":"#### 练习 1｜分类\n\n分别判断 least squares、LASSO、0-1 整数规划、神经网络训练属于哪些类别。不要只写“凸/非凸”，至少从三个分类维度回答。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 8. 练习 › 练习 2｜凸集","line":558,"end":567,"text":"#### 练习 2｜凸集\n\n证明半空间\n\n$$\nC=\\{x:a^Tx\\le b\\}\n$$\n\n是凸集。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 8. 练习 › 练习 3｜非例","line":568,"end":577,"text":"#### 练习 3｜非例\n\n证明单位球面\n\n$$\nS=\\{x:\\|x\\|_2=1\\}\n$$\n\n一般不是凸集。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 8. 练习 › 练习 4｜一阶条件","line":578,"end":587,"text":"#### 练习 4｜一阶条件\n\n对\n\n$$\nf(x)=\\frac12 x^TQx+b^Tx+c\n$$\n\n计算梯度，并说明 $Q\\succeq0$ 时一阶凸性条件为什么成立。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 8. 练习 › 练习 5｜数值代数选择","line":588,"end":595,"text":"#### 练习 5｜数值代数选择\n\n给出以下任务更自然的分解/工具，并解释原因：\n\n- 对称正定 Newton 系统；\n- 过定线性 least-squares；\n- 低秩矩阵近似。\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 8. 练习 › 练习 6｜概念边界","line":596,"end":602,"text":"#### 练习 6｜概念边界\n\n解释下面两句话为什么不同：\n\n1. “这个算法理论上收敛。”\n2. “这个实现数值稳定而且收敛得快。”\n","resources":[]},{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数 › 9. 完成检查","line":603,"end":618,"text":"### 9. 完成检查\n\n能不看资料回答以下问题，才进入 Unit 02：\n\n- 什么是可行域？\n- 凸集和仿射集有什么关系？\n- 可微凸函数的一阶条件是什么？\n- Hessian 半正定的结论需要哪些限定？\n- 为什么 LASSO 常出现 $\\ell_1$？\n- 为什么 Newton 法离不开数值线性代数？\n- condition number 对优化计算意味着什么？\n\n下一单元：[Unit 02｜优化建模与典型问题](optimization-pku-wenzw-study-units/02-modeling.md)\n\n---\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题","line":619,"end":626,"text":"## Unit 02｜优化建模与典型优化问题\n\n> 对应电子讲义：05 优化建模、06 典型优化问题。\n>\n> 对应教材：第 3 章“优化建模”、第 4 章“典型优化问题”。\n>\n> 本页依据教材的建模框架重新组织为学习单元，不复刻教材正文。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 1. 本单元的核心问题","line":627,"end":641,"text":"### 1. 本单元的核心问题\n\nUnit 01 解决“什么是优化问题、什么是凸性”。Unit 02 要回答更实际的问题：\n\n> 一个现实问题，怎样变成一个值得求解的优化模型？\n\n教材把建模看成从现实需求到数学对象的过程。真正需要决定的不是“套哪个公式”，而是：\n\n1. 决策变量是什么；\n2. 什么量应该被最小化或最大化；\n3. 哪些条件必须满足；\n4. 是否需要正则化、松弛或变量变换；\n5. 得到的模型属于哪一类优化问题；\n6. 这种模型是否保留了原问题真正重要的结构。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 2. 建模语法","line":642,"end":670,"text":"### 2. 建模语法\n\n把一个模型拆成四层：\n\n```text\n现实问题\n→ 决策变量\n→ 目标函数\n→ 可行域 / 约束\n→ 问题类别\n```\n\n一个常见形式是\n\n$$\n\\min_x \\; L(x)+\\lambda R(x)\n\\quad\n\\text{s.t. }x\\in X.\n$$\n\n其中：\n\n- $L(x)$：数据误差、代价、负收益或其他任务损失；\n- $R(x)$：先验结构或正则项；\n- $\\lambda$：平衡任务拟合与结构偏好的参数；\n- $X$：物理、几何、逻辑或资源约束。\n\n学习任何模型时都要逐项解释这四个部分，而不是只记最终公式。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 3. 目标函数的六种常见设计思路","line":671,"end":674,"text":"### 3. 目标函数的六种常见设计思路\n\n教材第 3.1 节依次讨论了多种目标函数设计方式。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 3. 目标函数的六种常见设计思路 › 3.1 最小二乘","line":675,"end":704,"text":"#### 3.1 最小二乘\n\n当观测关系近似为\n\n$$\nb_i=\\phi_i(x)+\\varepsilon_i,\n$$\n\n最小二乘模型为\n\n$$\n\\min_x \\sum_i \\bigl(b_i-\\phi_i(x)\\bigr)^2.\n$$\n\n关键点不是“平方”本身，而是你选择了 $\\ell_2$ 型误差度量。\n\n如果换成\n\n$$\n\\sum_i |b_i-\\phi_i(x)|,\n$$\n\n或者\n\n$$\n\\max_i |b_i-\\phi_i(x)|,\n$$\n\n得到的是不同的建模假设与不同的问题结构。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 3. 目标函数的六种常见设计思路 › 3.2 正则化","line":705,"end":724,"text":"#### 3.2 正则化\n\n正则化把“希望解具有某种结构”写进目标函数。\n\n典型例子：\n\n$$\n\\frac12\\|Ax-b\\|_2^2+\\mu\\|x\\|_2^2\n$$\n\n偏向较小的参数范数；而\n\n$$\n\\frac12\\|Ax-b\\|_2^2+\\mu\\|x\\|_1\n$$\n\n对应 LASSO，利用 $\\ell_1$ 项鼓励稀疏结构。\n\n对于矩阵变量，核范数常用于低秩结构的凸松弛。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 3. 目标函数的六种常见设计思路 › 3.3 最大似然估计","line":725,"end":734,"text":"#### 3.3 最大似然估计\n\n当数据被认为来自参数化概率模型 $p(a;x)$ 时，可通过最大化似然或对数似然估计参数。\n\n教材明确给出一个重要的条件化关系：\n\n> 在线性回归中，当误差假设为高斯白噪声时，最小二乘解与最大似然解对应。\n\n这个结论依赖噪声模型，不能无条件推广为“最小二乘总是最大似然”。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 3. 目标函数的六种常见设计思路 › 3.4 代价、损失与收益","line":735,"end":744,"text":"#### 3.4 代价、损失与收益\n\n运筹、机器学习和强化学习中，目标函数常直接来自：\n\n- cost；\n- loss；\n- reward。\n\n这类模型最重要的是确认“目标函数数值变好”是否真的等价于现实任务变好。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 3. 目标函数的六种常见设计思路 › 3.5 泛函与变分","line":745,"end":750,"text":"#### 3.5 泛函与变分\n\n物理和工程中的能量极小化问题常首先定义在函数空间上，再通过离散化转化为有限维优化问题。\n\n因此“离散化”不只是数值实现细节：不同离散方式可能产生不同的有限维目标函数。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 3. 目标函数的六种常见设计思路 › 3.6 松弛","line":751,"end":765,"text":"#### 3.6 松弛\n\n原问题难以求解时，可以用更容易处理的对象替代困难结构。\n\n教材的典型例子包括：\n\n- $\\ell_0 \\rightarrow \\ell_1$；\n- rank $\\rightarrow$ nuclear norm。\n\n必须保留的边界是：\n\n> 松弛后的问题一般不与原问题自动等价；等价或恢复原解通常需要额外条件。\n\n这条规则对后面的稀疏恢复、低秩恢复和 phase lift 都很重要。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 4. 约束的三种来源 › 4.1 问题本身的物理或结构性质","line":768,"end":779,"text":"#### 4.1 问题本身的物理或结构性质\n\n例如：\n\n- 非负性；\n- 预算/资源限制；\n- 正交性；\n- 微分方程约束；\n- 正定/半正定约束。\n\n这类约束来自问题本身，不能为了算法方便随意删除。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 4. 约束的三种来源 › 4.2 等价转换","line":780,"end":799,"text":"#### 4.2 等价转换\n\n通过引入辅助变量，把一个复杂表达拆开。\n\n例如\n\n$$\n\\min_x h(x)+r(x)\n$$\n\n可引入 $y$ 与约束 $x=y$，写成\n\n$$\n\\min_{x,y} h(x)+r(y)\n\\quad\n\\text{s.t. }x=y.\n$$\n\n后面的 ADMM 就会大量使用这种结构。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 4. 约束的三种来源 › 4.3 约束松弛","line":800,"end":809,"text":"#### 4.3 约束松弛\n\n把难约束替换为更容易处理、但可行域更大的约束。\n\n此时必须问：\n\n- 新可行域扩大了多少？\n- 是否丢失关键结构？\n- 松弛解怎样映射回原问题？\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 5. 教材中的模型地图","line":810,"end":829,"text":"### 5. 教材中的模型地图\n\n教材第 3 章把建模方法放进多类实际问题。\n\n| 模型 | 主要建模思想 | 典型结构 |\n|---|---|---|\n| 线性回归 | least squares / MLE / regularization | $Ax\\approx b$ |\n| LASSO | 数据拟合 + $\\ell_1$ 正则 | 稀疏参数 |\n| logistic regression | 最大似然 + 正则化 | 分类概率 |\n| SVM | margin / loss + 约束或罚函数 | 二分类 |\n| 概率图模型 | likelihood + 稀疏精度矩阵 | 正定矩阵 |\n| phase retrieval | least squares / lifting / relaxation | 二次观测 |\n| PCA | 最大投影方差或最小重构误差 | 正交约束 |\n| matrix separation | low-rank + sparse | 核范数 + $\\ell_1$ |\n| dictionary learning | reconstruction + sparsity | 双变量矩阵模型 |\n| K-means | 组内距离平方和 | 离散分配 |\n| TV imaging | data fidelity + TV regularization | 非光滑复合模型 |\n| wavelet model | 变换域稀疏 | $\\ell_1$ 小波系数 |\n| reinforcement learning | 累积 reward / MDP | 随机动态决策 |\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 6. 几个必须真正理解的模型 › 6.1 线性回归：误差模型决定损失","line":832,"end":853,"text":"#### 6.1 线性回归：误差模型决定损失\n\n线性观测\n\n$$\nb=Ax+\\varepsilon\n$$\n\n并不能唯一决定损失函数。\n\n若使用平方误差：\n\n$$\n\\min_x \\frac12\\|Ax-b\\|_2^2.\n$$\n\n如果误差分布或鲁棒性要求改变，可以得到 $\\ell_1$ 残差等其他模型。\n\n因此：\n\n> “数据相同”并不意味着“优化模型唯一”。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 6. 几个必须真正理解的模型 › 6.2 LASSO：把稀疏性写进模型","line":854,"end":864,"text":"#### 6.2 LASSO：把稀疏性写进模型\n\n$$\n\\min_x\n\\frac12\\|Ax-b\\|_2^2+\\mu\\|x\\|_1.\n$$\n\n第一项要求拟合数据；第二项要求参数具有稀疏结构。\n\n$\\mu$ 不是纯算法参数，而是**模型权衡参数**。改变它，就是改变对“拟合”和“稀疏”的相对重视程度。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 6. 几个必须真正理解的模型 › 6.3 Logistic regression：概率模型变成凸优化","line":865,"end":879,"text":"#### 6.3 Logistic regression：概率模型变成凸优化\n\n对于二分类，教材由条件概率模型构造对数似然，并得到 logistic loss。\n\n需要能解释：\n\n```text\n概率假设\n→ likelihood\n→ log-likelihood\n→ optimization objective\n```\n\n这是“统计建模 → 优化”的经典桥梁。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 6. 几个必须真正理解的模型 › 6.4 SVM：几何间隔变成优化约束","line":880,"end":889,"text":"#### 6.4 SVM：几何间隔变成优化约束\n\nSVM 从“找到分类超平面，并让样本离超平面尽量远”出发，经缩放和等价转换得到二次目标 + 线性约束的模型。\n\n软间隔版本再通过松弛变量允许部分分类违反。\n\n因此 SVM 展示的是：\n\n> 几何需求 → margin → 约束 → penalty。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 6. 几个必须真正理解的模型 › 6.5 Phase retrieval：提升与松弛","line":890,"end":898,"text":"#### 6.5 Phase retrieval：提升与松弛\n\n相位恢复原始观测含二次关系。教材展示两条路线：\n\n- 非线性 least-squares；\n- lifting：令 $X=xx^*$，把二次关系转成矩阵上的线性关系，再处理 rank-1 结构。\n\n进一步用核范数/迹等凸结构做松弛时，必须保留“恢复需要条件”的限定。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 6. 几个必须真正理解的模型 › 6.6 PCA：两个表面不同的目标可等价","line":899,"end":911,"text":"#### 6.6 PCA：两个表面不同的目标可等价\n\nPCA 可以从：\n\n- 最大化投影后的方差；\n- 最小化重构误差；\n\n两个角度建立模型。\n\n这是非常重要的建模经验：\n\n> 两个不同的现实解释，可能导出等价优化问题。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 6. 几个必须真正理解的模型 › 6.7 低秩 + 稀疏分解","line":912,"end":931,"text":"#### 6.7 低秩 + 稀疏分解\n\n矩阵分离把观测矩阵表示成：\n\n$$\nM=X+S,\n$$\n\n其中 $X$ 希望低秩，$S$ 希望稀疏。\n\n困难的 rank 与 $\\ell_0$ 结构可分别用核范数和 $\\ell_1$ 做凸松弛。\n\n这里要同时看懂：\n\n- 模型结构；\n- 松弛结构；\n- 算法结构。\n\n三者不是同一个层次。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 7. 第 4 章：建模后要做“问题归类”","line":932,"end":958,"text":"### 7. 第 4 章：建模后要做“问题归类”\n\n建立模型后，还必须判断它属于哪一类优化问题。\n\n教材第 4 章的主要分类包括：\n\n- linear programming；\n- least-squares；\n- composite optimization；\n- stochastic optimization；\n- semidefinite programming；\n- matrix optimization；\n- integer programming；\n- optimization software / modeling languages。\n\n为什么归类重要？\n\n因为算法通常不是针对“应用名称”设计，而是针对数学结构设计。\n\n例如，“图像恢复”和“稀疏回归”应用领域不同，却可能同时落入\n\n$$\n\\min_x f(x)+g(x)\n$$\n\n这样的复合优化结构，于是可以共享 proximal 类算法。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 8. 本单元实验：模型选择会改变答案","line":959,"end":968,"text":"### 8. 本单元实验：模型选择会改变答案\n\n运行：\n\n```bash\npython labs/14_optimization_modeling.py\n```\n\n实验包含两部分。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 8. 本单元实验：模型选择会改变答案 › 实验 A｜同一组回归数据，不同残差模型","line":969,"end":988,"text":"#### 实验 A｜同一组回归数据，不同残差模型\n\n比较：\n\n$$\n\\min_x \\|Ax-b\\|_2^2\n$$\n\n与\n\n$$\n\\min_x \\|Ax-b\\|_1.\n$$\n\n在加入少量大离群点后，观察估计直线如何变化。\n\n重点不是宣布某个模型“总是更好”，而是回答：\n\n> 哪种残差结构更符合你对噪声的假设？\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 8. 本单元实验：模型选择会改变答案 › 实验 B｜同一线性模型，不同正则项","line":989,"end":1010,"text":"#### 实验 B｜同一线性模型，不同正则项\n\n比较 ridge 与 LASSO：\n\n$$\n\\frac12\\|Ax-b\\|_2^2+\\lambda\\|x\\|_2^2\n$$\n\n和\n\n$$\n\\frac12\\|Ax-b\\|_2^2+\\lambda\\|x\\|_1.\n$$\n\n观察：\n\n- ridge 倾向于整体收缩；\n- LASSO 可以产生精确为零的系数；\n- 正则项实际上编码了对解结构的偏好。\n\n实验中的 ISTA 只是用来得到 LASSO 数值解；proximal 算法本身会在 Unit 06 系统学习。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 9. 建模检查表","line":1011,"end":1026,"text":"### 9. 建模检查表\n\n以后遇到任何实际问题，都按下面顺序写一遍：\n\n1. **数据/状态是什么？**\n2. **决策变量是什么？**\n3. **目标是什么？**\n4. **损失函数为什么这样选？**\n5. **有没有先验结构？**\n6. **正则项表达的是什么？**\n7. **哪些约束来自现实，哪些只是数学变换？**\n8. **有没有做松弛？**\n9. **松弛是否等价？若不是，丢了什么？**\n10. **模型属于哪类优化问题？**\n11. **后续算法应该利用什么结构？**\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 10. 练习 › 练习 1｜同一数据，不同模型","line":1029,"end":1039,"text":"#### 练习 1｜同一数据，不同模型\n\n给定 $b=Ax+\\varepsilon$，分别写出：\n\n- least-squares；\n- least-absolute-deviation；\n- ridge；\n- LASSO。\n\n逐项解释每个新增项改变了什么假设。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 10. 练习 › 练习 2｜从需求写模型","line":1040,"end":1045,"text":"#### 练习 2｜从需求写模型\n\n“希望预测准确，同时只使用少量特征。”\n\n写出一个合理模型，并解释为什么不是只最小化训练误差。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 10. 练习 › 练习 3｜等价变换与松弛","line":1046,"end":1052,"text":"#### 练习 3｜等价变换与松弛\n\n解释下面两件事的本质区别：\n\n- 引入 $y=Ax+b$ 做等价变量替换；\n- 用 $\\ell_1$ 代替 $\\ell_0$。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 10. 练习 › 练习 4｜模型分类","line":1053,"end":1064,"text":"#### 练习 4｜模型分类\n\n把以下模型分别归入第 4 章的问题类别：\n\n- ordinary least squares；\n- LASSO；\n- phase-lift SDP；\n- K-means；\n- logistic regression 的期望风险形式。\n\n允许一个模型具有多个结构标签，但要说明你关注哪一种结构来选算法。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 10. 练习 › 练习 5｜PCA 的双重解释","line":1065,"end":1068,"text":"#### 练习 5｜PCA 的双重解释\n\n说明“最大投影方差”和“最小重构误差”为何可以描述同一任务。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 10. 练习 › 练习 6｜失败案例","line":1069,"end":1075,"text":"#### 练习 6｜失败案例\n\n举一个正则化参数过大导致模型偏离原任务的例子，并解释这属于：\n\n- 算法失败；\n- 还是模型选择失败。\n","resources":[]},{"heading":"Unit 02｜优化建模与典型优化问题 › 11. 完成检查","line":1076,"end":1092,"text":"### 11. 完成检查\n\n进入 Unit 03 前，应当能不看资料回答：\n\n- 为什么最小二乘不是唯一合理的误差模型？\n- 正则化和约束有什么联系与区别？\n- 最大似然如何产生优化目标？\n- 等价变换和松弛有什么根本不同？\n- $\\ell_0\\rightarrow\\ell_1$ 为什么需要额外恢复条件？\n- LASSO 中 $\\lambda$ 为什么是模型参数，而不只是算法参数？\n- 为什么“问题分类”会决定算法路线？\n- 一个应用问题为什么可能对应多个不同的优化模型？\n\n下一单元：[Unit 03｜最优性理论](optimization-pku-wenzw-study-units/03-optimality.md)\n\n---\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？","line":1093,"end":1100,"text":"## Unit 03｜最优性理论：什么时候可以说“这个点是解”？\n\n> 对应电子讲义：凸优化最优性理论、非凸优化最优性理论。\n>\n> 对应教材：第 5 章“最优性理论”。\n>\n> 本页以第二版教材第 5 章为依据，保留“必要 / 充分 / 充要”“约束品性”“强对偶”等条件边界。\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 1. 本单元的主线","line":1101,"end":1120,"text":"### 1. 本单元的主线\n\nUnit 02 解决“怎样建立优化模型”。Unit 03 解决：\n\n> 给定一个候选点，凭什么说它是局部最优点、全局最优点，或者仅仅是驻点？\n\n教材第 5 章依次讨论：\n\n```text\n解的存在性与唯一性\n→ 无约束可微问题\n→ 无约束不可微 / 复合问题\n→ Lagrangian 与对偶\n→ 一般约束问题的 KKT\n→ 约束问题的二阶条件\n→ 凸约束问题 + Slater + 强对偶\n```\n\n学习时，每一个条件都必须同时标明：**必要、充分还是充要，以及它依赖哪些假设。**\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 2. 解的存在性与唯一性","line":1121,"end":1144,"text":"### 2. 解的存在性与唯一性\n\n考虑\n\n$$\n\\min_{x\\in X} f(x).\n$$\n\n教材的 Weierstrass 型存在性定理针对适当且闭的函数：如果以下三类条件之一成立，则最小值点集非空且紧：\n\n1. $\\operatorname{dom} f$ 有界；\n2. 存在一个非空且有界的下水平集；\n3. $f$ 是强制的，即 $\\|x^k\\|\\to\\infty$ 时 $f(x^k)\\to+\\infty$。\n\n直觉是防止“最小值跑向无穷远”。\n\n教材随后用强拟凸给出唯一性结果：若 $X$ 非空、紧、凸，而 $f$ 适当、闭且强拟凸，则最优解唯一。\n\n需要区分：\n\n- 存在最优点；\n- 最优点唯一；\n- 多个最优点共享同一个最优值。\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 3. 无约束可微问题：驻点不是最优点","line":1145,"end":1170,"text":"### 3. 无约束可微问题：驻点不是最优点\n\n考虑\n\n$$\n\\min_{x\\in\\mathbb R^n} f(x).\n$$\n\n如果存在方向 $d$ 满足\n\n$$\n\\nabla f(x)^T d\u003c0,\n$$\n\n则 $d$ 是下降方向。\n\n所以局部极小点必须满足一阶必要条件\n\n$$\n\\nabla f(x^*)=0.\n$$\n\n教材把满足该式的点称为稳定点，也可称驻点或临界点。\n\n但这只是必要条件。比如 $f(x)=x^3$ 在 $x=0$ 处导数为零，$0$ 却不是局部极小点。\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 4. 二阶最优性条件","line":1171,"end":1174,"text":"### 4. 二阶最优性条件\n\n若 $f$ 在 $x^*$ 附近二阶连续可微，教材定理 5.4 给出：\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 4. 二阶最优性条件 › 二阶必要条件","line":1175,"end":1184,"text":"#### 二阶必要条件\n\n若 $x^*$ 是局部极小点，则\n\n$$\n\\nabla f(x^*)=0,\n\\qquad\n\\nabla^2 f(x^*)\\succeq0.\n$$\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 4. 二阶最优性条件 › 二阶充分条件","line":1185,"end":1203,"text":"#### 二阶充分条件\n\n若\n\n$$\n\\nabla f(x^*)=0,\n\\qquad\n\\nabla^2 f(x^*)\\succ0,\n$$\n\n则 $x^*$ 是局部极小点。\n\n边界必须保留：\n\n- 二阶必要条件不是充分条件；\n- 二阶充分条件不是必要条件。\n\n例如 $x^3$ 在 0 处梯度和 Hessian 都为 0，但不是极小点；$x^4$ 在 0 处是全局极小点，但 Hessian 仍为 0。\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 5. 不可微与复合问题 › 5.1 凸问题","line":1206,"end":1217,"text":"#### 5.1 凸问题\n\n对适当凸函数，教材定理 5.5：\n\n$$\nx^* \\text{ 是全局极小点}\n\\quad\\Longleftrightarrow\\quad\n0\\in\\partial f(x^*).\n$$\n\n这是全局最优的充要条件。\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 5. 不可微与复合问题 › 5.2 复合优化","line":1218,"end":1241,"text":"#### 5.2 复合优化\n\n考虑\n\n$$\n\\psi(x)=f(x)+h(x),\n$$\n\n其中 $f$ 光滑（可以非凸），$h$ 凸（可以不可微）。\n\n教材定理 5.6 给出局部最优必要条件\n\n$$\n-\\nabla f(x^*)\\in\\partial h(x^*),\n$$\n\n即\n\n$$\n0\\in\\nabla f(x^*)+\\partial h(x^*).\n$$\n\n如果整个目标是凸的，这个条件也可用于刻画全局最优。\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 6. Lagrangian 与对偶","line":1242,"end":1294,"text":"### 6. Lagrangian 与对偶\n\n一般约束问题写成\n\n$$\n\\begin{aligned}\n\\min_x\\quad & f(x)\\\\\n\\text{s.t.}\\quad\n& c_i(x)\\le0,\\quad i\\in I,\\\\\n& c_i(x)=0,\\quad i\\in E.\n\\end{aligned}\n$$\n\n给不等式约束乘子 $\\lambda_i\\ge0$，等式约束乘子 $\\nu_i\\in\\mathbb R$，构造\n\n$$\nL(x,\\lambda,\\nu)\n=\nf(x)\n+\n\\sum_{i\\in I}\\lambda_i c_i(x)\n+\n\\sum_{i\\in E}\\nu_i c_i(x).\n$$\n\n对偶函数：\n\n$$\ng(\\lambda,\\nu)=\\inf_x L(x,\\lambda,\\nu).\n$$\n\n对偶问题：\n\n$$\n\\max_{\\lambda\\ge0,\\nu} g(\\lambda,\\nu).\n$$\n\n教材指出，对偶函数给原始最优值的下界，而且拉格朗日对偶问题本身是凸优化问题。\n\n若原始最优值为 $p^*$，对偶最优值为 $d^*$，则对偶间隙为\n\n$$\np^*-d^*\\ge0.\n$$\n\n若\n\n$$\np^*=d^*,\n$$\n\n则强对偶成立。\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 7. 约束品性：为什么 KKT 不能无条件使用？","line":1295,"end":1309,"text":"### 7. 约束品性：为什么 KKT 不能无条件使用？\n\n教材先比较：\n\n- 切锥 $T_X(x)$；\n- 线性化可行方向锥 $F(x)$。\n\n许多约束品性的作用就是保证\n\n$$\nT_X(x^*)=F(x^*).\n$$\n\n这样才能用容易计算的线性化方向代表真实可行方向。\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 7. 约束品性：为什么 KKT 不能无条件使用？ › LICQ","line":1310,"end":1320,"text":"#### LICQ\n\n若可行点处积极约束的梯度线性无关，则 LICQ 成立。\n\n教材还讨论：\n\n- MFCQ：LICQ 的弱化版本；\n- 线性约束品性：所有约束函数本身是线性的。\n\n这些条件在相应情形下可帮助保证 $T_X=F$。\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 8. KKT：一般约束问题的一阶必要条件","line":1321,"end":1332,"text":"### 8. KKT：一般约束问题的一阶必要条件\n\n教材定理 5.9：如果 $x^*$ 是局部最优点，并且\n\n$$\nT_X(x^*)=F(x^*),\n$$\n\n则存在乘子使 KKT 成立。\n\nKKT 四部分：\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 8. KKT：一般约束问题的一阶必要条件 › 稳定性","line":1333,"end":1338,"text":"#### 稳定性\n\n$$\n\\nabla_xL(x^*,\\lambda^*,\\nu^*)=0.\n$$\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 8. KKT：一般约束问题的一阶必要条件 › 原始可行性","line":1339,"end":1348,"text":"#### 原始可行性\n\n$$\nc_i(x^*)\\le0,\\quad i\\in I,\n$$\n\n$$\nc_i(x^*)=0,\\quad i\\in E.\n$$\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 8. KKT：一般约束问题的一阶必要条件 › 对偶可行性","line":1349,"end":1354,"text":"#### 对偶可行性\n\n$$\n\\lambda_i^*\\ge0,\\quad i\\in I.\n$$\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 8. KKT：一般约束问题的一阶必要条件 › 互补松弛","line":1355,"end":1362,"text":"#### 互补松弛\n\n$$\n\\lambda_i^*c_i(x^*)=0,\\quad i\\in I.\n$$\n\n一般非凸约束问题中，KKT 是必要条件，不是充分条件，因此 KKT 点不自动等于局部最优点。\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 9. 约束问题的二阶条件","line":1363,"end":1366,"text":"### 9. 约束问题的二阶条件\n\n教材用临界锥 $C(x^*,\\lambda^*)$ 收集“一阶信息无法判定”的线性化可行方向。\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 9. 约束问题的二阶条件 › 二阶必要条件","line":1367,"end":1376,"text":"#### 二阶必要条件\n\n在局部最优点、相应约束品性以及 KKT 乘子存在时，\n\n$$\nd^T\\nabla^2_{xx}L(x^*,\\lambda^*)d\\ge0,\n\\qquad\n\\forall d\\in C(x^*,\\lambda^*).\n$$\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 9. 约束问题的二阶条件 › 二阶充分条件","line":1377,"end":1388,"text":"#### 二阶充分条件\n\n如果 KKT 成立，而且\n\n$$\nd^T\\nabla^2_{xx}L(x^*,\\lambda^*)d>0\n$$\n\n对所有非零临界方向成立，则 $x^*$ 是严格局部极小点。\n\n和无约束问题相比，关键变化是：只需要沿临界锥检查二阶曲率，而不是要求整个空间上的正定性。\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 10. Slater：凸约束问题中的关键条件","line":1389,"end":1411,"text":"### 10. Slater：凸约束问题中的关键条件\n\n教材第 5.6 节定义 Slater 条件：在自然定义域的相对内点中，存在点使非仿射不等式严格成立并满足等式约束。对仿射不等式，严格性要求可以适当放宽。\n\n教材定理 5.12：\n\n> 凸优化问题满足 Slater 条件时，强对偶成立。\n\n所以\n\n$$\np^*=d^*.\n$$\n\n教材定理 5.13：\n\n> 对凸问题，在 Slater 条件下，KKT 条件成为原始/对偶全局最优的充要条件。\n\n| 问题 | 条件 | KKT 角色 |\n|---|---|---|\n| 一般约束问题 | 相应约束品性 | 局部最优的必要条件 |\n| 凸约束问题 | Slater | 原始/对偶全局最优的充要条件 |\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 11. 同一个可行域，不同约束表达","line":1412,"end":1417,"text":"### 11. 同一个可行域，不同约束表达\n\n教材习题 5.8 提醒：约束的代数表达会影响 KKT 分析。\n\n考虑可行域 $X=\\{0\\}$。\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 11. 同一个可行域，不同约束表达 › 表示 A","line":1418,"end":1439,"text":"#### 表示 A\n\n$$\nc(x)=x=0.\n$$\n\n此时 $c'(0)=1$，约束梯度不退化。\n\n对\n\n$$\n\\min_x x\\quad\\text{s.t. }x=0,\n$$\n\nstationarity 为\n\n$$\n1+\\nu=0,\n$$\n\n存在 $\\nu=-1$。\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 11. 同一个可行域，不同约束表达 › 表示 B","line":1440,"end":1465,"text":"#### 表示 B\n\n把同一个可行域写成\n\n$$\nc(x)=x^2=0.\n$$\n\n此时\n\n$$\nc'(0)=0.\n$$\n\nstationarity 变成\n\n$$\n1+\\nu\\cdot0=0,\n$$\n\n不存在任何乘子使它成立。\n\n但 $x=0$ 仍然是唯一可行点，也是全局最优点。\n\n这说明：如果约束品性失败，局部/全局最优点不一定是 KKT 点。\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 12. 本单元实验","line":1466,"end":1497,"text":"### 12. 本单元实验\n\n运行：\n\n```bash\npython labs/15_optimization_optimality.py\n```\n\n实验有三部分：\n\n1. $x^3$ 与 $x^4$：展示“驻点 ≠ 最优点”以及二阶条件边界；\n2. $x=0$ 与 $x^2=0$：展示同一可行域的不同表达如何影响 KKT；\n3. 凸问题\n   $$\n   \\min_x (x-2)^2\\quad\\text{s.t. }x\\le1\n   $$\n   展示 Slater、KKT 与强对偶。\n\n第三个问题有严格可行点 $x=0$。其最优点和乘子为\n\n$$\nx^*=1,\\qquad \\lambda^*=2,\n$$\n\n原始最优值 $p^*=1$。对偶函数为\n\n$$\ng(\\lambda)=\\lambda-\\frac{\\lambda^2}{4},\\qquad \\lambda\\ge0,\n$$\n\n最大值也为 $1$，所以对偶间隙为 0。\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 13. 最优性条件速查表","line":1498,"end":1510,"text":"### 13. 最优性条件速查表\n\n| 问题 | 条件 | 结论性质 |\n|---|---|---|\n| 无约束光滑 | $\\nabla f(x^*)=0$ | 局部最优必要 |\n| 无约束光滑 | $\\nabla f=0,\\nabla^2f\\succeq0$ | 二阶必要 |\n| 无约束光滑 | $\\nabla f=0,\\nabla^2f\\succ0$ | 局部最优充分 |\n| 无约束凸 | $0\\in\\partial f(x^*)$ | 全局最优充要 |\n| 复合 $f+h$ | $-\\nabla f(x^*)\\in\\partial h(x^*)$ | 局部最优必要 |\n| 一般约束 | KKT + 相应约束品性 | 局部最优必要 |\n| 一般约束 | Lagrangian Hessian 在临界锥上正定 | 严格局部最优充分 |\n| 凸约束 | Slater + KKT | 原始/对偶全局最优充要 |\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 14. 练习","line":1511,"end":1525,"text":"### 14. 练习\n\n1. 对 $f(x)=x^4-2x^2$ 求所有驻点，并分类。\n2. 分别举例说明二阶必要条件不是充分条件、二阶充分条件不是必要条件。\n3. 对 $f(x)=|x|+\\frac12(x-1)^2$ 写出 $0\\in\\partial f(x)$ 并求最优解。\n4. 对 $\\min x_1^2+x_2^2$，约束 $x_1+x_2=1,x_1\\ge0$，写出完整 KKT。\n5. 解释为什么互补松弛不意味着所有不等式约束都必须取等号。\n6. 解释 $x=0$ 与 $x^2=0$ 在 KKT 分析中的差别。\n7. 判断 $\\min x^2$ s.t. $x\\le1$ 是否有明显 Slater 点，并说明 Slater 支持什么结论。\n8. 判断并补条件：\n   - $\\nabla f(x)=0$，所以 $x$ 是局部极小点；\n   - 一个点满足 KKT，所以它是局部最优点；\n   - 凸问题满足 KKT，所以它一定是全局最优；\n   - Slater 成立，所以原始问题一定存在唯一最优解。\n","resources":[]},{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？ › 15. 完成检查","line":1526,"end":1545,"text":"### 15. 完成检查\n\n进入 Unit 04 前，应能回答：\n\n- 什么条件可以防止最优点跑向无穷远？\n- 驻点与局部极小点有什么区别？\n- 一阶必要、二阶必要、二阶充分分别是什么？\n- 为什么凸问题的 $0\\in\\partial f(x^*)$ 特别强？\n- Lagrangian、对偶函数、对偶间隙分别是什么？\n- KKT 四部分是什么？\n- LICQ / MFCQ / 线性约束品性的共同作用是什么？\n- 为什么一般非凸问题的 KKT 只是必要条件？\n- 临界锥为什么出现在约束二阶条件中？\n- Slater 如何连接强对偶与凸问题 KKT 的充要性？\n- 为什么相同可行域的不同表达可能导致不同 KKT 行为？\n\n下一单元：[Unit 04｜无约束优化算法](optimization-pku-wenzw-study-units/04-unconstrained.md)\n\n---\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度","line":1546,"end":1553,"text":"## Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度\n\n> 对应电子讲义：梯度下降算法、牛顿类算法、拟牛顿算法、信赖域算法、非线性最小二乘问题。\n>\n> 对应教材：第 6 章“无约束优化算法”，重点覆盖 6.1、6.2、6.4、6.5、6.6、6.7。\n>\n> 第 6.3 节“次梯度算法”属于本章，但本路线把它放到后续非光滑/随机单元集中学习。本页不删除这一章节，只是暂不展开。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 1. 一条统一主线","line":1554,"end":1586,"text":"### 1. 一条统一主线\n\n本单元不把算法看成互不相关的配方，而统一成四个问题：\n\n```text\n局部模型\n→ 搜索方向 / 子问题\n→ 全局化策略\n→ 收敛速度\n```\n\n对当前点 $x_k$，记\n\n$$\ng_k=\\nabla f(x_k),\\qquad B_k\\approx\\nabla^2 f(x_k).\n$$\n\n一个常见的二阶局部模型是\n\n$$\nm_k(d)\n=\nf(x_k)+g_k^Td+\\frac12d^TB_kd.\n$$\n\n不同算法的差别，往往就是：\n\n- $B_k$ 取什么；\n- 怎样从 $m_k$ 得到方向 $d_k$；\n- 是否需要额外选择步长；\n- 如何防止局部模型在远离当前点时失真；\n- 在什么条件下能证明收敛，以及局部速度有多快。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 2. 两种全局化哲学 › 2.1 线搜索：先选方向，再决定走多远","line":1589,"end":1611,"text":"#### 2.1 线搜索：先选方向，再决定走多远\n\n教材的基本格式是\n\n$$\nx_{k+1}=x_k+\\alpha_k d_k,\n$$\n\n其中 $d_k$ 是搜索方向，$\\alpha_k>0$ 是步长。\n\n如果\n\n$$\ng_k^Td_k\u003c0,\n$$\n\n则 $d_k$ 是下降方向。\n\n线搜索方法的核心是：\n\n1. 先通过梯度、Newton、BFGS 等规则得到 $d_k$；\n2. 再沿射线 $x_k+\\alpha d_k$ 选择一个合适的 $\\alpha_k$。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 2. 两种全局化哲学 › 2.2 信赖域：限制局部模型“可信”的范围","line":1612,"end":1631,"text":"#### 2.2 信赖域：限制局部模型“可信”的范围\n\n信赖域直接求\n\n$$\n\\min_d\\;\nm_k(d)\n\\quad\n\\text{s.t. }\\|d\\|\\le\\Delta_k.\n$$\n\n它不是先定方向再定步长，而是在半径 $\\Delta_k$ 内同时选择方向和步长。\n\n因此可以把两者对照为：\n\n| 思路 | 方向 | 步长/尺度 |\n|---|---|---|\n| 线搜索 | 先确定 $d_k$ | 再选 $\\alpha_k$ |\n| 信赖域 | 在子问题里共同确定 | 由 $\\Delta_k$ 限制 |\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 3. 线搜索：下降还不够，必须“充分下降”","line":1632,"end":1643,"text":"### 3. 线搜索：下降还不够，必须“充分下降”\n\n教材用一个一维例子说明：仅要求\n\n$$\nf(x_{k+1})\u003cf(x_k)\n$$\n\n仍可能收敛到错误位置，甚至迭代点振荡。\n\n所以需要更强的步长准则。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 3. 线搜索：下降还不够，必须“充分下降” › 3.1 Armijo 准则","line":1644,"end":1666,"text":"#### 3.1 Armijo 准则\n\n若\n\n$$\nf(x_k+\\alpha d_k)\n\\le\nf(x_k)+c_1\\alpha g_k^Td_k,\n\\qquad 0\u003cc_1\u003c1,\n$$\n\n则步长满足 Armijo 准则。\n\n它要求的不只是“下降”，而是相对于局部线性模型有**充分下降**。\n\n最常用的实现是回退法：\n\n```text\n从一个较大候选步长开始\n→ 若 Armijo 不满足则乘一个 0\u003cβ\u003c1\n→ 直到满足\n```\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 3. 线搜索：下降还不够，必须“充分下降” › 3.2 Wolfe 准则","line":1667,"end":1672,"text":"#### 3.2 Wolfe 准则\n\nWolfe 在充分下降之外增加曲率条件，防止步长过小。\n\n教材后面的 BFGS / L-BFGS 全局收敛分析会显式使用 Wolfe 线搜索，因此不能把“任意能下降的步长”与 Wolfe 混为一谈。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 3. 线搜索：下降还不够，必须“充分下降” › 3.3 非单调线搜索","line":1673,"end":1686,"text":"#### 3.3 非单调线搜索\n\n教材还介绍 Grippo 以及 Zhang–Hager 类型的非单调准则。\n\n这类规则允许\n\n$$\nf(x_{k+1})>f(x_k)\n$$\n\n在某些迭代出现，只要相对于一个历史参考值仍满足控制条件。\n\n这一点和 BB 方法非常契合，因为 BB 本身就是非单调方法。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 3. 线搜索：下降还不够，必须“充分下降” › 3.4 Zoutendijk 条件","line":1687,"end":1700,"text":"#### 3.4 Zoutendijk 条件\n\n教材定理 6.1 给出一般线搜索框架下的重要收敛工具：当目标函数下有界、连续可微、梯度 Lipschitz，方向为下降方向且步长满足 Wolfe 时，有\n\n$$\n\\sum_{k=0}^{\\infty}\n\\cos^2\\theta_k\\|\\nabla f(x_k)\\|^2\n\u003c\\infty,\n$$\n\n其中 $\\theta_k$ 是负梯度与搜索方向之间的夹角。\n\n这条结论揭示了“方向质量 + 步长规则”共同决定全局收敛性的思想。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 4. 梯度下降：一阶局部模型","line":1701,"end":1722,"text":"### 4. 梯度下降：一阶局部模型\n\n如果只看一阶近似\n\n$$\nf(x_k+d)\\approx f(x_k)+g_k^Td,\n$$\n\n在单位长度约束下，最陡下降方向就是\n\n$$\nd_k=-g_k.\n$$\n\n于是\n\n$$\nx_{k+1}\n=\nx_k-\\alpha_k\\nabla f(x_k).\n$$\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 4. 梯度下降：一阶局部模型 › 4.1 全局化策略","line":1723,"end":1731,"text":"#### 4.1 全局化策略\n\n步长可以：\n\n- 固定；\n- 精确线搜索；\n- Armijo/Wolfe；\n- 由其他谱步长规则产生。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 4. 梯度下降：一阶局部模型 › 4.2 收敛速度","line":1732,"end":1735,"text":"#### 4.2 收敛速度\n\n教材给出几类重要结论。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 4. 梯度下降：一阶局部模型 › 4.2 收敛速度 › 正定二次函数","line":1736,"end":1741,"text":"##### 正定二次函数\n\n精确线搜索的梯度法是 Q-线性收敛的，而且速度显式依赖 Hessian 的条件数。\n\n因此病态问题会出现典型“之字形”。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 4. 梯度下降：一阶局部模型 › 4.2 收敛速度 › 凸 + 梯度 Lipschitz","line":1742,"end":1751,"text":"##### 凸 + 梯度 Lipschitz\n\n若 $f$ 凸且梯度 $L$-Lipschitz，固定步长满足相应条件时，教材给出函数值\n\n$$\nO(1/k)\n$$\n\n的收敛速度。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 4. 梯度下降：一阶局部模型 › 4.2 收敛速度 › 强凸 + 梯度 Lipschitz","line":1752,"end":1759,"text":"##### 强凸 + 梯度 Lipschitz\n\n若进一步 $m$-强凸，则固定合适步长后，迭代点 Q-线性收敛。\n\n所以梯度法的定位是：\n\n> 每步便宜、结构简单、全局行为容易控制，但对条件数较大的问题可能很慢。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 5. Barzilai–Borwein：用两步信息估计曲率尺度","line":1760,"end":1797,"text":"### 5. Barzilai–Borwein：用两步信息估计曲率尺度\n\n梯度法可写成\n\n$$\nx_{k+1}=x_k-D_k g_k,\n\\qquad\nD_k=\\alpha_k I.\n$$\n\nBB 的关键不是换方向，而是用前后两步的变化估计一个“标量逆 Hessian”。\n\n定义\n\n$$\ns_{k-1}=x_k-x_{k-1},\n\\qquad\ny_{k-1}=g_k-g_{k-1}.\n$$\n\n按教材记号，两种步长为\n\n$$\n\\alpha_k^{\\mathrm{BB1}}\n=\n\\frac{s_{k-1}^Ty_{k-1}}\n{y_{k-1}^Ty_{k-1}},\n$$\n\n以及\n\n$$\n\\alpha_k^{\\mathrm{BB2}}\n=\n\\frac{s_{k-1}^Ts_{k-1}}\n{s_{k-1}^Ty_{k-1}}.\n$$\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 5. Barzilai–Borwein：用两步信息估计曲率尺度 › 5.1 为什么它常比普通梯度快？","line":1798,"end":1801,"text":"#### 5.1 为什么它常比普通梯度快？\n\n它把相邻迭代产生的曲率信息压缩进一个标量步长，不需要显式 Hessian，也不要求每次做完整线搜索。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 5. Barzilai–Borwein：用两步信息估计曲率尺度 › 5.2 但它不是“单调下降法”","line":1802,"end":1810,"text":"#### 5.2 但它不是“单调下降法”\n\n教材明确指出 BB 本身是非单调方法，实践中常：\n\n- 给 $\\alpha_k$ 设置上下界；\n- 搭配非单调线搜索。\n\n教材给出的正定二次函数结果是 R-线性收敛；一般非线性问题需要更多条件，不能把该速度直接推广。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 6. Newton：直接最小化二阶局部模型","line":1811,"end":1832,"text":"### 6. Newton：直接最小化二阶局部模型\n\n令\n\n$$\nB_k=\\nabla^2f(x_k).\n$$\n\n忽略 Taylor 高阶项后，二阶模型的稳定点满足 Newton 方程\n\n$$\n\\nabla^2f(x_k)d_k=-\\nabla f(x_k).\n$$\n\n经典 Newton 更新是\n\n$$\nx_{k+1}=x_k+d_k.\n$$\n\n即步长固定为 1。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 6. Newton：直接最小化二阶局部模型 › 6.1 局部速度","line":1833,"end":1844,"text":"#### 6.1 局部速度\n\n教材定理 6.6 的条件包括：\n\n- $f$ 二阶连续可微；\n- 最优点附近 Hessian Lipschitz；\n- $\\nabla f(x^*)=0$；\n- $\\nabla^2 f(x^*)\\succ0$；\n- 初值离 $x^*$ 足够近。\n\n在这些条件下，经典 Newton 的迭代点以及梯度范数都具有 Q-二次局部收敛性质。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 6. Newton：直接最小化二阶局部模型 › 6.2 为什么经典 Newton 不能直接当全局算法？","line":1845,"end":1852,"text":"#### 6.2 为什么经典 Newton 不能直接当全局算法？\n\n教材列出三个核心问题：\n\n1. Hessian 计算、存储以及线性系统求解昂贵；\n2. Hessian 不正定时 Newton 方向未必是下降方向；\n3. 距最优点较远时，直接取 $\\alpha=1$ 可能不稳定甚至发散。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 6. Newton：直接最小化二阶局部模型 › 6.3 修正 Newton","line":1853,"end":1881,"text":"#### 6.3 修正 Newton\n\n教材的修正框架是\n\n$$\nB_k\n=\n\\nabla^2f(x_k)+E_k\n\\succ0,\n$$\n\n再解\n\n$$\nB_kd_k=-g_k,\n$$\n\n并配线搜索选择 $\\alpha_k$。\n\n常见思路是 $E_k=\\tau_kI$，把 Hessian 修正到正定且条件数可接受。\n\n所以修正 Newton 可以概括为：\n\n```text\n准确二阶局部模型\n+ 正定化\n+ 线搜索全局化\n```\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 7. BFGS：不用真正 Hessian，也学习二阶几何","line":1882,"end":1917,"text":"### 7. BFGS：不用真正 Hessian，也学习二阶几何\n\n拟 Newton 的核心是构造\n\n$$\nB_k\\approx\\nabla^2f(x_k)\n$$\n\n或\n\n$$\nH_k\\approx\\nabla^2f(x_k)^{-1}.\n$$\n\n使用\n\n$$\ns_k=x_{k+1}-x_k,\n\\qquad\ny_k=g_{k+1}-g_k,\n$$\n\n并要求满足割线方程\n\n$$\nB_{k+1}s_k=y_k\n$$\n\n或\n\n$$\nH_{k+1}y_k=s_k.\n$$\n\nBFGS 用秩二更新完成这一点，同时尽量不让新矩阵偏离旧近似矩阵。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 7. BFGS：不用真正 Hessian，也学习二阶几何 › 7.1 全局化","line":1918,"end":1925,"text":"#### 7.1 全局化\n\n教材定理 6.8 的 BFGS 全局收敛结论显式要求 Wolfe 线搜索，并对目标函数/下水平集上的 Hessian 给出正定有界条件。\n\n因此：\n\n> BFGS 的好性质不是“更新公式单独保证”的；线搜索和函数结构也是证明的一部分。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 7. BFGS：不用真正 Hessian，也学习二阶几何 › 7.2 局部速度","line":1926,"end":1931,"text":"#### 7.2 局部速度\n\n教材定理 6.9 在给定收敛及附加条件下得到 Q-超线性速度。\n\n它比 Newton 的 Q-二次慢，但避免了每一步显式计算 Hessian。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 7. BFGS：不用真正 Hessian，也学习二阶几何 › 7.3 L-BFGS","line":1932,"end":1945,"text":"#### 7.3 L-BFGS\n\n完整 $B_k/H_k$ 是稠密矩阵，存储成本 $O(n^2)$。\n\nL-BFGS 只保留最近 $m$ 对\n\n$$\n(s_i,y_i),\n$$\n\n并用双循环递归计算 $H_kg_k$，因此适合大规模问题。\n\n教材的 L-BFGS 框架同样配 Wolfe 线搜索。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 8. 信赖域：让局部模型自己证明“可信”","line":1946,"end":1975,"text":"### 8. 信赖域：让局部模型自己证明“可信”\n\n考虑二次模型\n\n$$\nm_k(d)\n=\nf(x_k)+g_k^Td+\\frac12d^TB_kd\n$$\n\n以及约束\n\n$$\n\\|d\\|\\le\\Delta_k.\n$$\n\n求出候选步 $d_k$ 后，比较：\n\n- 实际下降；\n- 模型预测下降。\n\n定义比值\n\n$$\n\\rho_k\n=\n\\frac{f(x_k)-f(x_k+d_k)}\n{m_k(0)-m_k(d_k)}.\n$$\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 8. 信赖域：让局部模型自己证明“可信” › 8.1 半径更新逻辑","line":1976,"end":1984,"text":"#### 8.1 半径更新逻辑\n\n- $\\rho_k\\approx1$：模型可信，可以扩大 $\\Delta_k$；\n- $\\rho_k$ 很小或为负：模型失真，应缩小 $\\Delta_k$；\n- $\\rho_k$ 足够大：接受步长；\n- 否则拒绝，保持当前点。\n\n教材常用参数示例为 $0.25$、$0.75$ 等阈值，但这些是算法参数，不是数学常数。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 8. 信赖域：让局部模型自己证明“可信” › 8.2 子问题不一定要精确求解","line":1985,"end":1992,"text":"#### 8.2 子问题不一定要精确求解\n\n教材介绍 Cauchy 点和截断共轭梯度等方法。\n\n真正重要的是：\n\n> 子问题只需达到足够的模型下降质量，就可以支撑整个信赖域算法的收敛分析。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 9. 线搜索与信赖域：同一局部模型的两种全局化","line":1993,"end":1996,"text":"### 9. 线搜索与信赖域：同一局部模型的两种全局化\n\n可以把 Newton 类方法统一看成：\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 9. 线搜索与信赖域：同一局部模型的两种全局化 › 线搜索 Newton","line":1997,"end":2008,"text":"#### 线搜索 Newton\n\n$$\n\\nabla^2f(x_k)d_k=-g_k,\n$$\n\n然后寻找 $\\alpha_k$：\n\n$$\nx_{k+1}=x_k+\\alpha_kd_k.\n$$\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 9. 线搜索与信赖域：同一局部模型的两种全局化 › 信赖域 Newton","line":2009,"end":2021,"text":"#### 信赖域 Newton\n\n直接求\n\n$$\n\\min_{\\|d\\|\\le\\Delta_k}\ng_k^Td+\\frac12d^T\\nabla^2f(x_k)d.\n$$\n\n因此两者不是“有没有二阶信息”的区别，而是：\n\n> 如何限制二阶模型在远离当前点时造成的误导。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 10. 非线性最小二乘：利用残差结构，不要把它当普通黑箱","line":2022,"end":2056,"text":"### 10. 非线性最小二乘：利用残差结构，不要把它当普通黑箱\n\n考虑\n\n$$\nf(x)\n=\n\\frac12\\sum_{i=1}^{m}r_i(x)^2\n=\n\\frac12\\|r(x)\\|_2^2.\n$$\n\n记 $J(x)$ 为残差向量 $r(x)$ 的 Jacobian，则教材给出\n\n$$\n\\nabla f(x)\n=\nJ(x)^Tr(x),\n$$\n\n以及\n\n$$\n\\nabla^2f(x)\n=\nJ(x)^TJ(x)\n+\n\\sum_{i=1}^{m}\nr_i(x)\\nabla^2r_i(x).\n$$\n\n这说明 Hessian 自然分成两部分。\n\n第一部分 $J^TJ$ 在计算梯度时已经“顺带”获得；第二部分需要每个残差的 Hessian，代价更高。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 11. Gauss–Newton：舍掉难算的二阶残差项","line":2057,"end":2085,"text":"### 11. Gauss–Newton：舍掉难算的二阶残差项\n\nGauss–Newton 用\n\n$$\nJ_k^TJ_k\n$$\n\n近似真正 Hessian，于是方向满足\n\n$$\nJ_k^TJ_kd_k=-J_k^Tr_k.\n$$\n\n这等价于线性最小二乘子问题\n\n$$\n\\min_d\n\\frac12\\|J_kd+r_k\\|_2^2.\n$$\n\n教材把 Gauss–Newton 主要放在**小残量问题**中讨论。\n\n其局部速度结论不能简化成“永远二次收敛”：\n\n- 某个反映被舍弃 Hessian 项大小的量足够小时，可得到 Q-线性；\n- 当该项在解处为零时，可以达到 Q-二次；\n- 若被舍弃部分较大，Gauss–Newton 可能失效。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 12. Levenberg–Marquardt：Gauss–Newton 的信赖域化","line":2086,"end":2114,"text":"### 12. Levenberg–Marquardt：Gauss–Newton 的信赖域化\n\n教材把 LM 描述为信赖域型方法，考虑\n\n$$\n\\min_d\n\\frac12\\|J_kd+r_k\\|_2^2\n\\quad\n\\text{s.t. }\\|d\\|\\le\\Delta_k.\n$$\n\n相应最优性条件可以写为\n\n$$\n(J_k^TJ_k+\\lambda I)d\n=\n-J_k^Tr_k,\n\\qquad\n\\lambda\\ge0,\n$$\n\n并满足相应互补条件。\n\n这条式子揭示了 LM 的核心：\n\n- 当 $\\lambda$ 小，行为接近 Gauss–Newton；\n- 当 $\\lambda$ 大，步子更保守、更接近梯度型方向；\n- 即使 $J^TJ$ 奇异，加入正则项后仍可能得到稳定方向。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 13. “局部模型 → 方向 → 全局化 → 速度”总表","line":2115,"end":2131,"text":"### 13. “局部模型 → 方向 → 全局化 → 速度”总表\n\n| 方法 | 局部模型/曲率 | 方向或子问题 | 全局化 | 教材中的代表速度/性质 |\n|---|---|---|---|---|\n| Gradient | 一阶 | $-g_k$ | fixed / Armijo / Wolfe | 凸光滑函数值 $O(1/k)$；强凸时 Q-线性 |\n| BB | 标量谱曲率 | $-\\alpha_k g_k$ | 截断 + 非单调线搜索 | 正定二次情形 R-线性 |\n| Newton | 真 Hessian | $H_kd=-g_k$ | 经典版无；实用版线搜索/修正 | 合适局部条件下 Q-二次 |\n| BFGS | 拟 Hessian | $B_kd=-g_k$ 或 $-H_kg_k$ | Wolfe | 给定相应条件时 Q-超线性 |\n| L-BFGS | 最近若干割线对 | 双循环递归 | Wolfe | 降低内存，面向大规模 |\n| Trust region | 二阶模型 | $\\min m_k(d),\\|d\\|\\le\\Delta_k$ | $\\rho_k$ + 半径更新 | 全局化通过模型可信度控制 |\n| Gauss–Newton | $J^TJ$ | 线性 least-squares | 通常配线搜索 | 小残量；特定条件下 Q-线性/二次 |\n| LM | $J^TJ+\\lambda I$ | 正则化 least-squares / TR | 信赖域 | 对奇异/近奇异 $J^TJ$ 更稳健 |\n\n这张表不能理解成“速度排名”。\n\n局部收敛阶数、每步计算代价、内存、全局收敛前提以及问题结构不同，不能只看 Q-二次、Q-超线性、Q-线性几个词就判断实际耗时。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 14. 一个实用的算法选择视角 › 梯度 / BB","line":2134,"end":2142,"text":"#### 梯度 / BB\n\n适合：\n\n- 维度高；\n- Hessian 昂贵；\n- 中低精度阶段；\n- 希望每一步非常便宜。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 14. 一个实用的算法选择视角 › Newton / 修正 Newton","line":2143,"end":2150,"text":"#### Newton / 修正 Newton\n\n适合：\n\n- Hessian 可获得或可高效作用到向量；\n- 需要高精度；\n- 已进入较好的局部区域。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 14. 一个实用的算法选择视角 › BFGS / L-BFGS","line":2151,"end":2159,"text":"#### BFGS / L-BFGS\n\n适合：\n\n- Hessian 不易计算；\n- 梯度可计算；\n- 希望利用曲率；\n- L-BFGS 尤其适合大规模变量。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 14. 一个实用的算法选择视角 › Trust region","line":2160,"end":2167,"text":"#### Trust region\n\n适合：\n\n- 二阶局部模型可能在远处不可靠；\n- Hessian 可能不定；\n- 希望通过“模型预测 vs 实际下降”自动调节尺度。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 14. 一个实用的算法选择视角 › Gauss–Newton / LM","line":2168,"end":2177,"text":"#### Gauss–Newton / LM\n\n只有当目标确实具有\n\n$$\n\\frac12\\|r(x)\\|^2\n$$\n\n结构时才应优先考虑，因为它们的优势来自**利用问题结构**，而不是作为任意无约束问题的通用替代。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 15. 本单元实验","line":2178,"end":2187,"text":"### 15. 本单元实验\n\n运行：\n\n```bash\npython labs/16_optimization_unconstrained.py\n```\n\n实验分两组。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 15. 本单元实验 › A｜Rosenbrock：比较五种无约束策略","line":2188,"end":2213,"text":"#### A｜Rosenbrock：比较五种无约束策略\n\n从同一个初始点出发，比较：\n\n- gradient + Armijo；\n- BB + 非单调 Armijo；\n- modified Newton + Armijo；\n- BFGS + Armijo；\n- trust-region Newton model。\n\n记录：\n\n- $\\|\\nabla f(x_k)\\|$；\n- 迭代次数；\n- 最终函数值。\n\n观察重点：\n\n1. 一阶方法为什么会慢；\n2. BB 如何用谱步长改善梯度迭代；\n3. Newton 靠近解后为什么非常快；\n4. BFGS 如何在不显式使用真 Hessian 的情况下获得二阶加速；\n5. trust region 如何根据模型可信度接受/拒绝步长。\n\n> 这个实验只比较一个二维非凸函数，不能据此给算法做普遍排名。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 15. 本单元实验 › B｜非线性曲线拟合：Gauss–Newton vs LM","line":2214,"end":2230,"text":"#### B｜非线性曲线拟合：Gauss–Newton vs LM\n\n生成指数衰减模型\n\n$$\ny(t)=a\\exp(bt)+\\varepsilon,\n$$\n\n并比较：\n\n- Gauss–Newton；\n- LM 型阻尼更新。\n\n记录残差范数以及参数恢复结果。\n\n这里的目标是观察“利用 residual/Jacobian 结构”与普通通用算法的不同。\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 16. 练习","line":2231,"end":2248,"text":"### 16. 练习\n\n1. 写出 Armijo 准则，并解释“只要求函数下降”为何不足。\n2. 在正定二次函数上推导精确线搜索的梯度步长。\n3. 解释梯度法的条件数依赖为什么会产生之字形。\n4. 写出教材的 BB1/BB2，并说明 $s_k,y_k$ 各代表什么。\n5. 为什么经典 Newton 不是一个可靠的全局算法？\n6. 修正 Newton 为什么要让 $B_k$ 正定且条件数不要太差？\n7. 什么是拟 Newton 的割线方程？\n8. 为什么 BFGS 的全局收敛定理不能脱离 Wolfe 条件来复述？\n9. L-BFGS 为什么可以节省内存？\n10. 信赖域的 $\\rho_k$ 接近 1、很小、为负分别意味着什么？\n11. 推导非线性 least-squares 的梯度与 Hessian 分解。\n12. Gauss–Newton 丢掉了 Hessian 的哪一部分？\n13. 为什么“小残量”会让 Gauss–Newton 的近似更合理？\n14. LM 中 $\\lambda$ 增大时，为什么步骤通常会更保守？\n15. “Newton Q-二次，所以永远比 BFGS 快”为什么是错误说法？\n","resources":[]},{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度 › 17. 完成检查","line":2249,"end":2269,"text":"### 17. 完成检查\n\n进入 Unit 05 前，应能不看资料回答：\n\n- 线搜索与信赖域在全局化哲学上有什么区别？\n- Armijo 与 Wolfe 各控制什么？\n- 梯度法、BB、Newton、BFGS 各自用了多少曲率信息？\n- 为什么 BB 可以非单调？\n- Newton 的 Q-二次结论需要哪些局部条件？\n- 修正 Newton 怎样解决 Hessian 不正定？\n- BFGS 的割线方程是什么？\n- L-BFGS 为什么适合大规模问题？\n- 信赖域中的 actual reduction / predicted reduction 是什么？\n- Gauss–Newton 为什么能省掉一部分二阶导数？\n- LM 和 trust region 的关系是什么？\n- 为什么不能仅按“Q-二次 > Q-超线性 > Q-线性”给算法排优劣？\n\n下一单元：[Unit 05｜约束优化算法](optimization-pku-wenzw-study-units/05-constrained.md)\n\n---\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法","line":2270,"end":2277,"text":"## Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法\n\n> 对应电子讲义：罚函数法、增广拉格朗日函数法、线性规划内点法。\n>\n> 对应教材：第 7 章“约束优化算法”，本单元重点覆盖 7.1、7.2、7.3。\n>\n> 第二版第 7.4 节“流形约束优化算法”保留到 Unit 08 单独展开，不在本单元重复。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 1. 一条统一主线","line":2278,"end":2310,"text":"### 1. 一条统一主线\n\nUnit 03 已经给出了 KKT、乘子、对偶和约束品性。Unit 05 开始问：\n\n> 算法怎样逐步同时降低目标值、降低约束违反、逼近正确乘子，并最终满足 KKT？\n\n本单元把三类策略统一为：\n\n```text\n外点罚函数：把不可行性变成越来越重的代价\n→ 增广 Lagrangian：罚函数 + 乘子更新\n→ 原始–对偶内点：同时更新原始变量、对偶变量和互补条件\n```\n\n对一般问题\n\n$$\n\\begin{aligned}\n\\min_x\\quad & f(x)\\\\\n\\text{s.t.}\\quad\n& c_i(x)=0,\\quad i\\in E,\\\\\n& c_i(x)\\le0,\\quad i\\in I,\n\\end{aligned}\n$$\n\n算法真正要同时控制的是：\n\n- stationarity；\n- equality feasibility；\n- inequality feasibility；\n- dual feasibility；\n- complementary slackness。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 2. 二次罚函数：把约束变成目标的一部分 › 2.1 等式约束","line":2313,"end":2345,"text":"#### 2.1 等式约束\n\n对\n\n$$\nc_i(x)=0,\n$$\n\n教材定义二次罚函数\n\n$$\nP_E(x,\\sigma)\n=\nf(x)\n+\n\\frac{\\sigma}{2}\n\\sum_{i\\in E}c_i(x)^2.\n$$\n\n罚因子 $\\sigma>0$ 越大，不可行点受到的惩罚越强。\n\n典型外迭代是：\n\n```text\n选择 σ_0\n→ 近似求解 min P_E(x,σ_k)\n→ 增大 σ_k\n→ 用上一子问题的解 warm start\n→ 重复\n```\n\n这也是 continuation 思想的一种形式。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 2. 二次罚函数：把约束变成目标的一部分 › 2.2 不等式约束","line":2346,"end":2378,"text":"#### 2.2 不等式约束\n\n对\n\n$$\nc_i(x)\\le0,\n$$\n\n不能直接罚 $c_i(x)^2$，否则严格可行的 $c_i(x)\u003c0$ 也会被惩罚。\n\n教材采用\n\n$$\n[c_i(x)]_+\n=\n\\max\\{c_i(x),0\\},\n$$\n\n并构造\n\n$$\nP_I(x,\\sigma)\n=\nf(x)\n+\n\\frac{\\sigma}{2}\n\\sum_{i\\in I}[c_i(x)]_+^2.\n$$\n\n这只惩罚违反约束的部分。\n\n教材指出：该平方正部函数可导，但一般不是二阶可导，因此不能简单把普通光滑 Newton 理论原样套上去。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 3. 二次罚函数为什么会数值变难？","line":2379,"end":2412,"text":"### 3. 二次罚函数为什么会数值变难？\n\n二次罚函数法为了逼近严格可行性，通常需要\n\n$$\n\\sigma_k\\to+\\infty.\n$$\n\n教材对等式约束给出的 Hessian 结构可写成\n\n$$\n\\nabla^2_{xx}P_E(x,\\sigma)\n=\n\\nabla^2f(x)\n+\n\\sigma\\sum_i c_i(x)\\nabla^2c_i(x)\n+\n\\sigma\\nabla c(x)\\nabla c(x)^T.\n$$\n\n在接近解时，最后一项随 $\\sigma$ 放大，而它通常只在约束法向方向上强化曲率。\n\n结果是：\n\n> 约束违反越来越小，但子问题条件数可能越来越差。\n\n这就是罚函数的核心权衡：\n\n```text\n更大的 σ\n→ 更接近可行域\n→ 但子问题更病态\n```\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 4. 罚函数收敛：必须保留前提","line":2413,"end":2439,"text":"### 4. 罚函数收敛：必须保留前提\n\n教材定理 7.1 的结论不是无条件的。\n\n如果：\n\n- 每个二次罚函数子问题都取得全局极小解；\n- $\\sigma_k$ 单调趋于 $+\\infty$；\n\n那么这些子问题解序列的每个极限点都是原问题的全局极小解。\n\n实际中通常只能近似求子问题。教材定理 7.2进一步要求：\n\n- 子问题一阶残差趋于零；\n- $\\sigma_k\\to+\\infty$；\n- 极限点处等式约束梯度线性无关；\n\n此时极限点满足原问题 KKT，而且\n\n$$\n-\\sigma_k c_i(x_{k+1})\n\\to\n\\lambda_i^*.\n$$\n\n所以罚函数不仅在逼近可行性，还隐式地“制造”出乘子估计。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 5. 精确罚函数：有限罚因子也可能够用","line":2440,"end":2472,"text":"### 5. 精确罚函数：有限罚因子也可能够用\n\n教材还介绍 $\\ell_1$ 精确罚函数：\n\n$$\nP(x,\\sigma)\n=\nf(x)\n+\n\\sigma\n\\left(\n\\sum_{i\\in E}|c_i(x)|\n+\n\\sum_{i\\in I}[c_i(x)]_+\n\\right).\n$$\n\n和二次罚函数不同，它是非光滑的。\n\n教材定理 7.3 给出一个局部精确性结论：若 $x^*$ 是严格局部极小点并满足 KKT，乘子为 $\\lambda^*$，则当\n\n$$\n\\sigma>\\|\\lambda^*\\|_\\infty\n$$\n\n时，$x^*$ 也是该 $\\ell_1$ 罚函数的局部极小点。\n\n所以“精确”指的是：\n\n> 不需要让罚因子趋于无穷，有限大的罚因子就可能保留原问题局部解。\n\n但代价是子问题变成非光滑问题，这会和 Unit 06 的 proximal 方法衔接。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 6. 增广 Lagrangian：用乘子避免一味增大罚因子","line":2473,"end":2526,"text":"### 6. 增广 Lagrangian：用乘子避免一味增大罚因子\n\n对等式约束，教材定义\n\n$$\nL_\\sigma(x,\\lambda)\n=\nf(x)\n+\n\\sum_{i\\in E}\\lambda_i c_i(x)\n+\n\\frac{\\sigma}{2}\n\\sum_{i\\in E}c_i(x)^2.\n$$\n\n给定 $(\\lambda_k,\\sigma_k)$，先近似求\n\n$$\nx_{k+1}\n\\approx\n\\arg\\min_x\nL_{\\sigma_k}(x,\\lambda_k),\n$$\n\n再更新乘子\n\n$$\n\\lambda_{k+1}\n=\n\\lambda_k\n+\n\\sigma_k c(x_{k+1}).\n$$\n\n这里的关键不是“多加了一项”，而是：\n\n```text\n二次罚函数\n只靠 σ 压约束\n\n增广 Lagrangian\n靠 σ + λ_k 一起控制约束\n```\n\n教材由\n\n$$\nc_i(x_{k+1})\n\\approx\n\\frac{\\lambda_i^*-\\lambda_i^k}{\\sigma_k}\n$$\n\n解释了这一点：当乘子已经接近真实乘子时，即使 $\\sigma_k$ 不是极端大，约束违反也可以很小。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 7. 增广 Lagrangian 的局部精确性","line":2527,"end":2553,"text":"### 7. 增广 Lagrangian 的局部精确性\n\n教材定理 7.4 的条件包括：\n\n- $x^*$ 是等式约束问题局部极小点；\n- 对应乘子为 $\\lambda^*$；\n- LICQ 成立；\n- 二阶充分条件成立。\n\n则存在有限的 $\\bar\\sigma$，使得对\n\n$$\n\\sigma\\ge\\bar\\sigma,\n$$\n\n$x^*$ 是\n\n$$\nL_\\sigma(x,\\lambda^*)\n$$\n\n的严格局部极小点。\n\n这正是 ALM 相比纯二次罚函数的重要优势之一：\n\n> 在乘子正确或足够接近时，不必靠 $\\sigma\\to\\infty$ 才能锁定局部解。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 8. 一般不等式约束的 ALM","line":2554,"end":2579,"text":"### 8. 一般不等式约束的 ALM\n\n教材通过松弛变量把\n\n$$\nc_i(x)\\le0\n$$\n\n改写成\n\n$$\nc_i(x)+s_i=0,\n\\qquad\ns_i\\ge0.\n$$\n\n消去 $s_i$ 后，增广 Lagrangian 中出现\n\n$$\n\\max\\left\\{\n\\frac{\\mu_i}{\\sigma}+c_i(x),0\n\\right\\}.\n$$\n\n对应乘子更新为：\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 8. 一般不等式约束的 ALM › 等式约束","line":2580,"end":2589,"text":"#### 等式约束\n\n$$\n\\lambda_i^{k+1}\n=\n\\lambda_i^k\n+\n\\sigma_k c_i(x_{k+1}).\n$$\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 8. 一般不等式约束的 ALM › 不等式约束","line":2590,"end":2618,"text":"#### 不等式约束\n\n$$\n\\mu_i^{k+1}\n=\n\\max\\{\n\\mu_i^k+\\sigma_k c_i(x_{k+1}),\n0\n\\}.\n$$\n\n这个投影式更新直接维护\n\n$$\n\\mu_i^{k+1}\\ge0.\n$$\n\n教材的算法 7.6 还把“约束违反是否已经足够小”作为参数更新逻辑的一部分：\n\n- 若违反度下降得足够好：更新乘子、提高子问题精度，罚因子可保持；\n- 若违反度不够好：暂缓乘子更新并增大罚因子。\n\n所以实际 ALM 是一个双层控制系统：\n\n```text\n内层：近似最小化增广 Lagrangian\n外层：看约束违反 → 更新 multiplier 或 penalty\n```\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 9. 凸问题中的 ALM：原始与对偶同时出现","line":2619,"end":2636,"text":"### 9. 凸问题中的 ALM：原始与对偶同时出现\n\n教材第 7.2.3 对凸问题给出 ALM 收敛结论。\n\n在相应不精确子问题条件下，如果 Slater 成立，则：\n\n- 乘子序列有界并收敛；\n- 乘子极限是对偶问题的最优解。\n\n如果再有一个非空有界的适当下水平集，则：\n\n- 原始迭代点序列有界；\n- 所有聚点都是原问题最优解。\n\n所以在凸问题中，ALM 的乘子更新不是一个“辅助变量技巧”，而是实实在在地在逼近**对偶最优解**。\n\n教材在基追踪和半定规划中都进一步展示了原始问题与对偶问题两侧的 ALM 结构。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 10. 原始–对偶结构：从 KKT 到算法","line":2637,"end":2640,"text":"### 10. 原始–对偶结构：从 KKT 到算法\n\n线性规划写成：\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 10. 原始–对偶结构：从 KKT 到算法 › 原始问题","line":2641,"end":2651,"text":"#### 原始问题\n\n$$\n\\begin{aligned}\n\\min_x\\quad & c^Tx\\\\\n\\text{s.t.}\\quad\n& Ax=b,\\\\\n& x\\ge0.\n\\end{aligned}\n$$\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 10. 原始–对偶结构：从 KKT 到算法 › 对偶问题","line":2652,"end":2690,"text":"#### 对偶问题\n\n$$\n\\begin{aligned}\n\\max_y\\quad & b^Ty\\\\\n\\text{s.t.}\\quad\n& A^Ty+s=c,\\\\\n& s\\ge0.\n\\end{aligned}\n$$\n\nKKT 为：\n\n$$\nAx=b,\n$$\n\n$$\nA^Ty+s=c,\n$$\n\n$$\nx_i s_i=0,\n$$\n\n$$\nx\\ge0,\\quad s\\ge0.\n$$\n\n这里：\n\n- $x$ 是原始变量；\n- $y,s$ 是对偶侧变量；\n- $x_i s_i=0$ 是互补松弛。\n\n**原始–对偶算法**的含义就是：\n\n> 不只更新 $x$，而是把原始可行性、对偶可行性和互补性放进同一套方程一起处理。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 11. 内点法：先不碰边界，再逐渐逼近互补条件","line":2691,"end":2752,"text":"### 11. 内点法：先不碰边界，再逐渐逼近互补条件\n\n在线性规划最优解处通常有某些分量\n\n$$\nx_i=0\n$$\n\n或\n\n$$\ns_i=0.\n$$\n\n而内点法在迭代期间保持\n\n$$\nx>0,\n\\qquad\ns>0.\n$$\n\n它不能立即满足\n\n$$\nx_i s_i=0.\n$$\n\n所以教材把互补条件扰动为\n\n$$\nx_i s_i=\\tau,\n\\qquad\n\\tau>0.\n$$\n\n于是得到中心路径方程：\n\n$$\nAx=b,\n$$\n\n$$\nA^Ty+s=c,\n$$\n\n$$\nx_i s_i=\\tau,\n$$\n\n$$\nx>0,\\quad s>0.\n$$\n\n当\n\n$$\n\\tau\\downarrow0,\n$$\n\n这条路径逼近原始 KKT 系统。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 12. Barrier 视角与中心路径","line":2753,"end":2784,"text":"### 12. Barrier 视角与中心路径\n\n教材指出中心路径也可以从对数 barrier 问题理解：\n\n$$\n\\begin{aligned}\n\\min_x\\quad\n& c^Tx\n-\n\\tau\\sum_{i=1}^n\\log x_i\\\\\n\\text{s.t.}\\quad\n& Ax=b.\n\\end{aligned}\n$$\n\n这里\n\n$$\n-\\log x_i\n$$\n\n在 $x_i\\downarrow0$ 时趋于 $+\\infty$，所以迭代点被留在严格内部。\n\n随着 $\\tau$ 变小，barrier 逐渐减弱，允许解越来越接近边界上的 LP 最优点。\n\n这和外点罚函数正好形成对照：\n\n| 方法 | 迭代位置 |\n|---|---|\n| 外点罚函数 | 通常在可行域外逐渐逼近 |\n| 内点/barrier | 始终在可行域严格内部移动 |\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 13. 原始–对偶 Newton 系统","line":2785,"end":2818,"text":"### 13. 原始–对偶 Newton 系统\n\n对扰动 KKT 方程做 Newton 线性化，可以同时求：\n\n$$\n(\\Delta x,\\Delta y,\\Delta s).\n$$\n\n然后更新\n\n$$\nx_{k+1}=x_k+\\alpha\\Delta x,\n$$\n\n$$\ny_{k+1}=y_k+\\alpha\\Delta y,\n$$\n\n$$\ns_{k+1}=s_k+\\alpha\\Delta s.\n$$\n\n步长 $\\alpha$ 必须保证\n\n$$\nx_{k+1}>0,\n\\qquad\ns_{k+1}>0.\n$$\n\n因此内点法虽然使用 Newton 型方向，但还要做“fraction-to-boundary”式的步长控制，防止走出严格内部。\n\n主要计算代价集中在原始–对偶 Newton 线性系统的求解。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 14. 对偶间隙与中心路径","line":2819,"end":2846,"text":"### 14. 对偶间隙与中心路径\n\n若 $(x,y,s)$ 同时满足原始和对偶可行性，则\n\n$$\nc^Tx-b^Ty\n=\nx^Ts.\n$$\n\n在中心路径上\n\n$$\nx_i s_i=\\tau,\n$$\n\n因此\n\n$$\nx^Ts=n\\tau.\n$$\n\n这给出了非常直观的停止尺度：\n\n> 当互补乘积和对偶间隙都趋近于零时，原始–对偶对正在逼近 KKT 解。\n\n这里是由教材给出的原始/对偶可行方程与中心路径方程直接推得的代数结果。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 15. 路径追踪：不是每次从头解 barrier 子问题","line":2847,"end":2866,"text":"### 15. 路径追踪：不是每次从头解 barrier 子问题\n\n实际算法不会为每一个更小的 $\\tau$ 完全从头求解。\n\n更常见的路径追踪逻辑是：\n\n```text\n选择当前中心参数\n→ Newton 校正到中心路径附近\n→ 降低中心参数\n→ 用当前点 warm start\n→ 重复\n```\n\n这和罚函数 continuation 在结构上有相似之处：\n\n- 都是一系列参数化子问题；\n- 都利用上一阶段解 warm start；\n- 但一个从外侧压向可行域，一个从内部沿中心路径走向边界。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 16. 三类算法的统一比较","line":2867,"end":2875,"text":"### 16. 三类算法的统一比较\n\n| 方法 | 核心参数 | 原始可行性 | 对偶变量 | 主要数值问题 |\n|---|---|---|---|---|\n| 二次罚函数 | $\\sigma\\uparrow\\infty$ | 渐近逼近 | 隐式出现 | 大 $\\sigma$ 导致病态 |\n| 精确 $\\ell_1$ 罚函数 | 有限 $\\sigma$ | 可有限参数精确 | 阈值与乘子相关 | 非光滑子问题 |\n| 增广 Lagrangian | $\\sigma$ + $\\lambda_k$ | 通过乘子反馈逼近 | 显式更新 | 内层子问题与参数协调 |\n| 原始–对偶内点 | $\\tau\\downarrow0$ | 维持严格内部 | 显式同时更新 | Newton/KKT 线性系统 |\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 17. 和前后单元的关系 › 来自 Unit 03","line":2878,"end":2888,"text":"#### 来自 Unit 03\n\n本单元算法的终点几乎都在逼近：\n\n- stationarity；\n- primal feasibility；\n- dual feasibility；\n- complementary slackness。\n\n也就是 KKT。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 17. 和前后单元的关系 › 通往 Unit 06","line":2889,"end":2899,"text":"#### 通往 Unit 06\n\nALM 的很多子问题会包含：\n\n- $\\ell_1$；\n- 投影；\n- indicator function；\n- 非光滑复合结构。\n\n这正是 proximal / splitting / ADMM 的入口。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 17. 和前后单元的关系 › 通往 Unit 08","line":2900,"end":2910,"text":"#### 通往 Unit 08\n\n第二版第 7.4 节把约束几何推进到流形：\n\n- tangent space；\n- Riemannian gradient；\n- retraction；\n- manifold Newton / trust-region。\n\n这些内容会作为 Unit 08 单独处理。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 18. 本单元实验","line":2911,"end":2920,"text":"### 18. 本单元实验\n\n运行：\n\n```bash\npython labs/17_optimization_constrained.py\n```\n\n实验分两组。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 18. 本单元实验 › A｜二次罚函数 vs 增广 Lagrangian","line":2921,"end":2936,"text":"#### A｜二次罚函数 vs 增广 Lagrangian\n\n问题：\n\n$$\n\\min_x\n\\frac12\\|x-q\\|_2^2\n\\quad\n\\text{s.t. }\na^Tx=b.\n$$\n\n这个问题可以显式求最优解。\n\n实验比较：\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 18. 本单元实验 › A｜二次罚函数 vs 增广 Lagrangian › 纯二次罚函数","line":2937,"end":2953,"text":"##### 纯二次罚函数\n\n$$\n\\frac12\\|x-q\\|^2\n+\n\\frac{\\sigma}{2}(a^Tx-b)^2.\n$$\n\n随着 $\\sigma$ 增大：\n\n- 约束违反减小；\n- 子问题 Hessian\n  $$\n  I+\\sigma aa^T\n  $$\n  的条件数增大。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 18. 本单元实验 › A｜二次罚函数 vs 增广 Lagrangian › ALM","line":2954,"end":2980,"text":"##### ALM\n\n固定一个有限 $\\sigma$，重复：\n\n$$\nx_{k+1}\n=\n\\arg\\min_x\nL_\\sigma(x,\\lambda_k),\n$$\n\n$$\n\\lambda_{k+1}\n=\n\\lambda_k\n+\n\\sigma(a^Tx_{k+1}-b).\n$$\n\n观察：\n\n- 约束违反快速下降；\n- $\\lambda_k$ 逼近真实 KKT 乘子；\n- 内层 Hessian 条件数保持固定。\n\n这正好展示“为什么要从 penalty 走向 ALM”。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 18. 本单元实验 › B｜原始–对偶中心路径","line":2981,"end":3022,"text":"#### B｜原始–对偶中心路径\n\n线性规划：\n\n$$\n\\begin{aligned}\n\\min_{x_1,x_2}\\quad & x_1+2x_2\\\\\n\\text{s.t.}\\quad\n& x_1+x_2=1,\\\\\n& x_1,x_2\\ge0.\n\\end{aligned}\n$$\n\n最优点在边界：\n\n$$\nx^*=(1,0).\n$$\n\n实验直接解一系列中心路径方程：\n\n$$\nAx=b,\n$$\n\n$$\nA^Ty+s=c,\n$$\n\n$$\nx_i s_i=\\tau,\n$$\n\n并逐步减小 $\\tau$。\n\n观察：\n\n- $x_2\\to0$；\n- $s_1\\to0$；\n- $x^Ts=2\\tau\\to0$；\n- 原始目标和对偶目标逐渐靠拢。\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 19. 练习","line":3023,"end":3053,"text":"### 19. 练习\n\n1. 对等式约束问题写出二次罚函数，并解释为什么需要逐步增大 $\\sigma$。\n2. 为什么不等式罚函数必须使用 $[c_i(x)]_+$，而不是直接 $c_i(x)^2$？\n3. 教材定理 7.1 为什么在实际中较强？它对子问题解要求了什么？\n4. 解释\n   $$\n   -\\sigma_k c_i(x_{k+1})\\to\\lambda_i^*\n   $$\n   的意义。\n5. 为什么二次罚函数在 $\\sigma\\to\\infty$ 时容易病态？\n6. 精确 $\\ell_1$ 罚函数中的“精确”是什么意思？\n7. 推导等式 ALM 的乘子更新\n   $$\n   \\lambda_{k+1}=\\lambda_k+\\sigma_kc(x_{k+1}).\n   $$\n8. 不等式 ALM 为什么要做\n   $$\n   \\max\\{\\mu_i^k+\\sigma c_i(x),0\\}?\n   $$\n9. 在凸问题中，ALM 的乘子极限为什么可以解释为对偶最优解？\n10. 写出 LP 的原始、对偶和四类 KKT 条件。\n11. 为什么内点法在迭代中不能直接满足 $x_is_i=0$？\n12. 中心路径为什么使用 $x_is_i=\\tau$？\n13. 推导可行原始–对偶点的 gap：\n    $$\n    c^Tx-b^Ty=x^Ts.\n    $$\n14. 外点罚函数和 log-barrier 在“从哪一侧逼近”上有什么根本区别？\n15. 为什么路径追踪和 penalty continuation 都需要 warm start？\n","resources":[]},{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法 › 20. 完成检查","line":3054,"end":3071,"text":"### 20. 完成检查\n\n进入 Unit 06 前，应能回答：\n\n- 二次罚函数、精确罚函数、ALM 的差别是什么？\n- 为什么 penalty parameter 太大会造成数值困难？\n- ALM 的乘子更新在控制什么？\n- 一般不等式 ALM 怎样保持乘子非负？\n- 原始与对偶变量为什么应该联合看？\n- LP 的 KKT 条件是什么？\n- 内点法为什么维护 $x>0,s>0$？\n- 中心路径和 barrier 子问题是什么关系？\n- 原始–对偶 gap 为什么等于 $x^Ts$？\n- 为什么 ALM 与内点法都可以看成“直接逼近 KKT”，但采用了完全不同的路径？\n\n下一单元：[Unit 06｜复合优化：proximal、加速与分裂](optimization-pku-wenzw-study-units/06-composite.md)\n\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面","line":3072,"end":3075,"text":"## 6. Unit 06–10 原施工规格与现行独立页面\n\n> Unit 06 的已合并草稿见[独立学习页](optimization-pku-wenzw-study-units/06-composite.md)及 `labs/18_optimization_composite.py`。本节保留原施工规格；Unit 07–10 的现行独立页面见上表，尚未完成来源和运行验收。\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 06｜复合优化：proximal、加速、分裂","line":3076,"end":3099,"text":"### Unit 06｜复合优化：proximal、加速、分裂\n\n**状态：独立学习页与实验已交付草稿，待来源复核与 PR 验收；下列条目为原施工规格。**\n\n**直接讲义：**\n\n- 19 近似点算子：18-lect-prox_map.pdf；\n- 20 近似点梯度算法：19-lect-proxg.pdf；\n- 21 Nesterov 加速算法：20-lect-nesterov-ch.pdf；\n- 22 近似点算法：21-lect-prox_point.pdf；\n- 23 分块坐标下降法：22-lect-BCD.pdf / 22-lect-BCD-pku.pdf；\n- 24 对偶算法：23-lect-DualAlgo.pdf；\n- 25 ADMM：24-lect-admm-chhyx.pdf。\n\n**教材范围：第 8.1–8.6 节。**\n\n核心问题统一写为\n\n$$\n\\min_x \\psi(x)=f(x)+h(x),\n$$\n\n其中 f 通常光滑，h 可以不可微，但要求其结构可利用。\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 06｜复合优化：proximal、加速、分裂 › 06.1 邻近算子","line":3100,"end":3120,"text":"#### 06.1 邻近算子\n\n建立\n\n$$\n\\operatorname{prox}_{t h}(v)\n=\n\\arg\\min_u\n\\left\\{\nh(u)+\\frac{1}{2t}\\|u-v\\|^2\n\\right\\}.\n$$\n\n必须掌握：\n\n- indicator function 的 prox = projection；\n- l1 的 prox = soft-thresholding；\n- 为什么 prox 可以理解为“隐式一步”；\n- Moreau–Yosida 正则化与 prox 的关系；\n- prox 是否单值需要哪些条件，不能把凸情形结论无条件搬到非凸情形。\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 06｜复合优化：proximal、加速、分裂 › 06.2 Proximal Gradient / ISTA","line":3121,"end":3152,"text":"#### 06.2 Proximal Gradient / ISTA\n\n教材的核心更新：\n\n$$\nx_{k+1}\n=\n\\operatorname{prox}_{t_kh}\n\\bigl(x_k-t_k\\nabla f(x_k)\\bigr).\n$$\n\n统一解释为：\n\n- 对 f 做显式梯度步；\n- 对 h 做隐式 prox 步；\n- 或者最小化“光滑项线性化 + 二次稳定项 + 原非光滑项”。\n\n重点模型：\n\n$$\n\\min_x\n\\frac12\\|Ax-b\\|^2+\\lambda\\|x\\|_1.\n$$\n\n即 LASSO。\n\n待记录：\n\n- 固定步长与线搜索条件；\n- 凸光滑情形的代表性函数值速度；\n- 非凸 prox-gradient 需要保留的额外条件和多值 prox 边界。\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 06｜复合优化：proximal、加速、分裂 › 06.3 Nesterov / FISTA","line":3153,"end":3168,"text":"#### 06.3 Nesterov / FISTA\n\n教材明确把 proximal-gradient 的 O(1/k) 凸情形提升到 Nesterov/FISTA 的代表性\n\n$$\nO(1/k^2).\n$$\n\n学习重点：\n\n- extrapolation point；\n- estimate-sequence / 加速思想；\n- FISTA 为什么仍然只用一阶信息；\n- 非单调目标轨迹与函数值理论保证的区别；\n- restart 为什么是实际常见技巧，但不能把经验技巧写成无条件理论结论。\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 06｜复合优化：proximal、加速、分裂 › 06.4 Proximal Point","line":3169,"end":3182,"text":"#### 06.4 Proximal Point\n\n学习\n\n$$\nx_{k+1}\n=\n\\operatorname{prox}_{t_k f}(x_k).\n$$\n\n必须连接 Unit 05：\n\n> 教材后续明确讨论 proximal-point 与 augmented Lagrangian 的对偶关系；原始问题上做 ALM，可对应对偶问题上的 proximal-point 更新。\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 06｜复合优化：proximal、加速、分裂 › 06.5 Block Coordinate Descent","line":3183,"end":3199,"text":"#### 06.5 Block Coordinate Descent\n\n统一问题：\n\n$$\nx=(x_1,\\ldots,x_p),\n$$\n\n每次只更新一个或一组 block。\n\n要求掌握：\n\n- cyclic / randomized block update；\n- block-separable nonsmooth term；\n- 为什么“每个子问题都下降”并不自动等于任意非凸问题全局收敛；\n- LASSO / dictionary learning 等模型中的 block structure。\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 06｜复合优化：proximal、加速、分裂 › 06.6 Dual Methods","line":3200,"end":3210,"text":"#### 06.6 Dual Methods\n\n目标是把 Unit 03 的 duality 从“判定最优”推进到“直接在 dual 上迭代”。\n\n应覆盖：\n\n- dual decomposition；\n- primal recovery；\n- projection / prox on dual feasible set；\n- 对偶残差和原始残差如何一起解释。\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 06｜复合优化：proximal、加速、分裂 › 06.7 ADMM","line":3211,"end":3255,"text":"#### 06.7 ADMM\n\n标准分裂结构：\n\n$$\n\\min_{x,z}\nf(x)+g(z)\n\\quad\n\\text{s.t. }Ax+Bz=c.\n$$\n\n通过 augmented Lagrangian 交替最小化：\n\n1. x-update；\n2. z-update；\n3. multiplier update。\n\n必须和 Unit 05 建立明确联系：\n\n- ADMM 来自 augmented Lagrangian + variable splitting + alternating minimization；\n- primal residual / dual residual 是停止准则的一部分；\n- penalty parameter rho 会影响数值表现，但不能把某个固定经验值写成理论最优。\n\n**待审实验：** labs/18_optimization_composite.py\n\n同一个 LASSO 问题比较：\n\n- ISTA；\n- FISTA；\n- coordinate descent；\n- ADMM。\n\n记录 objective gap、KKT/prox-gradient residual、sparsity、ADMM primal/dual residual，以及每步成本与迭代数。\n\n**完成标准：**\n\n- 能手推 soft-threshold prox；\n- 能从 quadratic upper model 推导 proximal-gradient；\n- 能解释 ISTA 与 FISTA 的差别；\n- 能从 ALM 推出 ADMM 更新结构；\n- 能解释 primal/dual residual；\n- 能给出一个“算法迭代次数少但每步更贵”的案例，避免只按迭代数排名。\n\n---\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 07｜随机与非光滑高级算法","line":3256,"end":3268,"text":"### Unit 07｜随机与非光滑高级算法\n\n**状态：独立页面及脚本已写，未运行；本节为原施工规格。**\n\n**讲义：**\n\n- 10 次梯度；\n- 11 次梯度算法；\n- 26 随机优化算法；\n- 27 半光滑牛顿算法。\n\n**教材范围：第 6.3、8.7、8.8 节。**\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 07｜随机与非光滑高级算法 › 07.1 次梯度与次梯度算法","line":3269,"end":3285,"text":"#### 07.1 次梯度与次梯度算法\n\n补回 Unit 04 暂缓的第 6.3 节。\n\n$$\ng_k\\in\\partial f(x_k),\n\\qquad\nx_{k+1}=x_k-\\alpha_k g_k.\n$$\n\n重点是步长：\n\n- 固定步长可能只到邻域；\n- diminishing step 需要保留具体求和条件；\n- 次梯度法通常非单调；\n- 不能把光滑梯度法的 Lipschitz-gradient 速度直接搬过来。\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 07｜随机与非光滑高级算法 › 07.2 随机优化","line":3286,"end":3301,"text":"#### 07.2 随机优化\n\n教材第 8.7 采用有限和模型\n\n$$\nf(x)=\\frac1N\\sum_{i=1}^N f_i(x).\n$$\n\n要覆盖：\n\n- stochastic gradient estimator；\n- unbiasedness / variance；\n- batch / mini-batch；\n- diminishing learning rate；\n- convex / strongly convex / nonconvex 情形分开记录。\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 07｜随机与非光滑高级算法 › 07.3 方差减小","line":3302,"end":3312,"text":"#### 07.3 方差减小\n\n教材目录明确包含“方差减小技术”。\n\n学习目标：\n\n- 为什么普通 SGD 接近解时噪声仍存在；\n- full-gradient snapshot + stochastic correction 的思想；\n- 比较单步成本、epoch 成本和精度区间；\n- 不用“方差减小一定更快”这种无条件表述。\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 07｜随机与非光滑高级算法 › 07.4 半光滑 Newton","line":3313,"end":3352,"text":"#### 07.4 半光滑 Newton\n\n第二版新增重点。教材先引入：\n\n- B-subdifferential；\n- Clarke generalized Jacobian；\n- semismoothness；\n- strong semismoothness。\n\n然后构造 nonsmooth Newton-type 方法。\n\n核心问题：\n\n> 一阶非光滑算法容易得到低精度解，但高精度尾部可能很慢；半光滑 Newton 用广义导数恢复局部高速收敛。\n\n必须保留：\n\n- 超线性/二次局部速度依赖半光滑性与相应正则条件；\n- globalized semismooth Newton 还需要线搜索/merit function 等机制；\n- 不可把经典光滑 Newton 的 Hessian 理论原样复制。\n\n**建议实验：** labs/19_optimization_stochastic_nonsmooth.py\n\n两组：\n\n1. LASSO：subgradient vs proximal gradient；\n2. logistic finite-sum：full gradient vs SGD vs 一个方差减小版本。\n\n可增加一个低维 semismooth equation 演示 generalized Jacobian Newton。\n\n**完成标准：**\n\n- 能写出次梯度算法及步长要求；\n- 能解释 stochastic gradient 为什么便宜、为什么有噪声；\n- 能解释 variance reduction 的动机；\n- 能定义 generalized Jacobian 的角色；\n- 能区分 semismooth Newton 的高精度局部区间和 SGD 的大规模低成本区间。\n\n---\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 08｜流形约束优化","line":3353,"end":3376,"text":"### Unit 08｜流形约束优化\n\n**状态：独立页面及脚本已写，未运行；教材内容已登记，独立电子讲义 PDF 尚未确认。**\n\n第二版第 7.4 节目录已确认包括：\n\n- 7.4.1 流形基本概念；\n- 7.4.2 典型流形；\n- 7.4.3 最优性条件；\n- 7.4.4 retraction 与 vector transport；\n- 7.4.5 一阶优化方法；\n- 7.4.6 二阶优化算法；\n- 7.4.7 应用举例；\n- 7.4.8 收敛性分析。\n\n**资源边界：**\n\n当前 27 主题 / 33 PDF 中没有单列“流形约束优化”讲义。自动维护只能通过真实目录或页面发现后登记，**禁止猜文件名**。\n\n现有代码入口：\n\n- ARNT：https://github.com/optsuite/ARNT\n- OptM：https://github.com/optsuite/OptM\n","resources":[{"label":"https://github.com/optsuite/ARNT","url":"https://github.com/optsuite/ARNT"},{"label":"https://github.com/optsuite/OptM","url":"https://github.com/optsuite/OptM"}]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 08｜流形约束优化 › 08.1 从欧氏约束到流形","line":3377,"end":3392,"text":"#### 08.1 从欧氏约束到流形\n\n典型正交约束：\n\n$$\nX^TX=I.\n$$\n\n需要建立：\n\n- manifold；\n- tangent space；\n- Riemannian metric；\n- Riemannian gradient；\n- Riemannian Hessian。\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 08｜流形约束优化 › 08.2 Retraction","line":3393,"end":3404,"text":"#### 08.2 Retraction\n\n切空间方向 xi_k 通过\n\n$$\nx_{k+1}=R_{x_k}(t_k\\xi_k)\n$$\n\n映回流形。\n\n教材确认讨论 exponential map、Cayley transform、polar decomposition 和 QR-based retraction。\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 08｜流形约束优化 › 08.3 一阶方法","line":3405,"end":3414,"text":"#### 08.3 一阶方法\n\nRiemannian gradient descent：\n\n$$\n\\xi_k=-\\operatorname{grad} f(x_k),\n$$\n\n配合流形上的 Armijo / nonmonotone search 和 retraction。\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 08｜流形约束优化 › 08.4 二阶方法","line":3415,"end":3439,"text":"#### 08.4 二阶方法\n\n教材明确包含 Riemannian Newton、Riemannian trust-region 以及自适应正则化思路。\n\n**建议实验：** labs/20_optimization_manifold.py\n\n首选 sphere / Stiefel：\n\n$$\n\\min_{\\|x\\|=1}x^TAx.\n$$\n\n比较 projected Euclidean step 与 Riemannian gradient + retraction，并与最小特征向量解析结果对照。\n\n**完成标准：**\n\n- 能写 sphere / Stiefel tangent space；\n- 能解释 Euclidean gradient 与 Riemannian gradient；\n- 能解释 projection 和 retraction 的区别；\n- 能实现一个 Riemannian gradient method；\n- 能把 Unit 03 的 KKT 与 manifold stationarity 联系起来；\n- 不把“代码仓库存在”误写成“电子讲义已经发布”。\n\n---\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 09｜应用专题：至少三个端到端项目","line":3440,"end":3495,"text":"### Unit 09｜应用专题：至少三个端到端项目\n\n**状态：三个独立项目已有来源页码和单一种子实测；本节保留原施工规格，实际证据以[项目页](optimization-pku-wenzw-study-units/09-applications.md)及[运行记录](optimization-pku-wenzw-unit09-run-log.md)为准。**\n\n统一链条：\n\n$$\n\\text{问题}\n\\to\n\\text{模型}\n\\to\n\\text{结构判断}\n\\to\n\\text{算法选择}\n\\to\n\\text{停止准则}\n\\to\n\\text{验证}\n\\to\n\\text{失败分析}.\n$$\n\n候选项目：\n\n1. compressed sensing / sparse recovery；\n2. sparse regression；\n3. low-rank matrix recovery / recommendation；\n4. phase retrieval；\n5. image TV / wavelet denoising；\n6. logistic regression / SVM；\n7. stochastic optimization；\n8. optimal transport；\n9. reinforcement learning。\n\n每个项目必须包含：\n\n- 数据或 synthetic data；\n- 数学模型；\n- loss 选择理由；\n- regularizer 选择理由；\n- convex / nonconvex 判断；\n- optimality/KKT；\n- 至少两种算法；\n- objective / residual / optimality metric；\n- wall-clock 与 iteration 都记录；\n- 一个破坏关键假设的失败案例；\n- 结果解释，不只给图。\n\n最低交付建议：\n\n- A：LASSO / compressed sensing；\n- B：low-rank recovery / recommendation；\n- C：phase retrieval 或 stochastic logistic regression。\n\n---\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 10｜Lean4 形式化验证","line":3496,"end":3510,"text":"### Unit 10｜Lean4 形式化验证\n\n**状态：独立学习页已写，Lean 证明未编译；本节为原施工规格。**\n\n资源：\n\n- Optlib：https://github.com/optsuite/optlib\n- ReasLab：https://reaslab.io/\n- ReasBook：https://github.com/optpku/ReasBook\n- M2F：https://github.com/optsuite/M2F\n- SITA：https://github.com/chenyili0818/SITA\n- lean-tools-mcp：https://github.com/optsuite/lean-tools-mcp\n- CAM-Bench：https://github.com/optpku/CAM-Bench\n- 中文入口：http://faculty.bicmr.pku.edu.cn/~wenzw/formal/index.html\n","resources":[{"label":"https://github.com/optsuite/optlib","url":"https://github.com/optsuite/optlib"},{"label":"https://reaslab.io/","url":"https://reaslab.io/"},{"label":"https://github.com/optpku/ReasBook","url":"https://github.com/optpku/ReasBook"},{"label":"https://github.com/optsuite/M2F","url":"https://github.com/optsuite/M2F"},{"label":"https://github.com/chenyili0818/SITA","url":"https://github.com/chenyili0818/SITA"},{"label":"https://github.com/optsuite/lean-tools-mcp","url":"https://github.com/optsuite/lean-tools-mcp"},{"label":"https://github.com/optpku/CAM-Bench","url":"https://github.com/optpku/CAM-Bench"},{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/formal/index.html","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/formal/index.html"}]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 10｜Lean4 形式化验证 › 10.1 第一阶段：定义","line":3511,"end":3520,"text":"#### 10.1 第一阶段：定义\n\n优先形式化：\n\n- convex set；\n- convex function；\n- subgradient；\n- first-order optimality；\n- Lipschitz gradient。\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 10｜Lean4 形式化验证 › 10.2 第二阶段：简单算法","line":3521,"end":3527,"text":"#### 10.2 第二阶段：简单算法\n\n- gradient step；\n- descent lemma；\n- fixed-step convergence 的局部片段；\n- projection / prox 的基本性质。\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 10｜Lean4 形式化验证 › 10.3 第三阶段：复合算法","line":3528,"end":3536,"text":"#### 10.3 第三阶段：复合算法\n\n按照 Optlib 当前公开方向：\n\n- proximal gradient；\n- Nesterov；\n- block coordinate descent；\n- ADMM。\n","resources":[]},{"heading":"6. Unit 06–10 原施工规格与现行独立页面 › Unit 10｜Lean4 形式化验证 › 10.4 验收标准","line":3537,"end":3551,"text":"#### 10.4 验收标准\n\n每个 Lean 条目必须对应：\n\n1. 数学陈述；\n2. 精确假设；\n3. Lean definition；\n4. theorem statement；\n5. machine-checked proof；\n6. 与纸笔证明的差异说明。\n\n不能为了让 Lean 证明通过而静默强化或削弱原数学命题。\n\n\n","resources":[]},{"heading":"7. 实验与可执行产出总表 › 已完成","line":3554,"end":3563,"text":"### 已完成\n\n| 实验 | 对应 Unit | 主要观察对象 |\n|---|---|---|\n| labs/13_optimization_convexity.py | Unit 01 | 凸性抽样检查、条件数与梯度下降 |\n| labs/14_optimization_modeling.py | Unit 02 | L2/L1 残差、ridge/LASSO |\n| labs/15_optimization_optimality.py | Unit 03 | 驻点、KKT、Slater、duality gap |\n| labs/16_optimization_unconstrained.py | Unit 04 | Gradient/BB/Newton/BFGS/TR、Gauss–Newton/LM |\n| labs/17_optimization_constrained.py | Unit 05 | quadratic penalty、ALM、primal–dual central path |\n","resources":[]},{"heading":"7. 实验与可执行产出总表 › 新写待审与后续规划","line":3564,"end":3579,"text":"### 新写待审与后续规划\n\n| 建议实验 | 对应 Unit | 计划内容 |\n|---|---|---|\n| labs/18_optimization_composite.py | Unit 06 | ISTA/FISTA/BCD/ADMM on LASSO；已合并 |\n| labs/19_optimization_stochastic_nonsmooth.py | Unit 07 | subgradient/SGD/SVRG 与标量半光滑 Newton；新增部分未运行 |\n| labs/20_optimization_manifold.py | Unit 08 | sphere/Stiefel Riemannian gradient 与 QR retraction；新增部分未运行 |\n| labs/21_optimization_sparse_recovery.py | Unit 09 A | ISTA/FISTA 稀疏重建；固定种子基线与近共线压力已运行 |\n| labs/22_optimization_logistic.py | Unit 09 B | 全梯度/SGD 二分类；固定种子基线与尺度压力已运行 |\n| labs/23_optimization_phase_retrieval.py | Unit 09 C | 谱/随机初始化的非凸相位恢复；固定种子基线与采样/噪声压力已运行 |\n| Lean4 证明目录 | Unit 10 | 尚未建立、尚未编译 |\n\n> 表中 Unit 07–09 的脚本已写入但未执行；任何预设失败均待实测。Unit 10 仍无机器证明。\n\n\n","resources":[]},{"heading":"8. 统一学习模板与验收标准","line":3580,"end":3605,"text":"## 8. 统一学习模板与验收标准\n\n每个主题至少产出九类信息：\n\n1. **问题类**：变量、目标、约束；\n2. **核心假设**：凸性、光滑性、Lipschitz、强凸、约束品性、随机假设等；\n3. **最优性条件**：必要/充分/充要必须标记；\n4. **算法更新式**；\n5. **全局化机制**：line search / trust region / penalty / multiplier / projection / prox 等；\n6. **收敛结论**及其前提；\n7. **复杂度或局部速度**：只有来源支持时才记录；\n8. **一个数值实验**；\n9. **一个失败案例**：故意破坏关键假设。\n\n一个 Unit 只有在以下条件同时满足时才标记“完成”：\n\n- 能给出定义及非例；\n- 能手推核心公式；\n- 能解释结论依赖的假设；\n- 能独立实现至少一个算法；\n- 能写出停止准则；\n- 能解释 failure mode；\n- 能链接到至少一个实际模型；\n- 能和前后单元建立依赖关系；\n- 文档、代码、导航、HISTORY 一致。\n","resources":[]},{"heading":"9. 推荐实际学习顺序 › 第一遍：形成骨架","line":3608,"end":3611,"text":"### 第一遍：形成骨架\n\nUnit 01 → 02 → 03 → 04 → 05 → 06。\n","resources":[]},{"heading":"9. 推荐实际学习顺序 › 第二遍：补非光滑与随机","line":3612,"end":3615,"text":"### 第二遍：补非光滑与随机\n\n回到 Unit 07，把 subgradient、SGD、variance reduction、semismooth Newton 纳入同一“低成本一阶 ↔ 高精度二阶广义 Newton”的图景。\n","resources":[]},{"heading":"9. 推荐实际学习顺序 › 第三遍：几何与应用","line":3616,"end":3619,"text":"### 第三遍：几何与应用\n\nUnit 08 → Unit 09。\n","resources":[]},{"heading":"9. 推荐实际学习顺序 › 第四遍：形式化","line":3620,"end":3623,"text":"### 第四遍：形式化\n\nUnit 10。只形式化已经理解并能纸笔证明的内容。\n","resources":[]},{"heading":"10. 维护与自动巡检","line":3624,"end":3639,"text":"## 10. 维护与自动巡检\n\n每轮巡检：\n\n1. 检查 optbook 目录页；\n2. 检查 27 个主题 / 33 个 PDF；\n3. 检查程序页、新电子讲义、教材页；\n4. 明确搜索“流形约束优化电子讲义”，但禁止猜 URL；\n5. 检查 PKU 官方课程页、华文慕课；\n6. 检查 Optlib / ReasLab / ReasBook / optsuite 等资源；\n7. 记录 502/timeout 为“自动抓取不可达”，不删除用户确认链接；\n8. 做 URL/ISBN/课程号/学分/版本/协助准备者 preservation QA；\n9. 做 claim ledger / citation scope / semantic drift / repository QA；\n10. 即使无实质变化，也追加 UTC+8 scan log；\n11. 每轮只做一个 Git commit。\n","resources":[]},{"heading":"10. 维护与自动巡检 › Protected elements","line":3640,"end":3655,"text":"### Protected elements\n\n不得静默改写：\n\n- 9787040550351\n- 978-7-04-055841-8\n- 978-7-04-062561-5\n- 2025-01-16\n- 00130630\n- 00136720\n- 学分 3\n- 27 个主题 / 33 个 PDF 的原 URL\n- 每个讲义的协助准备者\n- “自动抓取不可达 ≠ 资源失效”\n- “流形约束优化讲义尚未真实发现”这一边界\n","resources":[]},{"heading":"11. 后续执行队列","line":3656,"end":3665,"text":"## 11. 后续执行队列\n\n1. **Unit 06**：草稿已合并，来源逐页复核待完成；\n2. **Unit 07**：页面及次梯度/SGD/SVRG 脚本已写，标量半光滑 Newton 例已补；新例运行与来源逐页核对待完成；\n3. **Unit 08**：流形几何页面及球面/Stiefel 教学脚本已写；来源逐页核对与运行待完成；\n4. **Unit 09**：三个项目已记录来源页码、原始 CSV 和实测失败案例；后续可扩展多种子及真实数据验证；\n5. **Unit 10**：学习页已写；Lean 命题与机器编译待完成。\n\nUnit 06 草稿承接 Unit 02 的 LASSO/composite modeling、Unit 03 的 subgradient optimality 和 Unit 05 的 augmented Lagrangian/variable splitting，仍需按来源复核。\n","resources":[]},{"heading":"12. 文档使用方式","line":3666,"end":3678,"text":"## 12. 文档使用方式\n\n如果只读一个文件，就读本文件。\n\n需要深入时再回到独立 Unit：\n\n- Unit 01–05：当前独立文档是已落库版本；\n- Unit 06：独立文档与实验是待审草稿；\n- Unit 07–10：已有独立待审页面；本文件中的原施工规格保留作对照，尚未完成来源与运行验收；\n- lecture index：本文件保留完整资源表，原索引页继续作为自动维护的机器友好清单。\n\n本文件的目标不是取代独立教学页面，而是提供一个**单一事实入口**：一眼看清资源、进度、已完成内容、待完成范围、实验与验收标准。\n","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-master.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-programs.md","module":"最优化课程","role":"课程与讲义","title":"文再文 optbook 程序资源索引","sections":[{"heading":"文再文 optbook 程序资源索引","line":1,"end":6,"text":"# 文再文 optbook 程序资源索引\n\n> 核对时间：2026-09-27 19:56–20:00（UTC+8）。本页从 [optbook 官方目录页](http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/contents/contents.html) 的真实锚点提取，去重后得到 42 个程序说明页；逐页读取后对应到 42 个 `.m` 文件。说明页本轮返回 HTTP 200，程序文件本轮 Range 请求返回 HTTP 206。此为**本轮工具侧可读性**，不保证后续持续可用，也不等于程序已运行或数值结果已验证。\n\n> [上位课程页](optimization-pku-wenzw.md) · [电子讲义索引](optimization-pku-wenzw-lectures.md)。程序资源和讲义资源分别计数；下列程序不能作为“流形约束优化电子讲义已发布”的证据。\n","resources":[{"label":"optbook 官方目录页","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/contents/contents.html"}]},{"heading":"官方目录列出的程序","line":7,"end":53,"text":"## 官方目录列出的程序\n\n| # | 目录中的名称 | 官方说明页 | 页面所链程序 |\n|---:|---|---|---|\n| 1 | LASSO 问题的梯度下 念卡**：定义、条件、反例；\n2. **推导卡**：核心公式为什么成立、条件在哪里使用；\n3. **算法卡**：更新式、停止准则、收敛条件与计算代价；\n4. **实验卡**：正常案例 + 故意破坏一个条件的失败案例。\n\n教材第二版的整体结构可以概括为：\n\n```text\n最优化简介\n→ 基础知识\n→ 优化建模\n→ 典型优化问题\n→ 最优性理论\n→ 无约束优化算法\n→ 约束优化算法\n→ 复合优化算法\n→ 附录：数学 / 数值代数 / 概率基础\n```\n\n第二版另增加流形约束优化和半光滑 Newton，因此它们作为后段高级单元处理。\n","resources":[]},{"heading":"Unit 01｜基础语言：问题、凸性与数值代数","line":32,"end":41,"text":"## Unit 01｜基础语言：问题、凸性与数值代数\n\n**资源**：01 简介、02 凸集、03 凸函数、04 数值代数基础；教材第 1–2 章与附录 B.2。\n\n**目标**：写出一般优化问题；区分约束/无约束、凸/非凸、确定性/随机；掌握范数、梯度、Hessian、凸集、凸函数的一阶/二阶判别；知道线性方程组、矩阵分解、特征值/SVD 为什么会进入优化算法实现。\n\n进入：[Unit 01 学习单元](optimization-pku-wenzw-study-units/01-foundations.md)\n\n实验：`labs/13_optimization_convexity.py`\n","resources":[]},{"heading":"Unit 02｜建模：把现实问题写成优化问题","line":42,"end":51,"text":"## Unit 02｜建模：把现实问题写成优化问题\n\n**资源**：05 优化建模、06 典型优化问题、教材第 3–4 章。\n\n目标：从现实描述提取变量、目标函数、约束、正则化/松弛/等价变换和问题类别。重点模型包括 least squares、LASSO、logistic regression、SVM、低秩恢复、相位恢复、PCA、TV、小波和随机优化。\n\n进入：[Unit 02 学习单元](optimization-pku-wenzw-study-units/02-modeling.md)\n\n实验：`labs/14_optimization_modeling.py`\n","resources":[]},{"heading":"Unit 03｜最优性：什么叫“解对了”","line":52,"end":61,"text":"## Unit 03｜最优性：什么叫“解对了”\n\n**资源**：凸优化最优性理论、非凸优化最优性理论、教材第 5 章。\n\n目标：存在性与唯一性；一阶/二阶必要与充分条件；对偶；KKT 与约束品性；严格区分局部最优、全局最优和驻点。\n\n进入：[Unit 03 学习单元](optimization-pku-wenzw-study-units/03-optimality.md)\n\n实验：`labs/15_optimization_optimality.py`\n","resources":[]},{"heading":"Unit 04｜无约束算法：从梯度到信赖域","line":62,"end":71,"text":"## Unit 04｜无约束算法：从梯度到信赖域\n\n**资源**：梯度下降、次梯度及次梯度算法、Newton、拟 Newton、信赖域、非线性最小二乘、教材第 6 章。\n\n统一视角：局部模型 → 搜索方向 → 全局化策略 → 收敛速度。比较 gradient、BB、Newton/modified Newton、BFGS/L-BFGS、trust-region、Gauss-Newton、Levenberg-Marquardt。\n\n进入：[Unit 04 学习单元](optimization-pku-wenzw-study-units/04-unconstrained.md)\n\n实验：`labs/16_optimization_unconstrained.py`\n","resources":[]},{"heading":"Unit 05｜约束优化：罚函数、ALM 与内点法","line":72,"end":81,"text":"## Unit 05｜约束优化：罚函数、ALM 与内点法\n\n**资源**：罚函数、增广 Lagrangian、线性规划内点法、教材第 7 章。\n\n目标：理解把约束罚进目标、乘子与罚参数联合控制约束违反，以及原始–对偶内点法如何沿中心路径逼近 KKT 解；明确 penalty、ALM 与 interior-point 的数值权衡和适用结构。\n\n进入：[Unit 05 学习单元](optimization-pku-wenzw-study-units/05-constrained.md)\n\n实验：`labs/17_optimization_constrained.py`\n","resources":[]},{"heading":"Unit 06｜复合优化：proximal、加速、分裂","line":82,"end":97,"text":"## Unit 06｜复合优化：proximal、加速、分裂\n\n**资源**：近似点算子、近似点梯度、Nesterov/FISTA、近似点算法、BCD、对偶算法、ADMM、教材第 8 章。\n\n核心结构：\n\n$$\n\\min_x f(x)+g(x).\n$$\n\n目标：理解 prox、变量分裂和原始—对偶结构如何把复合问题转化为可计算步骤。\n\n进入：[Unit 06 学习单元](optimization-pku-wenzw-study-units/06-composite.md)\n\n实验：`labs/18_optimization_composite.py`，在同一 LASSO 上比较 ISTA、FISTA、坐标下降与 ADMM，并记录最优性及分裂残差。\n","resources":[]},{"heading":"Unit 07｜随机与非光滑高级算法","line":98,"end":105,"text":"## Unit 07｜随机与非光滑高级算法\n\n**资源**：随机优化、半光滑 Newton、第二版相关章节。\n\n进入：[Unit 07 待审学习页](optimization-pku-wenzw-study-units/07-stochastic-nonsmooth.md)；教学脚本 `labs/19_optimization_stochastic_nonsmooth.py` 尚未运行。\n\n目标：SGD 与有限和/期望目标；方差减小；广义导数与半光滑 Newton；比较一阶大规模方法和高精度局部方法。\n","resources":[]},{"heading":"Unit 08｜流形约束优化","line":106,"end":118,"text":"## Unit 08｜流形约束优化\n\n教材第二版已经包含流形约束优化；当前电子讲义清单暂未单列对应 PDF。\n\n进入：[Unit 08 待审学习页](optimization-pku-wenzw-study-units/08-manifold.md)；教学脚本 `labs/20_optimization_manifold.py` 尚未运行。\n\n现有代码入口：\n\n- ARNT：https://github.com/optsuite/ARNT\n- OptM：https://github.com/optsuite/OptM\n\n目标：从正交约束 $X^TX=I$ 出发，理解切空间、Riemannian gradient、retraction、向量传输以及一阶/二阶方法。\n","resources":[{"label":"https://github.com/optsuite/ARNT","url":"https://github.com/optsuite/ARNT"},{"label":"https://github.com/optsuite/OptM","url":"https://github.com/optsuite/OptM"}]},{"heading":"Unit 09｜应用专题","line":119,"end":126,"text":"## Unit 09｜应用专题\n\n从压缩感知、低秩恢复、相位恢复、图像 TV/小波、logistic regression/SVM、随机优化/深度学习、强化学习、最优传输中至少完成三个端到端项目。\n\n进入：[Unit 09 三项目来源与实测](optimization-pku-wenzw-study-units/09-applications.md)及[运行记录](optimization-pku-wenzw-unit09-run-log.md)。三个合成数据脚本已完成固定种子的基线与压力运行；真实数据与跨种子验证仍待完成。\n\n每个项目必须回答：为什么选这个模型？为什么选这个算法？如果关键假设不满足，会怎样？\n","resources":[]},{"heading":"Unit 10｜形式化验证（可选）","line":127,"end":132,"text":"## Unit 10｜形式化验证（可选）\n\n进入 Optlib / ReasLab / Lean4 路线，把已经掌握的优化理论转化成机器可检查对象。优先顺序：凸集/凸函数 → 一阶最优性 → 梯度下降 → proximal/Nesterov → BCD/ADMM → 更复杂的收敛证明。\n\n[Unit 10 待审学习页](optimization-pku-wenzw-study-units/10-formalization.md)列出证明义务；当前没有已编译 Lean 证明。\n","resources":[]},{"heading":"完成标准","line":133,"end":143,"text":"## 完成标准\n\n一项内容只有同时满足下列条件才标记“学完”：\n\n- 能给出定义及至少一个非例；\n- 能解释结论使用了哪些假设；\n- 能手推一个简单问题；\n- 能运行或自己写出一个数值实验；\n- 能解释失败案例；\n- 能把它连接到至少一个现实模型；\n- 能说清它和前后算法的区别。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-roadmap.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/01-foundations.md","module":"最优化课程","role":"课程与讲义","title":"Unit 01｜最优化的基础语言：问题、凸性与数值代数","sections":[{"heading":"Unit 01｜最优化的基础语言：问题、凸性与数值代数","line":1,"end":8,"text":"# Unit 01｜最优化的基础语言：问题、凸性与数值代数\n\n> 对应电子讲义：01 简介、02 凸集、03 凸函数、04 数值代数基础。\n>\n> 对应教材：第 1 章“最优化简介”、第 2 章“基础知识”以及附录 B.2“数值代数基础”。\n>\n> 本页是学习导引与练习设计，不复刻教材或讲义正文。\n","resources":[]},{"heading":"1. 学完后应该会什么？","line":9,"end":23,"text":"## 1. 学完后应该会什么？\n\n完成本单元后，应当能：\n\n1. 把一个优化问题写成\n   $$\n   \\min_x f(x),\\qquad x\\in X;\n   $$\n2. 说明目标函数、决策变量、可行域分别代表什么；\n3. 区分约束/无约束、连续/离散、凸/非凸、确定性/随机问题；\n4. 用定义判断简单集合是否凸；\n5. 用定义、一阶条件或 Hessian 判断常见函数的凸性；\n6. 解释为什么矩阵分解、线性方程组、特征值和 SVD 是优化算法的计算底座；\n7. 识别“数学上收敛”与“数值上算得稳定”不是同一件事。\n","resources":[]},{"heading":"2. 第一层：优化问题到底是什么？","line":24,"end":44,"text":"## 2. 第一层：优化问题到底是什么？\n\n一般形式：\n\n$$\n\\min_{x\\in X} f(x).\n$$\n\n其中：\n\n- $x$：决策变量；\n- $f(x)$：目标函数；\n- $X$：可行域。\n\n学习时不要只盯公式，要反复问：\n\n- 谁是变量？\n- 什么东西越小/越大越好？\n- 什么条件不能违反？\n- 这是模型本身的限制，还是为了让算法更容易而人为加入的结构？\n","resources":[]},{"heading":"2. 第一层：优化问题到底是什么？ › 快速分类","line":45,"end":56,"text":"### 快速分类\n\n| 维度 | 两侧 |\n|---|---|\n| 是否有约束 | unconstrained / constrained |\n| 变量空间 | continuous / discrete |\n| 几何性质 | convex / nonconvex |\n| 信息来源 | deterministic / stochastic |\n| 光滑性 | smooth / nonsmooth |\n\
