 URL、北京大学官方页面、华文慕课页面、搜索索引/镜像证据**分层记录。暂时不可访问不等于资源不存在；未被独立验证的猜测路径不会列为事实。\n>\n> 编辑策略遵循 `Jaycob-jh/editorial-agent-framework` 的 `technical-docs` 路线：证据优先、轻量改写、数字/引用/版本/公式/代码严格保留；来源记录不做“润色式重写”。\n","resources":[{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook.html","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook.html"}]},{"heading":"1. 这套体系放在知识库的什么位置？","line":9,"end":35,"text":"## 1. 这套体系放在知识库的什么位置？\n\n建议把它作为“凸优化”之后的一条课程化主线：\n\n```text\n数学分析 / 微积分\n→ 线性代数 / 数值代数\n→ 概率基础\n→ 凸优化基础\n→ 最优性理论\n→ 无约束 / 约束 / 复合优化算法\n→ 大规模与随机优化\n→ 稀疏、低秩、最优传输、组合优化等数据问题\n→ 可选：Lean4 形式化验证\n```\n\n它与本库已有内容的连接：\n\n- [微积分基本定理](../core/01-calculus.md)\n- [Taylor 展开](../core/02-taylor.md)\n- [线性代数](../branches/12-linear-algebra.md)\n- [数值分析](../branches/09-numerical-analysis.md)\n- [概率论](../branches/20-probability.md)\n- [凸优化](../branches/19-convex-optimization.md)\n- [随机过程](../branches/08-stochastic-processes.md)\n- [Transformer 背后的数学](../branches/10-transformer-math.md)\n","resources":[]},{"heading":"2. optbook 主页面所描述的教材结构 › 详细版","line":38,"end":52,"text":"### 详细版\n\n- 刘浩洋、户将、李勇锋、文再文：《最优化：建模、算法与理论》\n- 高等教育出版社\n- ISBN：`9787040550351`\n\n主页面将详细版组织为四部分：\n\n1. **基础知识**：范数、导数、凸集、凸函数、次梯度、共轭函数；附录补线性代数、数值代数、概率等。\n2. **优化建模**：从应用问题到数学模型；覆盖线性规划、半正定规划、最小二乘、复合优化、矩阵优化、随机优化等模型。\n3. **最优性理论**：讨论无约束、约束及相关模型的最优性条件。\n4. **优化算法**：包括线搜索、梯度/次梯度、Newton、信赖域、非线性最小二乘、罚函数、增广 Lagrangian、内点法、近端梯度、Nesterov 加速、近端方法、坐标下降、对偶、ADMM、随机方法等。\n\n主页面还列出压缩感知、低秩恢复、回归、logistic regression、SVM、相位恢复、字典学习、图像处理、深度学习、强化学习等建模/应用例子。\n","resources":[]},{"heading":"2. optbook 主页面所描述的教材结构 › 简明版","line":53,"end":59,"text":"### 简明版\n\n- 刘浩洋、户将、李勇锋、文再文：《最优化计算方法》\n- ISBN：`978-7-04-055841-8`\n\n简明版适合作为算法入口；详细版更适合作为“建模—理论—算法”完整主线。\n","resources":[]},{"heading":"3. 主页面外链清单","line":60,"end":82,"text":"## 3. 主页面外链清单\n\n下面 12 个链接来自 optbook 主页面的可访问镜像/索引记录。由于原站本轮不可直连，状态栏只说明证据来源，不把“镜像出现”误写成“原站本轮已成功访问”。\n\n| # | 类型 | URL | 本轮证据状态 |\n|---|---|---|---|\n| 1 | 详细版目录 PDF | http://bicmr.pku.edu.cn/~wenzw/optbook/opt1-content.pdf | 主页面镜像列出；原站待复核 |\n| 2 | 简明版目录 PDF | http://bicmr.pku.edu.cn/~wenzw/opt2015/opt1-short-content.pdf | 主页面镜像列出；原站待复核 |\n| 3 | 教材 PDF/资源入口 | http://bicmr.pku.edu.cn/~wenzw/optbook/opt1.pdf | 主页面镜像列出；原站待复核 |\n| 4 | 高教社购买页 | http://www.hepmall.com/index.php/product-34415.html | 主页面镜像列出 |\n| 5 | 微店 | https://weidian.com/item.html?itemID=4276223598 | 主页面镜像列出 |\n| 6 | 京东 | https://item.jd.com/13064530.html | 主页面镜像列出 |\n| 7 | 当当 | http://product.dangdang.com/29185022.html | 主页面镜像列出 |\n| 8 | 读者问卷 | https://www.wenjuan.com/s/UZBZJvK0lr/ | 主页面镜像列出 |\n| 9 | 勘误/反馈表 | https://docs.qq.com/form/page/DWWhDR2JySVFjQlNm | 主页面镜像列出 |\n| 10 | 算法程序索引 | http://bicmr.pku.edu.cn/~wenzw/optbook/pages/index.html | 主页面镜像列出；原站待复核 |\n| 11 | 2020 秋：凸优化 | http://bicmr.pku.edu.cn/~wenzw/opt-2020-fall.html | 主页面镜像列出；课程历史入口 |\n| 12 | 2020 春：大数据分析中的算法 | http://bicmr.pku.edu.cn/~wenzw/bigdata2020.html | 主页面镜像列出；课程历史入口 |\n\n主入口：\n\n- http://faculty.bicmr.pku.edu.cn/~wenzw/optbook.html\n","resources":[{"label":"http://bicmr.pku.edu.cn/~wenzw/optbook/opt1-content.pdf","url":"http://bicmr.pku.edu.cn/~wenzw/optbook/opt1-content.pdf"},{"label":"http://bicmr.pku.edu.cn/~wenzw/opt2015/opt1-short-content.pdf","url":"http://bicmr.pku.edu.cn/~wenzw/opt2015/opt1-short-content.pdf"},{"label":"http://bicmr.pku.edu.cn/~wenzw/optbook/opt1.pdf","url":"http://bicmr.pku.edu.cn/~wenzw/optbook/opt1.pdf"},{"label":"http://www.hepmall.com/index.php/product-34415.html","url":"http://www.hepmall.com/index.php/product-34415.html"},{"label":"https://weidian.com/item.html?itemID=4276223598","url":"https://weidian.com/item.html?itemID=4276223598"},{"label":"https://item.jd.com/13064530.html","url":"https://item.jd.com/13064530.html"},{"label":"http://product.dangdang.com/29185022.html","url":"http://product.dangdang.com/29185022.html"},{"label":"https://www.wenjuan.com/s/UZBZJvK0lr/","url":"https://www.wenjuan.com/s/UZBZJvK0lr/"},{"label":"https://docs.qq.com/form/page/DWWhDR2JySVFjQlNm","url":"https://docs.qq.com/form/page/DWWhDR2JySVFjQlNm"},{"label":"http://bicmr.pku.edu.cn/~wenzw/optbook/pages/index.html","url":"http://bicmr.pku.edu.cn/~wenzw/optbook/pages/index.html"},{"label":"http://bicmr.pku.edu.cn/~wenzw/opt-2020-fall.html","url":"http://bicmr.pku.edu.cn/~wenzw/opt-2020-fall.html"},{"label":"http://bicmr.pku.edu.cn/~wenzw/bigdata2020.html","url":"http://bicmr.pku.edu.cn/~wenzw/bigdata2020.html"},{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook.html","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook.html"}]},{"heading":"4. 电子讲义：已确认可用的课程主线","line":83,"end":91,"text":"## 4. 电子讲义：已确认可用的课程主线\n\n用户补充并确认了一套可访问的 optbook 电子讲义清单，目前整理为 **27 个教学主题、33 个 PDF 链接**：\n\n- [文再文 optbook 电子讲义索引](optimization-pku-wenzw-lectures.md)\n- 目录入口：http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/contents/contents.html\n\n这批资源现在作为自动维护的**主抓取目标**。即使 optbook 首页在自动抓取环境中返回 502，也不影响继续使用这些确定 URL；失败只记录为“自动抓取不可达”，不会把链接误删。\n","resources":[{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/contents/contents.html","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/contents/contents.html"}]},{"heading":"4. 电子讲义：已确认可用的课程主线 › 第二版教材校正","line":92,"end":95,"text":"### 第二版教材校正\n\n本次用户提供的第二版教材 PDF 前言署于 **2025 年 2 月**。第二版明确新增流形约束优化、半光滑 Newton，并完善代码、网页、习题答案与电子讲义。当前用户提供的讲义清单已经包含半光滑 Newton，但暂未单列“流形约束优化”讲义，因此后续巡检把它设为明确待发现项。\n","resources":[]},{"heading":"5. optbook 内部程序页","line":96,"end":109,"text":"## 5. optbook 内部程序页\n\n以下路径除主页面链接外，还被搜索索引或学术材料独立指向，因此单独登记：\n\n- 目录页：http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/contents/contents.html\n- SGD：http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/stograd/sgd.html\n- Adam：https://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/stograd/Adam.html\n- FISTA / Nesterov（LASSO）：http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/lasso_proxg/LASSO_Nesterov_inn.html\n- ADMM demo：http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/lasso_admm/demo_admm.html\n\n2026-09-27 19:56–20:00（UTC+8），本轮工具直接读取[官方程序目录](http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/contents/contents.html)：其真实锚点去重后指向 42 个程序说明页，每页各链一个 MATLAB `.m` 文件；本轮说明页可读，程序文件的部分内容请求有响应。完整清单见[optbook 程序资源索引](optimization-pku-wenzw-programs.md)。目录真实列出 AdaGrad、RMSProp、AdaDelta 和 Adam，因此现在可按一手来源登记这些程序。上面的 HTTPS Adam 入口本轮连接被拒绝；官方目录所列 HTTP 入口本轮可读。\n\n上述 42 页是本轮目录所列的去重结果，不宣称 `pages/` 已穷尽；未来抓取失败也不等于链接失效。\n","resources":[{"label":"官方程序目录","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/contents/contents.html"},{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/stograd/sgd.html","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/stograd/sgd.html"},{"label":"https://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/stograd/Adam.html","url":"https://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/stograd/Adam.html"},{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/lasso_proxg/LASSO_Nesterov_inn.html","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/lasso_proxg/LASSO_Nesterov_inn.html"},{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/lasso_admm/demo_admm.html","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/lasso_admm/demo_admm.html"},{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/contents/contents.html)：其真实锚点去重后指向","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/pages/contents/contents.html)：其真实锚点去重后指向"}]},{"heading":"6. 课程体系 › 6.1 北京大学《最优化方法》","line":112,"end":135,"text":"### 6.1 北京大学《最优化方法》\n\n北京大学数学科学学院课程页：\n\n- https://math.pku.edu.cn/bks/sykc/148761.htm\n- 课程号：`00130630`\n- 学期：秋季\n- 学分：`3`\n- 先修：数学分析、数值代数\n\n课程主线可以压缩成四层：\n\n1. **凸分析与模型**：凸集、凸函数、线性规划、SOCP、SDP；\n2. **理论**：对偶性与最优性条件；\n3. **经典数值算法**：线搜索、梯度、次梯度、Newton、拟 Newton、信赖域、非线性最小二乘；\n4. **约束与复合优化**：罚函数、增广 Lagrangian、近端/近端梯度、Nesterov、对偶、ADMM、坐标下降、半光滑 Newton。\n\n华文慕课课程页：\n\n- https://www.chinesemooc.org/web/course_detail.php?courseid=5063\n- 2023 课程历史页：http://faculty.bicmr.pku.edu.cn/~wenzw/opt-2023-fall.html\n\n建议做法：把本库 [凸优化](../branches/19-convex-optimization.md) 当作概念入口，再用这门课补齐完整算法链。\n","resources":[{"label":"https://math.pku.edu.cn/bks/sykc/148761.htm","url":"https://math.pku.edu.cn/bks/sykc/148761.htm"},{"label":"https://www.chinesemooc.org/web/course_detail.php?courseid=5063","url":"https://www.chinesemooc.org/web/course_detail.php?courseid=5063"},{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/opt-2023-fall.html","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/opt-2023-fall.html"}]},{"heading":"6. 课程体系 › 6.2 北京大学《大数据分析中的算法》","line":136,"end":172,"text":"### 6.2 北京大学《大数据分析中的算法》\n\n北京大学数学科学学院课程页：\n\n- https://math.pku.edu.cn/bks/sykc/148668.htm\n- 课程号：`00136720`\n- 学期：秋季\n- 学分：`3`\n- 先修：数学分析、数值代数\n\n课程把优化算法推进到数据与计算问题，包括：\n\n- 线性/半正定优化与对偶；\n- 单纯形与内点方法；\n- 压缩感知与稀疏优化；\n- 最优传输；\n- 整数规划；\n- 图与网络流；\n- 次模优化；\n- 随机数值线性代数；\n- 随机优化；\n- 高维降维；\n- 推荐系统与低秩恢复；\n- 相位恢复；\n- 强化学习。\n\n华文慕课课程页：\n\n- https://www.chinesemooc.org/web/course_detail.php?courseid=4974\n- 2020 历史页：http://faculty.bicmr.pku.edu.cn/~wenzw/bigdata2020.html\n\n搜索索引还显示一个 2025 春课程入口：\n\n- http://faculty.bicmr.pku.edu.cn/~wenzw/bigdata2025.html\n\n但本轮无法从原站直接打开，所以该条目前标记为**二级证据，待原站恢复后复核**。\n","resources":[{"label":"https://math.pku.edu.cn/bks/sykc/148668.htm","url":"https://math.pku.edu.cn/bks/sykc/148668.htm"},{"label":"https://www.chinesemooc.org/web/course_detail.php?courseid=4974","url":"https://www.chinesemooc.org/web/course_detail.php?courseid=4974"},{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/bigdata2020.html","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/bigdata2020.html"},{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/bigdata2025.html","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/bigdata2025.html"}]},{"heading":"6. 课程体系 › 6.3 更新教材入口：《最优化方法与理论》","line":173,"end":188,"text":"### 6.3 更新教材入口：《最优化方法与理论》\n\n北京大学“101 计划”教材页：\n\n- https://math101.pku.edu.cn/hxjc/qb/3489f4fc70974d0da96ce949939fd3b8.htm\n- 文再文、袁亚湘：《最优化方法与理论》\n- ISBN：`978-7-04-062561-5`\n\n高等教育出版社当前产品页：\n\n- https://xuanshu.hep.com.cn/front/book/findBookDetails?bookId=66be39c274ce561611bda4a1\n- 出版时间：`2025-01-16`\n- 版次：1\n\n它可作为 optbook 体系之后的更新/进阶教材入口；本页不假定它替代旧教材，而把它作为后续资源并列保留。出版社页与北大“101 计划”页对作者和 ISBN 的记录一致。\n","resources":[{"label":"https://math101.pku.edu.cn/hxjc/qb/3489f4fc70974d0da96ce949939fd3b8.htm","url":"https://math101.pku.edu.cn/hxjc/qb/3489f4fc70974d0da96ce949939fd3b8.htm"},{"label":"https://xuanshu.hep.com.cn/front/book/findBookDetails?bookId=66be39c274ce561611bda4a1","url":"https://xuanshu.hep.com.cn/front/book/findBookDetails?bookId=66be39c274ce561611bda4a1"}]},{"heading":"6. 课程体系 › 6.4 可选研究线：Lean4 形式化","line":189,"end":210,"text":"### 6.4 可选研究线：Lean4 形式化\n\n核心入口：\n\n- Optlib：https://github.com/optsuite/optlib\n- ReasLab：https://reaslab.io/\n- ReasBook：https://github.com/optpku/ReasBook\n- 中文安装/训练入口：http://faculty.bicmr.pku.edu.cn/~wenzw/formal/index.html\n\nOptlib 当前公开说明把凸分析、最优性条件和算法收敛统一纳入 Lean4 形式化，已经列出梯度下降、近似点梯度 / Nesterov、分块坐标下降和 ADMM 等算法方向；其教材形式化项目还覆盖数值线性代数和高维概率。当前公开工具链还包括：\n\n- M2F：https://github.com/optsuite/M2F\n- SITA：https://github.com/chenyili0818/SITA\n- lean-tools-mcp：https://github.com/optsuite/lean-tools-mcp\n- Quokka：https://quokka.reaslab.io/ —— M2F / ReasBook 当前 README 将其登记为 M2F 的工程实现与公开在线服务，并明确保留“源码后续开放”的限制。\n\n当前已确认的公开 benchmark：\n\n- CAM-Bench：https://github.com/optpku/CAM-Bench —— 面向计算与应用数学的 Lean4 形式化定理证明基准，覆盖最优化、数值线性代数等主题。\n\n这些资源适合放在“已经会推导和实现算法”之后，用来训练机器可检查的定义、定理和收敛证明；它们不替代常规分析与数值训练。\n","resources":[{"label":"https://github.com/optsuite/optlib","url":"https://github.com/optsuite/optlib"},{"label":"https://reaslab.io/","url":"https://reaslab.io/"},{"label":"https://github.com/optpku/ReasBook","url":"https://github.com/optpku/ReasBook"},{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/formal/index.html","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/formal/index.html"},{"label":"https://github.com/optsuite/M2F","url":"https://github.com/optsuite/M2F"},{"label":"https://github.com/chenyili0818/SITA","url":"https://github.com/chenyili0818/SITA"},{"label":"https://github.com/optsuite/lean-tools-mcp","url":"https://github.com/optsuite/lean-tools-mcp"},{"label":"https://quokka.reaslab.io/","url":"https://quokka.reaslab.io/"},{"label":"https://github.com/optpku/CAM-Bench","url":"https://github.com/optpku/CAM-Bench"}]},{"heading":"6. 课程体系 › 6.5 代码资源：流形优化与正交约束","line":211,"end":220,"text":"### 6.5 代码资源：流形优化与正交约束\n\n文再文公开的 optsuite 代码组织：\n\n- https://github.com/optsuite\n- ARNT：https://github.com/optsuite/ARNT\n- OptM：https://github.com/optsuite/OptM\n\n其中 ARNT 是面向 Riemannian manifold optimization 的 MATLAB 软件，OptM 面向正交约束优化。它们可作为第二版“流形约束优化”章节的算法实现补充；**这里仅把它们作为代码入口，不把它们当作“流形约束优化电子讲义已经存在”的证据**。\n","resources":[{"label":"https://github.com/optsuite","url":"https://github.com/optsuite"},{"label":"https://github.com/optsuite/ARNT","url":"https://github.com/optsuite/ARNT"},{"label":"https://github.com/optsuite/OptM","url":"https://github.com/optsuite/OptM"}]},{"heading":"7. 系统学习入口","line":221,"end":244,"text":"## 7. 系统学习入口\n\n资源索引已经具备后，下一阶段转向课程化学习：\n\n- [完整总览：已完成 + 待完成](optimization-pku-wenzw-master.md)\n\n- [系统学习路线](optimization-pku-wenzw-study-roadmap.md)\n- [Unit 01｜最优化的基础语言](optimization-pku-wenzw-study-units/01-foundations.md)\n- [Unit 02｜优化建模与典型优化问题](optimization-pku-wenzw-study-units/02-modeling.md)\n- [Unit 03｜最优性理论](optimization-pku-wenzw-study-units/03-optimality.md)\n- [Unit 04｜无约束优化算法](optimization-pku-wenzw-study-units/04-unconstrained.md)\n- [Unit 05｜约束优化算法](optimization-pku-wenzw-study-units/05-constrained.md)\n- [Unit 06｜复合优化算法](optimization-pku-wenzw-study-units/06-composite.md)\n- [Unit 07｜随机与非光滑优化（待审）](optimization-pku-wenzw-study-units/07-stochastic-nonsmooth.md)\n- [Unit 08｜流形约束优化（待审）](optimization-pku-wenzw-study-units/08-manifold.md)\n- [Unit 09｜三个端到端应用（来源与单种子实测）](optimization-pku-wenzw-study-units/09-applications.md)\n- [Unit 10｜Lean4 形式化入口（未编译）](optimization-pku-wenzw-study-units/10-formalization.md)\n- [Unit 07–10 资料映射与待验证项](optimization-pku-wenzw-unit07-10-source-map.md)\n- 配套实验：`labs/13_optimization_convexity.py`、`labs/14_optimization_modeling.py`、`labs/15_optimization_optimality.py`、`labs/16_optimization_unconstrained.py`、`labs/17_optimization_constrained.py`、`labs/18_optimization_composite.py`\n\nUnit 07–08 的 `labs/19_optimization_stochastic_nonsmooth.py` 与 `labs/20_optimization_manifold.py` 尚未运行。Unit 09 的 `labs/21_optimization_sparse_recovery.py` 至 `labs/23_optimization_phase_retrieval.py` 已完成单一种子的基线和压力运行；[运行记录](optimization-pku-wenzw-unit09-run-log.md)保留实测失败案例，不能推广为真实数据效果。\n\n学习路线按“问题与基础 → 建模 → 最优性 → 无约束 → 约束 → 复合 → 随机/非光滑 → 流形 → 应用 → 形式化”组织，不要求按照 PDF 文件编号机械阅读。\n","resources":[]},{"heading":"8. 建议的学习任务顺序 › 阶段 A｜会识别问题","line":247,"end":254,"text":"### 阶段 A｜会识别问题\n\n目标：\n\n- 给定实际问题，能写出变量、目标函数、约束；\n- 能区分 LP / least squares / composite / stochastic / matrix optimization；\n- 能判断“凸性”为什么改变算法保证。\n","resources":[]},{"heading":"8. 建议的学习任务顺序 › 阶段 B｜会推理论","line":255,"end":263,"text":"### 阶段 B｜会推理论\n\n目标：\n\n- 熟悉凸集/凸函数、次梯度、共轭；\n- 能写一阶最优性条件；\n- 能解释 Lagrange duality、KKT、强/弱对偶；\n- 保留条件：不要把“在适当条件下”改写成无条件结论。\n","resources":[]},{"heading":"8. 建议的学习任务顺序 › 阶段 C｜会实现算法","line":264,"end":283,"text":"### 阶段 C｜会实现算法\n\n至少独立实现并比较：\n\n- gradient / subgradient；\n- Newton / quasi-Newton / trust-region；\n- proximal gradient；\n- Nesterov accelerated gradient / FISTA；\n- ADMM；\n- coordinate descent；\n- stochastic gradient。\n\n每个算法都记录：\n\n1. 目标模型；\n2. 收敛条件；\n3. 每步计算代价；\n4. 停止准则；\n5. 一个故意破坏条件的反例实验。\n","resources":[]},{"heading":"8. 建议的学习任务顺序 › 阶段 D｜会把优化用于数据问题","line":284,"end":295,"text":"### 阶段 D｜会把优化用于数据问题\n\n从下面选 2–3 个做完整小项目：\n\n- compressed sensing；\n- sparse regression；\n- low-rank recovery / recommendation；\n- optimal transport；\n- phase retrieval；\n- stochastic optimization；\n- reinforcement learning。\n","resources":[]},{"heading":"8. 建议的学习任务顺序 › 阶段 E｜可选：形式化验证","line":296,"end":304,"text":"### 阶段 E｜可选：形式化验证\n\n选择一个小定理或算法步骤，用 Lean4 写出：\n\n- 定义；\n- 假设；\n- 结论；\n- 机器可检查证明。\n","resources":[]},{"heading":"9. 证据与保真台账","line":305,"end":323,"text":"## 9. 证据与保真台账\n\n这是按 `editorial-agent-framework` 对“来源型技术文档”做的最小 claim ledger。\n\n| ID | 关键陈述 | 类型 | 证据等级 | 风险/处理 |\n|---|---|---|---|---|\n| C1 | 详细版教材及 ISBN `9787040550351` | 描述性 | 高 | 北大/BICMR 页面与主页面镜像交叉核对；数字严格保留 |\n| C2 | 《最优化方法》课程号 `00130630`、3 学分及课程模块 | 描述性 | 高 | 北京大学数学科学学院官方页 |\n| C3 | 《大数据分析中的算法》课程号 `00136720`、3 学分及课程模块 | 描述性 | 高 | 北京大学数学科学学院官方页 |\n| C4 | `bigdata2025.html` 及其课程主题 | 描述性 | 中 | 当前仅搜索索引/二级页面可见；原站恢复后复核 |\n| C5 | optbook 的 12 个主页面外链 | 来源记录 | 高 | 历史由主页面镜像记录；2026-09-27 本轮原站主页面可读，旧链接保留 |\n| C6 | 5 个既有内部子页及新编的 42 个程序说明页索引 | 来源记录 | 高 | 2026-09-27 本轮官方程序目录真实列出 42 个去重说明页，逐页读取并记录对应 `.m` 链接；不据此推断未出现的路径 |\n| C7 | optlib 的 Lean4 方向 | 描述性 | 高 | 项目仓库与公开说明 |\n| C8 | 27 个讲义主题 / 33 个 PDF URL | 来源记录 | 高（用户确认；本轮官方主页面交叉核对） | 本轮官方主页面仍列出相同 33 个 PDF URL；只校正合并版 Newton/信赖域协助准备者，见讲义索引；抓取失败不等同失效 |\n| C9 | 第二版新增流形约束优化、半光滑 Newton 并完善教学资源 | 描述性 | 高 | 用户提供的第二版 PDF，2025-02 前言 |\n| C10 | 《最优化方法与理论》ISBN `978-7-04-062561-5`、版次 1、出版时间 `2025-01-16` | 描述性 | 高 | 高等教育出版社产品页；北大“101 计划”页交叉核对作者与 ISBN |\n| C11 | 当前已确认的形式化资源链包含 Optlib / ReasLab / ReasBook、M2F、SITA、lean-tools-mcp、Quokka 与 CAM-Bench | 来源记录 | 高 | Optlib、M2F、ReasBook 当前 README 与 CAM-Bench 公开仓库；Quokka 仅记为公开在线服务并保留“源码后续开放”边界 |\n| C12 | ARNT / OptM 是 optsuite 下的流形优化与正交约束公开代码资源 | 来源记录 | 高 | optsuite GitHub 公开仓库；不据此推断流形讲义 PDF 已发布 |\n","resources":[]},{"heading":"9. 证据与保真台账 › Protected elements","line":324,"end":337,"text":"### Protected elements\n\n自动编辑时不得静默改变：\n\n- `9787040550351`\n- `978-7-04-055841-8`\n- `978-7-04-062561-5`\n- `2025-01-16`\n- `00130630`\n- `00136720`\n- 本页所有 URL\n- 课程学分 `3`\n- “2025 课程入口仅二级证据、待复核”这一不确定性边界\n","resources":[]},{"heading":"10. 自动巡检约定","line":338,"end":351,"text":"## 10. 自动巡检约定\n\n每次巡检执行：\n\n1. 重新访问 optbook 主入口与本页登记的全部链接；\n2. 若原站恢复，递归检查主页面和 `pages/` 中可发现的子链接；\n3. 搜索新的官方课程页、更新教材页、代码/形式化资源；\n4. 新信息必须记录来源等级；不能通过命名规律猜 URL；\n5. 对数字、ISBN、课程号、URL、版本和不确定性做 preservation QA；\n6. 有变化时更新本页及必要的导航/参考/学习路线；\n7. 无内容变化时也在 [巡检日志](optimization-pku-wenzw-scan-log.md) 追加一行，以形成每小时运行记录；\n8. 每轮只提交一个 Git commit。\n\n> 自动巡检是“发现变化 + 保留证据边界”的维护流程，不把网页可访问性当成资源真实性的唯一判断。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw.md"},{"path":"mathematics-changed-the-world/docs/coverage-matrix.md","module":"参考资料与覆盖记录","role":"资料索引","title":"资料覆盖与证据边界","sections":[{"heading":"资料覆盖与证据边界","line":1,"end":4,"text":"# 资料覆盖与证据边界\n\n> 建立日期：2026-09-27。逐项机器可读清单：[coverage-matrix.tsv](coverage-matrix.tsv)（120 行）。它记录“有什么、用在哪里、实际核查到哪一步”，不把文件存在或 URL 可访问写成“已读完”。\n","resources":[]},{"heading":"当前基线","line":5,"end":17,"text":"## 当前基线\n\n| 范围 | 已编目 | 本轮可确认的程度 | 尚不能宣称 |\n|---|---:|---|---|\n| 核心专题页面 | 9 | 仓库文件存在 | 逐篇来源、推导与应用已审计 |\n| 数学主干页面 | 20 | 仓库文件存在 | 每条主干已与实验和一手材料核对 |\n| Python 实验 | 18 | 仓库文件存在；Unit 06 实验曾在一组固定数据上运行 | 18 个实验都已复跑或可推广到其他数据 |\n| optbook 讲义 | 27 个主题、33 个 PDF URL | 官方主页链接与索引匹配；部分字节可读 | 33 份 PDF 全文已审读、公式与版本均已复核 |\n| optbook 程序 | 42 个说明页、42 个 `.m` 链接 | 官方页面可读；程序文件部分字节可读 | MATLAB 程序已完整读取、安装或运行 |\n| 教材、课程页、出版社页及形式化代码 | 4 组待细分来源 | 既有资源页和巡检记录提供入口或部分元数据 | 组内每项都已审读、运行或验证当前版本 |\n\n上表的 120 行是**当前已知资料的基线库存**，并不是外部资源的穷尽证明。资源巡检证据来自 `optimization-pku-wenzw-lectures.md`、`optimization-pku-wenzw-programs.md` 和 `optimization-pku-wenzw-scan-log.md`；原站 HTML 与请求 JSON 保存在项目交付目录，未把它们混同为全文阅读记录。\n","resources":[]},{"heading":"状态如何使用","line":18,"end":29,"text":"## 状态如何使用\n\n逐项清单的 `evidence_status` 描述已发生的检查，`next_check` 描述升级证据等级所需的工作。建议按以下顺序推进：\n\n1. **来源登记**：记录真实页面、版本、作者、日期和可访问状态；抓取失败只表示工具侧不可达。\n2. **全文审读**：对讲义、教材和代码逐项记录已读范围及所支持的公式或论断；不能从标题或目录推定正文。\n3. **页面映射**：把来源的具体章节/页码或代码段对齐到知识库页面、实验与练习，标出未覆盖和来源冲突。\n4. **复现验收**：保存环境、输入、参数、输出、失败案例及限制；数值运行不代替数学证明。\n5. **编辑验收**：修改既有文档时按 `technical-docs` profile 比对数字、路径、公式、引用、claim ledger 与语义范围，并运行仓库本地 QA。新写内容还需独立的来源核查。\n\n只有某项同时具备可追溯来源、实际阅读记录和相应的内容/代码核查，才可把该项从“已编目”提升到“已审读”。整库完成还需要对新增来源持续补录，因此此表不提供未经证实的“完成百分比”。\n","resources":[]},{"heading":"与课程建设的关系","line":30,"end":34,"text":"## 与课程建设的关系\n\n- [最优化学习路线](courses/optimization-pku-wenzw-study-roadmap.md)将讲义映射到 Unit 01–10。Unit 07–10 已有独立页面；Unit 07–08 的新脚本未运行，Unit 09 三个项目已保留单一种子的[实测记录](courses/optimization-pku-wenzw-unit09-run-log.md)，Unit 10 尚无已编译证明。[本批资料到页面映射](courses/optimization-pku-wenzw-unit07-10-source-map.md)另记新增内容，不回写本页 2026-09-27 的 120 行基线快照。\n- [实验清单](https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/labs/README.md)列出当前脚本；每个实验是否真正运行，以独立运行记录为准。\n- 流形约束优化电子讲义在当前官方讲义索引中仍未单列；教材章节或 ARNT/OptM 代码不能替代该 PDF 的直接证据。","resources":[{"label":"https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/labs/README.md)列出当前脚本；每个实验是否真正运行，以独立运行记录为准","url":"https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/labs/README.md)列出当前脚本；每个实验是否真正运行，以独立运行记录为准"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/coverage-matrix.md"},{"path":"mathematics-changed-the-world/docs/index.md","module":"学习导航","role":"导航页面","title":"数学如何改变世界","sections":[{"heading":"数学如何改变世界","line":1,"end":14,"text":"# 数学如何改变世界\n\n这个项目不是“著名公式排行榜”，而是一套 **数学思想史 × 数学原理 × 现代技术应用 × 可运行实验** 的中文知识库。\n\n我们用三个问题组织全部资料：\n\n不确定资料分布在哪个专题时，先用[关键词资料检索](keyword-search.md)定位文件、章节和现有教材/课程链接；支持中英相关词、资料分类及离线使用。\n\n1. **前世**：这个数学概念出现前，人们到底解决不了什么？\n2. **今生**：核心定义/公式为什么这样写，它解决了什么结构性难题？\n3. **来世**：它后来进入了哪些科学、工程、计算与 AI 系统？\n\n---\n","resources":[]},{"heading":"第一层：九个核心入口","line":15,"end":36,"text":"## 第一层：九个核心入口\n\n1. [微积分基本定理](core/01-calculus.md)\n2. [Taylor 展开](core/02-taylor.md)\n3. [Euler 公式](core/03-euler.md)\n4. [Fourier 变换](core/04-fourier.md)\n5. [散度定理](core/05-divergence.md)\n6. [留数定理](core/06-residue.md)\n7. [Bayes 公式](core/07-bayes.md)\n8. [素数定理、对数积分与 Riemann](core/08-prime-number-theorem.md)\n9. [Lebesgue 单调收敛](core/09-lebesgue.md)\n\n这九章分别代表九种高度可迁移的思想：\n\n$$\n\\boxed{\n变化,\\ 逼近,\\ 旋转,\\ 变换,\\ 守恒,\\ 奇点,\\ 更新,\\ 渐近,\\ 极限\n}\n$$\n\n---\n","resources":[]},{"heading":"第二层：专题桥梁","line":37,"end":44,"text":"## 第二层：专题桥梁\n\n这些页面不新增“核心公式排名”，而是把多个章节之间最重要的跨领域连接单独展开：\n\n- [Fourier–Laplace–Z：从复指数到极点、采样与数字系统](bridges/01-transform-family.md)\n\n---\n","resources":[]},{"heading":"第三层：数学主干地图 › 空间与结构","line":47,"end":54,"text":"### 空间与结构\n- [复数](branches/11-complex-numbers.md)\n- [线性代数](branches/12-linear-algebra.md)\n- [拓扑](branches/01-topology.md)\n- [非欧几何](branches/14-non-euclidean-geometry.md)\n- [微分几何](branches/02-differential-geometry.md)\n- [群论与对称性](branches/15-group-symmetry.md)\n","resources":[]},{"heading":"第三层：数学主干地图 › 连续变化","line":55,"end":61,"text":"### 连续变化\n- [微分方程](branches/13-differential-equations.md)\n- [泛函分析](branches/03-functional-analysis.md)\n- [控制论](branches/06-control-theory.md)\n- [混沌](branches/18-chaos.md)\n- [数值分析](branches/09-numerical-analysis.md)\n","resources":[]},{"heading":"第三层：数学主干地图 › 不确定性与信息","line":62,"end":67,"text":"### 不确定性与信息\n- [概率论](branches/20-probability.md)\n- [随机过程](branches/08-stochastic-processes.md)\n- [信息论](branches/16-information-theory.md)\n- [博弈论](branches/05-game-theory.md)\n","resources":[]},{"heading":"第三层：数学主干地图 › 离散、算法与表示","line":68,"end":76,"text":"### 离散、算法与表示\n- [图论](branches/04-graph-theory.md)\n- [可计算性](branches/17-computability.md)\n- [凸优化](branches/19-convex-optimization.md)\n- [小波](branches/07-wavelets.md)\n- [Transformer 背后的数学](branches/10-transformer-math.md)\n\n---\n","resources":[]},{"heading":"第四层：现实技术","line":77,"end":80,"text":"## 第四层：现实技术\n\n可以从一个现实系统反向追数学：\n","resources":[]},{"heading":"第四层：现实技术 › MRI","line":81,"end":83,"text":"### MRI\nFourier → linear algebra → inverse problem → optimization → numerical analysis。\n","resources":[]},{"heading":"第四层：现实技术 › 手机通信","line":84,"end":86,"text":"### 手机通信\ncomplex number → Fourier → probability → information theory → coding → optimization。\n","resources":[]},{"heading":"第四层：现实技术 › 自动驾驶/机器人","line":87,"end":89,"text":"### 自动驾驶/机器人\nlinear algebra → differential equations → geometry → control → Bayes/Kalman → optimization。\n","resources":[]},{"heading":"第四层：现实技术 › 现代 AI","line":90,"end":92,"text":"### 现代 AI\nlinear algebra → calculus → probability → information theory → optimization → numerical analysis → attention。\n","resources":[]},{"heading":"第四层：现实技术 › 天气与流体","line":93,"end":95,"text":"### 天气与流体\ncalculus → PDE → divergence/conservation → numerical analysis → chaos → probability ensemble。\n","resources":[]},{"heading":"第四层：现实技术 › 密码学","line":96,"end":100,"text":"### 密码学\nnumber theory → algebra → probability → complexity/computability。\n\n---\n","resources":[]},{"heading":"课程体系","line":101,"end":104,"text":"## 课程体系\n\n- [北大文再文最优化学习体系](courses/optimization-pku-wenzw.md) — 将教材、课程、代码、进阶算法与形式化入口串成可持续更新的课程路线，并显式记录来源等级与待复核项。\n","resources":[]},{"heading":"实验室","line":105,"end":120,"text":"## 实验室\n\n见 [数学实验室](https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/labs/README.md)。\n\n从动画和数值实验开始，建议重点观察“什么时候理论开始失效”：\n\n- Taylor 离展开中心太远；\n- FFT 采样率太低导致 aliasing；\n- Bayes 遇到错误 likelihood；\n- Kalman filter 遇到错误噪声模型；\n- 数值微分遇到 floating-point cancellation。\n\n**理解边界条件，比只得到正确图形更重要。**\n\n---\n","resources":[{"label":"数学实验室","url":"https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/labs/README.md"}]},{"heading":"推荐阅读顺序","line":121,"end":129,"text":"## 推荐阅读顺序\n\n不知道从哪里开始时，先看 [学习路线](learning-paths.md)。\n\n如果想理解整个项目的横向关系，看 [知识图谱](knowledge-graph.md)。\n\n历史总览见 [时间线与应用地图](03-timeline-applications.md)。\n\n资料出处见 [核心参考](04-references.md) 与 [现代主题参考](05-modern-references.md)。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/index.md"},{"path":"mathematics-changed-the-world/docs/keyword-search.md","module":"学习导航","role":"导航页面","title":"关键词资料检索","sections":[{"heading":"关键词资料检索","line":1,"end":4,"text":"# 关键词资料检索\n\n[打开数学资料检索页](knowledge-search/index.html)，输入“傅里叶变换”“凸优化”“流形”“Bayes”或“文再文”，即可定位资料所在的文件和章节。页面支持资料分类、中英相关词、章节预览及原章节的教材/课程链接；Ctrl+K回到搜索框。\n","resources":[]},{"heading":"GitHub与离线使用","line":5,"end":10,"text":"## GitHub与离线使用\n\nGitHub普通文件页显示HTML源码。打开[检索文件](https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/docs/knowledge-search/index.html)，选择Download raw file下载后双击，无需Python、服务或API key。也可把同一个HTML文件交给共创者。\n\n检索在本机完成；打开GitHub原文或教材、课程、PDF外链需要联网。每条命中定位到构建索引时的固定Git提交及源行号，资料更新后需重新下载生成的HTML。\n","resources":[{"label":"https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/docs/knowledge-search/index.html)，选择Download","url":"https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/docs/knowledge-search/index.html)，选择Download"}]},{"heading":"检索范围","line":11,"end":14,"text":"## 检索范围\n\n索引覆盖构建提交中的Markdown，包括九个核心专题、数学主干、专题桥梁、最优化课程、学习导航、参考资料及实验记录。它检索已有章节文字和链接，不下载外链PDF正文，不对扫描教材进行OCR，也不代表资料已经全部审读或代码已经运行。相关词用于发现资料，不表示方法或概念等价。\n","resources":[]},{"heading":"维护","line":15,"end":26,"text":"## 维护\n\n先提交资料修改，再从该提交生成索引，保证预览与原文一致：\n\n```bash\npython scripts/math_search.py\npython scripts/math_search.py --query \"傅里叶变换\"\npython scripts/math_search.py --query \"凸优化\" --module \"最优化课程\"\npython -m unittest discover -s scripts/tests -v\n```\n\n只读取Git已提交资料；本地未提交笔记不会自动进入可分享快照。生成器仅需Python标准库。可用`--revision`选择已存在的提交，或用`--exact`关闭相关词扩展。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/keyword-search.md"},{"path":"mathematics-changed-the-world/docs/knowledge-graph.md","module":"学习导航","role":"导航页面","title":"知识图谱：数学不是章节树，而是相互连接的网络","sections":[{"heading":"知识图谱：数学不是章节树，而是相互连接的网络","line":1,"end":60,"text":"# 知识图谱：数学不是章节树，而是相互连接的网络\n\n下面这张图强调“思想流向”，不是严格的历史先后，也不是全部依赖关系。\n\n\\`\\`\\`mermaid\nflowchart LR\n    Calc[微积分] --> Taylor[Taylor 展开]\n    Calc --> ODE[微分方程]\n    Calc --> Div[散度 / Stokes]\n    ODE --> Control[控制论]\n    ODE --> Chaos[混沌]\n    ODE --> PDE[PDE]\n\n    Complex[复数] --> Euler[Euler 公式]\n    Euler --> Fourier[Fourier]\n    ODE --> Laplace[Laplace]\n    Fourier --> Laplace\n    Fourier --> Sampling[采样 / DTFT]\n    Sampling --> ZT[Z 变换]\n    Laplace --> Control\n    ZT --> Control\n    ZT --> DSP[数字信号处理]\n    Fourier --> Residue[复分析 / 留数]\n    Fourier --> Wavelet[小波]\n    Fourier --> Func[泛函分析]\n\n    Leb[Lebesgue / 测度] --> Prob[概率论]\n    Leb --> Func\n    Prob --> Bayes[Bayes]\n    Prob --> Stoch[随机过程]\n    Stoch --> Kalman[Kalman / 状态估计]\n\n    LA[线性代数] --> Func\n    LA --> Graph[图论 / 谱图]\n    LA --> Optim[优化]\n    LA --> Transformer[Transformer]\n\n    Geometry[非欧几何] --> DiffGeo[微分几何]\n    Topology[拓扑] --> DiffGeo\n    Group[群与对称] --> DiffGeo\n    Group --> Physics[现代物理]\n\n    Number[数论 / 素数] --> Riemann[Riemann zeta]\n    Complex --> Riemann\n    Riemann --> Prime[素数分布]\n\n    Info[信息论] --> Coding[通信 / 编码]\n    Prob --> Info\n    Info --> Transformer\n    Optim --> Transformer\n    Num[数值分析] --> Transformer\n    Computability[可计算性] --> CS[计算机科学]\n\n    Graph --> GNN[GNN / 网络科学]\n    Wavelet --> Signal[信号 / 图像]\n    Control --> Robotics[机器人 / 自动系统]\n    DiffGeo --> Robotics\n    Fourier --> MRI[MRI / 成像]\n\\`\\`\\`\n","resources":[]},{"heading":"六条最值得记住的“纵向主链” › 1. 连续变化链","line":63,"end":76,"text":"### 1. 连续变化链\n\n$$\n\\text{微积分}\n\\to\n\\text{ODE/PDE}\n\\to\n\\text{守恒律}\n\\to\n\\text{数值计算}\n\\to\n\\text{控制/天气/工程}.\n$$\n","resources":[]},{"heading":"六条最值得记住的“纵向主链” › 2. 频率与函数空间链","line":77,"end":90,"text":"### 2. 频率与函数空间链\n\n$$\n\\text{Euler/复数}\n\\to\n\\text{Fourier}\n\\to\nL^2\n\\to\n\\text{泛函分析}\n\\to\n\\text{小波/量子/PDE}.\n$$\n","resources":[]},{"heading":"六条最值得记住的“纵向主链” › 3. 不确定性链","line":91,"end":104,"text":"### 3. 不确定性链\n\n$$\n\\text{概率}\n\\to\n\\text{Bayes}\n\\to\n\\text{随机过程}\n\\to\n\\text{状态估计}\n\\to\n\\text{现代统计/生成模型}.\n$$\n","resources":[]},{"heading":"六条最值得记住的“纵向主链” › 4. 空间与对称链","line":105,"end":118,"text":"### 4. 空间与对称链\n\n$$\n\\text{非欧几何}\n+\n\\text{拓扑}\n+\n\\text{群论}\n\\to\n\\text{微分几何/Lie group}\n\\to\n\\text{相对论/机器人/3D vision}.\n$$\n","resources":[]},{"heading":"六条最值得记住的“纵向主链” › 5. 计算与 AI 链","line":119,"end":136,"text":"### 5. 计算与 AI 链\n\n$$\n\\text{线性代数}\n+\n\\text{微积分}\n+\n\\text{概率}\n+\n\\text{信息论}\n+\n\\text{优化}\n+\n\\text{数值分析}\n\\to\n\\text{现代机器学习}.\n$$\n","resources":[]},{"heading":"六条最值得记住的“纵向主链” › 6. 变换与系统链","line":137,"end":152,"text":"### 6. 变换与系统链\n\n$$\n\\text{ODE}\n+\n\\text{Euler/Fourier}\n\\to\n\\text{Laplace}\n\\to\n\\text{采样}\n\\to\n\\text{Z}\n\\to\n\\text{数字信号/控制}.\n$$\n","resources":[]},{"heading":"横向观察：数学不断重复四种策略 › 换表示","line":155,"end":157,"text":"### 换表示\nFourier、Laplace、Z、SVD、eigenbasis、wavelet。\n","resources":[]},{"heading":"横向观察：数学不断重复四种策略 › 局部化","line":158,"end":160,"text":"### 局部化\nderivative、Taylor、local coordinate、wavelet。\n","resources":[]},{"heading":"横向观察：数学不断重复四种策略 › 把结构抽象出来","line":161,"end":163,"text":"### 把结构抽象出来\ngroup、graph、topology、vector space、probability space。\n","resources":[]},{"heading":"横向观察：数学不断重复四种策略 › 把“过程”本身数学化","line":164,"end":165,"text":"### 把“过程”本身数学化\ndifferential equation、stochastic process、algorithm、optimization dynamics。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/knowledge-graph.md"},{"path":"mathematics-changed-the-world/docs/learning-paths.md","module":"学习导航","role":"导航页面","title":"学习路线：不用从第一页读到最后一页","sections":[{"heading":"路线 A｜想建立“数学世界观”","line":3,"end":34,"text":"## 路线 A｜想建立“数学世界观”\n\n适合：对历史、思想、科学哲学感兴趣，但不要求马上推很复杂公式。\n\n顺序：\n\n1. 微积分基本定理\n2. Euler 公式\n3. Fourier\n4. Bayes\n5. 素数与 Riemann\n6. 非欧几何\n7. 拓扑\n8. 信息论\n9. 可计算性\n10. 混沌\n\n目标是理解十次观念变化：\n\n- 连续变化可以计算；\n- 虚数可以有几何意义；\n- 复杂信号可以换坐标；\n- 不确定性可以更新；\n- 随机外观可能有宏观规律；\n- 几何不是唯一；\n- 形状可以研究不变量；\n- 信息可以量化；\n- 算法有根本边界；\n- 确定性不等于可预测。\n\n---\n","resources":[]},{"heading":"路线 B｜工程 / 信号 / MRI / BCI","line":35,"end":68,"text":"## 路线 B｜工程 / 信号 / MRI / BCI\n\n建议：\n\n1. 复数\n2. Euler\n3. 微积分\n4. 线性代数\n5. 微分方程\n6. Fourier\n7. [Fourier–Laplace–Z：极点、采样与数字系统](bridges/01-transform-family.md)\n8. 散度定理\n9. 概率\n10. Bayes\n11. 随机过程\n12. 控制论\n13. 小波\n14. 数值分析\n15. 凸优化\n\n建议同步运行：\n\n- Fourier decomposition；\n- transform family（$s$ 平面、$z$ 平面、ZOH、Tustin）；\n- wavelet demo；\n- Kalman filter；\n- Taylor approximation。\n\n你应该最终能回答：\n\n> 一个真实传感器信号从采集、滤波、特征、状态估计到控制，分别用了哪些数学？\n\n---\n","resources":[]},{"heading":"路线 C｜机器学习 / AI","line":69,"end":104,"text":"## 路线 C｜机器学习 / AI\n\n先修链：\n\n$$\n\\text{线性代数}\n\\to\n\\text{微积分}\n\\to\n\\text{概率}\n\\to\n\\text{优化}.\n$$\n\n然后：\n\n1. Taylor：理解梯度、Hessian、局部曲率；\n2. Bayes：理解 likelihood/prior/posterior；\n3. 信息论：cross-entropy、KL；\n4. 数值分析：floating point、conditioning；\n5. 图论：GNN；\n6. Transformer 数学；\n7. 随机过程：diffusion model；\n8. 微分几何：manifold / equivariant learning；\n9. 泛函分析：kernel / operator viewpoints。\n\n不要把 AI 数学学成“背反向传播公式”。真正需要的是：\n\n- representation；\n- uncertainty；\n- optimization；\n- generalization；\n- computation。\n\n---\n","resources":[]},{"heading":"路线 D｜物理","line":105,"end":130,"text":"## 路线 D｜物理\n\n1. 微积分\n2. Euler/complex\n3. 微分方程\n4. 线性代数\n5. Fourier\n6. 散度 / Stokes\n7. 非欧几何\n8. 微分几何\n9. 群论\n10. 泛函分析\n11. 概率/随机过程\n12. 数值分析\n\n连接：\n\n- classical mechanics → ODE；\n- electromagnetism → vector calculus；\n- quantum → complex Hilbert space；\n- relativity → differential geometry；\n- particle physics → Lie groups；\n- statistical physics → probability。\n\n---\n","resources":[]},{"heading":"路线 E｜纯数学 / 理论路线","line":131,"end":149,"text":"## 路线 E｜纯数学 / 理论路线\n\n1. real analysis；\n2. complex analysis；\n3. Lebesgue measure；\n4. linear algebra；\n5. abstract algebra / groups；\n6. topology；\n7. functional analysis；\n8. differential geometry；\n9. analytic number theory；\n10. probability measure theory。\n\n这个路线会逐渐看到一个重要转变：\n\n> 数学从“算一个答案”变成“研究对象所属空间、允许的变换和保持不变的结构”。\n\n---\n","resources":[]},{"heading":"如何使用实验","line":150,"end":170,"text":"## 如何使用实验\n\n每读一章做四件事：\n\n1. 跑通默认实验；\n2. 改一个参数；\n3. 故意破坏一个条件；\n4. 解释“为什么坏了”。\n\n例如：\n\n- Taylor 把范围扩大到很远；\n- FFT 改采样率；\n- Bayes 改 prior 和 false-positive；\n- Kalman 把 $R,Q$ 设错；\n- attention 去掉 $1/\\sqrt{d_k}$。\n\n最后一步通常最有学习价值。\n\n---\n","resources":[]},{"heading":"路线 F｜系统学习最优化","line":171,"end":179,"text":"## 路线 F｜系统学习最优化\n\n如果希望从“凸优化概念”进一步进入完整课程体系，可沿 [北大文再文最优化学习体系](courses/optimization-pku-wenzw.md) 学习。\n\n建议顺序：\n\n线性代数/数值代数 → 微积分/Taylor → 概率 → 凸分析 → 最优性与对偶 → 无约束算法 → 约束算法 → 复合/近端算法 → 随机与大规模优化 → 稀疏/低秩/最优传输等数据问题。\n\n该路线尤其适合把路线 B 的工程优化与路线 C 的机器学习优化补成一套可实现、可验证的课程链。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/learning-paths.md"},{"path":"mathematics-changed-the-world/labs/README.md","module":"实验与运行记录","role":"实验资料","title":"数学实验室","sections":[{"heading":"数学实验室","line":1,"end":4,"text":"# 数学实验室\n\n这些脚本不是为了替代证明，而是把“抽象结构”变成可观察对象。\n","resources":[]},{"heading":"安装","line":5,"end":12,"text":"## 安装\n\n\\`\\`\\`bash\npython -m venv .venv\nsource .venv/bin/activate   # Windows: .venv\\Scripts\\activate\npip install -r requirements-labs.txt\n\\`\\`\\`\n","resources":[]},{"heading":"九个核心实验","line":13,"end":24,"text":"## 九个核心实验\n\n1. \\`01_calculus_accumulation.py\\`：累积函数与导数互逆。\n2. \\`02_taylor_animation.py\\`：Taylor 多项式逐阶逼近。\n3. \\`03_euler_phasor.py\\`：复指数旋转与 cosine 投影。\n4. \\`04_fourier_decomposition.py\\`：时域信号与 FFT 频谱。\n5. \\`05_divergence_flux.py\\`：内部散度和边界通量。\n6. \\`06_residue_numeric.py\\`：数值闭路积分读取留数。\n7. \\`07_bayes_update.py\\`：Beta-Bernoulli 顺序更新。\n8. \\`08_prime_counting.py\\`：$\\pi(x)$、$x/\\log x$、$\\operatorname{li}(x)$。\n9. \\`09_monotone_convergence.py\\`：单调简单函数逼近与积分收敛。\n","resources":[]},{"heading":"现代扩展示例","line":25,"end":36,"text":"## 现代扩展示例\n\n10. \\`10_kalman_filter.py\\`：状态空间 + Gaussian update。\n11. \\`11_wavelet_demo.py\\`：离散小波多尺度分解。\n12. \\`12_attention_heatmap.py\\`：scaled dot-product attention。\n13. \\`13_optimization_convexity.py\\`：凸性不等式抽样检查 + 条件数对梯度下降收敛的影响。\n14. \\`14_optimization_modeling.py\\`：比较 L2/L1 残差与 ridge/LASSO，观察建模选择如何改变解。\n15. \\`15_optimization_optimality.py\\`：驻点/二阶条件、约束品性与 KKT、Slater 与强对偶。\n16. \\`16_optimization_unconstrained.py\\`：统一比较 Gradient/BB/Newton/BFGS/Trust Region，并演示 Gauss-Newton/LM 非线性最小二乘。\n17. \\`17_optimization_constrained.py\\`：比较二次罚函数与 ALM，并沿 LP 原始–对偶中心路径观察可行性、互补性与 duality gap。\n18. \\`18_optimization_composite.py\\`：同一 LASSO 比较 ISTA、FISTA、循环坐标下降与 ADMM，记录目标值、proximal gradient mapping 及 ADMM 分裂残差。\n","resources":[]},{"heading":"Unit 07–09 新脚本","line":37,"end":44,"text":"## Unit 07–09 新脚本\n\n19. \\`19_optimization_stochastic_nonsmooth.py\\`：次梯度/近端梯度、全梯度/SGD/SVRG，以及标量半光滑 Newton 与奇异导数停止例。\n20. \\`20_optimization_manifold.py\\`：球面与 Stiefel Rayleigh quotient 的 Riemannian gradient、retraction 和非最优驻点教学例。\n21. \\`21_optimization_sparse_recovery.py\\`：Unit 09 项目 A，稀疏重建的 ISTA/FISTA。\n22. \\`22_optimization_logistic.py\\`：Unit 09 项目 B，logistic 分类的全梯度/SGD。\n23. \\`23_optimization_phase_retrieval.py\\`：Unit 09 项目 C，谱初始化/随机初始化的非凸相位恢复。\n","resources":[]},{"heading":"变换专题实验","line":45,"end":53,"text":"## 变换专题实验\n\n24. 24_transform_family.py：把一阶连续系统的 $s$ 平面极点映到 $z=e^{sT}$，比较模拟/采样频率响应，并可视化 bilinear/Tustin 的 frequency warping。默认参数已做本地无界面运行检查，退出码为 0；这不等价于跨平台或交互式绘图验收。\n\nUnit 07–08 的脚本 19–20 尚未运行。Unit 09 的脚本 21–23 已在固定种子下完成基线和压力运行；[实际运行记录](../docs/courses/optimization-pku-wenzw-unit09-run-log.md)与[原始 CSV](records/unit09/README.md)包含来源页码、命令和失败案例。单次合成数据观察不代表跨种子或真实数据验收。\n\n多数脚本只依赖 NumPy / Matplotlib / SciPy；wavelet 示例额外依赖 PyWavelets。\n\n> 建议：先阅读对应文档，再运行实验；把参数改坏、加噪声、改变采样率，往往比“得到漂亮图”更能理解数学。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/labs/README.md"},{"path":"mathematics-changed-the-world/labs/records/unit09/README.md","module":"实验与运行记录","role":"实验资料","title":"Unit 09｜合成数据运行记录与来源定位","sections":[{"heading":"Unit 09｜合成数据运行记录与来源定位","line":1,"end":4,"text":"# Unit 09｜合成数据运行记录与来源定位\n\n记录日期：2026-09-27（UTC+8）。本目录保存三个项目的六组原始 CSV，均为**同一种子 20260927 下的教学合成数据**。运行时的脚本提交为 `bda2dbb6c2d15238234df2b9dbe72d6dc7bad69e`；环境为 Python 3.12.14、NumPy 2.3.5。六个进程均以退出码 0 结束。[可移植运行清单](run-manifest.json)保留命令、脚本及 CSV 的 SHA-256、逐方法末行；stdout/stderr 另保存在本地 `I:\\Agents-workspace\\Outputs\\文再文最优化学习单元\\Unit09-runs-controlled-2026-09-27\\`。CSV 在此处保留原样；单次运行不提供跨种子不确定性估计。\n","resources":[]},{"heading":"一手资料与实现差异","line":5,"end":14,"text":"## 一手资料与实现差异\n\n来源是文再文等《最优化：建模、算法与理论》第二版[官方草稿 PDF](http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/opt2.pdf)，本批取得文件为 648 个 PDF 页，SHA-256 `3316A00B83690213D847142C5A5FA4062FC64C5E6D0A938CEE0D49E6F51FFCB1`。下表的“书页”是正文印刷页码；“PDF 页”从文件首页起算，二者不能混用。\n\n| 项目 | 模型来源（书页／PDF 页） | 算法来源（书页／PDF 页） | 本脚本的改动 |\n|---|---|---|---|\n| A 稀疏重建 | §3.2.3 LASSO，书页 90–92／PDF 108–110，特别是书页 91 的模型 | §8.1.2 近似点梯度，384／402；§8.2 FISTA，394／412 | 将平方残差除以样本数 $m$，并设 $\\lambda=0.002$；与书中未除以 $m$ 的模型比较须同步换算正则权重。高斯合成矩阵与近共线压力条件由脚本自定。 |\n| B logistic 分类 | §3.3 逻辑回归，93–94／111–112；§8.7.2 应用举例，505／523 | §8.7.1 SGD，498／516；全梯度为标准有限和梯度 | 损失取样本平均，加入**不正则化截距**，权重正则项写成 $\\lambda\\|w\\|^2/2$；因此参数约定和书中式 (3.3.3)、§8.7.2 不完全相同。压力条件放大一个特征，也改变正则项对原特征尺度的相对作用。 |\n| C 实数相位恢复 | §3.6，相位观测与实数最小二乘模型，100–102／118–120，特别是式 (3.6.4) | 本脚本用谱初始化加回溯梯度下降；[Candès 等的原始论文](https://arxiv.org/abs/1407.1065)提供谱初始化思路，但**本脚本不是其理论算法的复现** | 取实向量、实高斯测量，在**平方观测**上叠加高斯噪声，并用 $1/(4m)$ 缩放目标；书中式 (3.6.4) 以 $b_i^2$ 表示无噪声强度。 |\n","resources":[{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/opt2.pdf)，本批取得文件为","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/opt2.pdf)，本批取得文件为"},{"label":"https://arxiv.org/abs/1407.1065)提供谱初始化思路，但**本脚本不是其理论算法的复现**","url":"https://arxiv.org/abs/1407.1065)提供谱初始化思路，但**本脚本不是其理论算法的复现**"}]},{"heading":"固定配置与实际观察","line":15,"end":27,"text":"## 固定配置与实际观察\n\n三个脚本均执行基线和 `--stress`，保持默认维度与固定迭代预算：A 为 250 步、B 为 40 epoch、C 为 250 步。下表为末行数值，更多轨迹见同名 CSV。`seconds` 是脚本内每方法的计时；它还受到每轮额外指标计算和 Python 开销影响，不能据此排名算法的一般效率。\n\n| 项目与条件 | 方法 | 目标或训练损失 | 最优性/梯度指标 | 任务指标 | 本次观测 |\n|---|---|---:|---:|---:|---|\n| A 基线 | ISTA / FISTA | 0.010830 / 0.010830 | prox mapping 约 $2.6\\times10^{-14}$ / $3.2\\times10^{-12}$ | 相对恢复误差均 0.116；支持集差异均 0 | 在本次种子下，两法得到近乎相同的目标与恢复结果。 |\n| A 近共线 | ISTA / FISTA | 0.007836 / 0.007835 | prox mapping 均约 $1.4$–$1.5\\times10^{-6}$ | 相对恢复误差 0.655 / 0.692；支持集差异仍为 0 | 相同观测噪声下，近共线使系数幅值恢复变差；支持集指标没有显示这一问题。 |\n| B 基线 | 全梯度 / SGD | 0.413843 / 0.413942 | 全梯度范数 $3.5\\times10^{-6}$ / 0.00424 | 测试准确率均 0.842 | 固定 40 epoch 下分类相近，但 SGD 尚未达到相同的驻点残差。 |\n| B 特征放大 | 全梯度 / SGD | 0.664626 / 0.678121 | 全梯度范数 0.343 / 6.239 | 测试准确率 0.517 / 0.842；测试损失 0.704 / 0.707 | 全梯度在该预算下准确率明显下降；SGD 虽保持准确率，其损失和梯度范数仍差，不能称已收敛。 |\n| C 基线 | 谱 / 随机初值 | 约 $9.87\\times10^{-5}$ / 同量级 | 梯度范数约 $10^{-9}$ / $10^{-10}$ | 符号不变误差均 0.00216 | 本次种子下两种初值最终接近；不能推出谱初始化没有作用。 |\n| C 低采样＋高噪声 | 谱 / 随机初值 | 0.06757 / 0.05534 | 梯度范数 0.0117 / 0.00250 | 符号不变误差 1.048 / 1.075 | 两者均未恢复真值；随机初值目标更低却恢复误差略高，说明目标值与真实误差不能混同。 |\n","resources":[]},{"heading":"固定配置与实际观察 › 失败案例与边界","line":28,"end":35,"text":"### 失败案例与边界\n\n- **A：参数选择与可辨识性。** 早期探索曾用 $\\lambda=0.015$，基线相对恢复误差约 0.779，即使 prox mapping 近零也没有良好恢复。该轮原始证据保留在本地 `Unit09-runs-2026-09-27/`；之后改为 $0.002$。最终压力实验在同一种子、相同观测噪声下只改变一列以制造近共线；因此可将上述差异归于本次矩阵扰动，但不能据单次合成数据推断一般恢复概率。\n- **B：特征尺度失衡。** `--stress` 将一列特征乘以 100。它改变优化几何，也改变固定 $\\ell_2$ 惩罚对原始尺度的相对作用，因此本次差异不能仅归因于数值条件数。准确率与损失/最优性指标给出不同信息。\n- **C：欠采样与噪声联合压力。** `--stress` 同时将观测数从 240 降至 24、噪声标准差从 0.02 增至 0.3；这是联合失败条件，不能分辨两因素各自的贡献。符号等价误差 $\\min(\\|x-x^*\\|,\\|x+x^*\\|)/\\|x^*\\|$ 适用于本实数模型，不能直接推广到复数相位等价类。\n\n上述观察只覆盖一个种子、给定模型与固定迭代预算。实验脚本的停止条件不是统一精度门槛；脚本退出码 0 只表示运行完成，不等于数学或应用性能验收。\n","resources":[]},{"heading":"复跑命令","line":36,"end":44,"text":"## 复跑命令\n\n在 `mathematics-changed-the-world/` 下，将 `\u003c输出路径>` 替换为新文件名；每项分别运行无 `--stress` 与有 `--stress` 两次：\n\n```bash\npython labs/21_optimization_sparse_recovery.py --seed 20260927 --iterations 250 --lambda-value 0.002 --csv \u003c输出路径>\npython labs/22_optimization_logistic.py --seed 20260927 --epochs 40 --csv \u003c输出路径>\npython labs/23_optimization_phase_retrieval.py --seed 20260927 --iterations 250 --csv \u003c输出路径>\n```","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/labs/records/unit09/README.md"}],"aliases":{"傅里叶":["傅里叶","fourier"],"傅里叶变换":["傅里叶","fourier"],"fourier":["fourier","傅里叶"],"拉普拉斯":["拉普拉斯","laplace"],"laplace":["laplace","拉普拉斯"],"z变换":["z变换","z 变换","z-transform","z transform"],"牛顿法":["牛顿法","newton"],"贝叶斯":["贝叶斯","bayes","bayesian"],"bayes":["bayes","bayesian","贝叶斯"],"微积分":["微积分","calculus"],"线性代数":["线性代数","linear algebra"],"凸优化":["凸优化","convex optimization"],"流形":["流形","manifold","riemannian"],"随机梯度":["随机梯度","stochastic gradient","sgd"],"sgd":["sgd","stochastic gradient","随机梯度"],"文再文":["文再文","wenzw","optbook"]}};
const $=id=>document.getElementById(id);
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function count(text,term){text=text.toLowerCase();if(/^[a-z0-9_]+$/.test(term)){const escaped=term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return (text.match(new RegExp('(?<![a-z0-9_])'+escaped+'(?![a-z0-9_])','g'))||[]).length;}return text.split(term).length-1;}
function terms(){const q=$('query').value.trim().toLowerCase();return $('expand').checked&&INDEX.aliases[q]?INDEX.aliases[q]:[q];}
let results=[],limit=20;
function rank(){const q=$('query').value.trim(),ts=terms(),module=$('module').value;results=[];let sections=0;for(const d of INDEX.documents){if(module&&d.module!==module)continue;const hits=[];for(const s of d.sections){let score=q?ts.reduce((v,t)=>v+30*Math.min(count(s.heading,t),3)+Math.min(count(s.text,t),10),0):1;if(score&&q){score+=ts.reduce((v,t)=>v+40*Math.min(count(d.title,t),2),0);score+=d.role==='数学专题'?8:0;}if(score)hits.push({...s,score});}if(hits.length){hits.sort((a,b)=>b.score-a.score||a.line-b.line);results.push({...d,hits,score:hits[0].score});sections+=hits.length;}}results.sort((a,b)=>b.score-a.score||a.path.localeCompare(b.path));$('summary').textContent=q?'找到 '+results.length+' 个文件 · '+sections+' 个命中章节':'浏览全部 '+results.length+' 个文件；输入关键词可定位具体章节';$('terms').textContent=q?'检索词：'+ts.join(' / '):'';const modules=new Map();for(const d of results)modules.set(d.module,(modules.get(d.module)||0)+1);$('modules').replaceChildren();for(const [name,total] of modules){const b=node('button',name+' · '+total);b.onclick=()=>{$('module').value=name;run();};$('modules').append(b);}render();}
function snippet(s,ts){let pos=-1;for(const t of ts){const p=s.text.toLowerCase().indexOf(t);if(p>=0&&(pos<0||p<pos))pos=p;}const start=Math.max(0,pos-60);return (start?'…':'')+s.text.slice(start,start+220).replace(/\s+/g,' ')+(s.text.length>start+220?'…':'');}
function link(label,url){const a=node('a',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a;}
function preview(d,s){const reader=$('reader');reader.replaceChildren(node('h2',s.heading),node('div',d.path+' · L'+s.line+'–'+s.end,'path'),link('在 GitHub 查看该章节 →',d.url+'#L'+s.line),node('p','此处显示索引版本的 Markdown 原文；公式与 Markdown 的完整渲染请打开源文件。','note'),node('pre',s.text));if(s.resources?.length){reader.append(node('h3','本章节资料链接'));for(const resource of s.resources.slice(0,12)){const row=node('p');row.append(link(resource.label,resource.url));reader.append(row);}if(s.resources.length>12)reader.append(node('p','更多链接见原章节。','note'));}if(innerWidth<850)reader.scrollIntoView({behavior:'smooth',block:'start'});}
function render(){const container=$('results');container.replaceChildren();if(!results.length){container.append(node('p','没有命中。可尝试缩写、同义词或更短的词组，或将资料分类改为“全部资料分类”。当前使用关键词/词组匹配，不是自然语言问答。','empty'));}$('more').hidden=results.length<=limit;for(const d of results.slice(0,limit)){const a=node('article');a.append(node('span',d.module,'tag'),node('span',d.role,'tag'),node('h2',d.title),node('div',d.path,'path'));for(const s of d.hits.slice(0,3)){const h=node('div',undefined,'hit'),b=node('button',s.heading+' · L'+s.line);b.onclick=()=>preview(d,s);h.append(b,node('p',snippet(s,terms()),'snippet'));a.append(h);}const actions=node('div',undefined,'actions');actions.append(link('打开 Markdown',d.url));const copy=node('button','复制路径');copy.onclick=async()=>{try{await navigator.clipboard.writeText(d.path);copy.textContent='已复制';}catch(e){$('error').textContent='此浏览器不允许自动复制，请复制文件卡片上的路径。';}};const all=node('button','查看全部 '+d.hits.length+' 个命中');all.onclick=()=>{const reader=$('reader');reader.replaceChildren(node('h2',d.title),node('div',d.path,'path'));for(const s of d.hits){const b=node('button',s.heading+' · L'+s.line);b.onclick=()=>preview(d,s);reader.append(b,node('p',snippet(s,terms()),'snippet'));}if(innerWidth<850)reader.scrollIntoView({behavior:'smooth'});};actions.append(copy,all);a.append(actions);container.append(a);}}
function run(){limit=20;rank();$('reader').replaceChildren(node('h2','章节预览'),node('p','选择一条命中章节，查看原文。','empty'));const q=$('query').value.trim();history.replaceState(null,'',q?'#q='+encodeURIComponent(q):location.pathname);}
const modules=[...new Set(INDEX.documents.map(d=>d.module))].sort();for(const name of modules){const option=node('option',name);option.value=name;$('module').append(option);}for(const q of ['傅里叶变换','凸优化','流形','Bayes','文再文']){const b=node('button',q);b.type='button';b.onclick=()=>{$('query').value=q;$('module').value='';run();};$('suggestions').append(b);}
$('form').onsubmit=e=>{e.preventDefault();run();};$('module').onchange=run;$('expand').onchange=run;let timer;$('query').oninput=()=>{clearTimeout(timer);timer=setTimeout(run,160);};$('more').onclick=()=>{limit+=20;render();};$('meta').textContent='索引：'+INDEX.documents.length+' 个 Markdown 文件 · '+INDEX.built_at.slice(0,10)+' · 来源提交 '+INDEX.commit.slice(0,12)+'。离线检索不发送查询；打开 GitHub 原文或外部资料需要联网。资料更新后需重新生成索引；外链PDF正文未下载或OCR。';$('query').value=new URLSearchParams(location.hash.slice(1)).get('q')||'';rank();
</script>
<script>
function focusSearch(){ $('query').focus(); $('query').select(); }
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();focusSearch();}});
focusSearch();
</script>
