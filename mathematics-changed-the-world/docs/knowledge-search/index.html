:23,"end":28,"text":"## 2026-09-27：Unit 07–10 待审实施稿\n\n- 已建立 Unit 07–10 独立页面、Unit 07–09 的五个脚本、Unit 09 空白运行记录模板及资料映射表。\n- 本批按 Hai 要求不运行脚本、不复核 PDF/代码/Lean；预设失败条件仅为实验设计，未产生运行结果。\n- 课程总览、路线与导航同步链接到待审页面；本批提交与 PR 状态见工作区项目 `MANIFEST.md`。\n","resources":[]},{"heading":"2026-09-27：Unit 07 半光滑 Newton 例补充","line":29,"end":33,"text":"## 2026-09-27：Unit 07 半光滑 Newton 例补充\n\n- 在 Unit 07 页面和 `labs/19_optimization_stochastic_nonsmooth.py` 中加入标量 LASSO proximal fixed-point 方程、广义导数选择、与普通 proximal 迭代对照，以及独立的奇异导数停止例。\n- 公式与例子是教学构造；本批不把它归为讲义原文或已验证的运行结果。\n","resources":[]},{"heading":"2026-09-27：Unit 08 Stiefel 例补充","line":34,"end":38,"text":"## 2026-09-27：Unit 08 Stiefel 例补充\n\n- 在 Unit 08 页面和 `labs/20_optimization_manifold.py` 中加入 $p=2$ 的 Stiefel trace 模型、Riemannian gradient、QR retraction、子空间投影误差及非最优驻点对照。\n- 新增运行记录模板；本批未执行脚本，也未将教学构造当作教材或 ARNT/OptM 的已核对实现。\n","resources":[]},{"heading":"2026-09-19：项目起点 › 14:29 左右｜从短视频开始","line":41,"end":46,"text":"### 14:29 左右｜从短视频开始\n\n最初输入是一条抖音视频链接。视频主题围绕“数学曾多次改变我们认识世界的方式”，涉及多个经典数学公式与定理。\n\n由于抖音网页没有可靠返回字幕，后续通过用户提供的视频文件进行实际核对。\n","resources":[]},{"heading":"2026-09-19：项目起点 › 视频内容核对","line":47,"end":64,"text":"### 视频内容核对\n\n从上传的视频中确认九个核心数学主题：\n\n1. 微积分基本定理；\n2. Taylor 展开；\n3. Euler 公式；\n4. Fourier 变换；\n5. 散度定理；\n6. 留数定理；\n7. Bayes 公式；\n8. 对数积分 / 素数分布；\n9. Lebesgue 单调收敛定理。\n\n这一阶段同时修正了早期仅凭主题推测可能造成的不准确项，例如确认最后一项是 Lebesgue 单调收敛定理，而不是其他近似名称。\n\n---\n","resources":[]},{"heading":"2026-09-19 14:57｜GitHub 项目正式建立","line":65,"end":99,"text":"## 2026-09-19 14:57｜GitHub 项目正式建立\n\nGitHub 连接器不能直接创建全新仓库，因此采用安全方式：\n\n```text\n仓库：Jaycob-jh/learngit\n分支：math-changed-world\n目录：mathematics-changed-the-world/\n```\n\n未修改原仓库的默认主分支内容。\n\n首个项目提交：\n\n```text\n080dcca  add math knowledge base: mathematics-changed-the-world/README.md\n时间：2026-09-19 14:57:05 UTC+8\n```\n\n随后建立第一版基础结构：\n\n```text\n3d910ed  docs/01-nine-core.md\nfe0f1c2  docs/02-beyond.md\n653a917  docs/03-timeline-applications.md\nfe64f59  docs/04-references.md\n844e4aa  examples/taylor_demo.py\nfeb6b8a  examples/bayes_demo.py\n8a56a43  requirements.txt\n```\n\n这一阶段的目标是先建立一个可持续扩展的知识库骨架。\n\n---\n","resources":[]},{"heading":"2026-09-19 15:05–15:06｜九个核心专题拆分为独立长章","line":100,"end":132,"text":"## 2026-09-19 15:05–15:06｜九个核心专题拆分为独立长章\n\n九个主题开始从总览文档升级为独立专题。\n\n代表性提交：\n\n```text\nc07f9bb  01-calculus.md\n00a7518  02-taylor.md\n62caad4  03-euler.md\n5e17cd1  04-fourier.md\nbe673c1  05-divergence.md\nd9ee49b  06-residue.md\n4db7cb5  07-bayes.md\n49d1aab  08-prime-number-theorem.md\n5f34f08  09-lebesgue.md\n```\n\n每章逐步加入：\n\n- 前史；\n- 关键数学家；\n- 核心公式；\n- 原理解释；\n- 发展过程；\n- 现实应用；\n- 常见误解；\n- 延伸路线。\n\n这一步标志着项目从“公式列表”进入“课程型资料”的阶段。\n\n---\n","resources":[]},{"heading":"2026-09-19 15:07–15:13｜现代数学主干快速扩展","line":133,"end":195,"text":"## 2026-09-19 15:07–15:13｜现代数学主干快速扩展\n\n第一批现代主干：\n\n```text\n拓扑\n微分几何\n泛函分析\n图论\n博弈论\n控制论\n小波\n随机过程\n数值分析\nTransformer 数学\n```\n\n代表提交从：\n\n```text\nb108b71  add modern math branch: 01-topology.md\n```\n\n扩展到：\n\n```text\n09f8746  add modern math branch: 10-transformer-math.md\n```\n\n随后继续加入第二批基础主干：\n\n```text\n复数\n线性代数\n微分方程\n非欧几何\n群论与对称性\n信息论\n可计算性\n混沌\n凸优化\n概率论\n```\n\n最终形成 20 条主干。\n\n其中部分代表提交：\n\n```text\nbb89306  11-complex-numbers.md\n1433912  12-linear-algebra.md\ne06ebd5  13-differential-equations.md\n5b8a2fe  14-non-euclidean-geometry.md\n3cf99ab  15-group-symmetry.md\n9073f83  16-information-theory.md\neb97662  17-computability.md\nd7e3af3  18-chaos.md\n43cd9fd  19-convex-optimization.md\n0d97211  20-probability.md\n```\n\n---\n","resources":[]},{"heading":"2026-09-19 15:09–15:11｜建立数学实验室","line":196,"end":232,"text":"## 2026-09-19 15:09–15:11｜建立数学实验室\n\n项目从纯文本资料扩展为可运行实验体系。\n\n最早建立：\n\n```text\nlabs/README.md\nrequirements-labs.txt\n```\n\n随后加入九个核心实验：\n\n```text\n01_calculus_accumulation.py\n02_taylor_animation.py\n03_euler_phasor.py\n04_fourier_decomposition.py\n05_divergence_flux.py\n06_residue_numeric.py\n07_bayes_update.py\n08_prime_counting.py\n09_monotone_convergence.py\n```\n\n再加入三个现代实验：\n\n```text\n10_kalman_filter.py\n11_wavelet_demo.py\n12_attention_heatmap.py\n```\n\n实验体系完成后，项目已经具备“读理论 + 跑实验”的双层学习结构。\n\n---\n","resources":[]},{"heading":"2026-09-19｜实验代码质量修正","line":233,"end":236,"text":"## 2026-09-19｜实验代码质量修正\n\n在实验运行和检查过程中进行了多次修正。\n","resources":[]},{"heading":"2026-09-19｜实验代码质量修正 › 单调收敛实验","line":237,"end":250,"text":"### 单调收敛实验\n\n修正积分表达，并把 NumPy 已弃用接口：\n\n```python\nnp.trapz(...)\n```\n\n升级为：\n\n```python\nnp.trapezoid(...)\n```\n","resources":[]},{"heading":"2026-09-19｜实验代码质量修正 › Wavelet 实验","line":251,"end":261,"text":"### Wavelet 实验\n\n最初版本依赖 PyWavelets。为了降低安装成本，后改为纯 NumPy 实现 Haar 多尺度分解。\n\n对应提交：\n\n```text\n5733109  simplify wavelet lab to pure NumPy Haar transform\n152be34  remove optional PyWavelets dependency\n```\n","resources":[]},{"heading":"2026-09-19｜实验代码质量修正 › 散度实验","line":262,"end":271,"text":"### 散度实验\n\n原始离散求和存在端点面积近似带来的轻微偏差，后改成二维梯形积分，使数值结果更贴近理论值。\n\n代表提交：\n\n```text\nd969cc5  improve divergence theorem numerical integration\n```\n","resources":[]},{"heading":"2026-09-19｜实验代码质量修正 › Fourier 实验","line":272,"end":283,"text":"### Fourier 实验\n\n将输出从容易混入浮点残差的多个峰值，调整为展示真正构造信号中的三个主频。\n\n代表提交：\n\n```text\nbe6e58a  clarify FFT lab dominant frequencies\n```\n\n---\n","resources":[]},{"heading":"2026-09-19｜建立导航、学习路线和知识图谱","line":284,"end":298,"text":"## 2026-09-19｜建立导航、学习路线和知识图谱\n\n项目新增：\n\n```text\ndocs/index.md\ndocs/knowledge-graph.md\ndocs/learning-paths.md\ndocs/05-modern-references.md\nROADMAP.md\nmkdocs.yml\n```\n\n这一阶段的目标是把“很多文章”升级成“有路径的知识系统”。\n","resources":[]},{"heading":"2026-09-19｜建立导航、学习路线和知识图谱 › 学习路线","line":299,"end":308,"text":"### 学习路线\n\n建立了：\n\n- 数学世界观路线；\n- 工程 / 信号 / MRI / BCI 路线；\n- AI / 机器学习路线；\n- 物理路线；\n- 纯数学 / 理论路线。\n","resources":[]},{"heading":"2026-09-19｜建立导航、学习路线和知识图谱 › 知识图谱","line":309,"end":322,"text":"### 知识图谱\n\n建立主要连接链，例如：\n\n```text\n微积分 → 微分方程 → 控制 / 混沌\n复数 → Euler → Fourier → 复分析\nFourier → Lebesgue → 泛函分析 → 小波\n概率 → Bayes → 随机过程\n线性代数 + 优化 + 信息论 + 数值分析 → Transformer\n```\n\n---\n","resources":[]},{"heading":"2026-09-19 晚间｜数学公式显示问题被发现","line":323,"end":342,"text":"## 2026-09-19 晚间｜数学公式显示问题被发现\n\n用户提供截图，指出页面中出现类似：\n\n```text\n[ A(x)=\\int_a^x f(t)\\,dt, ]\n```\n\n和：\n\n```text\n\\frac{A(x+h)-A(x)}{h}\n```\n\n直接显示为文本的问题。\n\n问题本质是 Markdown / MathJax 数学分隔符兼容性不统一。\n\n---\n","resources":[]},{"heading":"2026-09-19 23:00–23:25 左右｜全项目公式渲染专项修复 › 第一阶段：统一公式语法","line":345,"end":370,"text":"### 第一阶段：统一公式语法\n\n将文档中的：\n\n```text\n\\( ... \\)\n\\[ ... \\]\n```\n\n统一转换为：\n\n```text\n$...$\n$$...$$\n```\n\n处理范围包括：\n\n- 9 个核心专题；\n- 20 个主干专题；\n- index；\n- knowledge graph；\n- learning paths；\n- labs README；\n- 其他包含公式的 Markdown 页面。\n","resources":[]},{"heading":"2026-09-19 23:00–23:25 左右｜全项目公式渲染专项修复 › 第二阶段：增加 MathJax 显式配置","line":371,"end":385,"text":"### 第二阶段：增加 MathJax 显式配置\n\n新增：\n\n```text\ndocs/javascripts/mathjax.js\n```\n\n代表提交：\n\n```text\n367b0e1  add explicit MathJax configuration\n4f3e2db  configure MathJax for rendered formulas\n```\n","resources":[]},{"heading":"2026-09-19 23:00–23:25 左右｜全项目公式渲染专项修复 › 第三阶段：发现并修正批量转换细节","line":386,"end":403,"text":"### 第三阶段：发现并修正批量转换细节\n\n在转换过程中发现 JavaScript `String.replace()` 对替换字符串 `$$` 有特殊语义，可能将预期的两个美元符号转换成一个。\n\n随后执行第二轮修复，将独立单行 `$` 恢复为正确的：\n\n```markdown\n$$\n...\n$$\n```\n\n相关提交大量使用：\n\n```text\nrepair display math delimiters\n```\n","resources":[]},{"heading":"2026-09-19 23:00–23:25 左右｜全项目公式渲染专项修复 › 第四阶段：全仓静态扫描","line":404,"end":435,"text":"### 第四阶段：全仓静态扫描\n\n最终对 40 个 Markdown 文件进行了多轮扫描。\n\n检查项：\n\n```text\n\\[\n\\]\n\\(\n\\)\n单独的 $\n数学环境外的 \\frac\n数学环境外的 \\int\n数学环境外的 \\sum\n数学环境外的 \\nabla\n数学环境外的 \\mathbb\n以及其他常见 LaTeX 命令\n```\n\n最终检查结果：\n\n```text\n残留 legacy delimiter：0\n错误 single-dollar display block：0\n检测到的裸露主要 LaTeX 数学命令：0\n```\n\n公式渲染问题至此完成全项目级修复。\n\n---\n","resources":[]},{"heading":"Git 历史统计","line":436,"end":465,"text":"## Git 历史统计\n\n在本 HISTORY 文档写入之前，项目目录：\n\n```text\nmathematics-changed-the-world/\n```\n\n共查询到 **131 条提交记录**。\n\n最早项目提交：\n\n```text\n080dcca\n2026-09-19 14:57:05 UTC+8\nadd math knowledge base: mathematics-changed-the-world/README.md\n```\n\n公式修复完成后的最新提交（在报告文档加入之前）：\n\n```text\n28dadfe\n2026-09-19 23:24:56 UTC+8\nrepair display math delimiters\n```\n\n从项目第一份 README 到公式全仓修复，主要开发工作集中在约 8.5 小时内完成。\n\n---\n","resources":[]},{"heading":"当前项目状态","line":466,"end":495,"text":"## 当前项目状态\n\n截至 2026-09-20：\n\n```text\n9   个核心数学长章\n20  个数学主干专题\n12  个正式 Python 实验\n40  个 Markdown 文件\n58  个项目文件\n1   套 MkDocs 文档网站结构\n1   套 MathJax 数学公式配置\n```\n\n项目已经完成第一阶段基础建设。\n\n下一阶段将从“覆盖广度”逐步转向：\n\n```text\n内容深度\n教学结构\n可视化\n练习体系\n原始论文导读\n现实技术案例\n自动化文档发布\n```\n\n---\n","resources":[]},{"heading":"维护约定","line":496,"end":520,"text":"## 维护约定\n\n以后重要项目修改建议继续记录到本文件，格式建议：\n\n```markdown\n## YYYY-MM-DD\n\n### Added\n新增了什么\n\n### Changed\n修改了什么\n\n### Fixed\n修复了什么\n\n### Verified\n进行了什么检查\n```\n\n这样 `HISTORY.md` 将同时承担项目开发日志和内容版本历史的作用。\n\n\n---\n","resources":[]},{"heading":"2026-09-26｜纳入北大最优化课程体系","line":521,"end":535,"text":"## 2026-09-26｜纳入北大最优化课程体系\n\n新增 `docs/courses/optimization-pku-wenzw.md`，把文再文 optbook 教材、北京大学《最优化方法》、北京大学《大数据分析中的算法》、算法代码入口与 Lean4 形式化方向接入现有数学知识库。\n\n本轮原始 `faculty.bicmr.pku.edu.cn/~wenzw/optbook.html` 返回 502 / 不可访问，因此按来源等级处理：\n\n- 主页面镜像逐项保留 12 个外链；\n- 独立搜索/文献索引确认 5 个内部算法/目录子页；\n- 北京大学数学科学学院与北京大学“101 计划”页面作为高等级课程/教材证据；\n- 2025 春 `bigdata2025.html` 暂列二级证据，等待原站恢复后复核；\n- 不根据命名规律猜测未验证 URL。\n\n编辑与 QA 采用 `Jaycob-jh/editorial-agent-framework` 的 technical-docs 路线：数字、ISBN、课程号、URL 和不确定性边界严格保留。同步更新 MkDocs 导航、凸优化章节、学习路线、现代参考资料与文档首页，并建立每小时巡检日志。\n\n","resources":[]},{"heading":"2026-09-26｜纳入北大最优化课程体系 › 2026-09-26｜补全 optbook 电子讲义索引","line":536,"end":544,"text":"### 2026-09-26｜补全 optbook 电子讲义索引\n\n用户提供并确认 optbook 目录页及电子讲义可访问。新增 `docs/courses/optimization-pku-wenzw-lectures.md`，逐项登记 27 个教学主题、33 个 PDF URL 与协助准备者，并按教材章节重组学习顺序。\n\n同时根据用户提供的《最优化：建模、算法与理论》第二版 PDF 更新版本记录：第二版前言署于 2025 年 2 月，明确新增流形约束优化和半光滑牛顿算法，并完善代码、网页、习题答案和电子教案讲义。当前讲义表已有半光滑 Newton，但未单列流形约束优化讲义，因此后续自动巡检将其作为明确待发现项。\n\n维护策略同步调整：即使自动抓取环境对 `faculty.bicmr.pku.edu.cn` 返回 502/timeout，只要用户已确认具体讲义 URL 可访问，就只标记为“自动抓取不可达”，不自动删除或判定资源失效。\n\n","resources":[]},{"heading":"2026-09-26｜纳入北大最优化课程体系 › 2026-09-26｜最优化课程进入“可学习单元”阶段","line":545,"end":553,"text":"### 2026-09-26｜最优化课程进入“可学习单元”阶段\n\n在资源索引完成后，建立 `docs/courses/optimization-pku-wenzw-study-roadmap.md`，把教材与 27 个讲义主题重组为 10 个学习单元：基础、建模、最优性、无约束、约束、复合、随机/非光滑、流形、应用、形式化。\n\n完成首个学习单元 `optimization-pku-wenzw-study-units/01-foundations.md`，覆盖最优化问题的一般形式、问题分类、凸集、凸函数、范数/梯度/Hessian 与数值代数的算法角色；内容采用导学、练习和边界条件形式，不复刻教材或讲义正文。\n\n新增 `labs/13_optimization_convexity.py`，用随机凸性不等式检查和不同条件数的二次问题说明“凸性”与“数值 conditioning”两个概念，并明确数值试验不构成数学证明。\n\n","resources":[]},{"heading":"2026-09-26｜纳入北大最优化课程体系 › 2026-09-26｜完成 Unit 02：优化建模与典型优化问题","line":554,"end":562,"text":"### 2026-09-26｜完成 Unit 02：优化建模与典型优化问题\n\n新增 `docs/courses/optimization-pku-wenzw-study-units/02-modeling.md`，依据第二版教材第 3–4 章把建模过程组织为“现实问题 → 决策变量 → 目标函数 → 约束 → 正则化/松弛/等价变换 → 问题分类”。\n\nUnit 02 保留教材的重要条件边界：高斯白噪声假设下线性回归的 least-squares 与 maximum-likelihood 对应；松弛问题一般不自动等价于原问题，`ℓ0 → ℓ1` 与 `rank → nuclear norm` 的恢复需要额外条件。模型地图覆盖 regression、LASSO、logistic regression、SVM、概率图模型、phase retrieval、PCA、matrix separation、dictionary learning、K-means、TV、小波和 reinforcement learning，并与第 4 章的 LP、least-squares、composite、stochastic、SDP、matrix、integer 等问题类别对应。\n\n新增 `labs/14_optimization_modeling.py`：第一部分在含离群点的同一组回归数据上比较 L2 least-squares 与 L1 least-absolute-deviations；第二部分比较 ridge 与 LASSO 的系数结构。实验用于观察“模型选择改变答案”，不把简单数值求解器当作后续算法章节的替代。\n\n","resources":[]},{"heading":"2026-09-26｜纳入北大最优化课程体系 › 2026-09-27｜完成 Unit 03：最优性理论","line":563,"end":571,"text":"### 2026-09-27｜完成 Unit 03：最优性理论\n\n新增 `docs/courses/optimization-pku-wenzw-study-units/03-optimality.md`，严格按第二版教材第 5 章组织：解的存在性/唯一性 → 无约束可微一阶与二阶条件 → 不可微凸与复合最优性 → Lagrangian/duality → 一般约束问题的 KKT 与约束品性 → 临界锥上的二阶条件 → Slater、强对偶与凸问题 KKT 充要性。\n\n保留教材的关键逻辑边界：`∇f(x*)=0` 只是无约束光滑局部最优的必要条件；一般约束问题的 KKT 在相应约束品性下是必要条件而非充分条件；当凸问题满足 Slater 时，强对偶成立，KKT 才升级为原始/对偶全局最优的充要条件。\n\n新增 `labs/15_optimization_optimality.py`，包含三个实验：`x^3` 与 `x^4` 展示“驻点不等于最优点”和二阶条件边界；同一可行域 `x=0` 与 `x^2=0` 展示约束表达退化导致 KKT 必要性失效；凸问题 `min (x-2)^2, s.t. x\u003c=1` 显式验证 Slater、KKT、对偶函数与零对偶间隙。\n\n","resources":[]},{"heading":"2026-09-26｜纳入北大最优化课程体系 › 2026-09-27｜完成 Unit 04：无约束优化算法","line":572,"end":580,"text":"### 2026-09-27｜完成 Unit 04：无约束优化算法\n\n新增 `docs/courses/optimization-pku-wenzw-study-units/04-unconstrained.md`，依据第二版教材第 6 章，把线搜索、梯度/BB、Newton/修正 Newton、BFGS/L-BFGS、信赖域和非线性最小二乘统一为“局部模型 → 搜索方向/子问题 → 全局化策略 → 收敛速度”的框架。第 6.3 节次梯度算法保留为教材交叉内容，但按本路线延后到非光滑/随机单元集中处理。\n\n该单元保留教材的收敛条件边界：Armijo/Wolfe 不是任意下降步长；梯度法在凸光滑问题上为函数值 O(1/k)、强凸条件下 Q-线性；经典 Newton 的 Q-二次速度是局部结论且依赖 Hessian Lipschitz、最优点 Hessian 正定与足够近的初值；BFGS 的全局收敛结论依赖 Wolfe 与函数曲率条件，Q-超线性结论也有额外前提；Gauss-Newton 主要针对小残量问题，不能无条件宣称二次收敛。\n\n新增 `labs/16_optimization_unconstrained.py`：Rosenbrock 实验统一比较 gradient+Armijo、BB+非单调 Armijo、modified Newton+Armijo、BFGS+Armijo 与 trust-region 二次模型；非线性指数拟合实验比较 Gauss-Newton 与 LM 型阻尼更新，并记录梯度/残差范数与迭代次数。实验明确仅用于观察算法机制，不用于给算法做普遍排名。\n\n","resources":[]},{"heading":"2026-09-26｜纳入北大最优化课程体系 › 2026-09-27｜完成 Unit 05：约束优化算法","line":581,"end":589,"text":"### 2026-09-27｜完成 Unit 05：约束优化算法\n\n新增 `docs/courses/optimization-pku-wenzw-study-units/05-constrained.md`，依据第二版教材第 7 章的 7.1–7.3，把罚函数、增广 Lagrangian、原始–对偶结构和线性规划内点法统一为“约束违反 → 乘子/KKT → 参数化子问题 → 原始–对偶 gap”的学习框架。第二版第 7.4 节流形约束优化保留到 Unit 08 单独展开。\n\n该单元保留教材的重要条件边界：二次罚函数的全局收敛结论要求每个子问题取得全局极小解且罚因子趋于无穷；近似子问题版本还要求一阶残差趋零并在极限点有相应线性无关条件。精确 ℓ1 罚函数的有限罚因子结论以严格局部极小、KKT 和乘子阈值为前提。ALM 的局部精确性依赖 LICQ 与二阶充分条件；凸问题 ALM 的乘子收敛结论以 Slater 和不精确子问题条件为前提。\n\n新增 `labs/17_optimization_constrained.py`：第一部分在等式约束二次问题上比较 quadratic penalty 与 fixed-penalty ALM，显式展示罚函数约束违反下降伴随 Hessian 条件数增长，而 ALM 通过乘子反馈在固定有限罚因子下逼近 KKT 乘子；第二部分求解二维 LP 的扰动原始–对偶 KKT 方程，沿中心路径逐步减小 `tau`，验证 `x^T s = 2 tau`、原始/对偶目标靠拢以及边界最优解的逼近。\n\n","resources":[]},{"heading":"2026-09-26｜纳入北大最优化课程体系 › 2026-09-27｜交付 Unit 06 草稿：复合优化","line":590,"end":596,"text":"### 2026-09-27｜交付 Unit 06 草稿：复合优化\n\n新增 `docs/courses/optimization-pku-wenzw-study-units/06-composite.md`，以凸复合问题为主线说明 proximal operator、ISTA、FISTA、PPA、BCD、对偶分解与 ADMM；显式列出闭凸性、Lipschitz 梯度、最优解及分裂鞍点等条件，不把凸速度结论套用于非凸情形。PPA 与对偶 ALM 的关系沿用 Unit 05 的乘子符号，并指向既有等式约束实验。\n\n新增 `labs/18_optimization_composite.py`，在同一固定种子的 LASSO 上比较 ISTA、FISTA、循环坐标下降与两块 ADMM，记录原目标、proximal gradient mapping 与 ADMM 分裂残差；另用标量二次问题展示越过稳定步长上界的发散。实验只观察机制，不据迭代次数对方法作通用速度排名。\n\n","resources":[]},{"heading":"2026-09-26｜纳入北大最优化课程体系 › 2026-09-27｜仓库入口与资料覆盖基线","line":597,"end":599,"text":"### 2026-09-27｜仓库入口与资料覆盖基线\n\n仓库更名为 `math-atlas` 后，新增根目录 `README.md` 作为数学知识与应用实验入口；默认分支改为 `math-changed-world`，旧 `main` 仍保留。新增 `docs/coverage-matrix.md` 与逐项 TSV，按 9 个核心页面、20 条数学主干、18 个 Python 实验、27 个讲义主题和 42 个官方程序说明页记录实际核查级别，明确 HTTP 可读、全文审读和运行验证的区别。修正原有页面中错误的本地链接及 Unit 01–05 的无效下一单元锚点；不改这些单元的正文论证。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/HISTORY.md"},{"path":"mathematics-changed-the-world/PROJECT_REPORT.md","module":"项目说明与历史","role":"项目说明","title":"项目报告：数学如何改变世界","sections":[{"heading":"项目报告：数学如何改变世界","line":1,"end":10,"text":"# 项目报告：数学如何改变世界\n\n> 项目：`mathematics-changed-the-world`  \n> 仓库：`Jaycob-jh/learngit`  \n> 分支：`math-changed-world`  \n> 报告日期：2026-09-20（UTC+8）  \n> 项目状态：第一阶段知识库与实验体系已完成，进入持续扩展与内容深化阶段。\n\n---\n","resources":[]},{"heading":"1. 项目背景","line":11,"end":23,"text":"## 1. 项目背景\n\n本项目起源于一段以“九个经典数学公式/定理”为线索的短视频。最初的目标是识别视频中的九个数学主题，并解释它们“为什么重要”。\n\n在后续讨论中，项目目标被扩展为两条并行主线：\n\n1. 将九个核心数学主题做成真正可学习的专题资料，包括前史、关键人物、发展过程、公式原理、现实应用、常见误解和实验；\n2. 不局限于九个主题，继续扩展到现代数学与科技的主要知识主干，使整个项目逐渐成为“数学思想史 × 现代科技知识图谱”。\n\n项目最终形成了一个面向长期维护的中文数学知识库，而不是一组孤立的公式笔记。\n\n---\n","resources":[]},{"heading":"2. 当前项目规模","line":24,"end":44,"text":"## 2. 当前项目规模\n\n截至本报告生成时，项目目录中共有 **58 个文件**：\n\n| 类型 | 数量 |\n|---|---:|\n| Markdown 文档 | 40 |\n| Python 文件 | 14 |\n| 其中：专题实验脚本 | 12 |\n| 核心专题长章 | 9 |\n| 数学主干专题 | 20 |\n| MkDocs 配置 | 1 |\n| MathJax JavaScript 配置 | 1 |\n| requirements 文件 | 2 |\n\nPython 文件中的 14 个文件包括 12 个正式实验和 2 个早期示例程序。\n\n在本报告生成前，`mathematics-changed-the-world` 路径已有 **131 次 Git 提交**；本报告和历史记录写入后，项目路径提交数增加到 133 次。\n\n---\n","resources":[]},{"heading":"3. 九个核心专题","line":45,"end":75,"text":"## 3. 九个核心专题\n\n九个核心专题已经从早期总览拆分为独立长章：\n\n| # | 专题 | 核心思想 | 主要现实联系 |\n|---|---|---|---|\n| 1 | 微积分基本定理 | 局部变化与整体累积互相恢复 | 力学、PDE、优化、控制 |\n| 2 | Taylor 展开 | 用局部多项式逼近复杂函数 | 数值分析、优化、微扰 |\n| 3 | Euler 公式 | 指数、复数、旋转和三角函数统一 | 电路、波、通信、量子 |\n| 4 | Fourier 变换 | 时空域与频域之间换表示 | MRI、通信、图像、信号 |\n| 5 | 散度定理 | 内部源汇与边界通量相连 | 电磁、流体、守恒律 |\n| 6 | 留数定理 | 全局积分由奇点局部信息控制 | 复分析、逆变换、系统理论 |\n| 7 | Bayes 公式 | 用新证据更新不确定性 | 统计、诊断、AI、状态估计 |\n| 8 | 素数定理 / li(x) / Riemann | 离散无序背后的渐近规律 | 解析数论、密码学背景 |\n| 9 | Lebesgue 单调收敛 | 极限与积分何时可以交换 | 概率、Fourier、PDE、泛函分析 |\n\n每章目前基本统一采用以下结构：\n\n- 问题出现前的历史背景；\n- 数学家面对的原始问题；\n- 核心定义与公式；\n- 公式为什么成立的直觉或推导；\n- 严格化和后续发展；\n- 现实世界中的应用；\n- 常见误解；\n- 与其他专题的知识链接；\n- Python 实验入口；\n- 参考资料。\n\n---\n","resources":[]},{"heading":"4. 二十条数学主干","line":76,"end":79,"text":"## 4. 二十条数学主干\n\n在九个核心专题之外，项目已经扩展出 20 个相邻或基础主干：\n","resources":[]},{"heading":"4. 二十条数学主干 › 空间、结构与代数","line":80,"end":90,"text":"### 空间、结构与代数\n\n- 拓扑\n- 微分几何\n- 泛函分析\n- 图论\n- 复数\n- 线性代数\n- 非欧几何\n- 群论与对称性\n","resources":[]},{"heading":"4. 二十条数学主干 › 动态系统、工程与计算","line":91,"end":99,"text":"### 动态系统、工程与计算\n\n- 微分方程\n- 控制论\n- 混沌\n- 数值分析\n- 小波\n- 凸优化\n","resources":[]},{"heading":"4. 二十条数学主干 › 不确定性、信息与计算理论","line":100,"end":120,"text":"### 不确定性、信息与计算理论\n\n- 概率论\n- 随机过程\n- 信息论\n- 博弈论\n- 可计算性\n- Transformer 背后的数学\n\n这些主干并不是彼此独立，而是通过项目中的 `knowledge-graph.md` 建立交叉链接。例如：\n\n```text\n微积分 → 微分方程 → 控制 / 混沌 / PDE\n复数 → Euler → Fourier → 复分析 / 留数\nFourier → Lebesgue → L² → 泛函分析 → 小波\n概率 → Bayes → 随机过程 → Kalman / 状态估计\n线性代数 + 微积分 + 概率 + 信息论 + 优化 + 数值分析 → Transformer\n```\n\n---\n","resources":[]},{"heading":"5. Python 数学实验室","line":121,"end":149,"text":"## 5. Python 数学实验室\n\n项目已经建立 12 个可运行实验：\n\n| # | 实验 | 目标 |\n|---|---|---|\n| 1 | 微积分累积函数 | 数值验证累积函数的导数恢复原函数 |\n| 2 | Taylor 动画 | 观察不同阶多项式的局部逼近 |\n| 3 | Euler phasor | 观察复指数旋转与三角投影 |\n| 4 | Fourier 分解 | 从时域信号中识别主要频率 |\n| 5 | 散度与通量 | 比较内部散度积分和边界通量 |\n| 6 | 留数数值积分 | 数值验证闭路积分与留数 |\n| 7 | Bayes 更新 | 展示 Beta–Bernoulli 顺序学习 |\n| 8 | 素数计数 | 比较 π(x)、x/log(x) 和 li(x) |\n| 9 | 单调收敛 | 展示简单函数的积分收敛 |\n| 10 | Kalman filter | 展示模型预测和测量更新 |\n| 11 | Haar wavelet | 展示多尺度局部信号分解 |\n| 12 | Attention heatmap | 展示 scaled dot-product attention |\n\n实验代码经过了多轮修正，包括：\n\n- 将 wavelet 示例改成纯 NumPy Haar 实现，降低依赖；\n- 将 NumPy 弃用的 `trapz` 更新为 `trapezoid`；\n- 修正单调收敛示例中的积分表达；\n- 改进散度示例的数值积分，使内部积分与理论值更一致；\n- 将 FFT 输出聚焦到真正的三个主频，避免浮点噪声干扰教学。\n\n---\n","resources":[]},{"heading":"6. 文档站与导航体系","line":150,"end":176,"text":"## 6. 文档站与导航体系\n\n项目已经加入 MkDocs Material 配置，用于生成完整知识网站。\n\n核心导航包括：\n\n- 首页；\n- 学习路线；\n- 知识图谱；\n- 九个核心专题；\n- 二十条数学主干；\n- 历史时间线；\n- 核心参考资料；\n- 现代主题参考资料。\n\n学习路线目前包含：\n\n- 数学世界观路线；\n- 信号 / MRI / BCI / 工程路线；\n- AI / 机器学习路线；\n- 物理路线；\n- 纯数学 / 理论路线。\n\n这使项目不仅可以“按章节阅读”，还可以根据目标反向选择数学学习路径。\n\n---\n","resources":[]},{"heading":"7. 数学公式渲染专项修复","line":177,"end":180,"text":"## 7. 数学公式渲染专项修复\n\n2026-09-19 晚间进行了一次全项目数学公式渲染专项修复。\n","resources":[]},{"heading":"7. 数学公式渲染专项修复 › 原问题","line":181,"end":197,"text":"### 原问题\n\n部分 Markdown 使用：\n\n```text\n\\( ... \\)\n\\[ ... \\]\n```\n\n在某些 GitHub/MkDocs 页面中没有被正确识别，导致页面直接显示 LaTeX 源码。例如：\n\n```text\n[ A(x)=\\int_a^x f(t)\\,dt, ]\n```\n\n以及 `\\frac`、`\\int` 等命令直接显示为文本。\n","resources":[]},{"heading":"7. 数学公式渲染专项修复 › 修复标准","line":198,"end":214,"text":"### 修复标准\n\n统一为：\n\n- 行内公式：`$...$`\n- 独立公式：`$$...$$`\n\n例如：\n\n```markdown\n若 $f$ 连续，定义\n\n$$\nA(x)=\\int_a^x f(t)\\,dt.\n$$\n```\n","resources":[]},{"heading":"7. 数学公式渲染专项修复 › MathJax 配置","line":215,"end":224,"text":"### MathJax 配置\n\n新增：\n\n```text\ndocs/javascripts/mathjax.js\n```\n\n并在 `mkdocs.yml` 中显式加载 MathJax 配置和 MathJax 3。\n","resources":[]},{"heading":"7. 数学公式渲染专项修复 › 全仓检查结果","line":225,"end":237,"text":"### 全仓检查结果\n\n最终对 **40 个 Markdown 文件**进行了公式语法扫描，检查内容包括：\n\n- 遗留的 `\\[` / `\\]`；\n- 遗留的 `\\(` / `\\)`；\n- 错误的单独 `$` 块；\n- 数学环境外裸露的 `\\frac`、`\\int`、`\\sum`、`\\nabla`、`\\mathbb` 等 LaTeX 命令。\n\n最终扫描结果为：**未发现上述残留问题。**\n\n---\n","resources":[]},{"heading":"8. 内容质量原则","line":238,"end":241,"text":"## 8. 内容质量原则\n\n项目当前采用以下内容原则：\n","resources":[]},{"heading":"8. 内容质量原则 › 不采用“单一天才神话”","line":242,"end":245,"text":"### 不采用“单一天才神话”\n\n微积分、散度定理、Bayes 推断等理论都强调前驱、并行发展和后续严格化，而不是简单归功于一个人。\n","resources":[]},{"heading":"8. 内容质量原则 › 区分数学对象、算法和实现","line":246,"end":255,"text":"### 区分数学对象、算法和实现\n\n例如：\n\n```text\nFourier transform ≠ DFT ≠ FFT\nattention 数学定义 ≠ GPU kernel 实现\n概率定理 ≠ 具体统计模型\n```\n","resources":[]},{"heading":"8. 内容质量原则 › 区分“数学联系”和“直接工程应用”","line":256,"end":259,"text":"### 区分“数学联系”和“直接工程应用”\n\n例如 RSA 使用大素数，但不能简单写成“RSA 直接应用素数定理”。\n","resources":[]},{"heading":"8. 内容质量原则 › 公式必须回到问题","line":260,"end":270,"text":"### 公式必须回到问题\n\n每个重要公式都应回答：\n\n1. 为什么当时需要它？\n2. 它把什么困难问题换成了什么表示？\n3. 它的适用条件是什么？\n4. 现实系统中究竟在哪一层使用？\n\n---\n","resources":[]},{"heading":"9. 当前项目定位","line":271,"end":287,"text":"## 9. 当前项目定位\n\n当前项目已经从最初的“九个经典公式整理”发展为：\n\n> **数学思想史 × 原理推导 × 现代应用 × Python 实验 × 知识图谱**\n\n它适合继续发展为：\n\n- GitHub 开源知识库；\n- MkDocs 数学网站；\n- 数学科普长文系列；\n- 数学史课程资料；\n- AI / 工程数学学习路线；\n- 可视化数学实验集合。\n\n---\n","resources":[]},{"heading":"10. 后续建议","line":288,"end":310,"text":"## 10. 后续建议\n\n下一阶段建议优先处理三个方向。\n\n第一，继续把已有专题从“资料章”升级为“课程章”，每章增加先修知识、直觉版、本科版、进阶版、练习题和原论文摘读。\n\n第二，继续扩展当前 Roadmap 中的重要连接主题，包括 Laplace 变换、Green 函数、变分法、Hamilton/Lagrange 力学、tensor calculus、微分形式、Sobolev 空间、有限元、inverse problems、compressed sensing、coding theory、cryptography、optimal transport、causal inference、statistical learning theory、quantum information、spectral graph theory 和 TDA。\n\n第三，增加“从现实技术反推数学”的第二套目录，例如：\n\n```text\nMRI 是怎样重建图像的？\n手机是怎样在噪声中传输数据的？\nGPS 为什么需要状态估计？\n天气预报为什么做 ensemble？\n大模型为什么主要消耗矩阵乘法？\n机器人为什么需要 SO(3) / SE(3)？\n```\n\n这样项目最终能够同时从“数学历史”与“现实技术”两个方向进入。\n\n---\n","resources":[]},{"heading":"11. 项目入口","line":311,"end":333,"text":"## 11. 项目入口\n\nGitHub 在线项目：\n\n```text\nhttps://github.com/Jaycob-jh/learngit/tree/math-changed-world/mathematics-changed-the-world\n```\n\n主要文件：\n\n```text\nREADME.md\nPROJECT_REPORT.md\nHISTORY.md\nROADMAP.md\nmkdocs.yml\ndocs/\nlabs/\n```\n\n---\n\n**结论：** 第一阶段项目基础已经形成。目前最重要的资产不是单个公式，而是已经建立起的“历史—结构—应用—实验—知识关联”统一框架。后续新增主题只要遵循这一框架，就可以持续扩展而不会退化成零散资料堆积。","resources":[{"label":"https://github.com/Jaycob-jh/learngit/tree/math-changed-world/mathematics-changed-the-world","url":"https://github.com/Jaycob-jh/learngit/tree/math-changed-world/mathematics-changed-the-world"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/PROJECT_REPORT.md"},{"path":"mathematics-changed-the-world/README.md","module":"项目说明与历史","role":"项目说明","title":"数学如何改变世界","sections":[{"heading":"Mathematics Changed the World","line":2,"end":14,"text":"## Mathematics Changed the World\n\n一套中文 **数学思想史 × 核心原理 × 现实应用 × Python 实验** 知识库。\n\n它从九个经典数学公式/定理出发，但目标不是做“公式排行榜”，而是回答四件事：\n\n1. **前世**：这个理论出现前，人类卡在什么问题上？\n2. **诞生**：哪些人物、争论和前驱工作共同让它成熟？\n3. **原理**：核心公式为什么这样写，背后的结构是什么？\n4. **今生**：它今天如何进入物理、工程、通信、医学成像、统计、计算机与 AI？\n\n---\n","resources":[]},{"heading":"当前规模 › 9 个核心专题长章","line":17,"end":32,"text":"### 9 个核心专题长章\n\n| # | 专题 | 思想关键词 | 现实落点 |\n|---|---|---|---|\n| 1 | [微积分基本定理](docs/core/01-calculus.md) | 变化 ↔ 累积 | 力学、PDE、优化 |\n| 2 | [Taylor 展开](docs/core/02-taylor.md) | 局部逼近 | 数值计算、控制、优化 |\n| 3 | [Euler 公式](docs/core/03-euler.md) | 复数 ↔ 旋转 ↔ 波 | 电路、通信、量子 |\n| 4 | [Fourier 变换](docs/core/04-fourier.md) | 时空域 ↔ 频域 | MRI、音视频、通信 |\n| 5 | [散度定理](docs/core/05-divergence.md) | 内部 ↔ 边界 | 电磁、流体、守恒律 |\n| 6 | [留数定理](docs/core/06-residue.md) | 全局积分 ↔ 奇点 | 复分析、系统、物理 |\n| 7 | [Bayes 公式](docs/core/07-bayes.md) | 证据更新 | 统计、诊断、AI |\n| 8 | [素数 / li(x) / Riemann](docs/core/08-prime-number-theorem.md) | 局部无序 ↔ 宏观规律 | 数论、密码学背景 |\n| 9 | [Lebesgue 单调收敛](docs/core/09-lebesgue.md) | 极限 ↔ 积分 | 概率、Fourier、PDE |\n\n每一章都有：历史前因、推导思路、数学意义、现实应用、常见误解、关联主题和实验入口。\n","resources":[]},{"heading":"当前规模 › 20 条数学主干","line":33,"end":63,"text":"### 20 条数学主干\n\n**空间与结构**\n\n- [拓扑](docs/branches/01-topology.md)\n- [微分几何](docs/branches/02-differential-geometry.md)\n- [泛函分析](docs/branches/03-functional-analysis.md)\n- [图论](docs/branches/04-graph-theory.md)\n- [博弈论](docs/branches/05-game-theory.md)\n- [复数](docs/branches/11-complex-numbers.md)\n- [线性代数](docs/branches/12-linear-algebra.md)\n- [非欧几何](docs/branches/14-non-euclidean-geometry.md)\n- [群论与对称性](docs/branches/15-group-symmetry.md)\n\n**连续、动态与计算**\n\n- [控制论](docs/branches/06-control-theory.md)\n- [小波](docs/branches/07-wavelets.md)\n- [随机过程](docs/branches/08-stochastic-processes.md)\n- [数值分析](docs/branches/09-numerical-analysis.md)\n- [微分方程](docs/branches/13-differential-equations.md)\n- [混沌](docs/branches/18-chaos.md)\n- [凸优化](docs/branches/19-convex-optimization.md)\n\n**概率、信息与现代计算**\n\n- [Transformer 背后的数学](docs/branches/10-transformer-math.md)\n- [信息论](docs/branches/16-information-theory.md)\n- [可计算性](docs/branches/17-computability.md)\n- [概率论](docs/branches/20-probability.md)\n","resources":[]},{"heading":"当前规模 › 24 个实验与教学脚本","line":64,"end":84,"text":"### 24 个实验与教学脚本\n\n见 [labs/README.md](labs/README.md)。\n\n内容包括九个核心专题实验、Kalman、小波、attention、Unit 01–09 最优化实验，以及 [Fourier–Laplace–Z 变换族实验](labs/24_transform_family.py)。Unit 07–08 的两个新脚本尚未运行；Unit 09 的三个脚本已完成单一种子的基线和压力运行，详见[原始记录](labs/records/unit09/README.md)。变换族实验已用默认参数做本地无界面运行检查。例如：\n\n- 微积分累积函数；\n- Taylor 动画；\n- Euler phasor 动画；\n- FFT 频谱；\n- 散度/通量；\n- 留数数值积分；\n- Bayes sequential update；\n- 素数计数与 li(x)；\n- 单调收敛；\n- Kalman filter；\n- wavelet 多尺度分解；\n- scaled dot-product attention heatmap。\n\n---\n","resources":[]},{"heading":"从哪里开始？ › 我想理解“数学为什么会这样发展”","line":87,"end":89,"text":"### 我想理解“数学为什么会这样发展”\n看 [学习路线](docs/learning-paths.md) 的“数学世界观”路线。\n","resources":[]},{"heading":"从哪里开始？ › 我做信号 / MRI / BCI / 工程","line":90,"end":94,"text":"### 我做信号 / MRI / BCI / 工程\n走：\n\n复数 → Euler → 线性代数 → 微分方程 → Fourier → [Laplace / Z / 采样](docs/bridges/01-transform-family.md) → 概率 → 随机过程 → 控制 → 小波 → 数值分析。\n","resources":[]},{"heading":"从哪里开始？ › 我做 AI / ML","line":95,"end":99,"text":"### 我做 AI / ML\n走：\n\n线性代数 → 微积分 → Taylor → 概率/Bayes → 信息论 → 优化 → 数值分析 → Transformer。\n","resources":[]},{"heading":"从哪里开始？ › 我想看所有主题怎样连接","line":100,"end":104,"text":"### 我想看所有主题怎样连接\n直接看 [知识图谱](docs/knowledge-graph.md)。\n\n---\n","resources":[]},{"heading":"三个入口","line":105,"end":122,"text":"## 三个入口\n\n- [📚 文档首页](docs/index.md)\n- [🗺️ 知识图谱](docs/knowledge-graph.md)\n- [🧪 Python 实验室](labs/README.md)\n\n历史纵览：\n- [数学时间线与现实应用地图](docs/03-timeline-applications.md)\n\n资料来源：\n- [核心主题参考](docs/04-references.md)\n- [现代主题参考](docs/05-modern-references.md)\n\n开发计划：\n- [ROADMAP](ROADMAP.md)\n\n---\n","resources":[]},{"heading":"本地运行文档站","line":123,"end":143,"text":"## 本地运行文档站\n\n\\`\\`\\`bash\ncd mathematics-changed-the-world\npython -m venv .venv\nsource .venv/bin/activate\npip install mkdocs-material\nmkdocs serve\n\\`\\`\\`\n\n浏览器打开 MkDocs 给出的本地地址即可。\n\n实验环境：\n\n\\`\\`\\`bash\npip install -r requirements-labs.txt\npython labs/04_fourier_decomposition.py\n\\`\\`\\`\n\n---\n","resources":[]},{"heading":"项目原则 › 1. 不写“单一天才神话”","line":146,"end":148,"text":"### 1. 不写“单一天才神话”\n重大理论通常有前驱、并行发现、符号改进和后续严格化。\n","resources":[]},{"heading":"项目原则 › 2. 区分数学对象、算法和实现","line":149,"end":155,"text":"### 2. 区分数学对象、算法和实现\n例如：\n\n- Fourier transform ≠ DFT ≠ FFT；\n- probability theorem ≠ statistical model；\n- attention definition ≠ GPU implementation。\n","resources":[]},{"heading":"项目原则 › 3. 区分“数学联系”与“直接工程应用”","line":156,"end":158,"text":"### 3. 区分“数学联系”与“直接工程应用”\n例如 RSA 使用大素数，但不能简单说“RSA 直接使用素数定理”。\n","resources":[]},{"heading":"项目原则 › 4. 公式必须回到问题","line":159,"end":165,"text":"### 4. 公式必须回到问题\n每个公式都要回答：\n\n> 为什么当时需要它？它压缩了哪一类问题？换了什么表示？\n\n---\n","resources":[]},{"heading":"核心观点","line":166,"end":180,"text":"## 核心观点\n\n数学改变世界，往往不是因为某个公式本身“神奇”，而是因为它发明了一种新的表示语言：\n\n- 把运动表示成导数；\n- 把复杂函数表示成局部多项式；\n- 把波表示成频率；\n- 把高维关系表示成向量和矩阵；\n- 把不确定性表示成概率分布；\n- 把对称性表示成群；\n- 把连续形状表示成拓扑不变量；\n- 把信息表示成熵；\n- 把算法本身变成数学研究对象。\n\n> **选对表示，往往就是解决问题的一半。**","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/README.md"},{"path":"mathematics-changed-the-world/ROADMAP.md","module":"项目说明与历史","role":"项目说明","title":"Roadmap","sections":[{"heading":"Roadmap","line":1,"end":4,"text":"# Roadmap\n\n项目目标不是一次写完一本“数学百科”，而是建立可持续扩展的知识图谱。\n","resources":[]},{"heading":"已完成：Phase 1 — 两条主线同时启动 › A. 九个核心公式专题","line":7,"end":26,"text":"### A. 九个核心公式专题\n- [x] 微积分基本定理\n- [x] Taylor 展开\n- [x] Euler 公式\n- [x] Fourier 变换\n- [x] 散度定理\n- [x] 留数定理\n- [x] Bayes 公式\n- [x] 素数定理 / li(x) / Riemann\n- [x] Lebesgue 单调收敛\n\n每章包含：\n- 历史问题；\n- 核心推导；\n- 数学意义；\n- 现实应用；\n- 常见误解；\n- 关联知识；\n- 实验入口。\n","resources":[]},{"heading":"已完成：Phase 1 — 两条主线同时启动 › B. 现代数学主干","line":27,"end":48,"text":"### B. 现代数学主干\n- [x] 拓扑\n- [x] 微分几何\n- [x] 泛函分析\n- [x] 图论\n- [x] 博弈论\n- [x] 控制论\n- [x] 小波\n- [x] 随机过程\n- [x] 数值分析\n- [x] Transformer 数学\n- [x] 复数\n- [x] 线性代数\n- [x] 微分方程\n- [x] 非欧几何\n- [x] 群论与对称\n- [x] 信息论\n- [x] 可计算性\n- [x] 混沌\n- [x] 凸优化\n- [x] 概率论\n","resources":[]},{"heading":"已完成：Phase 1 — 两条主线同时启动 › C. 实验","line":49,"end":54,"text":"### C. 实验\n- [x] 9 个核心专题 Python lab\n- [x] Kalman filter\n- [x] wavelet decomposition\n- [x] attention heatmap\n","resources":[]},{"heading":"Phase 2 — 每章“从资料变成课程”","line":55,"end":66,"text":"## Phase 2 — 每章“从资料变成课程”\n\n- [ ] 每章加入 prerequisites；\n- [ ] 3–6 个练习题；\n- [ ] “不使用公式的直觉版”；\n- [ ] “本科数学版”；\n- [ ] “研究生延伸版”；\n- [ ] 原始论文摘读；\n- [ ] 关键人物时间线；\n- [ ] 可复现实验结果图；\n- [ ] Manim 动画。\n","resources":[]},{"heading":"Phase 3 — 继续扩展数学版图","line":67,"end":93,"text":"## Phase 3 — 继续扩展数学版图\n\n候选专题：\n\n- [ ] Laplace transform\n- [ ] Green function\n- [ ] calculus of variations\n- [ ] Hamiltonian / Lagrangian mechanics\n- [ ] tensor calculus\n- [ ] category theory\n- [ ] algebraic geometry\n- [ ] differential forms\n- [ ] distribution / generalized functions\n- [ ] Sobolev spaces\n- [ ] finite element method\n- [ ] inverse problems\n- [ ] compressed sensing\n- [ ] coding theory\n- [ ] cryptography\n- [ ] optimal transport\n- [ ] information geometry\n- [ ] causal inference\n- [ ] statistical learning theory\n- [ ] quantum information\n- [ ] spectral graph theory\n- [ ] topological data analysis\n","resources":[]},{"heading":"Phase 4 — 按现实系统组织第二套入口","line":94,"end":108,"text":"## Phase 4 — 按现实系统组织第二套入口\n\n不是“按数学科目”，而是从设备/系统反推数学：\n\n- MRI 是怎么重建图像的？\n- GPS 为什么必须估计状态？\n- 手机如何在噪声里传比特？\n- 天气预报为什么必须做 ensemble？\n- 大模型为什么主要烧矩阵乘法？\n- RSA 为什么依赖数论和复杂性？\n- 自动驾驶怎样把 geometry + Bayes + control 接起来？\n\n最终目标：\n\n> 同一个知识库既可以从“数学史”进入，也可以从“现实技术”进入。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/ROADMAP.md"},{"path":"mathematics-changed-the-world/docs/01-nine-core.md","module":"学习导航","role":"导航页面","title":"九个核心主题：前世、诞生、发展与应用","sections":[{"heading":"1. 微积分基本定理：变化与累积","line":3,"end":10,"text":"## 1. 微积分基本定理：变化与累积\n\n核心关系：\n\n∫_a^b f'(x) dx = f(b)-f(a)\n\n以及 d/dx ∫_a^x f(t)dt = f(x)。\n","resources":[]},{"heading":"1. 微积分基本定理：变化与累积 › 前世","line":11,"end":14,"text":"### 前世\n\n古代 Archimedes 的穷竭法已能处理若干面积、体积问题，但近代科学需要解决两个更一般的问题：瞬时变化率与连续累积。Fermat、Cavalieri、Torricelli、Barrow 等人为切线、面积与运动问题铺路。17 世纪 Newton 与 Leibniz 独立建立系统微积分；Newton 从运动和“流数”出发，Leibniz 的 dx、dy 与积分号则塑造了今天的书写语言。\n","resources":[]},{"heading":"1. 微积分基本定理：变化与累积 › 后续发展","line":15,"end":18,"text":"### 后续发展\n\n早期无穷小计算非常有效，但逻辑基础并不充分。19 世纪 Cauchy、Weierstrass 等以极限和严格分析重建微积分；之后 Riemann、Lebesgue 又不断扩展“积分”的含义。\n","resources":[]},{"heading":"1. 微积分基本定理：变化与累积 › 为什么改变世界","line":19,"end":22,"text":"### 为什么改变世界\n\n微积分使“自然规律”可以写成局部变化方程。Newton 力学、电磁学、流体、热传导、控制系统、经济学边际分析、机器学习反向传播都依赖这套语言。\n","resources":[]},{"heading":"1. 微积分基本定理：变化与累积 › 常见误解","line":23,"end":28,"text":"### 常见误解\n\n不是 Newton 一个人从零发明微积分；也不是会求导积分就理解了微积分。真正的核心是极限、局部线性化、累积、连续模型与微分方程。\n\n---\n","resources":[]},{"heading":"2. Taylor 展开：用简单局部模型逼近复杂世界","line":29,"end":34,"text":"## 2. Taylor 展开：用简单局部模型逼近复杂世界\n\n核心形式：\n\nf(x) = Σ f^(n)(a)/n! · (x-a)^n。\n","resources":[]},{"heading":"2. Taylor 展开：用简单局部模型逼近复杂世界 › 前世","line":35,"end":38,"text":"### 前世\n\n无穷级数在 17–18 世纪天文、力学与方程求解中迅速发展。Gregory、Newton、Leibniz、Bernoulli、de Moivre 等都有相关先驱结果。Brook Taylor 在 1712 年通信和 1715 年著作中系统给出后来以他命名的形式；Maclaurin 推广了 a=0 的特殊情形。\n","resources":[]},{"heading":"2. Taylor 展开：用简单局部模型逼近复杂世界 › 数学关键","line":39,"end":42,"text":"### 数学关键\n\nTaylor 多项式是局部近似，不应把“无限可导”与“等于自己的 Taylor 级数”混为一谈。C∞ 函数不一定 analytic。现代 Taylor 定理因此特别重视余项和误差界。\n","resources":[]},{"heading":"2. Taylor 展开：用简单局部模型逼近复杂世界 › 应用","line":43,"end":48,"text":"### 应用\n\n数值计算、误差传播、Newton 法、二阶优化、控制系统线性化、物理微扰理论、机器学习局部损失近似。\n\n---\n","resources":[]},{"heading":"3. Euler 公式：指数、旋转、复数、波动的统一","line":49,"end":56,"text":"## 3. Euler 公式：指数、旋转、复数、波动的统一\n\n核心公式：\n\ne^(iθ) = cos θ + i sin θ。\n\n取 θ=π 得 e^(iπ)+1=0。\n","resources":[]},{"heading":"3. Euler 公式：指数、旋转、复数、波动的统一 › 前世","line":57,"end":60,"text":"### 前世\n\n复数在 16 世纪三次方程求解中被迫出现，Bombelli 等逐渐建立运算规则；de Moivre、Cotes 等研究三角函数与复数量的关系。Euler 在 1748 年《无穷分析引论》中给出经典指数形式。\n","resources":[]},{"heading":"3. Euler 公式：指数、旋转、复数、波动的统一 › 为什么强大","line":61,"end":64,"text":"### 为什么强大\n\n复数乘法天然编码旋转；正弦波可用复指数表示；指数函数又是微分运算最自然的特征函数之一。于是振动、线性系统、Fourier 分析都获得统一语言。\n","resources":[]},{"heading":"3. Euler 公式：指数、旋转、复数、波动的统一 › 应用","line":65,"end":70,"text":"### 应用\n\n交流电相量、通信调制、信号处理、控制系统特征值、量子相位、波动与微分方程。\n\n---\n","resources":[]},{"heading":"4. Fourier 变换：换一个坐标系看复杂信号","line":71,"end":76,"text":"## 4. Fourier 变换：换一个坐标系看复杂信号\n\n常用形式：\n\nF(ω) = ∫ f(t)e^(-iωt) dt。\n","resources":[]},{"heading":"4. Fourier 变换：换一个坐标系看复杂信号 › 前世","line":77,"end":80,"text":"### 前世\n\nFourier 最初研究的是热传导，而不是音乐。他用三角级数解热方程，提出相当一般的函数可以拆成正弦、余弦成分。这引发了关于函数、收敛、逐项积分求导的长期争论，并反向推动严格分析、Riemann 与 Lebesgue 理论发展。\n","resources":[]},{"heading":"4. Fourier 变换：换一个坐标系看复杂信号 › 四个概念不要混","line":81,"end":87,"text":"### 四个概念不要混\n\nFourier 级数：周期函数到离散频率。\nFourier 变换：非周期连续信号到连续频谱。\nDFT：有限离散序列到有限频谱。\nFFT：快速计算 DFT 的算法族。\n","resources":[]},{"heading":"4. Fourier 变换：换一个坐标系看复杂信号 › 应用","line":88,"end":91,"text":"### 应用\n\n通信频谱和调制、音频降噪、图像变换、MRI k-space 重建、CT、光学衍射、X 射线晶体学、PDE 谱方法。\n","resources":[]},{"heading":"4. Fourier 变换：换一个坐标系看复杂信号 › 深层思想","line":92,"end":97,"text":"### 深层思想\n\n卷积在频域变乘法，微分在频域变为乘 iω。数学上的“换表示”会把困难运算变成简单运算。\n\n---\n","resources":[]},{"heading":"5. 散度定理：内部与边界的守恒桥梁","line":98,"end":103,"text":"## 5. 散度定理：内部与边界的守恒桥梁\n\n核心公式：\n\n∭_Ω div F dV = ∬_∂Ω F·n dS。\n","resources":[]},{"heading":"5. 散度定理：内部与边界的守恒桥梁 › 直觉","line":104,"end":107,"text":"### 直觉\n\n一个区域内部产生多少“源”，等于穿过边界的净流出量。\n","resources":[]},{"heading":"5. 散度定理：内部与边界的守恒桥梁 › 历史校正","line":108,"end":111,"text":"### 历史校正\n\n它不应简单描述为“高斯一人发明”。二维版本常与 Green 相关；Gauss 在 1813 年处理过三维特殊形式；Ostrogradsky 后来给出推广；更早 Euler 等人的工作中也出现相近思想。今天常见 Gauss、Gauss-Green、Gauss-Ostrogradsky 等多种名称。\n","resources":[]},{"heading":"5. 散度定理：内部与边界的守恒桥梁 › 数学地位","line":112,"end":115,"text":"### 数学地位\n\n它可以看成一维微积分基本定理的高维版本，并与 Green 定理、Stokes 定理统一到“内部导数与边界积分”的框架。\n","resources":[]},{"heading":"5. 散度定理：内部与边界的守恒桥梁 › 应用","line":116,"end":121,"text":"### 应用\n\nMaxwell 方程、电磁通量、流体质量守恒、热传导、连续性方程、有限体积法、PDE。\n\n---\n","resources":[]},{"heading":"6. 留数定理：全局积分由奇点局部信息决定","line":122,"end":127,"text":"## 6. 留数定理：全局积分由奇点局部信息决定\n\n核心关系：\n\n∮_γ f(z) dz = 2πi Σ Res(f,z_k)。\n","resources":[]},{"heading":"6. 留数定理：全局积分由奇点局部信息决定 › 前世","line":128,"end":131,"text":"### 前世\n\n19 世纪 Cauchy 把复函数积分建立成系统理论。若函数在闭曲线内部全纯，闭路积分为零；真正“留下”非零贡献的往往是奇点。Laurent 展开中的 (z-z0)^(-1) 项系数就是留数。\n","resources":[]},{"heading":"6. 留数定理：全局积分由奇点局部信息决定 › 为什么惊艳","line":132,"end":135,"text":"### 为什么惊艳\n\n复杂函数在奇点附近可能有无限多个 Laurent 项，但闭路积分最终只读取一个特殊系数。它是一种极强的信息压缩。\n","resources":[]},{"heading":"6. 留数定理：全局积分由奇点局部信息决定 › 应用","line":136,"end":139,"text":"### 应用\n\n难算实积分、Laplace/Fourier 逆变换、Green 函数、波传播、线性系统极点与稳定性、统计物理与理论物理中的复积分。\n","resources":[]},{"heading":"6. 留数定理：全局积分由奇点局部信息决定 › 常见误解","line":140,"end":145,"text":"### 常见误解\n\n留数不是“奇点处的函数值”；奇点处通常没有普通函数值。\n\n---\n","resources":[]},{"heading":"7. Bayes 公式：把学习写成概率更新","line":146,"end":153,"text":"## 7. Bayes 公式：把学习写成概率更新\n\nP(A|B) = P(B|A)P(A)/P(B)。\n\n统计建模常写：\n\nposterior ∝ likelihood × prior。\n","resources":[]},{"heading":"7. Bayes 公式：把学习写成概率更新 › 前世","line":154,"end":157,"text":"### 前世\n\nThomas Bayes 的论文在其去世后由 Richard Price 整理发表，处理由观察结果反推未知概率的问题。Laplace 随后大规模推广“逆概率”，今天很多 Bayes 形式的系统化与 Laplace 密切相关。\n","resources":[]},{"heading":"7. Bayes 公式：把学习写成概率更新 › 核心意义","line":158,"end":161,"text":"### 核心意义\n\n它描述了一种通用学习循环：先有不确定判断，观察数据，计算不同假设产生数据的可能性，然后更新成后验分布。\n","resources":[]},{"heading":"7. Bayes 公式：把学习写成概率更新 › 应用","line":162,"end":165,"text":"### 应用\n\n医学检测、机器人传感器融合、垃圾邮件分类、A/B 测试、科学参数推断、Gaussian process、概率编程、Bayesian neural networks。\n","resources":[]},{"heading":"7. Bayes 公式：把学习写成概率更新 › 常见误解","line":166,"end":171,"text":"### 常见误解\n\n高灵敏度检测不意味着阳性后患病概率一定高；还必须考虑先验基准率。先验也不等于随便猜，它可以来自历史数据、物理约束或层级模型。\n\n---\n","resources":[]},{"heading":"8. 对数积分与素数分布：局部无序，宏观有序","line":172,"end":183,"text":"## 8. 对数积分与素数分布：局部无序，宏观有序\n\n素数计数函数：\n\nπ(x) = #{p≤x : p 为素数}。\n\n素数定理：\n\nπ(x) ~ x/log x。\n\n对数积分 li(x) 常给更精细的近似。\n","resources":[]},{"heading":"8. 对数积分与素数分布：局部无序，宏观有序 › 前世","line":184,"end":187,"text":"### 前世\n\nEuclid 证明素数无穷多；Euler 把 zeta 函数与素数乘积联系；Gauss、Legendre 观察到素数密度约为 1/log x。Riemann 1859 年把素数计数与复变量 zeta 函数的零点联系，开创解析数论关键路线。Hadamard 与 de la Vallée Poussin 在 1896 年独立证明素数定理。\n","resources":[]},{"heading":"8. 对数积分与素数分布：局部无序，宏观有序 › Riemann 假设","line":188,"end":191,"text":"### Riemann 假设\n\n素数定理控制平均分布；Riemann 假设更精细地控制偏离平均趋势的误差。\n","resources":[]},{"heading":"8. 对数积分与素数分布：局部无序，宏观有序 › 密码学关系要说准确","line":192,"end":197,"text":"### 密码学关系要说准确\n\nRSA 使用大素数和整数分解困难性，但不是“直接使用素数定理”。素数定理帮助理解大数附近素数的平均密度；实际生成素数依赖随机采样与素性测试。\n\n---\n","resources":[]},{"heading":"9. Lebesgue 单调收敛定理：无限过程什么时候合法","line":198,"end":203,"text":"## 9. Lebesgue 单调收敛定理：无限过程什么时候合法\n\n若 0≤f1≤f2≤… 且 fn ↑ f，则：\n\n∫ f dμ = lim ∫ fn dμ。\n","resources":[]},{"heading":"9. Lebesgue 单调收敛定理：无限过程什么时候合法 › 前世","line":204,"end":207,"text":"### 前世\n\n19 世纪 Fourier 级数、函数列和不连续函数不断挑战 Riemann 积分框架。Borel、Jordan 等集合与测度思想铺路；Lebesgue 在 1901–1902 年建立测度和新积分理论。\n","resources":[]},{"heading":"9. Lebesgue 单调收敛定理：无限过程什么时候合法 › 真正价值","line":208,"end":211,"text":"### 真正价值\n\n现代分析经常要交换极限、求和、积分。这个交换并非自动合法。MCT、Fatou 引理、支配收敛定理等给出清晰条件，令极限过程可控。\n","resources":[]},{"heading":"9. Lebesgue 单调收敛定理：无限过程什么时候合法 › 与概率论的关系","line":212,"end":215,"text":"### 与概率论的关系\n\n现代概率中：概率是测度，随机变量是可测函数，期望是 Lebesgue 积分。因此收敛定理直接是概率论基础设施。\n","resources":[]},{"heading":"9. Lebesgue 单调收敛定理：无限过程什么时候合法 › 应用","line":216,"end":221,"text":"### 应用\n\nFourier 的 Lp 空间、随机过程、条件期望、PDE 弱解、Sobolev 空间、统计模型积分与边缘化。\n\n---\n","resources":[]},{"heading":"九个主题之间的四条主链","line":222,"end":229,"text":"# 九个主题之间的四条主链\n\n1. 微积分 → 微分方程 → Fourier → Lebesgue。\n2. 复数 → Euler → Fourier → 复分析 → 留数。\n3. 概率 → Bayes → 测度论 → 现代统计/AI。\n4. 素数 → Euler 乘积 → Riemann zeta → 复分析。\n\n共同策略都是：选对表示，让原问题在新空间里更简单。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/01-nine-core.md"},{"path":"mathematics-changed-the-world/docs/02-beyond.md","module":"学习导航","role":"导航页面","title":"不止九个：现代数学的九条延伸主干","sections":[{"heading":"1. 复数","line":3,"end":6,"text":"## 1. 复数\n\n复数从 16 世纪方程求解中的“可疑中间量”逐步成长为二维旋转与相位的自然语言。今天 z=re^(iθ) 同时编码长度和方向。它支撑交流电、Fourier、控制、量子力学和复分析。\n","resources":[]},{"heading":"2. 线性代数","line":7,"end":12,"text":"## 2. 线性代数\n\n线性方程组古已有之，但矩阵作为独立对象主要在 19 世纪成熟。Sylvester 在 1850 年使用 matrix 一词，Cayley 随后系统发展矩阵代数。现代核心包括向量空间、线性变换、特征值、正交投影、SVD。\n\n现实应用：3D 图形、PCA、深度学习张量运算、量子算符、图网络、控制状态空间。若微积分是变化语言，线性代数就是高维关系语言。\n","resources":[]},{"heading":"3. 微分方程","line":13,"end":18,"text":"## 3. 微分方程\n\n微积分之后，人们把“当前变化规律”写成 dx/dt=f(x,t)，进而预测演化。Newton 力学、Euler/Lagrange 力学、Fourier 热方程、Maxwell 方程都属于这条路线。\n\n现实应用：轨道、流体、热、声、电磁、化学反应、传染病模型、神经动力学、金融定价、机器人控制。\n","resources":[]},{"heading":"4. 非欧几何","line":19,"end":24,"text":"## 4. 非欧几何\n\nEuclid 第五公设困扰数学两千多年。19 世纪 Lobachevsky 与 Bolyai 独立发展双曲几何，Riemann 在 1854 年把几何推进为“可弯曲空间”的理论。\n\n哲学变化：几何不再只有一种。Einstein 广义相对论后来用 Riemann 几何描述弯曲时空。现代计算机视觉、机器人、形状分析、流形学习也使用微分几何。\n","resources":[]},{"heading":"5. 群论与对称性","line":25,"end":30,"text":"## 5. 群论与对称性\n\nGalois 在研究多项式方程时发现，能否用根式解方程与根的置换群结构相关。群论后来抽象为“可组合、可逆的变换”的理论。\n\n它把“对称性”变成数学对象。晶体学、量子角动量、粒子物理规范群、几何变换和编码理论都使用群及其表示。\n","resources":[]},{"heading":"6. 信息论","line":31,"end":40,"text":"## 6. 信息论\n\nClaude Shannon 1948 年建立现代信息论。熵：\n\nH(X) = -Σ p(x)log p(x)。\n\n它把“信息量、噪声、压缩、可靠通信”变成精确数学问题，并证明通信与压缩存在不可突破的极限。\n\n现实应用：无线通信、纠错码、数据压缩、密码学、统计学习、交叉熵、KL divergence、互信息。\n","resources":[]},{"heading":"7. 可计算性","line":41,"end":46,"text":"## 7. 可计算性\n\nTuring 1936 年把“算法”形式化为机器过程，并证明有些问题不存在通用算法。Church 从 lambda calculus 得到相近的计算边界。\n\n这给计算机科学先划了一条比“运行速度”更根本的线：一个问题到底能不能被算法普遍解决？之后复杂性理论再研究可解问题的时间与空间成本。\n","resources":[]},{"heading":"8. 混沌与动力系统","line":47,"end":54,"text":"## 8. 混沌与动力系统\n\nLorenz 1963 年研究非线性系统时发现：极小初值差异可以发展成巨大轨迹差异。\n\n重要结论：确定性不等于长期可预测性。方程可以完全确定，但有限测量误差会被非线性放大。\n\n现实应用：天气、流体、生态、激光、心脏动力学等复杂系统。\n","resources":[]},{"heading":"9. 凸优化与机器学习","line":55,"end":60,"text":"## 9. 凸优化与机器学习\n\n现代科学常问的不是“方程解是多少”，而是 min f(x) subject to constraints。\n\n凸性特别重要，因为局部最优常等于全局最优，且拥有成熟的对偶理论和收敛算法。现代工程中的数据拟合、资源分配、控制、信号处理、金融与机器学习大量依赖优化。\n","resources":[]},{"heading":"9. 凸优化与机器学习 › AI 是多条传统数学的汇合","line":61,"end":72,"text":"### AI 是多条传统数学的汇合\n\n- 线性代数：矩阵与张量。\n- 微积分：反向传播。\n- Taylor：局部近似。\n- 概率/Bayes：不确定性。\n- 信息论：交叉熵、KL。\n- 优化：参数训练。\n- Fourier：频域、卷积、谱方法。\n- 数值分析：浮点稳定性和迭代算法。\n\nAI 并不是“旧数学失效后的新公式”，而是成熟数学在大规模计算上的组合。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/02-beyond.md"},{"path":"mathematics-changed-the-world/docs/03-timeline-applications.md","module":"学习导航","role":"导航页面","title":"时间线与现实应用地图","sections":[{"heading":"历史时间线","line":3,"end":17,"text":"## 历史时间线\n\n| 时期 | 关键变化 | 代表人物/事件 |\n|---|---|---|\n| 古代 | 演绎几何、穷竭法、素数 | Euclid、Archimedes |\n| 16–17 世纪 | 代数符号、解析几何、复数 | Cardano、Bombelli、Descartes、Fermat |\n| 1660s–1680s | 微积分形成 | Newton、Leibniz、Barrow 等 |\n| 18 世纪 | 分析、级数、ODE、概率 | Euler、Taylor、Bernoulli、Lagrange、Laplace |\n| 1800–1850 | Fourier、复分析、非欧几何 | Fourier、Cauchy、Gauss、Lobachevsky、Bolyai |\n| 1850–1900 | 矩阵、群论、Riemann 几何、解析数论 | Cayley、Galois、Riemann、Hadamard |\n| 1900–1930 | 测度、Lebesgue 积分、函数空间 | Lebesgue、Borel、Hilbert |\n| 1930–1950 | 可计算性、概率公理、信息论 | Turing、Church、Kolmogorov、Shannon |\n| 1950–1970 | 数值计算、FFT、控制、现代统计 | 数字计算机与算法化数学 |\n| 1960s–今天 | 混沌、优化、机器学习 | Lorenz、现代计算数学 |\n","resources":[]},{"heading":"三次抽象升级 › 从量到函数","line":20,"end":22,"text":"### 从量到函数\n运动、热、波、物理状态都可以写成函数，再做微分、积分和展开。\n","resources":[]},{"heading":"三次抽象升级 › 从函数到结构","line":23,"end":25,"text":"### 从函数到结构\n19 世纪以后，群、矩阵、流形、拓扑、函数空间本身成为研究对象。\n","resources":[]},{"heading":"三次抽象升级 › 从结构到信息与算法","line":26,"end":28,"text":"### 从结构到信息与算法\n20 世纪开始，“能不能算、需要多少比特、算法多快、数据怎样更新概率”也成为数学对象。\n","resources":[]},{"heading":"现实应用地图","line":29,"end":43,"text":"## 现实应用地图\n\n| 场景 | 数学工具 | 数学实际在做什么 |\n|---|---|---|\n| 手机通信 | 复数、Fourier、线性代数、信息论 | 调制、频谱、滤波、编码、MIMO |\n| 音乐/语音 | Fourier、概率、优化 | 谱分析、降噪、压缩、识别 |\n| 图像/视频 | 线性代数、变换、概率 | DCT/小波、卷积、压缩、重建 |\n| MRI/CT | Fourier、线性代数、优化 | k-space/投影重建、逆问题 |\n| GPS/机器人 | 微积分、ODE、Bayes、线性代数 | 状态估计、滤波、控制 |\n| 天气 | PDE、数值分析、混沌 | 方程离散求解、集合预报 |\n| 电力/电路 | 复数、ODE、Fourier | 相量、频率响应、稳定性 |\n| AI 训练 | 线性代数、微积分、优化、信息论 | 前向计算、梯度、损失最小化 |\n| 密码学 | 数论、代数、概率、复杂性 | 大整数、有限域、椭圆曲线、随机性 |\n| 物理仿真 | 微积分、PDE、Stokes/散度、线性代数 | 守恒、离散、求大型方程组 |\n","resources":[]},{"heading":"四个跨行业数学动作","line":44,"end":51,"text":"## 四个跨行业数学动作\n\n1. 变换：把问题搬到更好算的空间。Fourier、Laplace、SVD 都是典型。\n2. 线性化：在局部先用简单模型。Taylor、Jacobian、Hessian。\n3. 概率化：承认信息不完整。Bayes、随机过程、统计估计。\n4. 离散化：把连续世界交给计算机。有限差分、有限元、有限体积、FFT、数值积分。\n\n理解应用时，最好记住这些“动作”，而不是只记某行业用了某条公式。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/03-timeline-applications.md"},{"path":"mathematics-changed-the-world/docs/04-references.md","module":"参考资料与覆盖记录","role":"资料索引","title":"权威参考资料与继续阅读","sections":[{"heading":"历史与九个核心","line":3,"end":43,"text":"## 历史与九个核心\n\n1. MacTutor — The rise of calculus\n   https://mathshistory.st-andrews.ac.uk/HistTopics/The_rise_of_calculus/\n\n2. MacTutor — Isaac Newton\n   https://mathshistory.st-andrews.ac.uk/Biographies/Newton/\n\n3. MacTutor — Brook Taylor\n   https://mathshistory.st-andrews.ac.uk/Biographies/Taylor/\n\n4. MacTutor — Leonhard Euler\n   https://mathshistory.st-andrews.ac.uk/Biographies/Euler/\n\n5. MacTutor — Joseph Fourier\n   https://mathshistory.st-andrews.ac.uk/Biographies/Fourier/\n\n6. Encyclopedia of Mathematics — Divergence theorem\n   https://encyclopediaofmath.org/wiki/Divergence_theorem\n\n7. MacTutor — Cauchy's Theorem\n   https://mathshistory.st-andrews.ac.uk/Diagrams/CauchyTheorem/\n\n8. MacTutor — Thomas Bayes\n   https://mathshistory.st-andrews.ac.uk/Biographies/Bayes/\n\n9. MacTutor — Pierre-Simon Laplace\n   https://mathshistory.st-andrews.ac.uk/Biographies/Laplace/\n\n10. MacTutor — Prime numbers\n    https://mathshistory.st-andrews.ac.uk/HistTopics/Prime_numbers/\n\n11. Clay Mathematics Institute — Riemann's 1859 Manuscript\n    https://www.claymath.org/collections/riemanns-1859-manuscript/\n\n12. Clay Mathematics Institute — Riemann Hypothesis\n    https://www.claymath.org/millennium/Riemann-Hypothesis/\n\n13. MacTutor — Henri Lebesgue\n    https://mathshistory.st-andrews.ac.uk/Biographies/Lebesgue/\n","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/HistTopics/The_rise_of_calculus/","url":"https://mathshistory.st-andrews.ac.uk/HistTopics/The_rise_of_calculus/"},{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Newton/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Newton/"},{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Taylor/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Taylor/"},{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Euler/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Euler/"},{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Fourier/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Fourier/"},{"label":"https://encyclopediaofmath.org/wiki/Divergence_theorem","url":"https://encyclopediaofmath.org/wiki/Divergence_theorem"},{"label":"https://mathshistory.st-andrews.ac.uk/Diagrams/CauchyTheorem/","url":"https://mathshistory.st-andrews.ac.uk/Diagrams/CauchyTheorem/"},{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Bayes/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Bayes/"},{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Laplace/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Laplace/"},{"label":"https://mathshistory.st-andrews.ac.uk/HistTopics/Prime_numbers/","url":"https://mathshistory.st-andrews.ac.uk/HistTopics/Prime_numbers/"},{"label":"https://www.claymath.org/collections/riemanns-1859-manuscript/","url":"https://www.claymath.org/collections/riemanns-1859-manuscript/"},{"label":"https://www.claymath.org/millennium/Riemann-Hypothesis/","url":"https://www.claymath.org/millennium/Riemann-Hypothesis/"},{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Lebesgue/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Lebesgue/"}]},{"heading":"Fourier 的工程应用","line":44,"end":54,"text":"## Fourier 的工程应用\n\n14. Stanford EE261 — The Fourier Transform and its Applications\n    https://see.stanford.edu/Course/EE261\n\n15. MIT OpenCourseWare — Applications of Fourier Transforms\n    https://ocw.mit.edu/courses/6-003-signals-and-systems-fall-2011/resources/lecture-20-applications-of-fourier-transforms/\n\n16. NIST — Introduction to Fourier Transform Spectroscopy\n    https://www.nist.gov/publications/introduction-fourier-transform-spectroscopy\n","resources":[{"label":"https://see.stanford.edu/Course/EE261","url":"https://see.stanford.edu/Course/EE261"},{"label":"https://ocw.mit.edu/courses/6-003-signals-and-systems-fall-2011/resources/lecture-20-applications-of-fourier-transforms/","url":"https://ocw.mit.edu/courses/6-003-signals-and-systems-fall-2011/resources/lecture-20-applications-of-fourier-transforms/"},{"label":"https://www.nist.gov/publications/introduction-fourier-transform-spectroscopy","url":"https://www.nist.gov/publications/introduction-fourier-transform-spectroscopy"}]},{"heading":"Laplace / Z / 连续—离散系统","line":55,"end":74,"text":"## Laplace / Z / 连续—离散系统\n\n- MIT OpenCourseWare RES.6-007 — Lecture 16: Sampling  \n  https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-16-sampling/\n\n- MIT OpenCourseWare RES.6-007 — Lecture 20: The Laplace Transform  \n  https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-20-the-laplace-transform/\n\n- MIT OpenCourseWare RES.6-007 — Lecture 22: The z-Transform  \n  https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-22-the-z-transform/\n\n- MIT OpenCourseWare RES.6-007 — Lecture 23: Mapping Continuous-Time Filters to Discrete-Time Filters  \n  https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-23-mapping-continuous-time-filters-to-discrete-time-filters/\n\n- MIT OpenCourseWare RES.6-007 — readings for ROC, inverse transforms, LTI analysis and bilinear transformation  \n  https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/pages/readings/\n\n- SciPy — signal.bilinear_zpk documentation (Tustin/bilinear transform)  \n  https://docs.scipy.org/doc/scipy/reference/generated/scipy.signal.bilinear_zpk.html\n","resources":[{"label":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-16-sampling/","url":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-16-sampling/"},{"label":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-20-the-laplace-transform/","url":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-20-the-laplace-transform/"},{"label":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-22-the-z-transform/","url":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-22-the-z-transform/"},{"label":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-23-mapping-continuous-time-filters-to-discrete-time-filters/","url":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-23-mapping-continuous-time-filters-to-discrete-time-filters/"},{"label":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/pages/readings/","url":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/pages/readings/"},{"label":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.signal.bilinear_zpk.html","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.signal.bilinear_zpk.html"}]},{"heading":"矩阵、几何、群","line":75,"end":85,"text":"## 矩阵、几何、群\n\n17. MacTutor — Matrices and determinants\n    https://mathshistory.st-andrews.ac.uk/HistTopics/Matrices_and_determinants/\n\n18. MacTutor — Non-Euclidean geometry\n    https://mathshistory.st-andrews.ac.uk/HistTopics/Non-Euclidean_geometry/\n\n19. MacTutor — Development of group theory\n    https://mathshistory.st-andrews.ac.uk/HistTopics/Development_group_theory/\n","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/HistTopics/Matrices_and_determinants/","url":"https://mathshistory.st-andrews.ac.uk/HistTopics/Matrices_and_determinants/"},{"label":"https://mathshistory.st-andrews.ac.uk/HistTopics/Non-Euclidean_geometry/","url":"https://mathshistory.st-andrews.ac.uk/HistTopics/Non-Euclidean_geometry/"},{"label":"https://mathshistory.st-andrews.ac.uk/HistTopics/Development_group_theory/","url":"https://mathshistory.st-andrews.ac.uk/HistTopics/Development_group_theory/"}]},{"heading":"信息、计算、混沌、优化","line":86,"end":105,"text":"## 信息、计算、混沌、优化\n\n20. Claude E. Shannon — A Mathematical Theory of Communication (1948)\n    https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf\n\n21. Turing Digital Archive — Computable numbers\n    https://turingarchive.kings.cam.ac.uk/computable-numbers\n\n22. Alan Turing — On Computable Numbers\n    https://www.cs.virginia.edu/~robins/Turing_Paper_1936.pdf\n\n23. Edward N. Lorenz — Deterministic Nonperiodic Flow (1963)\n    https://journals.ametsoc.org/view/journals/atsc/20/2/1520-0469_1963_020_0130_dnf_2_0_co_2.xml\n\n24. Stephen Boyd — Overview of Convex Optimization\n    https://web.stanford.edu/~boyd/papers/cvx_opt_overview.html\n\n25. Boyd & V n/bks/sykc/148761.htm"},{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook.html","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook.html"},{"label":"https://www.chinesemooc.org/web/course_detail.php?courseid=5063","url":"https://www.chinesemooc.org/web/course_detail.php?courseid=5063"},{"label":"https://math.pku.edu.cn/bks/sykc/148668.htm","url":"https://math.pku.edu.cn/bks/sykc/148668.htm"},{"label":"https://www.chinesemooc.org/web/course_detail.php?courseid=4974","url":"https://www.chinesemooc.org/web/course_detail.php?courseid=4974"},{"label":"https://math101.pku.edu.cn/hxjc/qb/3489f4fc70974d0da96ce949939fd3b8.htm","url":"https://math101.pku.edu.cn/hxjc/qb/3489f4fc70974d0da96ce949939fd3b8.htm"}]},{"heading":"Transformer / AI","line":95,"end":101,"text":"## Transformer / AI\n\n- Vaswani et al., *Attention Is All You Need*  \n  https://arxiv.org/abs/1706.03762\n- Goodfellow, Bengio & Courville, *Deep Learning*  \n  https://www.deeplearningbook.org/\n","resources":[{"label":"https://arxiv.org/abs/1706.03762","url":"https://arxiv.org/abs/1706.03762"},{"label":"https://www.deeplearningbook.org/","url":"https://www.deeplearningbook.org/"}]},{"heading":"推荐“桥梁教材”","line":102,"end":113,"text":"## 推荐“桥梁教材”\n\n- Strang — Linear Algebra\n- Strogatz — Nonlinear Dynamics and Chaos\n- Cover & Thomas — Information Theory\n- Gelman et al. — Bayesian Data Analysis\n- Boyd & Vandenberghe — Convex Optimization\n- Oppenheim & Willsky — Signals and Systems\n- Trefethen & Bau — Numerical Linear Algebra\n- Axler — Linear Algebra Done Right\n- Hatcher — Algebraic Topology\n- Lee — Riemannian Manifolds","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/05-modern-references.md"},{"path":"mathematics-changed-the-world/docs/branches/01-topology.md","module":"数学主干","role":"数学专题","title":"拓扑：当长度和角度都不重要时，还剩下什么？","sections":[{"heading":"拓扑：当长度和角度都不重要时，还剩下什么？","line":1,"end":4,"text":"# 拓扑：当长度和角度都不重要时，还剩下什么？\n\n> **核心问题**：如果一个物体可以连续拉伸、弯曲，但不允许撕裂或粘合，哪些性质仍然不变？\n","resources":[]},{"heading":"从 Königsberg 七桥到“位置的几何”","line":5,"end":14,"text":"## 从 Königsberg 七桥到“位置的几何”\n\n1736 年 Euler 研究七桥问题：能否从某处出发，每座桥恰好经过一次？关键突破是他意识到桥的具体长度、河岸形状、角度都不重要，只需要保留：\n\n- 陆地区域；\n- 桥；\n- 连接关系。\n\n这是后来图论和拓扑思想的重要源头。问题第一次明确展示：有一种几何学研究的不是距离，而是“连接方式”。\n","resources":[]},{"heading":"Euler characteristic","line":15,"end":26,"text":"## Euler characteristic\n\n对凸多面体：\n\n$$\nV-E+F=2.\n$$\n\n这里 $V,E,F$ 分别是顶点、边、面。\n\n后来这个量被推广到更一般的空间，成为 topological invariant 的原型。\n","resources":[]},{"heading":"Poincaré：把拓扑变成系统学科","line":27,"end":40,"text":"## Poincaré：把拓扑变成系统学科\n\nPoincaré 在 1895 年《Analysis Situs》中系统发展拓扑方法，并引入 fundamental group 等代数工具。\n\n核心策略：\n\n$$\n\\text{空间}\n\\longrightarrow\n\\text{群、同调等代数对象}.\n$$\n\n两个空间若拓扑结构不同，往往可以通过这些 invariants 区分。\n","resources":[]},{"heading":"什么叫“同一个拓扑空间”？","line":41,"end":48,"text":"## 什么叫“同一个拓扑空间”？\n\n若存在连续双射且逆映射也连续，两个空间 homeomorphic。\n\n经典直觉：咖啡杯和甜甜圈都只有一个“洞”，可在不撕裂粘合的连续变形中互相变换。\n\n但注意：这个比喻只表达 homeomorphism 的直觉，不是拓扑的完整定义。\n","resources":[]},{"heading":"为什么今天重要？ › 数据分析","line":51,"end":53,"text":"### 数据分析\nTopological Data Analysis 使用 persistent homology 追踪点云在不同尺度下的连通分支、洞和高维空腔。\n","resources":[]},{"heading":"为什么今天重要？ › 机器人","line":54,"end":56,"text":"### 机器人\n机械臂配置空间可能具有复杂拓扑；路径规划本质上是在 configuration space 中寻找可行路径。\n","resources":[]},{"heading":"为什么今天重要？ › 物理","line":57,"end":59,"text":"### 物理\n拓扑绝缘体、topological phase、缺陷与 winding number 都用拓扑不变量描述“连续扰动下不会轻易消失”的结构。\n","resources":[]},{"heading":"为什么今天重要？ › 神经科学与复杂系统","line":60,"end":62,"text":"### 神经科学与复杂系统\n高维数据中的环、空腔和 connectivity 可以作为网络或状态空间的结构特征。\n","resources":[]},{"heading":"与九个核心公式的连接","line":63,"end":70,"text":"## 与九个核心公式的连接\n\n- 微积分 → differential topology；\n- Euler 公式 → winding number；\n- Fourier / functional analysis → topological vector spaces；\n- 复分析 → argument principle 与拓扑绕数；\n- 数据分析 → probability + topology。\n","resources":[]},{"heading":"常见误解","line":71,"end":78,"text":"## 常见误解\n\n**“拓扑就是甜甜圈和咖啡杯。”**  \n这是入门类比。现代拓扑包括 point-set topology、algebraic topology、differential topology、geometric topology 等大量分支。\n\n**“只要洞的数量一样就是同一个空间。”**  \n不对。Euler characteristic 或 Betti numbers 都只是部分 invariants。\n","resources":[]},{"heading":"参考","line":79,"end":83,"text":"## 参考\n\n- MacTutor, *A history of Topology*: https://mathshistory.st-andrews.ac.uk/HistTopics/Topology_in_mathematics/\n- MacTutor, Henri Poincaré: https://mathshistory.st-andrews.ac.uk/Biographies/Poincare/\n- Hatcher, *Algebraic Topology*.","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/HistTopics/Topology_in_mathematics/","url":"https://mathshistory.st-andrews.ac.uk/HistTopics/Topology_in_mathematics/"},{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Poincare/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Poincare/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/01-topology.md"},{"path":"mathematics-changed-the-world/docs/branches/02-differential-geometry.md","module":"数学主干","role":"数学专题","title":"微分几何：在弯曲空间里做微积分","sections":[{"heading":"微分几何：在弯曲空间里做微积分","line":1,"end":4,"text":"# 微分几何：在弯曲空间里做微积分\n\n> **核心问题**：曲线、曲面乃至高维空间自身可以弯曲时，长度、角度、最短路径和“曲率”怎样定义？\n","resources":[]},{"heading":"从地图测量开始","line":5,"end":14,"text":"## 从地图测量开始\n\n微分几何不是先从相对论出现的。地球测量、地图投影、曲面曲率早已提出问题：\n\n- 怎样在球面上测最短路？\n- 能不能把地球表面无失真摊平？\n- 曲面的弯曲是依赖嵌入空间，还是可以只从曲面内部感知？\n\nGauss 在 1827/1828 年的 curved surfaces 工作中系统发展曲面内在几何。其著名 Theorema Egregium 表明 Gaussian curvature 是内在量：只住在曲面上的“二维生物”也能通过测量判断曲面是否弯曲。\n","resources":[]},{"heading":"Riemann 的升级：空间本身也可以弯","line":15,"end":33,"text":"## Riemann 的升级：空间本身也可以弯\n\n1854 年 Riemann 的 habilitation lecture 把曲面思想推广到任意维：\n\n- 每一点附近像 $\\mathbb R^n$；\n- 但全局可能弯曲；\n- 用 metric tensor 决定局部长度和角度。\n\n局部线元素：\n\n$$\nds^2\n\\mathrel{=}\n\\sum_{i,j}\ng_{ij}\\,dx^i dx^j.\n$$\n\n这就是 Riemannian geometry 的核心入口。\n","resources":[]},{"heading":"Geodesic：弯曲空间里的“直线”","line":34,"end":51,"text":"## Geodesic：弯曲空间里的“直线”\n\n平面最短路是直线；球面上是大圆弧。\n\n在一般 manifold 上，geodesic 满足\n\n$$\n\\frac{d^2x^k}{dt^2}\n+\n\\Gamma^k_{ij}\n\\frac{dx^i}{dt}\n\\frac{dx^j}{dt}\n\\mathrel{=}\n0.\n$$\n\nChristoffel symbols $\\Gamma^k_{ij}$ 编码坐标下的连接结构。\n","resources":[]},{"heading":"从曲率到广义相对论","line":52,"end":63,"text":"## 从曲率到广义相对论\n\nEinstein 的关键思想之一是：引力不再单纯被视作普通力，而与 spacetime geometry 联系。\n\n极简口号是：\n\n$$\n\\text{物质告诉时空怎样弯，时空告诉物质怎样运动}.\n$$\n\n数学语言需要 Riemann curvature、tensor calculus、geodesic 等。\n","resources":[]},{"heading":"今天的应用 › 机器人","line":66,"end":68,"text":"### 机器人\n姿态属于 rotation group $SO(3)$，不是普通欧氏向量空间。导航和优化需要在 manifold 上计算。\n","resources":[]},{"heading":"今天的应用 › 计算机视觉","line":69,"end":71,"text":"### 计算机视觉\n相机姿态、三维重建、shape space 都大量使用 Lie group / manifold。\n","resources":[]},{"heading":"今天的应用 › 机器学习","line":72,"end":77,"text":"### 机器学习\n- Riemannian optimization；\n- manifold learning；\n- SPD matrix geometry；\n- information geometry。\n","resources":[]},{"heading":"今天的应用 › 神经影像","line":78,"end":80,"text":"### 神经影像\ndMRI 中 diffusion tensor 是正定矩阵；直接用普通欧氏平均可能破坏几何结构，因此常考虑其 manifold geometry。\n","resources":[]},{"heading":"与拓扑区别","line":81,"end":97,"text":"## 与拓扑区别\n\n拓扑允许连续变形，不关心长度角度。  \n微分几何要求更细的 smooth structure 和 metric，因此可以谈导数、曲率、geodesic。\n\n可以粗略理解：\n\n$$\n\\text{topology}\n\\subset\n\\text{smooth structure}\n+\n\\text{metric geometry}.\n$$\n\n这不是严格集合包含关系，而是“结构逐层增加”的概念图。\n","resources":[]},{"heading":"与九个核心公式的连接","line":98,"end":104,"text":"## 与九个核心公式的连接\n\n微积分 → multivariable calculus → tensor → differential geometry。  \n散度定理 → Stokes theorem on manifolds。  \nEuler / complex → Lie groups 与旋转。  \nLebesgue → integration on manifolds。\n","resources":[]},{"heading":"参考","line":105,"end":110,"text":"## 参考\n\n- MacTutor, Gauss: https://mathshistory.st-andrews.ac.uk/Biographies/Gauss/\n- MacTutor, Riemann: https://mathshistory.st-andrews.ac.uk/Biographies/Riemann/\n- do Carmo, *Riemannian Geometry*.\n- Lee, *Introduction to Riemannian Manifolds*.","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Gauss/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Gauss/"},{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Riemann/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Riemann/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/02-differential-geometry.md"},{"path":"mathematics-changed-the-world/docs/branches/03-functional-analysis.md","module":"数学主干","role":"数学专题","title":"泛函分析：把线性代数搬到无限维","sections":[{"heading":"泛函分析：把线性代数搬到无限维","line":1,"end":4,"text":"# 泛函分析：把线性代数搬到无限维\n\n> **核心问题**：函数本身能不能像向量一样做几何？微分方程、Fourier series 和量子态能不能放在同一个“空间”里？\n","resources":[]},{"heading":"为什么有限维线性代数不够？","line":5,"end":23,"text":"## 为什么有限维线性代数不够？\n\n在普通线性代数中：\n\n$$\nx=(x_1,\\dots,x_n).\n$$\n\n但很多数学对象本身是函数，例如：\n\n- 温度场 $u(x)$；\n- 波函数 $\\psi(x)$；\n- 信号 $f(t)$；\n- PDE 的解。\n\nFourier 告诉我们函数可以像向量那样分解成“基函数”。这推动一个巨大抽象：\n\n> 把函数当成无限维向量。\n","resources":[]},{"heading":"Hilbert space","line":24,"end":56,"text":"## Hilbert space\n\nHilbert space 具有 inner product：\n\n$$\n\\langle f,g\\rangle.\n$$\n\n例如\n\n$$\nL^2([a,b])\n$$\n\n中的典型内积：\n\n$$\n\\langle f,g\\rangle\n\\mathrel{=}\n\\int_a^b f(x)\\overline{g(x)}\\,dx.\n$$\n\n于是：\n\n- orthogonality；\n- projection；\n- basis；\n- length；\n\n全部可以从有限维向量空间推广到函数空间。\n\nFourier series 就可以理解为向正交基做投影。\n","resources":[]},{"heading":"Banach space","line":57,"end":68,"text":"## Banach space\n\nBanach space 只要求 norm 与 completeness：\n\n$$\n\\|x\\|.\n$$\n\n不一定有 inner product。\n\nStefan Banach 在 20 世纪早期把这套框架系统化。1932 年的著作成为 functional analysis 发展的里程碑。\n","resources":[]},{"heading":"Operator：无限维的“矩阵”","line":69,"end":88,"text":"## Operator：无限维的“矩阵”\n\n线性算子\n\n$$\nT:X\\to Y\n$$\n\n对应有限维中的矩阵。\n\n例如微分：\n\n$$\nD f=f'\n$$\n\n就是一个 operator。\n\n量子力学中的 observable、PDE 中的 differential operator、积分方程中的 integral operator 都属于这一语言。\n","resources":[]},{"heading":"四个基础定理群","line":89,"end":101,"text":"## 四个基础定理群\n\n泛函分析的骨架包括：\n\n- Hahn–Banach theorem；\n- Uniform Boundedness Principle；\n- Open Mapping Theorem；\n- Closed Graph Theorem。\n\n再加上 spectral theory，它们共同回答：\n\n> 无限维空间里的线性方程什么时候有解、解是否稳定、operator 有什么“特征值结构”？\n","resources":[]},{"heading":"量子力学为什么离不开 Hilbert space？","line":102,"end":107,"text":"## 量子力学为什么离不开 Hilbert space？\n\n量子态通常表示为 Hilbert space 中的向量；observables 表示为 self-adjoint operators。\n\n有限维量子计算中就是熟悉的复向量与矩阵，而连续变量系统自然走向无限维。\n","resources":[]},{"heading":"PDE","line":108,"end":119,"text":"## PDE\n\nPDE 的 classical solution 往往要求过强的光滑性。\n\nfunctional analysis 允许在 Sobolev space 中寻找 weak solution：\n\n$$\nu\\in H^1,\\ H^2,\\dots\n$$\n\n这样“解”可以不拥有每一点上的传统导数，却仍满足积分形式的方程。\n","resources":[]},{"heading":"与机器学习的关系","line":120,"end":127,"text":"## 与机器学习的关系\n\n- kernel methods → reproducing kernel Hilbert spaces；\n- Gaussian processes 与 kernel operator；\n- neural tangent kernel；\n- inverse problems；\n- regularization 与 operator theory。\n","resources":[]},{"heading":"一条关键发展链","line":128,"end":151,"text":"## 一条关键发展链\n\n$$\n\\text{Fourier}\n\\to\nL^2\n\\to\n\\text{Hilbert space}\n\\to\n\\text{operators}\n\\to\n\\text{spectral theory}.\n$$\n\n另一条：\n\n$$\n\\text{Lebesgue}\n\\to\nL^p\n\\to\n\\text{Banach spaces}.\n$$\n","resources":[]},{"heading":"参考","line":152,"end":156,"text":"## 参考\n\n- MacTutor, Stefan Banach: https://mathshistory.st-andrews.ac.uk/Biographies/Banach/\n- Kreyszig, *Introductory Functional Analysis with Applications*.\n- Conway, *A Course in Functional Analysis*.","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Banach/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Banach/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/03-functional-analysis.md"},{"path":"mathematics-changed-the-world/docs/branches/04-graph-theory.md","module":"数学主干","role":"数学专题","title":"图论：把世界压缩成“节点 + 关系”","sections":[{"heading":"图论：把世界压缩成“节点 + 关系”","line":1,"end":4,"text":"# 图论：把世界压缩成“节点 + 关系”\n\n> **核心问题**：当对象之间“谁和谁连接”比它们的位置更重要时，怎样进行数学推理？\n","resources":[]},{"heading":"起点：七桥问题","line":5,"end":16,"text":"## 起点：七桥问题\n\nEuler 在 1736 年处理 Königsberg bridges 时，把陆地压成 vertices，把桥压成 edges。\n\n现实地图被抽象成：\n\n$$\nG=(V,E).\n$$\n\n这个抽象非常激进：距离、角度、桥的长度全部丢掉，只保留 connectivity。\n","resources":[]},{"heading":"Euler path","line":17,"end":24,"text":"## Euler path\n\nEuler path：每条 edge 恰走一次。\n\n对连通图，存在 Euler circuit 的经典条件是所有 vertex degree 都是偶数；存在非闭 Euler trail 时恰有两个奇度顶点。\n\n这说明一个全局旅行问题可以由局部 degree 信息判断。\n","resources":[]},{"heading":"图论如何成熟？","line":25,"end":28,"text":"## 图论如何成熟？\n\n19 世纪图结构进入化学、组合数学等领域。Sylvester 在 1878 年把 graph 一词用于与化学结构有关的表示。20 世纪 König 等推动系统化；随后 Erdős 等人的组合方法使图论成为庞大独立领域。\n","resources":[]},{"heading":"树","line":29,"end":46,"text":"## 树\n\nTree 是无环连通图。\n\n对 $n$ 个顶点的树：\n\n$$\n|E|=n-1.\n$$\n\n树结构无处不在：\n\n- 文件系统；\n- 决策树；\n- 编译器 AST；\n- 系统发育树；\n- hierarchical clustering。\n","resources":[]},{"heading":"最短路径","line":47,"end":60,"text":"## 最短路径\n\nDijkstra、Bellman–Ford、A* 等算法解决不同条件下的 shortest path。\n\n这把“图论”连接到 algorithmics：\n\n$$\n\\text{结构}\n+\n\\text{复杂性}\n+\n\\text{数据结构}.\n$$\n","resources":[]},{"heading":"网络科学","line":61,"end":78,"text":"## 网络科学\n\n现实网络通常不是单纯规则图：\n\n- social network；\n- brain connectome；\n- internet；\n- transportation；\n- protein interaction。\n\n需要研究：\n\n- degree distribution；\n- community；\n- centrality；\n- diffusion；\n- robustness。\n","resources":[]},{"heading":"PageRank 的数学","line":79,"end":84,"text":"## PageRank 的数学\n\n网页作为节点，超链接作为边。PageRank 本质上与随机游走和 Markov chain 的 stationary distribution 有关。\n\n因此图论又与概率论、线性代数相连。\n","resources":[]},{"heading":"Graph Neural Networks","line":85,"end":100,"text":"## Graph Neural Networks\n\nGNN 常把邻居信息聚合：\n\n$$\nh_v^{(l+1)}\n\\mathrel{=}\n\\operatorname{UPDATE}\n\\left(\nh_v^{(l)},\n\\operatorname{AGG}_{u\\in N(v)}h_u^{(l)}\n\\right).\n$$\n\n它把“学习”从网格数据扩展到任意 graph structure。\n","resources":[]},{"heading":"常见应用","line":101,"end":110,"text":"## 常见应用\n\n- 路由导航；\n- 推荐系统；\n- 社交关系；\n- 分子性质预测；\n- fraud detection；\n- 脑连接网络；\n- dependency analysis。\n","resources":[]},{"heading":"与拓扑的关系","line":111,"end":116,"text":"## 与拓扑的关系\n\nEuler 七桥同时被视作 graph theory 和 topology 的重要源头。\n\n图论通常研究离散有限结构；拓扑研究更一般的连续空间，但二者在 simplicial complexes、network topology、TDA 中重新汇合。\n","resources":[]},{"heading":"参考","line":117,"end":121,"text":"## 参考\n\n- MacTutor, *A history of Topology*: https://mathshistory.st-andrews.ac.uk/HistTopics/Topology_in_mathematics/\n- MacTutor, Sainte-Laguë / graph history: https://mathshistory.st-andrews.ac.uk/Extras/Les_reseaux/\n- Diestel, *Graph Theory*.","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/HistTopics/Topology_in_mathematics/","url":"https://mathshistory.st-andrews.ac.uk/HistTopics/Topology_in_mathematics/"},{"label":"https://mathshistory.st-andrews.ac.uk/Extras/Les_reseaux/","url":"https://mathshistory.st-andrews.ac.uk/Extras/Les_reseaux/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/04-graph-theory.md"},{"path":"mathematics-changed-the-world/docs/branches/05-game-theory.md","module":"数学主干","role":"数学专题","title":"博弈论：当结果取决于“别人也在思考”时","sections":[{"heading":"博弈论：当结果取决于“别人也在思考”时","line":1,"end":4,"text":"# 博弈论：当结果取决于“别人也在思考”时\n\n> **核心问题**：如果我的最佳选择取决于你的选择，而你又在预测我的选择，该怎样建立数学模型？\n","resources":[]},{"heading":"与普通优化有什么不同？","line":5,"end":24,"text":"## 与普通优化有什么不同？\n\n普通优化：\n\n$$\n\\min_x f(x).\n$$\n\n变量由一个决策者控制。\n\n博弈中玩家 $i$ 的收益：\n\n$$\nu_i(a_1,\\dots,a_n)\n$$\n\n同时依赖所有人的 action。\n\n因此每个人都在优化，但优化目标互相耦合。\n","resources":[]},{"heading":"早期系统化","line":25,"end":30,"text":"## 早期系统化\n\nvon Neumann 在 1928 年证明 two-player zero-sum game 的 minimax theorem。\n\n1944 年 von Neumann 与 Morgenstern 的 *Theory of Games and Economic Behavior* 把博弈论推向经济学系统框架。\n","resources":[]},{"heading":"Nash equilibrium","line":31,"end":46,"text":"## Nash equilibrium\n\n策略组合 $s^*=(s_1^*,\\dots,s_n^*)$ 若满足：\n\n$$\nu_i(s_i^*,s_{-i}^*)\n\\ge\nu_i(s_i,s_{-i}^*)\n$$\n\n对每个玩家 $i$ 和任何 unilateral deviation $s_i$ 成立，则为 Nash equilibrium。\n\n直觉：\n\n> 在其他人策略不变时，没有任何玩家能通过单独改变策略让自己更好。\n","resources":[]},{"heading":"Nash equilibrium 不等于“社会最优”","line":47,"end":57,"text":"## Nash equilibrium 不等于“社会最优”\n\nPrisoner's dilemma 的典型教训就是：\n\n- 每个个体的 equilibrium behavior；\n- 整体最佳 outcome；\n\n可能完全不同。\n\n因此 equilibrium 是稳定性概念，不自动包含公平、效率或道德评价。\n","resources":[]},{"heading":"不完全信息","line":58,"end":68,"text":"## 不完全信息\n\n现实玩家不知道：\n\n- 对方类型；\n- 成本；\n- 偏好；\n- 私有信息。\n\nHarsanyi 把 incomplete information 转换为 Bayesian game，为 auction、mechanism design、information economics 奠定重要基础。\n","resources":[]},{"heading":"Sequential game","line":69,"end":74,"text":"## Sequential game\n\n若行动有先后顺序，需要 extensive-form game、subgame perfect equilibrium 等概念。Selten 对 equilibrium refinement 作出关键贡献。\n\n1994 年 Economics Prize 授予 Harsanyi、Nash、Selten，以表彰他们对 non-cooperative games equilibrium analysis 的先驱贡献。\n","resources":[]},{"heading":"现实应用 › 拍卖与广告","line":77,"end":79,"text":"### 拍卖与广告\nGoogle/广告竞价、频谱拍卖都涉及机制设计与策略行为。\n","resources":[]},{"heading":"现实应用 › 市场","line":80,"end":82,"text":"### 市场\n企业定价、竞争、进入退出。\n","resources":[]},{"heading":"现实应用 › 网络","line":83,"end":85,"text":"### 网络\n拥堵博弈与 routing。\n","resources":[]},{"heading":"现实应用 › 安全","line":86,"end":88,"text":"### 安全\n攻防策略、security games。\n","resources":[]},{"heading":"现实应用 › 多智能体 AI","line":89,"end":91,"text":"### 多智能体 AI\nmulti-agent reinforcement learning 中，各 agent 的 environment 包含其他正在学习的 agent，因此环境不是固定的。\n","resources":[]},{"heading":"现实应用 › 进化","line":92,"end":94,"text":"### 进化\nevolutionary game theory 研究策略比例如何在群体中变化。\n","resources":[]},{"heading":"与机器学习的连接","line":95,"end":106,"text":"## 与机器学习的连接\n\nGAN 可以写成 min-max：\n\n$$\n\\min_G\\max_D V(D,G).\n$$\n\n强化学习中的 policy competition、self-play、adversarial training 都包含博弈结构。\n\n但现实大模型训练不能简单归结为“一个 Nash equilibrium 问题”；只有特定互动结构才适合如此建模。\n","resources":[]},{"heading":"参考","line":107,"end":111,"text":"## 参考\n\n- Nobel Prize 1994 summary: https://www.nobelprize.org/prizes/economic-sciences/1994/summary/\n- von Neumann & Morgenstern, *Theory of Games and Economic Behavior*.\n- Osborne & Rubinstein, *A Course in Game Theory*.","resources":[{"label":"https://www.nobelprize.org/prizes/economic-sciences/1994/summary/","url":"https://www.nobelprize.org/prizes/economic-sciences/1994/summary/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/05-game-theory.md"},{"path":"mathematics-changed-the-world/docs/branches/06-control-theory.md","module":"数学主干","role":"数学专题","title":"控制论：不是“预测系统”，而是让系统按目标行动","sections":[{"heading":"控制论：不是“预测系统”，而是让系统按目标行动","line":1,"end":4,"text":"# 控制论：不是“预测系统”，而是让系统按目标行动\n\n> **核心问题**：一个会随时间演化的系统，怎样利用反馈，把它稳定、跟踪到目标、抵抗扰动？\n","resources":[]},{"heading":"从自动调节到数学控制","line":5,"end":15,"text":"## 从自动调节到数学控制\n\n控制思想早于现代数学：蒸汽机 governor、航海舵机、机械调速器都依赖 feedback。\n\n20 世纪通信和电子工程发展后，控制理论逐渐形成两条经典路线：\n\n1. **频域方法**：Nyquist、Bode 等；\n2. **状态空间方法**：Kalman 等。\n\n两条路线分别擅长不同问题，今天仍同时存在。\n","resources":[]},{"heading":"变换域：Laplace、Z 与极点","line":16,"end":37,"text":"## 变换域：Laplace、Z 与极点\n\n连续时间 LTI 系统常在 Laplace 域分析，离散时间 LTI 系统常在 Z 域分析。它们与 Fourier 的统一关系、双边/单边变换、收敛域、采样和 $z=e^{sT}$ 映射见 [Fourier–Laplace–Z 专题桥梁](../bridges/01-transform-family.md)。\n\n在零初始条件下，连续系统的 transfer function 常写为\n\n$$\nG(s)\n\\mathrel{=}\n\\frac{Y(s)}{U(s)},\n$$\n\n离散系统相应写为\n\n$$\nH(z)\n\\mathrel{=}\n\\frac{Y(z)}{U(z)}.\n$$\n\n这里不能只看分式本身：极点位置与 ROC 一起决定时域信号、因果性和稳定性。对因果有理系统，连续时间稳定对应极点位于左半 $s$ 平面，离散时间稳定对应极点位于单位圆内。采样周期为 $T$ 时，连续模态 $e^{st}$ 采样后产生自然极点映射 $z=e^{sT}$；但具体连续—离散系统转换仍取决于离散化方法。\n","resources":[]},{"heading":"状态空间","line":38,"end":58,"text":"## 状态空间\n\n连续线性系统：\n\n$$\n\\dot x(t)=Ax(t)+Bu(t),\n$$\n\n$$\ny(t)=Cx(t)+Du(t).\n$$\n\n其中：\n\n- $x$：内部 state；\n- $u$：control input；\n- $y$：observation；\n- $A,B,C,D$：系统结构。\n\n这个写法把 ODE 与线性代数结合起来。\n","resources":[]},{"heading":"稳定性","line":59,"end":80,"text":"## 稳定性\n\n若无输入：\n\n$$\n\\dot x=Ax.\n$$\n\n解涉及\n\n$$\ne^{At}.\n$$\n\n矩阵 $A$ 的 eigenvalues 决定系统模式：\n\n- 实部 \u003c 0：衰减；\n- 实部 > 0：发散；\n- 虚部：振荡频率。\n\n因此 Euler 公式、特征值与微分方程在控制理论中自然汇合。\n","resources":[]},{"heading":"Feedback","line":81,"end":96,"text":"## Feedback\n\n最简单状态反馈：\n\n$$\nu=-Kx.\n$$\n\n闭环变成\n\n$$\n\\dot x=(A-BK)x.\n$$\n\n控制器设计的目标之一，是选择 $K$ 改变系统闭环特征，使其满足稳定性和性能要求。\n","resources":[]},{"heading":"Kalman filter：控制与 Bayes 的交汇","line":97,"end":125,"text":"## Kalman filter：控制与 Bayes 的交汇\n\nKalman 1960 年提出的经典线性滤波方法，在 state-space model 下递归估计不可直接观测的 state。\n\n预测：\n\n$$\n\\hat x_{k|k-1}=A\\hat x_{k-1|k-1}\n$$\n\n更新：\n\n$$\n\\hat x_{k|k}\n\\mathrel{=}\n\\hat x_{k|k-1}\n+\nK_k(y_k-H\\hat x_{k|k-1}).\n$$\n\n它可以被理解为：\n\n- 线性系统；\n- Gaussian probability；\n- Bayesian update；\n- least squares；\n\n四者的结合。\n","resources":[]},{"heading":"Optimal control","line":126,"end":145,"text":"## Optimal control\n\n若要最小化\n\n$$\nJ\n\\mathrel{=}\n\\int\n(x^TQx+u^TRu)\\,dt,\n$$\n\n得到 LQR 一类问题。\n\n更一般的 optimal control 连接：\n\n- calculus of variations；\n- Hamiltonian；\n- dynamic programming；\n- Bellman equation。\n","resources":[]},{"heading":"现代应用","line":146,"end":157,"text":"## 现代应用\n\n- 飞机、火箭、卫星；\n- 无人机和机器人；\n- 自动驾驶；\n- 电网；\n- 工业过程；\n- 脑机接口与神经调控闭环；\n- camera stabilization；\n- 数据中心温控；\n- autonomous systems。\n","resources":[]},{"heading":"与强化学习的关系","line":158,"end":171,"text":"## 与强化学习的关系\n\ncontrol theory 通常假设系统模型已知或部分已知；RL 更强调通过交互学习 policy。\n\n二者共享：\n\n- state；\n- action；\n- dynamics；\n- cost/reward；\n- Bellman recursion。\n\n现代研究中 model predictive control、system identification、RL 正在不断交叉。\n","resources":[]},{"heading":"与九个核心公式的连接","line":172,"end":179,"text":"## 与九个核心公式的连接\n\n微积分 → ODE；  \nEuler → eigenmodes；  \nFourier → frequency response；  \nBayes → state estimation；  \nTaylor → nonlinear system linearization。\n","resources":[]},{"heading":"参考","line":180,"end":184,"text":"## 参考\n\n- R. E. Kalman, *A New Approach to Linear Filtering and Prediction Problems* (1960), DOI: 10.1115/1.3662552\n- Ogata, *Modern Control Engineering*.\n- Åström & Murray, *Feedback Systems*.","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/06-control-theory.md"},{"path":"mathematics-changed-the-world/docs/branches/07-wavelets.md","module":"数学主干","role":"数学专题","title":"小波：Fourier 看“有什么频率”，小波还问“这个频率在什么时候出现”","sections":[{"heading":"小波：Fourier 看“有什么频率”，小波还问“这个频率在什么时候出现”","line":1,"end":4,"text":"# 小波：Fourier 看“有什么频率”，小波还问“这个频率在什么时候出现”\n\n> **核心问题**：怎样同时获得频率信息与局部时间/空间位置？\n","resources":[]},{"heading":"Fourier 的局限不是“错误”，而是全局性","line":5,"end":16,"text":"## Fourier 的局限不是“错误”，而是全局性\n\nFourier basis：\n\n$$\ne^{i\\omega t}\n$$\n\n在整个时间轴上延伸。\n\n若信号是 stationary 的，这非常合适；但如果一个高频事件只在很短时间出现，单纯 global spectrum 会告诉你“有高频”，却不直接告诉你“在哪里出现”。\n","resources":[]},{"heading":"Windowed Fourier","line":17,"end":29,"text":"## Windowed Fourier\n\n一种改进是短时 Fourier：\n\n$$\n\\operatorname{STFT}_x(\\tau,\\omega)\n\\mathrel{=}\n\\int\nx(t)w(t-\\tau)e^{-i\\omega t}\\,dt.\n$$\n\n问题在于固定 window width 意味着所有频率使用同样的时间—频率分辨率。\n","resources":[]},{"heading":"Wavelet transform","line":30,"end":53,"text":"## Wavelet transform\n\n连续小波：\n\n$$\nW_x(a,b)\n\\mathrel{=}\n\\frac1{\\sqrt{|a|}}\n\\int\nx(t)\n\\overline{\n\\psi\\left(\\frac{t-b}{a}\\right)\n}\ndt.\n$$\n\n其中：\n\n- $b$：位置；\n- $a$：scale；\n- $\\psi$：mother wavelet。\n\n改变 scale 相当于“伸缩观察镜头”。\n","resources":[]},{"heading":"多分辨率思想","line":54,"end":61,"text":"## 多分辨率思想\n\n粗尺度看趋势，细尺度看局部细节。\n\n这与图像金字塔和 signal processing 的 filter bank 产生深刻联系。\n\nMallat 与 Meyer 在 1980s 形成 multiresolution analysis 框架；Daubechies 构造了紧支撑正交 wavelet，令理论更适合数值实现和压缩。\n","resources":[]},{"heading":"Haar wavelet","line":62,"end":78,"text":"## Haar wavelet\n\n最简单 wavelet：\n\n$$\n\\psi(t)=\n\\begin{cases}\n1,&0\\le t\u003c1/2,\\\\\n-1,&1/2\\le t\u003c1,\\\\\n0,&\\text{otherwise}.\n\\end{cases}\n$$\n\n它计算的本质是“左半平均与右半平均之差”。\n\n因此 wavelet coefficient 天然对局部变化、边缘和突变敏感。\n","resources":[]},{"heading":"现实应用","line":79,"end":88,"text":"## 现实应用\n\n- JPEG 2000；\n- 图像去噪；\n- ECG/EEG 瞬态检测；\n- 地震信号；\n- 多尺度 PDE；\n- 压缩感知的稀疏表示；\n- texture 与 edge analysis。\n","resources":[]},{"heading":"为什么小波与现代机器学习仍有关？","line":89,"end":98,"text":"## 为什么小波与现代机器学习仍有关？\n\n深度网络中很多层级特征也具有多尺度结构。scattering transform 把 wavelet 与非线性层级表示连接起来。\n\nCNN 并不等于 wavelet transform，但二者共享：\n\n- local filters；\n- translation structure；\n- multi-scale representation。\n","resources":[]},{"heading":"Fourier vs Wavelet","line":99,"end":108,"text":"## Fourier vs Wavelet\n\n| 问题 | Fourier | Wavelet |\n|---|---|---|\n| 频率分解 | 强 | 强 |\n| 时间定位 | 弱 | 强 |\n| 固定/可变分辨率 | 全局频率 | 多尺度 |\n| 突变检测 | 可做但不局部 | 天然适合 |\n| 理论结构 | harmonic analysis | multiresolution / harmonic analysis |\n","resources":[]},{"heading":"与九个核心公式的连接","line":109,"end":115,"text":"## 与九个核心公式的连接\n\nFourier → function spaces → wavelet basis。  \nLebesgue → $L^2$ 正交基。  \nTaylor → local approximation。  \nsignal processing → filter banks。\n","resources":[]},{"heading":"参考","line":116,"end":119,"text":"## 参考\n\n- Ingrid Daubechies, *Ten Lectures on Wavelets*, SIAM: https://epubs.siam.org/doi/book/10.1137/1.9781611970104\n- Mallat, *A Wavelet Tour of Signal Processing*.","resources":[{"label":"https://epubs.siam.org/doi/book/10.1137/1.9781611970104","url":"https://epubs.siam.org/doi/book/10.1137/1.9781611970104"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/07-wavelets.md"},{"path":"mathematics-changed-the-world/docs/branches/08-stochastic-processes.md","module":"数学主干","role":"数学专题","title":"随机过程：把“随时间变化的不确定性”变成数学对象","sections":[{"heading":"随机过程：把“随时间变化的不确定性”变成数学对象","line":1,"end":4,"text":"# 随机过程：把“随时间变化的不确定性”变成数学对象\n\n> **核心问题**：一个系统既随时间变化、又包含随机性时，怎样描述它的路径、记忆、波动和长期行为？\n","resources":[]},{"heading":"从随机变量到随机过程","line":5,"end":26,"text":"## 从随机变量到随机过程\n\n随机变量：\n\n$$\nX:\\Omega\\to\\mathbb R.\n$$\n\n随机过程是一族随机变量：\n\n$$\n\\{X_t:t\\in T\\}.\n$$\n\n每个 $t$ 有一个随机变量；一次真实观察则产生整条 trajectory：\n\n$$\nt\\mapsto X_t(\\omega).\n$$\n\n这一步把 probability 从“单次不确定量”扩展为“随机动态系统”。\n","resources":[]},{"heading":"Markov property","line":27,"end":40,"text":"## Markov property\n\nMarkov process 的核心条件可粗略写为：\n\n$$\nP(X_{t+1}|X_t,X_{t-1},\\dots)\n\\mathrel{=}\nP(X_{t+1}|X_t).\n$$\n\n即给定当前状态后，过去不再提供额外预测信息。\n\n这不是说系统“没有历史”，而是说当前 state 已经压缩了与未来有关的历史信息。\n","resources":[]},{"heading":"Brownian motion","line":41,"end":59,"text":"## Brownian motion\n\nWiener process 满足：\n\n- $W_0=0$；\n- independent increments；\n- $W_t-W_s\\sim N(0,t-s)$；\n- paths 几乎处处连续。\n\n但其路径几乎处处不可导。\n\n因此普通微积分不能直接处理\n\n$$\ndW_t/dt.\n$$\n\n这催生 stochastic calculus。\n","resources":[]},{"heading":"Itô calculus","line":60,"end":95,"text":"## Itô calculus\n\n典型 SDE：\n\n$$\ndX_t\n\\mathrel{=}\n\\mu(X_t,t)\\,dt\n+\n\\sigma(X_t,t)\\,dW_t.\n$$\n\nItô formula 类似 stochastic 版本的 chain rule，但多出二阶项。\n\n若\n\n$$\ndX_t=\\mu\\,dt+\\sigma\\,dW_t,\n$$\n\n则\n\n$$\ndf(X_t)\n\\mathrel{=}\nf'(X_t)dX_t\n+\n\\frac12f''(X_t)\\sigma^2dt.\n$$\n\n这个额外项来自 Brownian increment 的尺度：\n\n$$\n(dW_t)^2\\sim dt.\n$$\n","resources":[]},{"heading":"Kolmogorov 的作用","line":96,"end":99,"text":"## Kolmogorov 的作用\n\n1933 年 measure-theoretic axioms 为 probability 提供统一基础。Kolmogorov 同时在 Markov process、diffusion 等方向做出奠基工作。\n","resources":[]},{"heading":"现实应用 › 金融","line":102,"end":104,"text":"### 金融\nasset price、interest rate、option pricing。\n","resources":[]},{"heading":"现实应用 › 生物","line":105,"end":107,"text":"### 生物\npopulation stochasticity、ion channel、neural spike variability。\n","resources":[]},{"heading":"现实应用 › 通信","line":108,"end":110,"text":"### 通信\nnoise process、channel modeling。\n","resources":[]},{"heading":"现实应用 › 排队系统","line":111,"end":113,"text":"### 排队系统\n网络服务器、呼叫中心、交通。\n","resources":[]},{"heading":"现实应用 › 物理","line":114,"end":116,"text":"### 物理\ndiffusion、thermal fluctuation。\n","resources":[]},{"heading":"现实应用 › 机器学习","line":117,"end":119,"text":"### 机器学习\ndiffusion models、stochastic gradient、state-space model。\n","resources":[]},{"heading":"Diffusion models 与经典随机过程","line":120,"end":131,"text":"## Diffusion models 与经典随机过程\n\n现代生成式 diffusion model 不是凭空出现。其数学连接包括：\n\n- Markov chains；\n- SDE；\n- Fokker–Plan
