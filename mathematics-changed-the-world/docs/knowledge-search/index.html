ck equation；\n- reverse-time dynamics；\n- score estimation。\n\n因此它是现代深度学习与百年随机过程理论的汇合点。\n","resources":[]},{"heading":"与九个核心公式的连接","line":132,"end":139,"text":"## 与九个核心公式的连接\n\nBayes → probability update；  \nLebesgue → probability measure / expectation；  \n微积分 → SDE；  \nTaylor → Itô formula 的局部展开直觉；  \nFourier → characteristic functions / spectral processes。\n","resources":[]},{"heading":"参考","line":140,"end":144,"text":"## 参考\n\n- MacTutor, Kiyosi Itô: https://mathshistory.st-andrews.ac.uk/Biographies/Ito/\n- MacTutor, Kolmogorov: https://mathshistory.st-andrews.ac.uk/Biographies/Kolmogorov/\n- Øksendal, *Stochastic Differential Equations*.","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Ito/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Ito/"},{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Kolmogorov/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Kolmogorov/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/08-stochastic-processes.md"},{"path":"mathematics-changed-the-world/docs/branches/09-numerical-analysis.md","module":"数学主干","role":"数学专题","title":"数值分析：数学公式到了计算机里，为什么会“变质”？","sections":[{"heading":"数值分析：数学公式到了计算机里，为什么会“变质”？","line":1,"end":4,"text":"# 数值分析：数学公式到了计算机里，为什么会“变质”？\n\n> **核心问题**：当实数变成有限精度浮点数、连续对象变成离散网格、无限过程变成有限迭代时，怎样保证结果可靠？\n","resources":[]},{"heading":"数值计算比电子计算机古老得多","line":5,"end":20,"text":"## 数值计算比电子计算机古老得多\n\n古代求平方根、天文表、插值、数值积分都是 numerical mathematics。\n\n但电子计算机出现后，问题发生质变：\n\n> 不是“能不能手算”，而是“算法在有限精度机器上是否稳定、复杂度是否可接受”。\n\n现代 numerical analysis 因此同时研究：\n\n- approximation；\n- error；\n- stability；\n- conditioning；\n- complexity。\n","resources":[]},{"heading":"误差至少有三类 › 建模误差","line":23,"end":25,"text":"### 建模误差\n现实被数学模型简化。\n","resources":[]},{"heading":"误差至少有三类 › 离散化/截断误差","line":26,"end":36,"text":"### 离散化/截断误差\n例如导数：\n\n$$\nf'(x)\n\\approx\n\\frac{f(x+h)-f(x)}{h}.\n$$\n\n这不是精确等式。\n","resources":[]},{"heading":"误差至少有三类 › floating-point roundoff","line":37,"end":39,"text":"### floating-point roundoff\n计算机不能精确表示大多数实数。\n","resources":[]},{"heading":"一个反直觉：$h$ 越小不一定越好","line":40,"end":48,"text":"## 一个反直觉：$h$ 越小不一定越好\n\n差分导数中：\n\n- $h$ 太大 → truncation error 大；\n- $h$ 太小 → 两个非常接近的数相减，roundoff / catastrophic cancellation 放大。\n\n因此最佳 $h$ 常是折中，而不是趋近机器能表示的最小数。\n","resources":[]},{"heading":"Conditioning vs stability","line":49,"end":58,"text":"## Conditioning vs stability\n\n**condition number** 描述“问题本身”对输入扰动敏感不敏感。\n\n**algorithm stability** 描述“算法实现”是否额外放大误差。\n\n一个 ill-conditioned problem，即便算法很好，也可能无法从噪声输入得到高精度答案。\n\n一个 well-conditioned problem，也可能被 bad algorithm 算坏。\n","resources":[]},{"heading":"Linear systems 是核心基础设施","line":59,"end":68,"text":"## Linear systems 是核心基础设施\n\n$$\nAx=b.\n$$\n\nGaussian elimination、LU、QR、Cholesky、iterative methods、Krylov methods 是 scientific computing 的骨架。\n\n很多 PDE 离散后最终都会变成巨大的 sparse linear system。\n","resources":[]},{"heading":"Eigenvalue problems","line":69,"end":83,"text":"## Eigenvalue problems\n\n$$\nAv=\\lambda v.\n$$\n\n出现在：\n\n- vibration；\n- quantum mechanics；\n- PCA；\n- stability；\n- graph spectral analysis；\n- PageRank。\n","resources":[]},{"heading":"数值 PDE","line":84,"end":94,"text":"## 数值 PDE\n\n连续 PDE 需要离散化：\n\n- finite difference；\n- finite element；\n- finite volume；\n- spectral methods。\n\n散度定理直接影响 finite volume；Fourier directly connects spectral methods。\n","resources":[]},{"heading":"为什么现代 AI 也是数值分析问题？","line":95,"end":110,"text":"## 为什么现代 AI 也是数值分析问题？\n\n训练大模型本质上执行海量 floating-point linear algebra。\n\n实际系统关注：\n\n- mixed precision；\n- conditioning；\n- gradient scaling；\n- optimizer stability；\n- iterative convergence；\n- matrix multiplication error；\n- hardware-aware algorithms。\n\n因此“AI 工程”和传统 numerical linear algebra 并不是两套世界。\n","resources":[]},{"heading":"一条现代历史线","line":111,"end":122,"text":"## 一条现代历史线\n\n手工表格  \n→ mechanical computation  \n→ early electronic computer  \n→ floating-point analysis  \n→ numerical linear algebra  \n→ scientific computing / HPC  \n→ GPU tensor computing。\n\nSIAM 的 numerical analysis history 项目记录了现代 scientific computing 多位开拓者的口述史。\n","resources":[]},{"heading":"与九个核心公式的连接","line":123,"end":130,"text":"## 与九个核心公式的连接\n\nTaylor → truncation error；  \nFourier → spectral method / FFT；  \n散度 → finite volume；  \nLebesgue → function space 与收敛；  \n线性代数 → 所有大规模离散计算。\n","resources":[]},{"heading":"参考","line":131,"end":135,"text":"## 参考\n\n- SIAM, History of Numerical Analysis and Scientific Computing: https://history.siam.org/\n- Higham, *Accuracy and Stability of Numerical Algorithms*.\n- Trefethen & Bau, *Numerical Linear Algebra*.","resources":[{"label":"https://history.siam.org/","url":"https://history.siam.org/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/09-numerical-analysis.md"},{"path":"mathematics-changed-the-world/docs/branches/10-transformer-math.md","module":"数学主干","role":"数学专题","title":"Transformer 背后的数学：不是“新数学”，而是多条成熟数学主干的组合","sections":[{"heading":"Transformer 背后的数学：不是“新数学”，而是多条成熟数学主干的组合","line":1,"end":4,"text":"# Transformer 背后的数学：不是“新数学”，而是多条成熟数学主干的组合\n\n> **核心问题**：Transformer 为什么能让每个 token 动态“读取”其他 token 的信息？它具体调用了哪些数学结构？\n","resources":[]},{"heading":"2017：Attention Is All You Need","line":5,"end":12,"text":"## 2017：Attention Is All You Need\n\nTransformer 在 2017 年的论文 *Attention Is All You Need* 中系统提出。原始架构的关键变化是：\n\n- 不再依赖 recurrent network 顺序传播状态；\n- 不再以 convolution 作为主要 token mixing；\n- 核心交互由 attention 完成。\n","resources":[]},{"heading":"1. Linear algebra：最底层语言","line":13,"end":30,"text":"## 1. Linear algebra：最底层语言\n\n输入 token embedding：\n\n$$\nX\\in\\mathbb R^{n\\times d}.\n$$\n\n通过 learned linear maps：\n\n$$\nQ=XW_Q,\\qquad\nK=XW_K,\\qquad\nV=XW_V.\n$$\n\n这里没有神秘操作，本质是 matrix multiplication。\n","resources":[]},{"heading":"2. Dot product：相似性与匹配","line":31,"end":44,"text":"## 2. Dot product：相似性与匹配\n\nattention logits：\n\n$$\nS\n\\mathrel{=}\n\\frac{QK^T}{\\sqrt{d_k}}.\n$$\n\n第 $i,j$ 项是 query $q_i$ 与 key $k_j$ 的 dot product。\n\n若向量尺度相近，dot product 大致反映方向匹配。\n","resources":[]},{"heading":"2. Dot product：相似性与匹配 › 为什么除以 $\\sqrt{d_k}$？","line":45,"end":56,"text":"### 为什么除以 $\\sqrt{d_k}$？\n\n若分量独立、均值约 0、方差约 1，则 dot product 的 variance 会随维数 $d_k$ 增长。\n\n缩放\n\n$$\n1/\\sqrt{d_k}\n$$\n\n让 logits 数值尺度更稳定，避免 softmax 太容易进入极端饱和区。\n","resources":[]},{"heading":"3. Softmax：把 score 变成权重","line":57,"end":79,"text":"## 3. Softmax：把 score 变成权重\n\n$$\nA_{ij}\n\\mathrel{=}\n\\frac{e^{S_{ij}}}\n{\\sum_j e^{S_{ij}}}.\n$$\n\n每一行形成 probability-like weights：\n\n$$\n\\sum_j A_{ij}=1.\n$$\n\n输出：\n\n$$\nO=AV.\n$$\n\n所以单个 token 的新表示，是其他 value vectors 的数据依赖加权平均。\n","resources":[]},{"heading":"4. Multi-head attention","line":80,"end":93,"text":"## 4. Multi-head attention\n\n不是只做一次 $Q,K,V$，而是多个 head：\n\n$$\n\\operatorname{head}_h\n\\mathrel{=}\n\\operatorname{Attention}(Q_h,K_h,V_h).\n$$\n\n然后 concatenate + linear projection。\n\n不同 head 可以学习不同关系，但不应把“某个 head 一定对应语法/实体”等解释当作普遍定律；representation 往往是 distributed。\n","resources":[]},{"heading":"5. Positional information","line":94,"end":121,"text":"## 5. Positional information\n\n纯 self-attention 对 token permutation 本身缺乏序列顺序感，因此需要加入 position structure。\n\n原论文使用 sinusoidal positional encoding：\n\n$$\nPE(pos,2i)\n\\mathrel{=}\n\\sin\n\\left(\npos/10000^{2i/d}\n\\right),\n$$\n\n$$\nPE(pos,2i+1)\n\\mathrel{=}\n\\cos\n\\left(\npos/10000^{2i/d}\n\\right).\n$$\n\n这里能看到 Euler/Fourier 相关的周期表示思想，但 positional encoding 并不等于 Fourier transform。\n\n后续模型还出现 learned position、relative position、rotary positional embedding 等路线。\n","resources":[]},{"heading":"6. Probability 与 information theory","line":122,"end":141,"text":"## 6. Probability 与 information theory\n\n语言模型训练常最小化 negative log-likelihood：\n\n$$\nL\n\\mathrel{=}\n-\\sum_t \\log p(x_t|x_{\u003ct}).\n$$\n\n分类形式常表现为 cross-entropy：\n\n$$\nH(p,q)\n\\mathrel{=}\n-\\sum_i p_i\\log q_i.\n$$\n\n因此 Shannon information、maximum likelihood、probability modeling 都直接进入训练目标。\n","resources":[]},{"heading":"7. Calculus 与 optimization","line":142,"end":155,"text":"## 7. Calculus 与 optimization\n\n参数量可能达到极大规模，但训练仍建立在：\n\n$$\n\\nabla_\\theta L\n$$\n\n与 chain rule 上。\n\nbackpropagation 本质上是高效组织 chain rule 的算法。\n\n优化器如 SGD、Adam 则在 noisy gradient 下迭代寻找低损失区域。\n","resources":[]},{"heading":"8. Numerical linear algebra","line":156,"end":166,"text":"## 8. Numerical linear algebra\n\n真正运行 Transformer 时，绝大多数计算成本来自：\n\n- GEMM / matrix multiplication；\n- attention matrix operation；\n- normalization；\n- vectorized elementwise operation。\n\nFlashAttention 一类技术的创新往往不是改变 attention 数学定义，而是改变 memory access、tiling 和 exact computation order，从而提高硬件效率。\n","resources":[]},{"heading":"9. Attention 与 kernel / graph 的类比","line":167,"end":178,"text":"## 9. Attention 与 kernel / graph 的类比\n\n每个 token 与其他 token 建立 weighted interaction，可视为动态、data-dependent complete graph。\n\n因此它与：\n\n- kernel methods；\n- message passing；\n- graph neural networks；\n\n存在结构类比，但不能简单等同。\n","resources":[]},{"heading":"10. Transformer 知识树","line":179,"end":218,"text":"## 10. Transformer 知识树\n\n$$\n\\text{线性代数}\n\\to\nQ,K,V\n$$\n\n$$\n\\text{概率/信息论}\n\\to\nsoftmax,\\ cross\\ entropy\n$$\n\n$$\n\\text{微积分}\n\\to\nbackprop\n$$\n\n$$\n\\text{优化}\n\\to\nSGD/Adam\n$$\n\n$$\n\\text{Fourier/Euler}\n\\to\nperiodic positional representations\n$$\n\n$$\n\\text{数值分析}\n\\to\nmixed precision,\\ stability,\\ efficient kernels.\n$$\n\n所以“Transformer 背后的数学”不是一条公式，而是多条数学文明主干在现代计算机上的汇流。\n","resources":[]},{"heading":"参考","line":219,"end":223,"text":"## 参考\n\n- Vaswani et al., *Attention Is All You Need*: https://arxiv.org/abs/1706.03762\n- Goodfellow, Bengio & Courville, *Deep Learning*.\n- Dive into Deep Learning: https://d2l.ai/","resources":[{"label":"https://arxiv.org/abs/1706.03762","url":"https://arxiv.org/abs/1706.03762"},{"label":"https://d2l.ai/","url":"https://d2l.ai/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/10-transformer-math.md"},{"path":"mathematics-changed-the-world/docs/branches/11-complex-numbers.md","module":"数学主干","role":"数学专题","title":"复数：从“荒谬的平方根”到旋转、波和量子态","sections":[{"heading":"复数：从“荒谬的平方根”到旋转、波和量子态","line":1,"end":4,"text":"# 复数：从“荒谬的平方根”到旋转、波和量子态\n\n> **核心问题**：为什么把实数轴扩展成二维数系，反而让许多现实问题变得更自然？\n","resources":[]},{"heading":"一开始是三次方程逼出来的","line":5,"end":16,"text":"## 一开始是三次方程逼出来的\n\n16 世纪求 cubic equations 时，Cardano 公式会在某些最终具有实根的情形中出现\n\n$$\n\\sqrt{-1}.\n$$\n\n这些量最初令人不安，因为它们似乎不对应普通长度。\n\nBombelli 系统整理了相关运算规则，逐渐让 complex arithmetic 成为可操作对象。\n","resources":[]},{"heading":"从代数怪物到平面几何","line":17,"end":46,"text":"## 从代数怪物到平面几何\n\n写\n\n$$\nz=x+iy.\n$$\n\n复数可以对应平面点 $(x,y)$。\n\n于是：\n\n- 加法 = 平移式向量加法；\n- 模长\n\n$$\n|z|=\\sqrt{x^2+y^2};\n$$\n\n- argument = 方向角；\n- multiplication = 缩放 + 旋转。\n\n极坐标：\n\n$$\nz=re^{i\\theta}.\n$$\n\n这让 complex number 从“多出来的根”变成二维 geometry 的自然 algebra。\n","resources":[]},{"heading":"Fundamental theorem of algebra","line":47,"end":58,"text":"## Fundamental theorem of algebra\n\n在 complex numbers 中，每个非零次数 polynomial 都能完全分解为一次因子：\n\n$$\np(z)\n\\mathrel{=}\na\\prod_{k=1}^{n}(z-z_k).\n$$\n\n复数因此给 polynomial equations 提供代数闭包。\n","resources":[]},{"heading":"Euler 公式是转折点之一","line":59,"end":77,"text":"## Euler 公式是转折点之一\n\n$$\ne^{i\\theta}\n\\mathrel{=}\n\\cos\\theta+i\\sin\\theta.\n$$\n\n复指数把：\n\n- exponentials；\n- trigonometry；\n- rotations；\n- oscillations；\n\n连接起来。\n\n详见 [Euler 公式](../core/03-euler.md)。\n","resources":[]},{"heading":"复可微为什么比实可微强？","line":78,"end":101,"text":"## 复可微为什么比实可微强？\n\n若\n\n$$\nf(z)=u(x,y)+iv(x,y)\n$$\n\ncomplex differentiable，实部虚部需满足 Cauchy–Riemann equations：\n\n$$\nu_x=v_y,\\qquad\nu_y=-v_x.\n$$\n\n满足适当条件后，holomorphic function 会具有极强结构：\n\n- 无限次可微；\n- 局部 power series；\n- contour integral theory；\n- maximum principle。\n\n因此 complex analysis 远不只是“二维微积分”。\n","resources":[]},{"heading":"现实应用","line":102,"end":112,"text":"## 现实应用\n\n- AC circuits 与 phasors；\n- Fourier / Laplace transforms；\n- control poles；\n- wave propagation；\n- quantum mechanics；\n- fluid potential flow；\n- conformal mapping；\n- electrical impedance。\n","resources":[]},{"heading":"一条知识链","line":113,"end":128,"text":"## 一条知识链\n\n$$\n\\text{三次方程}\n\\to\ni\n\\to\n\\text{复平面}\n\\to\ne^{i\\theta}\n\\to\n\\text{complex analysis}\n\\to\n\\text{residue/Fourier/control}.\n$$\n","resources":[]},{"heading":"参考","line":129,"end":133,"text":"## 参考\n\n- Needham, *Visual Complex Analysis*.\n- Ahlfors, *Complex Analysis*.\n- MacTutor, Euler: https://mathshistory.st-andrews.ac.uk/Biographies/Euler/","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Euler/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Euler/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/11-complex-numbers.md"},{"path":"mathematics-changed-the-world/docs/branches/12-linear-algebra.md","module":"数学主干","role":"数学专题","title":"线性代数：现代科技最常用的“高维关系语言”","sections":[{"heading":"线性代数：现代科技最常用的“高维关系语言”","line":1,"end":4,"text":"# 线性代数：现代科技最常用的“高维关系语言”\n\n> **核心问题**：当变量很多、关系又近似线性时，怎样把整个系统压缩成向量、矩阵和线性变换？\n","resources":[]},{"heading":"线性方程组比“矩阵”古老得多","line":5,"end":17,"text":"## 线性方程组比“矩阵”古老得多\n\n中国《九章算术》等古代数学传统已经包含系统消元思想。\n\n后来 determinant、simultaneous equations、geometry 等路线逐渐汇流。19 世纪 matrix 才成为独立对象：\n\n- Sylvester 在 1850 年使用 matrix 一词；\n- Cayley 1858 年系统发展 abstract matrix algebra。\n\n这提醒我们：\n\n> “矩阵记号”出现得很晚，但线性问题存在了很久。\n","resources":[]},{"heading":"矩阵真正代表什么？","line":18,"end":37,"text":"## 矩阵真正代表什么？\n\n最重要的理解不是“二维数字表”，而是：\n\n$$\nA:\\mathbb R^n\\to\\mathbb R^m\n$$\n\n表示 linear transformation。\n\n矩阵乘法\n\n$$\nAB\n$$\n\n对应变换 composition。\n\n因此“为什么矩阵乘法规则看起来怪”，答案是：它必须让 composition 正确工作。\n","resources":[]},{"heading":"Ax=b","line":38,"end":52,"text":"## Ax=b\n\n$$\nAx=b\n$$\n\n是 scientific computing 的基础结构。\n\n问题包括：\n\n- 是否有解？\n- 解唯一吗？\n- 对输入误差敏感吗？\n- 怎样在百万/十亿维上高效求解？\n","resources":[]},{"heading":"Eigenvalue","line":53,"end":69,"text":"## Eigenvalue\n\n$$\nAv=\\lambda v.\n$$\n\n$v$ 是被变换后方向不变的特殊向量，只被 scale。\n\n现实意义：\n\n- vibration modes；\n- quantum energy states；\n- stability；\n- PCA；\n- graph spectrum；\n- PageRank。\n","resources":[]},{"heading":"SVD：最重要的矩阵分解之一","line":70,"end":88,"text":"## SVD：最重要的矩阵分解之一\n\n$$\nA=U\\Sigma V^T.\n$$\n\nSVD 把任意矩阵分成：\n\n1. 旋转/正交变换；\n2. 按不同方向缩放；\n3. 再旋转。\n\n它揭示：\n\n- rank；\n- dominant directions；\n- best low-rank approximation；\n- condition number。\n","resources":[]},{"heading":"PCA","line":89,"end":96,"text":"## PCA\n\n中心化数据矩阵 $X$ 的 principal components 与 covariance eigenvectors / SVD 密切相关。\n\n本质上：\n\n> 找到数据方差最大的正交方向。\n","resources":[]},{"heading":"AI 为什么基本等于大规模线性代数 + 非线性？","line":97,"end":116,"text":"## AI 为什么基本等于大规模线性代数 + 非线性？\n\n神经网络层：\n\n$$\nh=\\sigma(Wx+b).\n$$\n\nTransformer 的：\n\n$$\nQ=XW_Q,\\quad\nK=XW_K,\\quad\nV=XW_V\n$$\n\n仍是矩阵乘法。\n\nGPU/TPU 的核心价值之一，就是把大规模 matrix/tensor operations 做得极快。\n","resources":[]},{"heading":"现实应用","line":117,"end":128,"text":"## 现实应用\n\n- graphics 3D transformations；\n- MRI inverse problems；\n- machine learning；\n- recommendation；\n- control；\n- quantum mechanics；\n- network analysis；\n- least squares；\n- statistics。\n","resources":[]},{"heading":"与其他主干连接","line":129,"end":136,"text":"## 与其他主干连接\n\n线性代数 + 微积分 → optimization。  \n线性代数 + probability → statistics。  \n线性代数 + graphs → spectral graph theory。  \n线性代数 + functions → functional analysis。  \n线性代数 + geometry → manifolds / Lie groups。\n","resources":[]},{"heading":"参考","line":137,"end":141,"text":"## 参考\n\n- MacTutor, Matrices and determinants: https://mathshistory.st-andrews.ac.uk/HistTopics/Matrices_and_determinants/\n- Strang, *Linear Algebra and Its Applications*.\n- Trefethen & Bau, *Numerical Linear Algebra*.","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/HistTopics/Matrices_and_determinants/","url":"https://mathshistory.st-andrews.ac.uk/HistTopics/Matrices_and_determinants/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/12-linear-algebra.md"},{"path":"mathematics-changed-the-world/docs/branches/13-differential-equations.md","module":"数学主干","role":"数学专题","title":"微分方程：如果知道“怎样变化”，能否推演“将来怎样”？","sections":[{"heading":"微分方程：如果知道“怎样变化”，能否推演“将来怎样”？","line":1,"end":4,"text":"# 微分方程：如果知道“怎样变化”，能否推演“将来怎样”？\n\n> **核心问题**：自然规律经常不给你位置本身，而只告诉你变化率与当前状态的关系。\n","resources":[]},{"heading":"从微积分到动力规律","line":5,"end":21,"text":"## 从微积分到动力规律\n\nNewton 力学的自然写法：\n\n$$\nm\\frac{d^2x}{dt^2}=F(x,t).\n$$\n\n给定：\n\n- differential law；\n- initial conditions；\n\n就尝试求完整 trajectory。\n\n这使 differential equation 成为近代科学的核心语言。\n","resources":[]},{"heading":"ODE","line":22,"end":36,"text":"## ODE\n\nordinary differential equation 只有一个 independent variable，例如：\n\n$$\n\\frac{dx}{dt}=f(x,t).\n$$\n\n典型问题：\n\n- existence；\n- uniqueness；\n- stability；\n- long-term behavior。\n","resources":[]},{"heading":"Laplace：把初值微分方程变成代数问题","line":37,"end":64,"text":"## Laplace：把初值微分方程变成代数问题\n\n对一阶初值问题\n\n$$\ny'(t)+ay(t)=u(t),\n\\qquad\ny(0^-)=y_0,\n$$\n\n使用单边 Laplace 变换：\n\n$$\nsY(s)-y_0+aY(s)=U(s),\n$$\n\n所以\n\n$$\nY(s)\n=\n\\frac{U(s)+y_0}{s+a}.\n$$\n\n这里最关键的不是“查表”，而是两个结构同时被编码：导数变成 $s$ 的乘法，初值变成代数边界项。对于线性常系数 ODE，这使解法、暂态、极点和稳定性进入同一套语言。\n\n但 Laplace 并没有让所有微分方程都变简单：非线性、时变系数、复杂边界条件仍可能需要数值方法、定性分析或其他函数空间工具。Fourier、Laplace、Z 与采样之间的完整连接见 [专题桥梁](../bridges/01-transform-family.md)。\n","resources":[]},{"heading":"PDE","line":65,"end":76,"text":"## PDE\n\n若未知量依赖多个变量：\n\n$$\nu(x,t)\n$$\n\n会出现 partial derivatives。\n\n三大经典原型：\n","resources":[]},{"heading":"PDE › Heat","line":77,"end":82,"text":"### Heat\n\n$$\nu_t=\\alpha u_{xx}.\n$$\n","resources":[]},{"heading":"PDE › Wave","line":83,"end":88,"text":"### Wave\n\n$$\nu_{tt}=c^2u_{xx}.\n$$\n","resources":[]},{"heading":"PDE › Laplace","line":89,"end":100,"text":"### Laplace\n\n$$\n\\nabla^2u=0.\n$$\n\n它们分别体现：\n\n- diffusion；\n- propagation；\n- equilibrium。\n","resources":[]},{"heading":"求出 closed form 不是唯一目标","line":101,"end":115,"text":"## 求出 closed form 不是唯一目标\n\n很多 nonlinear differential equations 没有漂亮解析解。\n\n现代研究更关注：\n\n- solution 是否存在；\n- 是否唯一；\n- stability；\n- bifurcation；\n- qualitative phase portrait；\n- numerical approximation。\n\n这就是 dynamical systems 的兴起。\n","resources":[]},{"heading":"Phase space","line":116,"end":132,"text":"## Phase space\n\n对\n\n$$\n\\dot x=f(x)\n$$\n\n不一定直接求 $x(t)$，可以研究 state space 中 trajectory 的结构：\n\n- fixed point；\n- limit cycle；\n- attractor；\n- stable/unstable manifold。\n\n这条路线最终通向 chaos theory。\n","resources":[]},{"heading":"PDE 与现代技术","line":133,"end":143,"text":"## PDE 与现代技术\n\n- weather / climate；\n- aerodynamics；\n- electromagnetic simulation；\n- semiconductor；\n- biomechanics；\n- medical imaging；\n- material mechanics；\n- acoustics。\n","resources":[]},{"heading":"Neural ODE 与 scientific ML","line":144,"end":154,"text":"## Neural ODE 与 scientific ML\n\n现代机器学习也重新把 neural network 与 differential equations 联系：\n\n- Neural ODE；\n- physics-informed neural networks；\n- diffusion / SDE models；\n- continuous normalizing flows。\n\n但“用神经网络求 PDE”并不消除传统 numerical analysis；稳定性、误差与边界条件仍然存在。\n","resources":[]},{"heading":"与九个核心公式连接","line":155,"end":163,"text":"## 与九个核心公式连接\n\n微积分 → differential equations。  \nTaylor → numerical integrators。  \nFourier → solve linear PDE in frequency domain。  \n散度 → conservation PDE。  \nLebesgue/functional analysis → weak solution。  \nchaos → nonlinear ODE。\n","resources":[]},{"heading":"参考","line":164,"end":168,"text":"## 参考\n\n- Boyce & DiPrima, *Elementary Differential Equations*.\n- Evans, *Partial Differential Equations*.\n- MacTutor historical overview: https://mathshistory.st-andrews.ac.uk/HistTopics/History_overview/","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/HistTopics/History_overview/","url":"https://mathshistory.st-andrews.ac.uk/HistTopics/History_overview/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/13-differential-equations.md"},{"path":"mathematics-changed-the-world/docs/branches/14-non-euclidean-geometry.md","module":"数学主干","role":"数学专题","title":"非欧几何：几何不是宇宙唯一的“默认设置”","sections":[{"heading":"非欧几何：几何不是宇宙唯一的“默认设置”","line":1,"end":4,"text":"# 非欧几何：几何不是宇宙唯一的“默认设置”\n\n> **核心问题**：Euclid 的 parallel postulate 是逻辑必然，还是一种可以替换的假设？\n","resources":[]},{"heading":"第五公设为什么困扰两千年？","line":5,"end":14,"text":"## 第五公设为什么困扰两千年？\n\nEuclid 前四条公设看起来非常直接，第五条平行公设却复杂得多。\n\n几代数学家尝试从其他公设证明它，希望它不是独立假设。\n\n最终发生了观念逆转：\n\n> 与其证明它，不如否定它，看看能否产生自洽几何。\n","resources":[]},{"heading":"Hyperbolic geometry","line":15,"end":28,"text":"## Hyperbolic geometry\n\nLobachevsky 与 Bolyai 在 19 世纪独立发展非欧几何。\n\n在 hyperbolic geometry 中，通过线外一点可以存在多条不与原线相交的 geodesics。\n\n三角形角和：\n\n$$\n\\alpha+\\beta+\\gamma\u003c\\pi.\n$$\n\n而且偏差与面积存在关系。\n","resources":[]},{"heading":"Spherical / elliptic geometry","line":29,"end":40,"text":"## Spherical / elliptic geometry\n\n球面上“大圆”扮演直线角色。\n\n任意两条大圆都会相交，不存在欧氏意义下平行线。\n\n球面三角形：\n\n$$\n\\alpha+\\beta+\\gamma>\\pi.\n$$\n","resources":[]},{"heading":"Riemann 的升级","line":41,"end":48,"text":"## Riemann 的升级\n\nRiemann 不只是提出另一种具体几何，而是把问题提升：\n\n> 空间的 metric 本身可以随位置变化。\n\n1854 年 habilitation lecture 形成 Riemannian manifold 思想的重要起点。\n","resources":[]},{"heading":"Beltrami：相对一致性","line":49,"end":58,"text":"## Beltrami：相对一致性\n\n1868 年 Beltrami 构造 hyperbolic geometry 的 Euclidean model。\n\n这意味着：\n\n> 如果 Euclidean geometry 没矛盾，则这种 non-Euclidean geometry 也没矛盾。\n\n从此“非欧几何只是荒谬假设”的观点难以维持。\n","resources":[]},{"heading":"广义相对论","line":59,"end":68,"text":"## 广义相对论\n\n20 世纪 Einstein 用 curved spacetime 描述 gravity。\n\n这不是简单地说“宇宙就是某种二维弯曲面”，而是四维 pseudo-Riemannian spacetime。\n\n但思想革命来自同一源头：\n\n> geometry 可以是物理结构，而不是先验固定舞台。\n","resources":[]},{"heading":"现代应用","line":69,"end":77,"text":"## 现代应用\n\n- GPS relativistic correction；\n- cosmology；\n- hyperbolic embeddings；\n- network representation；\n- differential geometry；\n- robotics / manifold optimization。\n","resources":[]},{"heading":"哲学影响","line":78,"end":87,"text":"## 哲学影响\n\n非欧几何迫使数学家区分：\n\n- axioms；\n- logical consequences；\n- physical truth。\n\n数学可以研究多个自洽几何；究竟哪一种描述现实，需要 measurement 与 physics 决定。\n","resources":[]},{"heading":"参考","line":88,"end":91,"text":"## 参考\n\n- MacTutor, Non-Euclidean geometry: https://mathshistory.st-andrews.ac.uk/HistTopics/Non-Euclidean_geometry/\n- Coxeter, *Non-Euclidean Geometry*.","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/HistTopics/Non-Euclidean_geometry/","url":"https://mathshistory.st-andrews.ac.uk/HistTopics/Non-Euclidean_geometry/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/14-non-euclidean-geometry.md"},{"path":"mathematics-changed-the-world/docs/branches/15-group-symmetry.md","module":"数学主干","role":"数学专题","title":"群论与对称性：把“允许哪些变换”变成数学对象","sections":[{"heading":"群论与对称性：把“允许哪些变换”变成数学对象","line":1,"end":4,"text":"# 群论与对称性：把“允许哪些变换”变成数学对象\n\n> **核心问题**：一个系统在什么变换下保持不变？这些变换如何组合？\n","resources":[]},{"heading":"从解方程到 permutation","line":5,"end":18,"text":"## 从解方程到 permutation\n\n多项式方程长期追问：\n\n> 五次方程为什么没有像二、三、四次方程那样的通用根式公式？\n\nLagrange 等人发现 roots 的 permutations 与公式结构密切相关。\n\nGalois 的突破是把“根之间允许的置换”组织成 group，并证明：\n\n> equation 是否 solvable by radicals 与其 Galois group 的结构有关。\n\n这使“解方程”变成“研究 symmetry structure”。\n","resources":[]},{"heading":"Group 定义","line":19,"end":35,"text":"## Group 定义\n\n集合 $G$ 配 operation $*$，满足：\n\n1. closure；\n2. associativity；\n3. identity；\n4. inverse。\n\n例子：\n\n- integers under addition；\n- rotations of a square；\n- permutation group；\n- invertible matrices；\n- continuous Lie groups。\n","resources":[]},{"heading":"对称性为什么是 group？","line":36,"end":47,"text":"## 对称性为什么是 group？\n\n正方形的旋转/反射可以连续做两次，结果仍是一个 symmetry。\n\n这些变换：\n\n- 能组合；\n- 有 identity；\n- 每个有 inverse。\n\n因此自然构成 dihedral group。\n","resources":[]},{"heading":"Representation","line":48,"end":57,"text":"## Representation\n\n抽象 group 可以通过 matrices 作用在 vector space：\n\n$$\n\\rho:G\\to GL(V).\n$$\n\nrepresentation theory 让抽象 symmetry 进入 linear algebra。\n","resources":[]},{"heading":"Lie group","line":58,"end":75,"text":"## Lie group\n\nrotation group：\n\n$$\nSO(3)\n$$\n\n既是 group，又是 smooth manifold。\n\n它连接：\n\n- group theory；\n- differential geometry；\n- differential equations。\n\n机器人姿态和 3D vision 因此自然生活在 $SO(3)$、$SE(3)$ 上。\n","resources":[]},{"heading":"物理：对称性比方程更深","line":76,"end":89,"text":"## 物理：对称性比方程更深\n\n20 世纪物理不断发现：\n\n- rotational symmetry；\n- translation symmetry；\n- gauge symmetry；\n\n可以强烈约束物理规律。\n\nNoether theorem 更把 continuous symmetry 与 conservation law 连接起来。\n\n例如时间平移对称性与能量守恒相关。\n","resources":[]},{"heading":"晶体","line":90,"end":93,"text":"## 晶体\n\ncrystal 的空间对称性通过 group 分类。材料性质与允许的 symmetry 直接相关。\n","resources":[]},{"heading":"粒子物理","line":94,"end":103,"text":"## 粒子物理\n\nStandard Model 使用 Lie groups：\n\n$$\nSU(3)\\times SU(2)\\times U(1).\n$$\n\n这里 group 不只是“漂亮分类”，而是决定允许相互作用的结构语言。\n","resources":[]},{"heading":"AI 中的 symmetry","line":104,"end":113,"text":"## AI 中的 symmetry\n\n若模型尊重数据的 symmetry，可以降低学习负担。\n\n典型：\n\n- CNN 对 translation 具有 equivariance；\n- graph networks 对 node permutation 设计 invariance/equivariance；\n- equivariant neural networks 面向 rotations / 3D geometry。\n","resources":[]},{"heading":"与九个核心公式的连接","line":114,"end":121,"text":"## 与九个核心公式的连接\n\nEuler complex rotation → $U(1)$。  \nlinear algebra → group representations。  \ngeometry → Lie groups。  \nphysics → symmetry + conservation。  \nGNN/CNN → equivariant learning。\n","resources":[]},{"heading":"参考","line":122,"end":126,"text":"## 参考\n\n- MacTutor, Development of group theory: https://mathshistory.st-andrews.ac.uk/HistTopics/Development_group_theory/\n- Armstrong, *Groups and Symmetry*.\n- Hall, *Lie Groups, Lie Algebras, and Representations*.","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/HistTopics/Development_group_theory/","url":"https://mathshistory.st-andrews.ac.uk/HistTopics/Development_group_theory/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/15-group-symmetry.md"},{"path":"mathematics-changed-the-world/docs/branches/16-information-theory.md","module":"数学主干","role":"数学专题","title":"信息论：信息能不能像长度、能量一样被测量？","sections":[{"heading":"信息论：信息能不能像长度、能量一样被测量？","line":1,"end":4,"text":"# 信息论：信息能不能像长度、能量一样被测量？\n\n> **核心问题**：一个符号到底携带多少信息？数据最多能压缩到什么程度？带噪声信道最多能可靠传多少比特？\n","resources":[]},{"heading":"1948：Shannon 把通信从设备问题提升为数学问题","line":5,"end":14,"text":"## 1948：Shannon 把通信从设备问题提升为数学问题\n\nClaude Shannon 在 1948 年的 *A Mathematical Theory of Communication* 中建立现代 information theory 的核心框架。\n\n重要观念是：\n\n> 通信系统首先处理的是“从一个概率分布中选出的消息”，而不是消息的语义。\n\n语义当然重要，但信道容量、编码与压缩可以先在概率层面精确研究。\n","resources":[]},{"heading":"Self-information","line":15,"end":40,"text":"## Self-information\n\n低概率事件更“意外”。\n\n定义：\n\n$$\nI(x)=-\\log p(x).\n$$\n\n为什么 logarithm 自然？\n\n因为独立事件概率相乘：\n\n$$\np(x,y)=p(x)p(y),\n$$\n\n而我们希望信息量可加：\n\n$$\nI(x,y)=I(x)+I(y).\n$$\n\nlog 正好把 multiplication 变 addition。\n","resources":[]},{"heading":"Entropy","line":41,"end":52,"text":"## Entropy\n\n随机变量 $X$ 的 entropy：\n\n$$\nH(X)\n\\mathrel{=}\n-\\sum_x p(x)\\log p(x).\n$$\n\n它可理解为平均 self-information，也是无损压缩理论的核心量。\n","resources":[]},{"heading":"为什么公平硬币 1 bit？","line":53,"end":66,"text":"## 为什么公平硬币 1 bit？\n\n若 heads/tails 各 $1/2$：\n\n$$\nH\n\\mathrel{=}\n-\\frac12\\log_2\\frac12\n-\\frac12\\log_2\\frac12\n=1.\n$$\n\n若硬币几乎永远 heads，entropy 接近 0，因为结果几乎可预测。\n","resources":[]},{"heading":"Mutual information","line":67,"end":78,"text":"## Mutual information\n\n$$\nI(X;Y)\n\\mathrel{=}\nH(X)-H(X|Y).\n$$\n\n它衡量知道 $Y$ 后，对 $X$ 的 uncertainty 减少多少。\n\n这让“相关信息”成为精确 quantity。\n","resources":[]},{"heading":"KL divergence","line":79,"end":88,"text":"## KL divergence\n\n$$\nD_{\\mathrm{KL}}(p\\|q)\n\\mathrel{=}\n\\sum_x p(x)\\log\\frac{p(x)}{q(x)}.\n$$\n\n它不是对称 distance，却广泛衡量两个 distributions 的差异。\n","resources":[]},{"heading":"Channel capacity","line":89,"end":98,"text":"## Channel capacity\n\nShannon 最惊人的结论之一是：对给定 noisy channel 存在容量 $C$。\n\n当 transmission rate \u003c $C$，原则上可以通过编码把 error probability 做得任意小；超过容量则无法可靠通信。\n\n这第一次告诉工程师：\n\n> 不是“还没发明足够好的设备”，而是存在数学极限。\n","resources":[]},{"heading":"现实应用","line":99,"end":109,"text":"## 现实应用\n\n- compression；\n- error-correcting codes；\n- cellular / satellite communication；\n- cryptography；\n- statistical inference；\n- neuroscience coding；\n- machine learning losses；\n- representation learning。\n","resources":[]},{"heading":"AI 中的 cross-entropy","line":110,"end":121,"text":"## AI 中的 cross-entropy\n\n分类模型常最小化\n\n$$\n-\\sum_i p_i\\log q_i.\n$$\n\n它和 maximum likelihood、KL divergence 直接相关。\n\n语言模型 next-token objective 也本质上是 probability + information theory。\n","resources":[]},{"heading":"与九个核心公式连接","line":122,"end":129,"text":"## 与九个核心公式连接\n\nBayes → probability distribution；  \nFourier → communication signals；  \nlinear algebra → coding；  \nTransformer → cross-entropy；  \nstatistics → KL / mutual information。\n","resources":[]},{"heading":"参考","line":130,"end":133,"text":"## 参考\n\n- C. E. Shannon, *A Mathematical Theory of Communication* (1948), Bell System Technical Journal, Vol. 27.\n- Cover & Thomas, *Elements of Information Theory*.","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/16-information-theory.md"},{"path":"mathematics-changed-the-world/docs/branches/17-computability.md","module":"数学主干","role":"数学专题","title":"可计算性：有些问题不是“计算机太慢”，而是根本不存在通用算法","sections":[{"heading":"可计算性：有些问题不是“计算机太慢”，而是根本不存在通用算法","line":1,"end":4,"text":"# 可计算性：有些问题不是“计算机太慢”，而是根本不存在通用算法\n\n> **核心问题**：到底什么叫“算法”？是否每个数学问题原则上都能通过机械步骤解决？\n","resources":[]},{"heading":"20 世纪初的基础危机","line":5,"end":12,"text":"## 20 世纪初的基础危机\n\nHilbert 等人希望数学拥有机械化 decision procedure：\n\n> 给定形式化命题，是否存在一种通用有限程序判断其真伪？\n\n要回答这个问题，首先必须精确定义“程序”。\n","resources":[]},{"heading":"Turing machine","line":13,"end":25,"text":"## Turing machine\n\n1936 年 Alan Turing 用极简抽象机器刻画机械计算：\n\n- tape；\n- finite states；\n- read/write head；\n- deterministic transition rules。\n\n它不是为了模拟具体电脑硬件，而是为了抓住 algorithmic procedure 的本质。\n\nChurch 的 lambda calculus 从另一条路线得到等价计算能力，形成 Church–Turing thesis 的背景。\n","resources":[]},{"heading":"Universal machine","line":26,"end":37,"text":"## Universal machine\n\nTuring 进一步展示：\n\n> 一台通用机器可以把“另一台机器的描述 + 输入”当数据读取并模拟它。\n\n这就是现代 stored-program computer 最重要的概念祖先之一：\n\n$$\n\\text{program 也可以是 data}.\n$$\n","resources":[]},{"heading":"Halting problem","line":38,"end":47,"text":"## Halting problem\n\n问：\n\n> 给定任意程序 $P$ 和输入 $x$，能否写一个通用程序判断 $P(x)$ 最终是否停止？\n\nTuring 证明：不存在这样的 universal halting decider。\n\n这不是“还没人找到算法”，而是 mathematically impossible。\n","resources":[]},{"heading":"Computable vs tractable","line":48,"end":51,"text":"## Computable vs tractable\n\n两个问题不要混：\n","resources":[]},{"heading":"Computable vs tractable › Computability","line":52,"end":54,"text":"### Computability\n有没有算法？\n","resources":[]},{"heading":"Computable vs tractable › Complexity","line":55,"end":63,"text":"### Complexity\n有算法，但需要多少：\n\n- time；\n- memory；\n- communication？\n\n一个 problem 可以 computable，但在现实规模上极难。\n","resources":[]},{"heading":"从 Turing 到现代计算机科学","line":64,"end":74,"text":"## 从 Turing 到现代计算机科学\n\n可计算性催生：\n\n- formal languages；\n- compilers 理论；\n- complexity；\n- verification；\n- cryptography foundations；\n- computability in analysis。\n","resources":[]},{"heading":"AI 能绕过不可计算性吗？","line":75,"end":89,"text":"## AI 能绕过不可计算性吗？\n\n不能。\n\nMachine learning 可以：\n\n- approximate；\n- predict common cases；\n- exploit distributions；\n- use heuristics。\n\n但它不会让 mathematically undecidable problem 变成 universal decidable。\n\n同样，LLM 输出“看起来像证明”不等于拥有 general theorem-deciding oracle。\n","resources":[]},{"heading":"Gödel 与 Turing","line":90,"end":98,"text":"## Gödel 与 Turing\n\nGödel incompleteness 和 Turing undecidability 深刻相关但不是同一个定理。\n\n粗略说：\n\n- Gödel：足够强的 formal system 有无法在系统内证明/否证的命题；\n- Turing：不存在能解决所有程序 halting instances 的算法。\n","resources":[]},{"heading":"与项目主线连接","line":99,"end":106,"text":"## 与项目主线连接\n\n数学开始研究“数”；\n后来研究“函数与空间”；\n20 世纪进一步把“证明与算法自身”变成数学对象。\n\n这是一次对象层级的巨大提升。\n","resources":[]},{"heading":"参考","line":107,"end":110,"text":"## 参考\n\n- Alan Turing, *On Computable Numbers, with an Application to the Entscheidungsproblem* (1936).\n- Sipser, *Introduction to the Theory of Computation*.","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/17-computability.md"},{"path":"mathematics-changed-the-world/docs/branches/18-chaos.md","module":"数学主干","role":"数学专题","title":"混沌：确定性方程为什么仍然可能长期不可预测？","sections":[{"heading":"混沌：确定性方程为什么仍然可能长期不可预测？","line":1,"end":4,"text":"# 混沌：确定性方程为什么仍然可能长期不可预测？\n\n> **核心问题**：如果系统完全由 deterministic equations 控制，为什么未来仍可能迅速变得无法预测？\n","resources":[]},{"heading":"“确定性”不等于“可预测”","line":5,"end":34,"text":"## “确定性”不等于“可预测”\n\n经典理想：\n\n$$\n\\text{initial condition}\n+\n\\text{law}\n\\Rightarrow\n\\text{future}.\n$$\n\n但若系统对初值 extremely sensitive，任何测量误差都会指数放大。\n\n两个初始状态相差\n\n$$\n\\delta x(0)\n$$\n\n可能满足近似：\n\n$$\n|\\delta x(t)|\n\\approx\n|\\delta x(0)|e^{\\lambda t}.\n$$\n\n若最大 Lyapunov exponent $\\lambda>0$，长期预测 horizon 有根本限制。\n","resources":[]},{"heading":"Lorenz 1963","line":35,"end":54,"text":"## Lorenz 1963\n\nLorenz 研究简化 convection system：\n\n$$\n\\dot x=\\sigma(y-x),\n$$\n\n$$\n\\dot y=x(\\rho-z)-y,\n$$\n\n$$\n\\dot z=xy-\\beta z.\n$$\n\n它只有三个 ODE，却可以产生非周期、对小初值差异极敏感的轨迹。\n\n1963 年 *Deterministic Nonperiodic Flow* 成为 chaos history 的标志论文之一。\n","resources":[]},{"heading":"Strange attractor","line":55,"end":65,"text":"## Strange attractor\n\ntrajectory 不会简单：\n\n- 收敛到一个 fixed point；\n- 或进入周期 orbit。\n\n它会在 bounded region 中形成复杂 fractal-like attractor。\n\n这打破“长期行为一定走向 equilibrium 或简单周期”的直觉。\n","resources":[]},{"heading":"Butterfly effect 到底是什么意思？","line":66,"end":73,"text":"## Butterfly effect 到底是什么意思？\n\n不是“一只蝴蝶必然造成某次龙卷风”。\n\n更精确：\n\n> 在具有 sensitive dependence 的 nonlinear dynamics 中，极小 initial-state uncertainty 可能快速增长，使长时间具体 trajectory prediction 失去可靠性。\n","resources":[]},{"heading":"天气预报","line":74,"end":85,"text":"## 天气预报\n\n天气不是“因为随机所以算不准”。\n\n大气方程在宏观模型中主要是 deterministic PDE，但：\n\n- initial state 不可能无限精确；\n- model 不完美；\n- nonlinear dynamics 放大误差。\n\n因此现代 weather prediction 使用 ensemble forecasting，而非只给一条未来轨迹。\n","resources":[]},{"heading":"Chaos ≠ random","line":86,"end":100,"text":"## Chaos ≠ random\n\nchaotic trajectory 可以来自完全 deterministic equations。\n\n但其 statistical behavior 可能看起来 random-like。\n\n研究工具包括：\n\n- phase space；\n- Poincaré section；\n- Lyapunov exponent；\n- bifurcation；\n- symbolic dynamics；\n- ergodic theory。\n","resources":[]},{"heading":"现实应用","line":101,"end":110,"text":"## 现实应用\n\n- weather / climate dynamics；\n- fluid turbulence；\n- lasers；\n- power systems；\n- cardiac dynamics；\n- celestial mechanics；\n- ecology。\n","resources":[]},{"heading":"与九个核心公式连接","line":111,"end":118,"text":"## 与九个核心公式连接\n\ncalculus → ODE；  \nTaylor → local stability / Jacobian；  \nnumerical analysis → trajectory simulation；  \nprobability → uncertainty quantification；  \ntopology/geometry → phase-space structure。\n","resources":[]},{"heading":"参考","line":119,"end":122,"text":"## 参考\n\n- E. N. Lorenz, *Deterministic Nonperiodic Flow*, Journal of the Atmospheric Sciences 20(2), 1963.\n- Strogatz, *Nonlinear Dynamics and Chaos*.","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/18-chaos.md"},{"path":"mathematics-changed-the-world/docs/branches/19-convex-optimization.md","module":"数学主干","role":"数学专题","title":"凸优化：怎样把“找最好”变成可证明可靠的算法","sections":[{"heading":"凸优化：怎样把“找最好”变成可证明可靠的算法","line":1,"end":4,"text":"# 凸优化：怎样把“找最好”变成可证明可靠的算法\n\n> **核心问题**：什么时候一个高维 optimization problem 不会到处都是糟糕 local minima？\n","resources":[]},{"heading":"一般优化","line":5,"end":14,"text":"## 一般优化\n\n$$\n\\min_x f(x)\n$$\n\nsubject to constraints.\n\n若 $f$ 与 feasible region 都非常复杂，local optimum 未必 global optimum。\n","resources":[]},{"heading":"Convex set","line":15,"end":24,"text":"## Convex set\n\n集合 $C$ convex，若任意 $x,y\\in C$ 与 $0\\le\\theta\\le1$：\n\n$$\n\\theta x+(1-\\theta)y\\in C.\n$$\n\n直觉：任意两点之间整条线段仍在集合内。\n","resources":[]},{"heading":"Convex function","line":25,"end":34,"text":"## Convex function\n\n$$\nf(\\theta x+(1-\\theta)y)\n\\le\n\\theta f(x)+(1-\\theta)f(y).\n$$\n\n几何上函数图像位于任意 chord 下方。\n","resources":[]},{"heading":"为什么 convex 特别？","line":35,"end":42,"text":"## 为什么 convex 特别？\n\n在适当条件下：\n\n> local minimum 就是 global minimum。\n\n这把“搜索最好答案”从极不可靠问题变成有坚实理论的算法问题。\n","resources":[]},{"heading":"First-order condition","line":43,"end":62,"text":"## First-order condition\n\n可微 convex $f$：\n\n$$\nf(y)\n\\ge\nf(x)+\\nabla f(x)^T(y-x).\n$$\n\n函数永远位于 tangent hyperplane 之上。\n\n若\n\n$$\n\\nabla f(x^*)=0,\n$$\n\n则 $x^*$ 为 global minimizer。\n","resources":[]},{"heading":"Lagrange duality","line":63,"end":86,"text":"## Lagrange duality\n\n带 constraints：\n\n$$\n\\min_x f_0(x)\n$$\n\ns.t.\n\n$$\nf_i(x)\\le0.\n$$\n\n构造 Lagrangian：\n\n$$\nL(x,\\lambda)\n\\mathrel{=}\nf_0(x)+\\sum_i\\lambda_i f_i(x).\n$$\n\ndual problem 不仅用于求解，也能给 lower bound 和 optimality certificate。\n","resources":[]},{"heading":"KKT","line":87,"end":97,"text":"## KKT\n\nKarush–Kuhn–Tucker conditions 把：\n\n- stationarity；\n- primal feasibility；\n- dual feasibility；\n- complementary slackness；\n\n组合成 constrained optimization 的核心条件。\n","resources":[]},{"heading":"Machine learning","line":98,"end":117,"text":"## Machine learning\n\n很多经典模型是 convex：\n\n- linear regression；\n- logistic regression；\n- SVM；\n- Lasso；\n- ridge regression。\n\ndeep neural networks 通常 nonconvex，但 convex optimization 的：\n\n- gradient methods；\n- duality；\n- regularization；\n- proximal algorithms；\n- conditioning；\n\n仍深刻影响训练理论和算法。\n","resources":[]},{"heading":"工程应用","line":118,"end":130,"text":"## 工程应用\n\n- resource allocation；\n- portfolio；\n- signal processing；\n- control；\n- network flow；\n- experiment design；\n- power systems；\n- model fitting。\n\nStanford 的 Boyd 等推动 convex optimization 成为现代工程的通用工具箱。\n","resources":[]},{"heading":"与 Taylor 的关系","line":131,"end":154,"text":"## 与 Taylor 的关系\n\n二阶 Taylor：\n\n$$\nf(x+\\Delta)\n\\approx\nf(x)\n+\n\\nabla f^T\\Delta\n+\n\\frac12\\Delta^TH\\Delta.\n$$\n\nHessian：\n\n$$\nH\\succeq0\n$$\n\n是二阶可微 convex function 的重要判据。\n\n因此 Taylor curvature 与 convexity 直接相连。\n","resources":[]},{"heading":"参考","line":155,"end":159,"text":"## 参考\n\n- Boyd & Vandenberghe, *Convex Optimization*: https://web.stanford.edu/~boyd/cvxbook/\n- Boyd, *Overview of Convex Optimization*: https://web.stanford.edu/~boyd/papers/cvx_opt_overview.html\n","resources":[{"label":"https://web.stanford.edu/~boyd/cvxbook/","url":"https://web.stanford.edu/~boyd/cvxbook/"},{"label":"https://web.stanford.edu/~boyd/papers/cvx_opt_overview.html","url":"https://web.stanford.edu/~boyd/papers/cvx_opt_overview.html"}]},{"heading":"课程化学习入口","line":160,"end":164,"text":"## 课程化学习入口\n\n如果希望把本章扩展成完整课程路线，进入 [北大文再文最优化学习体系](../courses/optimization-pku-wenzw.md)。\n\n该路线把凸分析、最优性理论、无约束/约束/复合优化、大规模与随机算法，以及数据问题中的优化串成一条主线；同时保留教材、课程、代码与来源的证据状态。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/19-convex-optimization.md"},{"path":"mathematics-changed-the-world/docs/branches/20-probability.md","module":"数学主干","role":"数学专题","title":"概率论：把不确定性从直觉变成可计算结构","sections":[{"heading":"概率论：把不确定性从直觉变成可计算结构","line":1,"end":4,"text":"# 概率论：把不确定性从直觉变成可计算结构\n\n> **核心问题**：随机事件能否像长度、面积一样拥有一致的数学规则？\n","resources":[]},{"heading":"从赌博问题开始，但没有停在那里","line":5,"end":17,"text":"## 从赌博问题开始，但没有停在那里\n\n17 世纪 Pascal 与 Fermat 关于赌博分赌金问题的通信，是 probability history 的经典起点之一。\n\n早期概率长期与：\n\n- gambling；\n- insurance；\n- mortality tables；\n- astronomy errors；\n\n紧密相关。\n","resources":[]},{"heading":"Bernoulli：大数规律","line":18,"end":33,"text":"## Bernoulli：大数规律\n\n若独立重复试验成功概率为 $p$，样本比例：\n\n$$\n\\hat p_n\n\\mathrel{=}\n\\frac1n\\sum_{i=1}^n X_i\n$$\n\n会随着 $n$ 增大趋近 $p$。\n\n这揭示概率学的核心张力：\n\n> 单次事件不可确定，大量重复却出现稳定规律。\n","resources":[]},{"heading":"从组合概率到 distribution","line":34,"end":44,"text":"## 从组合概率到 distribution\n\n18–19 世纪 De Moivre、Laplace、Gauss 等发展：\n\n- normal approximation；\n- error distribution；\n- limit ideas；\n- inverse probability。\n\n统计学开始与 probability 深度融合。\n","resources":[]},{"heading":"Kolmogorov 1933","line":45,"end":78,"text":"## Kolmogorov 1933\n\n现代 probability space：\n\n$$\n(\\Omega,\\mathcal F,P).\n$$\n\n其中：\n\n- $\\Omega$：sample space；\n- $\\mathcal F$：events 的 sigma-algebra；\n- $P$：probability measure。\n\n公理：\n\n$$\nP(A)\\ge0,\n$$\n\n$$\nP(\\Omega)=1,\n$$\n\n对互斥 $A_i$：\n\n$$\nP\\left(\\bigcup_iA_i\\right)\n\\mathrel{=}\n\\sum_iP(A_i).\n$$\n\n这把 probability 建立在 measure theory 上。\n","resources":[]},{"heading":"Random variable","line":79,"end":96,"text":"## Random variable\n\n随机变量不是“一个随机变化的数字”，而是函数：\n\n$$\nX:\\Omega\\to\\mathbb R.\n$$\n\ndistribution：\n\n$$\nP_X(B)\n\\mathrel{=}\nP(X\\in B).\n$$\n\n这种抽象让我们不必追踪 sample space 的所有细节，而专注观测量的概率规律。\n","resources":[]},{"heading":"Expectation","line":97,"end":108,"text":"## Expectation\n\n$$\nE[X]\n\\mathrel{=}\n\\int_\\Omega X\\,dP.\n$$\n\n这就是 Lebesgue integral。\n\n因此现代 probability 不是 analysis 的旁支，而与 measure theory 深度统一。\n","resources":[]},{"heading":"三类基本问题 › 描述","line":111,"end":113,"text":"### 描述\ndistribution 是什么？\n","resources":[]},{"heading":"三类基本问题 › 推断","line":114,"end":116,"text":"### 推断\n观察 data 后 unknown parameters 是什么？\n","resources":[]},{"heading":"三类基本问题 › 预测","line":117,"end":121,"text":"### 预测\nfuture / unseen variable 的分布是什么？\n\nBayesian statistics、frequentist statistics、stochastic processes 都是在这些问题上发展出的不同工具。\n","resources":[]},{"heading":"Probability 与 randomness 的哲学","line":122,"end":131,"text":"## Probability 与 randomness 的哲学\n\n同一套 probability calculus 可以有不同解释：\n\n- frequentist；\n- Bayesian degree of belief；\n- propensity 等。\n\n数学公理与“概率究竟意味着什么”的哲学解释需要区分。\n","resources":[]},{"heading":"现实应用","line":132,"end":143,"text":"## 现实应用\n\n- clinical trials；\n- reliability；\n- finance；\n- genetics；\n- weather ensemble；\n- communications；\n- AI；\n- randomized algorithms；\n- quantum measurement。\n","resources":[]},{"heading":"一条主链","line":144,"end":151,"text":"## 一条主链\n\nPascal/Fermat  \n→ Bernoulli/Laplace/Gauss  \n→ measure theory  \n→ Kolmogorov  \n→ stochastic processes / modern statistics / ML。\n","resources":[]},{"heading":"与核心九章连接","line":152,"end":158,"text":"## 与核心九章连接\n\nBayes 公式是 probability 的 conditional update。  \nLebesgue integral 给 expectation 基础。  \nFourier transform 进入 characteristic function。  \n随机过程把 probability 放入 time dynamics。\n","resources":[]},{"heading":"参考","line":159,"end":163,"text":"## 参考\n\n- MacTutor, Kolmogorov: https://mathshistory.st-andrews.ac.uk/Biographies/Kolmogorov/\n- Billingsley, *Probability and Measure*.\n- Durrett, *Probability: Theory and Examples*.","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Kolmogorov/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Kolmogorov/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/branches/20-probability.md"},{"path":"mathematics-changed-the-world/docs/bridges/01-transform-family.md","module":"专题桥梁","role":"跨主题教程","title":"Fourier–Laplace–Z：从复指数到极点、采样与数字系统","sections":[{"heading":"Fourier–Laplace–Z：从复指数到极点、采样与数字系统","line":1,"end":10,"text":"# Fourier–Laplace–Z：从复指数到极点、采样与数字系统\n\n> **核心问题**：为什么频谱、微分方程、控制系统、数字滤波和递推关系，会反复出现同一批复指数、极点和收敛域？\n\nFourier、Laplace 与 Z 变换不是三个互不相干的“公式技巧”。更统一的看法是：它们都在寻找一种表示，使**平移、微分、差分和卷积**变成更简单的乘法或代数运算。真正的分叉来自连续/离散时间、变换变量所在的空间，以及什么范围内变换真正收敛。\n\n本页把三种变换放到同一张地图里，并继续连接到采样、控制、数字滤波、生成函数与概率论。\n\n---\n","resources":[]},{"heading":"1. 为什么复指数总会出现？","line":11,"end":60,"text":"## 1. 为什么复指数总会出现？\n\n连续时间指数\n\n$$\ne^{st},\n\\qquad\ns=\\sigma+i\\omega\n$$\n\n同时编码两件事：\n\n$$\ne^{st}\n=\ne^{\\sigma t}e^{i\\omega t}.\n$$\n\n其中 $e^{\\sigma t}$ 描述增长或衰减，$e^{i\\omega t}$ 描述旋转或振荡。\n\n它还是微分算子的特征函数：\n\n$$\n\\frac{d}{dt}e^{st}\n=\ns e^{st}.\n$$\n\n所以当一个线性常系数微分方程作用在 $e^{st}$ 上时，微分会直接变成关于 $s$ 的多项式。\n\n离散时间也有完全平行的结构。对序列\n\n$$\nz^n,\n$$\n\n延迟一个采样点只会乘一个常数：\n\n$$\nz^{n-1}\n=\nz^{-1}z^n.\n$$\n\n这正是 Z 变换里 $z^{-1}$ 代表单位延迟的根本原因。\n\n> **统一视角**：连续时间里，复指数让“微分”对角化；离散时间里，几何序列让“移位/差分”对角化。\n\n---\n","resources":[]},{"heading":"2. 三种变换放在一起 › Fourier：只观察纯振荡方向","line":63,"end":89,"text":"### Fourier：只观察纯振荡方向\n\n$$\nX_F(\\omega)\n=\n\\int_{-\\infty}^{\\infty}\nx(t)e^{-i\\omega t}\\,dt.\n$$\n\n它沿着复 $s$ 平面的虚轴\n\n$$\ns=i\\omega\n$$\n\n观察信号。\n\n常见逆变换归一化为\n\n$$\nx(t)\n=\n\\frac{1}{2\\pi}\n\\int_{-\\infty}^{\\infty}\nX_F(\\omega)e^{i\\omega t}\\,d\\omega.\n$$\n","resources":[]},{"heading":"2. 三种变换放在一起 › Laplace：把虚轴扩展成整个复平面的一部分","line":90,"end":124,"text":"### Laplace：把虚轴扩展成整个复平面的一部分\n\n双边 Laplace 变换为\n\n$$\nX_L(s)\n=\n\\int_{-\\infty}^{\\infty}\nx(t)e^{-st}\\,dt,\n\\qquad\ns=\\sigma+i\\omega.\n$$\n\n因为\n\n$$\ne^{-st}\n=\ne^{-\\sigma t}e^{-i\\omega t},\n$$\n\n它相当于先用 $e^{-\\sigma t}$ 对信号做指数加权，再做 Fourier 分析。\n\n逆变换可写成 Bromwich 积分：\n\n$$\nx(t)\n=\n\\frac{1}{2\\pi i}\n\\int_{\\gamma-i\\infty}^{\\gamma+i\\infty}\nX_L(s)e^{st}\\,ds,\n$$\n\n其中竖直积分线必须选在合适的收敛区域内。\n","resources":[]},{"heading":"2. 三种变换放在一起 › Z：离散时间的复变量变换","line":125,"end":165,"text":"### Z：离散时间的复变量变换\n\n双边 Z 变换：\n\n$$\nX_Z(z)\n=\n\\sum_{n=-\\infty}^{\\infty}\nx[n]z^{-n}.\n$$\n\n写\n\n$$\nz=re^{i\\Omega}\n$$\n\n后，\n\n$$\nz^{-n}\n=\nr^{-n}e^{-i\\Omega n}.\n$$\n\n所以 Z 变换可以理解为：对离散序列先乘指数权重 $r^{-n}$，再做离散时间 Fourier 分析。\n\n逆 Z 变换可写成\n\n$$\nx[n]\n=\n\\frac{1}{2\\pi i}\n\\oint_C\nX_Z(z)z^{n-1}\\,dz,\n$$\n\n其中闭合路径 $C$ 要位于 ROC 中。\n\n---\n","resources":[]},{"heading":"3. Fourier 是 Laplace 的“切片”，但必须带 ROC 条件","line":166,"end":196,"text":"## 3. Fourier 是 Laplace 的“切片”，但必须带 ROC 条件\n\n若 Laplace 变换的收敛域包含虚轴 $\\sigma=0$，则\n\n$$\nX_F(\\omega)\n=\nX_L(i\\omega).\n$$\n\n这时 Fourier 频率响应就是 Laplace 变换沿虚轴的取值。\n\n关键是“**ROC 包含虚轴**”。如果虚轴不在收敛域里，普通意义下就不能直接把 $s=i\\omega$ 代进去。\n\n同理，对离散时间：\n\n$$\nX_{\\mathrm{DTFT}}(\\Omega)\n=\nX_Z(e^{i\\Omega})\n$$\n\n只在 Z 变换的 ROC 包含单位圆 $|z|=1$ 时成立。\n\n因此：\n\n- Fourier ↔ Laplace 的特殊边界：虚轴；\n- DTFT ↔ Z 的特殊边界：单位圆。\n\n---\n","resources":[]},{"heading":"4. 为什么 ROC 不是附属信息？","line":197,"end":200,"text":"## 4. 为什么 ROC 不是附属信息？\n\n只写代数表达式可能不够，因为**同一个公式可以对应不同的时域信号**。\n","resources":[]},{"heading":"4. 为什么 ROC 不是附属信息？ › Laplace 例子","line":201,"end":234,"text":"### Laplace 例子\n\n考虑\n\n$$\nX(s)\n=\n\\frac{1}{s+a}.\n$$\n\n若\n\n$$\n\\operatorname{Re}(s)>-a,\n$$\n\n它对应\n\n$$\nx_1(t)=e^{-at}u(t).\n$$\n\n但若\n\n$$\n\\operatorname{Re}(s)\u003c-a,\n$$\n\n同一个代数式对应\n\n$$\nx_2(t)=-e^{-at}u(-t).\n$$\n","resources":[]},{"heading":"4. 为什么 ROC 不是附属信息？ › Z 例子","line":235,"end":272,"text":"### Z 例子\n\n同样，\n\n$$\nX(z)\n=\n\\frac{1}{1-a z^{-1}}\n$$\n\n若 ROC 为\n\n$$\n|z|>|a|,\n$$\n\n则对应\n\n$$\nx_1[n]=a^n u[n].\n$$\n\n若 ROC 为\n\n$$\n|z|\u003c|a|,\n$$\n\n则对应\n\n$$\nx_2[n]=-a^n u[-n-1].\n$$\n\n所以在 Laplace/Z 变换里，**表达式 + ROC** 才是完整信息。\n\n---\n","resources":[]},{"heading":"5. 双边与单边：为什么工程教材有时写法不一样？","line":273,"end":319,"text":"## 5. 双边与单边：为什么工程教材有时写法不一样？\n\n双边变换更适合讨论：\n\n- 信号本身；\n- 频率响应；\n- 因果性；\n- ROC；\n- 双向时间序列。\n\n但解初值问题时，单边变换往往更方便。\n\n单边 Laplace：\n\n$$\nX_+(s)\n=\n\\int_{0^-}^{\\infty}\nx(t)e^{-st}\\,dt.\n$$\n\n它把初值直接带进导数公式：\n\n$$\n\\mathcal L_+\\{x'(t)\\}\n=\nsX_+(s)-x(0^-).\n$$\n\n于是\n\n$$\ny'(t)+ay(t)=u(t)\n$$\n\n会变成\n\n$$\nsY(s)-y(0^-)+aY(s)=U(s).\n$$\n\n这解释了为什么 Laplace 变换在电路、控制和 ODE 初值问题中如此常见：它把**微分方程 + 初始条件**一起变成代数方程。\n\n单边 Z 变换对差分方程扮演类似角色；初始样本会作为边界项进入变换后的代数关系。\n\n---\n","resources":[]},{"heading":"6. 卷积为什么会被“消掉”？","line":320,"end":357,"text":"## 6. 卷积为什么会被“消掉”？\n\n对 LTI 系统，\n\n$$\ny(t)=(h*x)(t)\n$$\n\n或离散时间\n\n$$\ny[n]=(h*x)[n].\n$$\n\n在适当条件下，三类变换都会把卷积变成乘法：\n\n$$\nY_F(\\omega)\n=\nH_F(\\omega)X_F(\\omega),\n$$\n\n$$\nY_L(s)\n=\nH_L(s)X_L(s),\n$$\n\n$$\nY_Z(z)\n=\nH_Z(z)X_Z(z).\n$$\n\n所以“变换域”不是为了把公式写得更漂亮，而是在把一个积分/求和运算变成普通乘法。\n\n---\n","resources":[]},{"heading":"7. 从微分方程到 transfer function","line":358,"end":417,"text":"## 7. 从微分方程到 transfer function\n\n考虑线性常系数方程\n\n$$\na_2y''+a_1y'+a_0y=u.\n$$\n\n在零初值条件下做 Laplace 变换：\n\n$$\n(a_2s^2+a_1s+a_0)Y(s)\n=\nU(s).\n$$\n\n因此\n\n$$\nH(s)\n=\n\\frac{Y(s)}{U(s)}\n=\n\\frac{1}{a_2s^2+a_1s+a_0}.\n$$\n\n原本的微分算子被多项式\n\n$$\na_2s^2+a_1s+a_0\n$$\n\n取代。\n\n离散差分方程也完全类似。若\n\n$$\ny[n]-\\alpha y[n-1]=u[n],\n$$\n\n在零初值下：\n\n$$\nY(z)-\\alpha z^{-1}Y(z)\n=\nU(z),\n$$\n\n于是\n\n$$\nH(z)\n=\n\\frac{1}{1-\\alpha z^{-1}}.\n$$\n\n这就是“微分/差分方程 → 代数分式 → 极点与零点”的核心路径。\n\n---\n","resources":[]},{"heading":"8. 极点、零点与频率响应的几何意义","line":418,"end":452,"text":"## 8. 极点、零点与频率响应的几何意义\n\n对有理系统，可以写\n\n$$\nH(s)\n=\nK\n\\frac{\\prod_k(s-z_k)}\n{\\prod_m(s-p_m)}\n$$\n\n或\n\n$$\nH(z)\n=\nK\n\\frac{\\prod_k(z-z_k)}\n{\\prod_m(z-p_m)}.\n$$\n\n这里 $z_k$ 是 zeros，$p_m$ 是 poles。\n\n在频率轴上评估时：\n\n- 连续系统看 $s=i\\omega$；\n- 离散系统看 $z=e^{i\\Omega}$。\n\n频率响应的幅度可理解为“评价点到所有零点距离的乘积 / 到所有极点距离的乘积”。\n\n因此 pole-zero plot 不只是画点：它直接编码系统在哪些频率附近放大、衰减或产生共振。\n\n---\n","resources":[]},{"heading":"9. 稳定性为什么变成“看极点位置”？","line":453,"end":458,"text":"## 9. 稳定性为什么变成“看极点位置”？\n\nBIBO 稳定的本质条件仍是冲激响应绝对可积/绝对可和。\n\n对于**因果有理系统**，这进一步简化为：\n","resources":[]},{"heading":"9. 稳定性为什么变成“看极点位置”？ › 连续时间","line":459,"end":466,"text":"### 连续时间\n\n全部极点位于左半 $s$ 平面：\n\n$$\n\\operatorname{Re}(p_k)\u003c0.\n$$\n","resources":[]},{"heading":"9. 稳定性为什么变成“看极点位置”？ › 离散时间","line":467,"end":481,"text":"### 离散时间\n\n全部极点位于单位圆内部：\n\n$$\n|p_k|\u003c1.\n$$\n\n更一般的非因果系统不能只看“极点在哪一边”；还必须连同 ROC 判断。真正通用的说法是：\n\n- 连续时间稳定 ⇒ ROC 包含虚轴；\n- 离散时间稳定 ⇒ ROC 包含单位圆。\n\n---\n","resources":[]},{"heading":"10. 采样为什么自然产生 $z=e^{sT}$？","line":482,"end":527,"text":"## 10. 采样为什么自然产生 $z=e^{sT}$？\n\n连续时间单个模态\n\n$$\ne^{st}\n$$\n\n以采样周期 $T$ 取样：\n\n$$\ne^{s nT}\n=\n\\left(e^{sT}\\right)^n.\n$$\n\n因此离散模态自然满足\n\n$$\nz=e^{sT}.\n$$\n\n若\n\n$$\ns=\\sigma+i\\omega,\n$$\n\n则\n\n$$\nz\n=\ne^{\\sigma T}e^{i\\omega T}.\n$$\n\n于是：\n\n- $\\sigma=0$ 的虚轴 → 单位圆；\n- $\\sigma\u003c0$ 的左半平面 → 单位圆内部；\n- $\\sigma>0$ 的右半平面 → 单位圆外部。\n\n这就是连续稳定极点与离散稳定极点对应关系的几何来源。\n\n---\n","resources":[]},{"heading":"11. 一个更精确的 Laplace–Z 连接：采样脉冲列","line":528,"end":574,"text":"## 11. 一个更精确的 Laplace–Z 连接：采样脉冲列\n\n把离散序列表示成连续时间冲激列\n\n$$\nx_s(t)\n=\n\\sum_{n=-\\infty}^{\\infty}\nx[n]\\delta(t-nT).\n$$\n\n对它做双边 Laplace 变换：\n\n$$\n\\mathcal L\\{x_s\\}(s)\n=\n\\sum_{n=-\\infty}^{\\infty}\nx[n]e^{-snT}.\n$$\n\n而 Z 变换是\n\n$$\nX_Z(z)\n=\n\\sum_{n=-\\infty}^{\\infty}\nx[n]z^{-n}.\n$$\n\n因此令\n\n$$\nz=e^{sT},\n$$\n\n得到\n\n$$\n\\mathcal L\\{x_s\\}(s)\n=\nX_Z(e^{sT}).\n$$\n\n这比“Z 变换就是 Laplace 变换的离散版”更准确：Z 变换与**序列对应的冲激列**的 Laplace 变换，通过变量替换 $z=e^{sT}$ 联系起来。\n\n---\n","resources":[]},{"heading":"12. 为什么采样会有 aliasing？","line":575,"end":600,"text":"## 12. 为什么采样会有 aliasing？\n\n因为指数映射在虚部方向具有周期性：\n\n$$\ne^{i(\\omega+2\\pi k/T)T}\n=\ne^{i\\omega T},\n\\qquad\nk\\in\\mathbb Z.\n$$\n\n所以相差整数倍采样角频率\n\n$$\n\\frac{2\\pi}{T}\n$$\n\n的连续频率会映到同一个单位圆角度。\n\n这正是频率混叠的复平面版本。\n\nNyquist 条件不是一个孤立的“采样口诀”；它是在阻止多个连续频率被压到同一个离散频率上。\n\n---\n","resources":[]},{"heading":"13. “连续系统变成离散系统”不只有一种方法 › 13.1 精确模态映射","line":603,"end":618,"text":"### 13.1 精确模态映射\n\n单个连续极点\n\n$$\np\n$$\n\n采样后自然映为\n\n$$\nz=e^{pT}.\n$$\n\n但只知道极点映射，并不自动给出完整的输入保持模型。\n","resources":[]},{"heading":"13. “连续系统变成离散系统”不只有一种方法 › 13.2 Zero-order hold（ZOH）","line":619,"end":648,"text":"### 13.2 Zero-order hold（ZOH）\n\n状态空间\n\n$$\n\\dot x=Ax+Bu\n$$\n\n若输入在每个采样区间保持常数，则精确离散模型为\n\n$$\nx_{k+1}\n=\nA_dx_k+B_du_k,\n$$\n\n其中\n\n$$\nA_d=e^{AT},\n$$\n\n$$\nB_d\n=\n\\int_0^T e^{A\\tau}B\\,d\\tau.\n$$\n\n所以矩阵指数直接进入数字控制。\n","resources":[]},{"heading":"13. “连续系统变成离散系统”不只有一种方法 › 13.3 Impulse invariance","line":649,"end":652,"text":"### 13.3 Impulse invariance\n\n一种思路是让离散系统冲激响应取自连续冲激响应的采样。它会保留相应的指数模态，因此极点出现 $z=e^{pT}$ 映射；但模拟频谱会周期复制，因此可能发生 aliasing。\n","resources":[]},{"heading":"13. “连续系统变成离散系统”不只有一种方法 › 13.4 Bilinear / Tustin transform","line":653,"end":692,"text":"### 13.4 Bilinear / Tustin transform\n\n常见代换：\n\n$$\ns\n=\n\\frac{2}{T}\n\\frac{1-z^{-1}}{1+z^{-1}}\n=\n\\frac{2}{T}\n\\frac{z-1}{z+1}.\n$$\n\n它把：\n\n- 左半 $s$ 平面映到单位圆内部；\n- 虚轴映到单位圆；\n- 整条模拟频率轴一一压缩到数字频率区间。\n\n代价是 frequency warping。沿频率轴有\n\n$$\n\\omega\n=\n\\frac{2}{T}\\tan\\frac{\\Omega}{2},\n$$\n\n即\n\n$$\n\\Omega\n=\n2\\arctan\\frac{\\omega T}{2}.\n$$\n\n所以 bilinear transform 避免了 impulse-invariance 式的频谱周期重叠，但频率刻度不再线性。\n\n---\n","resources":[]},{"heading":"14. 一个一阶系统把整张图串起来","line":693,"end":758,"text":"## 14. 一个一阶系统把整张图串起来\n\n考虑低通系统\n\n$$\n\\tau \\dot y+y=u.\n$$\n\n连续 transfer function：\n\n$$\nH(s)\n=\n\\frac{1}{\\tau s+1}.\n$$\n\n唯一极点为\n\n$$\np=-\\frac1\\tau.\n$$\n\n因为 $p\u003c0$，它位于左半平面。\n\n若采用 ZOH，精确状态递推为\n\n$$\ny[k+1]\n=\n\\alpha y[k]\n+\n(1-\\alpha)u[k],\n$$\n\n其中\n\n$$\n\\alpha=e^{-T/\\tau}.\n$$\n\n因为\n\n$$\n0\u003ce^{-T/\\tau}\u003c1,\n$$\n\n离散极点\n\n$$\nz=\\alpha\n$$\n\n自动落在单位圆内。\n\n这就是\n\n$$\n-\\frac1\\tau\n\\quad\\longrightarrow\\quad\ne^{-T/\\tau}\n$$\n\n从连续衰减率到离散衰减因子的直接对应。\n\n---\n","resources":[]},{"heading":"15. Z 变换还有一个“非工程”身份：生成函数","line":759,"end":805,"text":"## 15. Z 变换还有一个“非工程”身份：生成函数\n\n对单边序列，\n\n$$\nX_Z(z)\n=\n\\sum_{n=0}^{\\infty}\nx[n]z^{-n}.\n$$\n\n令\n\n$$\nw=z^{-1},\n$$\n\n就得到普通生成函数\n\n$$\nG(w)\n=\n\\sum_{n=0}^{\\infty}\nx[n]w^n.\n$$\n\n所以\n\n$$\nX_Z(z)\n=\nG(z^{-1}).\n$$\n\n这意味着 Z 变换不仅属于 DSP，也与：\n\n- 递推关系；\n- 组合数学；\n- 动态系统；\n- 算法复杂度中的序列分析；\n\n有直接联系。\n\n例如 Fibonacci 递推可以通过生成函数求解，本质上与用 Z 变换解差分方程是同一种代数策略。\n\n---\n","resources":[]},{"heading":"16. 概率论里也藏着 Fourier/Laplace 的亲戚","line":806,"end":844,"text":"## 16. 概率论里也藏着 Fourier/Laplace 的亲戚\n\n随机变量 $X$ 的 characteristic function：\n\n$$\n\\varphi_X(\\omega)\n=\n\\mathbb E[e^{i\\omega X}]\n$$\n\n本质上是概率分布的 Fourier 型变换。\n\nmoment-generating function：\n\n$$\nM_X(t)\n=\n\\mathbb E[e^{tX}]\n$$\n\n则具有 Laplace 型结构，但它未必对所有 $t$ 存在。\n\n对非负整数随机变量，probability-generating function：\n\n$$\nG_X(s)\n=\n\\mathbb E[s^X]\n=\n\\sum_{n=0}^{\\infty}\nP(X=n)s^n\n$$\n\n又与普通生成函数/Z 变换形式高度相似。\n\n所以“复指数变换”的思想并不局限于信号处理；它同样渗入概率、统计与组合数学。\n\n---\n","resources":[]},{"heading":"17. Fourier、Laplace、Z 与小波不是竞争关系","line":845,"end":879,"text":"## 17. Fourier、Laplace、Z 与小波不是竞争关系\n\nFourier/Laplace/Z 的共同优势是把全局指数模态组织得非常清楚。\n\n但如果你关心：\n\n> 某个频率**什么时候**出现？\n\n则需要时间—频率局部化。\n\nSTFT 用固定窗：\n\n$$\n\\operatorname{STFT}_x(\\tau,\\omega)\n=\n\\int\nx(t)w(t-\\tau)e^{-i\\omega t}\\,dt.\n$$\n\nWavelet 则使用随尺度变化的局部基函数。\n\n因此可以把这条路线理解为：\n\n$$\n\\text{全局复指数表示}\n\\to\n\\text{变换域代数}\n\\to\n\\text{采样与数字系统}\n\\to\n\\text{局部时频表示}.\n$$\n\n---\n","resources":[]},{"heading":"18. 最容易混淆的八件事","line":880,"end":894,"text":"## 18. 最容易混淆的八件事\n\n| 容易混淆 | 更准确的说法 |\n|---|---|\n| Fourier = Laplace | Fourier 可在 ROC 包含虚轴时视为 Laplace 的虚轴切片 |\n| Z = Laplace 采样 | 更精确的是序列冲激列的 Laplace 变换与 Z 通过 $z=e^{sT}$ 联系 |\n| Z = DFT | Z 的变量是复数；DFT 只在有限个离散频点上工作 |\n| 单位圆 = 所有离散系统 | 单位圆是 DTFT 评价路径，也是稳定性判断中的关键边界 |\n| 极点在左边/圆内就一定稳定 | 对因果有理系统成立；一般情况还要结合 ROC |\n| $z=e^{sT}$ 就等于完整离散化 | 它精确描述模态/极点映射；输入保持方式还需另行规定 |\n| Tustin 不改变频率 | 它保持稳定域映射，但会造成 frequency warping |\n| FFT 是一种新变换 | FFT 是高效计算 DFT 的算法族 |\n\n---\n","resources":[]},{"heading":"19. 一张总表","line":895,"end":907,"text":"## 19. 一张总表\n\n| 对象 | 连续/离散 | 变量 | 关键边界 | 典型作用 |\n|---|---|---|---|---|\n| Fourier transform | 连续 | $\\omega$ | 实频率轴 | 频谱、卷积、PDE |\n| Laplace transform | 连续 | $s=\\sigma+i\\omega$ | 虚轴 | ODE、控制、极点、暂态 |\n| DTFT | 离散 | $\\Omega$ | 单位圆上的角度 | 离散频谱 |\n| Z transform | 离散 | $z=re^{i\\Omega}$ | 单位圆 | 差分方程、数字控制、DSP |\n| DFT | 有限离散数据 | $k$ | 单位圆上的有限采样点 | 数值频谱 |\n| FFT | 算法 | — | — | 快速计算 DFT |\n\n---\n","resources":[]},{"heading":"20. 动手实验","line":908,"end":931,"text":"## 20. 动手实验\n\n运行：\n\n```bash\npython labs/24_transform_family.py\n```\n\n实验观察四件事：\n\n1. 连续一阶稳定极点位于左半平面；\n2. 经过 $z=e^{sT}$ 后落到单位圆内部；\n3. 同一一阶系统的模拟与采样后频率响应如何对应；\n4. bilinear/Tustin 映射如何产生 frequency warping。\n\n建议继续改坏参数：\n\n- 增大采样周期 $T$；\n- 比较 $T\\ll\\tau$ 与 $T\\approx\\tau$；\n- 把模拟频率提高到 Nyquist 附近；\n- 比较 ZOH、impulse invariance 与 bilinear 的差别。\n\n---\n","resources":[]},{"heading":"21. 推荐学习顺序","line":932,"end":971,"text":"## 21. 推荐学习顺序\n\n如果目标是工程/信号/控制：\n\n$$\n\\text{复数}\n\\to\n\\text{Euler}\n\\to\n\\text{ODE}\n\\to\n\\text{Fourier}\n\\to\n\\text{Laplace}\n\\to\n\\text{采样}\n\\to\n\\text{Z}\n\\to\n\\text{极点/零点}\n\\to\n\\text{数字滤波/控制}.\n$$\n\n如果目标是更抽象的数学理解：\n\n$$\n\\text{特征函数/特征模态}\n\\to\n\\text{积分变换}\n\\to\n\\text{卷积代数}\n\\to\n\\text{复分析}\n\\to\n\\text{谱理论/泛函分析}.\n$$\n\n---\n","resources":[]},{"heading":"参考","line":972,"end":987,"text":"## 参考\n\n- MIT OpenCourseWare, RES.6-007 *Signals and Systems*, Lecture 16 — Sampling:  \n  https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-16-sampling/\n- MIT OpenCourseWare, Lecture 20 — The Laplace Transform:  \n  https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-20-the-laplace-transform/\n- MIT OpenCourseWare, Lecture 22 — The z-Transform:  \n  https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-22-the-z-transform/\n- MIT OpenCourseWare, Lecture 23 — Mapping Continuous-Time Filters to Discrete-Time Filters:  \n  https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-23-mapping-continuous-time-filters-to-discrete-time-filters/\n- MIT OpenCourseWare, RES.6-007 readings for Laplace/Z ROC, inverse transforms and bilinear transformation:  \n  https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/pages/readings/\n- SciPy documentation, scipy.signal.bilinear_zpk:  \n  https://docs.scipy.org/doc/scipy/reference/generated/scipy.signal.bilinear_zpk.html\n- Oppenheim, Willsky & Nawab, *Signals and Systems*.\n- Oppenheim & Schafer, *Discrete-Time Signal Processing*.","resources":[{"label":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-16-sampling/","url":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-16-sampling/"},{"label":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-20-the-laplace-transform/","url":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-20-the-laplace-transform/"},{"label":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-22-the-z-transform/","url":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-22-the-z-transform/"},{"label":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-23-mapping-continuous-time-filters-to-discrete-time-filters/","url":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-23-mapping-continuous-time-filters-to-discrete-time-filters/"},{"label":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/pages/readings/","url":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/pages/readings/"},{"label":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.signal.bilinear_zpk.html","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.signal.bilinear_zpk.html"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/bridges/01-transform-family.md"},{"path":"mathematics-changed-the-world/docs/core/01-calculus.md","module":"九个核心专题","role":"数学专题","title":"01｜微积分基本定理：把“变化”和“累积”接成一座桥","sections":[{"heading":"01｜微积分基本定理：把“变化”和“累积”接成一座桥","line":1,"end":4,"text":"# 01｜微积分基本定理：把“变化”和“累积”接成一座桥\n\n> **一句话**：微分问“此刻变化多快”，积分问“这些变化累计起来有多少”；微积分基本定理说明二者本质上是互逆操作。\n","resources":[]},{"heading":"1. 它出现以前，人们卡在哪里？","line":5,"end":15,"text":"## 1. 它出现以前，人们卡在哪里？\n\n古代数学已经能算很多特殊面积和体积。Archimedes 的穷竭法非常接近后来的极限思想，但它仍然依赖针对具体图形的巧妙证明。\n\n到了 16–17 世纪，天文学、弹道学和机械学同时提出两类更一般的问题：\n\n- **切线/速度问题**：曲线在某一点的斜率是多少？物体在某一瞬间速度是多少？\n- **面积/累积问题**：曲线下面积、路程、质量、功、流量怎样从无穷多个小贡献累加出来？\n\nFermat、Cavalieri、Torricelli、Barrow 等人为这些问题分别发展了技巧。Newton 与 Leibniz 在 17 世纪后期把它们系统化；二人独立发展微积分，但思路和记号不同。Newton 更强调运动和“流数”，Leibniz 的 $dx,dy,\\int$ 记号则深刻影响了现代书写。\n","resources":[]},{"heading":"2. 核心公式","line":16,"end":37,"text":"## 2. 核心公式\n\n若 $f$ 连续，定义累积函数\n\n$$\nA(x)=\\int_a^x f(t)\\,dt,\n$$\n\n则\n\n$$\nA'(x)=f(x).\n$$\n\n反过来，若 $F'(x)=f(x)$，则\n\n$$\n\\int_a^b f(x)\\,dx = F(b)-F(a).\n$$\n\n这两条通常合称微积分基本定理。\n","resources":[]},{"heading":"3. 为什么 $A'(x)=f(x)$？","line":38,"end":55,"text":"## 3. 为什么 $A'(x)=f(x)$？\n\n看差商：\n\n$$\n\\frac{A(x+h)-A(x)}{h}\n\\mathrel{=}\n\\frac{1}{h}\\int_x^{x+h}f(t)\\,dt.\n$$\n\n右边就是 $f$ 在很短区间 $[x,x+h]$ 上的平均值。若 $f$ 连续，当 $h\\to0$ 时，这个平均值趋近 $f(x)$，所以\n\n$$\nA'(x)=f(x).\n$$\n\n这段推理看似简单，却揭示了一件非常深的事：**局部信息（瞬时值）和全局信息（累积量）可以互相恢复。**\n","resources":[]},{"heading":"4. 为什么它改变了物理学？","line":56,"end":74,"text":"## 4. 为什么它改变了物理学？\n\nNewton 第二定律可写成\n\n$$\nm\\frac{d^2x}{dt^2}=F(x,t).\n$$\n\n这不是单纯一个“公式”，而是一种世界观：只要知道系统当前状态及局部变化规律，就可以通过微分方程推演未来。\n\n同样：\n\n- 电磁学写成 Maxwell 偏微分方程；\n- 流体写成 Navier–Stokes 方程；\n- 热传导写成 heat equation；\n- 量子力学有 Schrödinger equation；\n- 控制理论研究状态方程；\n- 机器学习用梯度描述损失对参数的局部变化。\n","resources":[]},{"heading":"5. 从 Newton/Leibniz 到严格分析","line":75,"end":88,"text":"## 5. 从 Newton/Leibniz 到严格分析\n\n早期微积分依赖“无穷小量”，非常有效，但逻辑基础并不统一。19 世纪 Cauchy、Weierstrass 等用极限、$\\varepsilon$-$\\delta$ 语言重建分析。之后积分又经历：\n\n$$\n\\text{Riemann 积分}\n\\longrightarrow\n\\text{Lebesgue 积分}\n\\longrightarrow\n\\text{更一般的测度与泛函分析}.\n$$\n\n因此微积分不是 17 世纪结束的故事，而是一条持续数百年的严格化和推广路线。\n","resources":[]},{"heading":"6. 现实应用 › 物理与工程","line":91,"end":93,"text":"### 物理与工程\n速度、加速度、功、能量、连续介质、电磁场、热流、流体。\n","resources":[]},{"heading":"6. 现实应用 › 优化与机器学习","line":94,"end":102,"text":"### 优化与机器学习\n若损失函数为 $L(\\theta)$，梯度\n\n$$\n\\nabla_\\theta L\n$$\n\n告诉我们局部最陡上升方向。梯度下降沿其反方向更新参数。\n","resources":[]},{"heading":"6. 现实应用 › 医学与生物","line":103,"end":105,"text":"### 医学与生物\n药代动力学、人口动力学、神经动力学、血流和扩散模型都依赖微分方程。\n","resources":[]},{"heading":"6. 现实应用 › 金融","line":106,"end":108,"text":"### 金融\n连续复利、随机微分方程、Black–Scholes 类模型建立在微积分与概率的结合上。\n","resources":[]},{"heading":"7. 常见误解","line":109,"end":119,"text":"## 7. 常见误解\n\n**误解 1：微积分是 Newton 或 Leibniz 一个人突然发明的。**  \n更准确的说法是：二人完成了系统化突破，但此前已有漫长前史。\n\n**误解 2：微积分就是“求导公式 + 积分公式”。**  \n真正核心是极限、局部线性化、累积以及连续系统的建模。\n\n**误解 3：所有现实系统都真的连续。**  \n微积分是强大的连续近似语言；现实底层是否连续，是物理问题，不是微积分自动保证的。\n","resources":[]},{"heading":"8. 动手实验","line":120,"end":129,"text":"## 8. 动手实验\n\n运行：\n\n\\`\\`\\`bash\npython labs/01_calculus_accumulation.py\n\\`\\`\\`\n\n观察 $f(x)$ 与其累积函数 $A(x)$ 的关系，并数值验证 $A'(x)\\approx f(x)$。\n","resources":[]},{"heading":"9. 向外延伸","line":130,"end":136,"text":"## 9. 向外延伸\n\n- 微积分 → [Taylor 展开](02-taylor.md)：局部变化进一步变成局部多项式。\n- 微积分 → 微分方程：从“变化率”走向“动力系统”。\n- 微积分 → [散度定理](05-divergence.md)：一维基本定理的高维版本。\n- 微积分 → [Lebesgue 理论](09-lebesgue.md)：解决更复杂的积分和极限交换。\n","resources":[]},{"heading":"参考","line":137,"end":142,"text":"## 参考\n\n- MacTutor, *The rise of calculus*: https://mathshistory.st-andrews.ac.uk/HistTopics/The_rise_of_calculus/\n- MacTutor, Isaac Newton: https://mathshistory.st-andrews.ac.uk/Biographies/Newton/\n- Apostol, *Calculus*.\n- Spivak, *Calculus*.","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/HistTopics/The_rise_of_calculus/","url":"https://mathshistory.st-andrews.ac.uk/HistTopics/The_rise_of_calculus/"},{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Newton/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Newton/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/core/01-calculus.md"},{"path":"mathematics-changed-the-world/docs/core/02-taylor.md","module":"九个核心专题","role":"数学专题","title":"02｜Taylor 展开：把复杂世界局部变成多项式","sections":[{"heading":"02｜Taylor 展开：把复杂世界局部变成多项式","line":1,"end":4,"text":"# 02｜Taylor 展开：把复杂世界局部变成多项式\n\n> **一句话**：只要一个函数在某点足够光滑，我们就可以让一个多项式在该点匹配它的函数值、斜率、曲率以及更高阶变化。\n","resources":[]},{"heading":"1. 前世：为什么需要无穷级数？","line":5,"end":16,"text":"## 1. 前世：为什么需要无穷级数？\n\n17–18 世纪的数学家面对大量“没有初等闭式解”的问题：行星轨道、三角函数、对数、微分方程。一个自然策略是把复杂函数写成\n\n$$\na_0+a_1x+a_2x^2+\\cdots\n$$\n\n因为多项式容易加减、微分、积分和计算。\n\nGregory、Newton、Leibniz、Bernoulli 等都发展过级数方法。Brook Taylor 在 1712 年通信和 1715 年著作中系统给出后来以他命名的展开。Maclaurin 展开只是以 $a=0$ 为中心的 Taylor 展开。\n","resources":[]},{"heading":"2. 公式从哪里来？","line":17,"end":48,"text":"## 2. 公式从哪里来？\n\n希望找一个 $n$ 次多项式\n\n$$\nP_n(x)=c_0+c_1(x-a)+\\cdots+c_n(x-a)^n\n$$\n\n使它在 $x=a$ 处与 $f$ 的前 $n$ 阶导数全部一致：\n\n$$\nP_n^{(k)}(a)=f^{(k)}(a),\\quad k=0,\\dots,n.\n$$\n\n逐阶比较可得\n\n$$\nc_k=\\frac{f^{(k)}(a)}{k!},\n$$\n\n因此\n\n$$\nP_n(x)=\\sum_{k=0}^{n}\\frac{f^{(k)}(a)}{k!}(x-a)^k.\n$$\n\n若余项趋于零，则可以写成无穷级数\n\n$$\nf(x)=\\sum_{k=0}^{\\infty}\\frac{f^{(k)}(a)}{k!}(x-a)^k.\n$$\n","resources":[]},{"heading":"3. 关键不是级数，而是余项","line":49,"end":61,"text":"## 3. 关键不是级数，而是余项\n\nLagrange 型余项：\n\n$$\nR_n(x)=\n\\frac{f^{(n+1)}(\\xi)}{(n+1)!}(x-a)^{n+1}\n$$\n\n其中 $\\xi$ 位于 $a$ 与 $x$ 之间。\n\n这告诉我们：**近似是否可信，取决于下一阶导数和离展开中心有多远。**\n","resources":[]},{"heading":"4. 一个重要反例：光滑 ≠ 可解析","line":62,"end":83,"text":"## 4. 一个重要反例：光滑 ≠ 可解析\n\n有些函数无限次可导，但 Taylor 级数仍不能在邻域中还原原函数。\n\n经典例子：\n\n$$\nf(x)=\n\\begin{cases}\ne^{-1/x^2}, & x\\ne0,\\\\\n0,&x=0.\n\\end{cases}\n$$\n\n它在 $0$ 处所有阶导数都为 0，所以 Taylor 级数恒为 0，但 $x\\ne0$ 时函数并不为 0。\n\n因此：\n\n$$\nC^\\infty \\not\\Rightarrow \\text{analytic}.\n$$\n","resources":[]},{"heading":"5. 为什么现代计算机离不开 Taylor 思想？","line":84,"end":87,"text":"## 5. 为什么现代计算机离不开 Taylor 思想？\n\n计算机原生只能高效执行有限次算术。很多 transcendental function 的高精度算法，都依赖级数、区间化简、逼近理论或与 Taylor 同源的局部多项式思想。\n","resources":[]},{"heading":"5. 为什么现代计算机离不开 Taylor 思想？ › 优化","line":88,"end":99,"text":"### 优化\n二阶局部模型：\n\n$$\nf(x+\\Delta)\n\\approx\nf(x)+\\nabla f(x)^T\\Delta\n+\\frac12\\Delta^TH\\Delta.\n$$\n\n这直接连接 Newton optimization、Hessian、Laplace approximation。\n","resources":[]},{"heading":"5. 为什么现代计算机离不开 Taylor 思想？ › 控制","line":100,"end":108,"text":"### 控制\n非线性系统\n\n$$\n\\dot x=f(x,u)\n$$\n\n在平衡点附近通过 Jacobian 做一阶 Taylor 展开，可以得到线性状态空间模型。\n","resources":[]},{"heading":"5. 为什么现代计算机离不开 Taylor 思想？ › 物理","line":109,"end":111,"text":"### 物理\n“小参数展开”贯穿经典力学、量子力学、场论和天体力学。\n","resources":[]},{"heading":"6. 现实应用","line":112,"end":119,"text":"## 6. 现实应用\n\n- 自动驾驶与机器人：局部线性化动力学；\n- 神经网络：分析损失曲率和优化稳定性；\n- 数值 ODE/PDE：高阶时间步进公式；\n- 工程误差传播；\n- 科学计算中的函数逼近。\n","resources":[]},{"heading":"7. 常见误解","line":120,"end":127,"text":"## 7. 常见误解\n\n**Taylor 级数不是“万能精确展开”。**  \n有限阶 Taylor 是局部近似；无穷 Taylor 是否等于原函数需要额外条件。\n\n**阶数越高不一定数值越好。**  \n浮点误差、消去误差和离中心过远都可能破坏效果。\n","resources":[]},{"heading":"8. 动手实验","line":128,"end":135,"text":"## 8. 动手实验\n\n\\`\\`\\`bash\npython labs/02_taylor_animation.py\n\\`\\`\\`\n\n程序会逐阶增加 $P_1,P_3,P_5,\\dots$，展示多项式如何从展开中心向外逼近 $\\sin x$。\n","resources":[]},{"heading":"9. 向外延伸","line":136,"end":142,"text":"## 9. 向外延伸\n\n- Taylor → Newton 法与凸优化；\n- Taylor → 数值分析中的截断误差；\n- Taylor → 微扰理论；\n- Taylor → 深度学习 Hessian / curvature。\n","resources":[]},{"heading":"参考","line":143,"end":147,"text":"## 参考\n\n- MacTutor, Brook Taylor: https://mathshistory.st-andrews.ac.uk/Biographies/Taylor/\n- Rudin, *Principles of Mathematical Analysis*.\n- Burden & Faires, *Numerical Analysis*.","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Taylor/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Taylor/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/core/02-taylor.md"},{"path":"mathematics-changed-the-world/docs/core/03-euler.md","module":"九个核心专题","role":"数学专题","title":"03｜Euler 公式：复数为什么天然描述旋转与波","sections":[{"heading":"03｜Euler 公式：复数为什么天然描述旋转与波","line":1,"end":4,"text":"# 03｜Euler 公式：复数为什么天然描述旋转与波\n\n> **一句话**：$e^{i\\theta}=\\cos\\theta+i\\sin\\theta$ 把指数增长、圆周旋转、三角函数和复数统一成同一套语言。\n","resources":[]},{"heading":"1. 复数最初不是为了“旋转”","line":5,"end":10,"text":"## 1. 复数最初不是为了“旋转”\n\n16 世纪解三次方程时，即便最终答案是实数，中间步骤也会出现 $\\sqrt{-1}$。Cardano、Bombelli 等逐渐学会操作这些当时被视为“虚构”的量。\n\n之后 de Moivre、Cotes、Euler 等发现：复数不只是代数技巧，它和圆周运动存在极其自然的联系。\n","resources":[]},{"heading":"2. 从幂级数看 Euler 公式","line":11,"end":50,"text":"## 2. 从幂级数看 Euler 公式\n\n指数、余弦、正弦的 Taylor 级数分别为\n\n$$\ne^x\n\\mathrel{=}\n1+x+\\frac{x^2}{2!}+\\frac{x^3}{3!}+\\cdots,\n$$\n\n$$\n\\cos x\n\\mathrel{=}\n1-\\frac{x^2}{2!}+\\frac{x^4}{4!}-\\cdots,\n$$\n\n$$\n\\sin x\n\\mathrel{=}\nx-\\frac{x^3}{3!}+\\frac{x^5}{5!}-\\cdots.\n$$\n\n把 $x$ 换成 $i\\theta$，利用 $i^2=-1$：\n\n$$\ne^{i\\theta}\n\\mathrel{=}\n1+i\\theta-\\frac{\\theta^2}{2!}\n-i\\frac{\\theta^3}{3!}\n+\\frac{\\theta^4}{4!}+\\cdots.\n$$\n\n把实部、虚部分组：\n\n$$\ne^{i\\theta}\n\\mathrel{=}\n\\cos\\theta+i\\sin\\theta.\n$$\n","resources":[]},{"heading":"3. 为什么复乘法就是旋转？","line":51,"end":77,"text":"## 3. 为什么复乘法就是旋转？\n\n写\n\n$$\nz=re^{i\\theta}.\n$$\n\n再乘以\n\n$$\nw=\\rho e^{i\\phi},\n$$\n\n得到\n\n$$\nzw=r\\rho e^{i(\\theta+\\phi)}.\n$$\n\n所以复数乘法同时完成两件事：\n\n- 模长相乘；\n- 角度相加。\n\n特别地，乘 $e^{i\\phi}$ 就是把平面向量旋转 $\\phi$。\n","resources":[]},{"heading":"4. 为什么“波”喜欢复指数？","line":78,"end":105,"text":"## 4. 为什么“波”喜欢复指数？\n\n对\n\n$$\ne^{i\\omega t}\n$$\n\n求导：\n\n$$\n\\frac{d}{dt}e^{i\\omega t}\n\\mathrel{=}\ni\\omega e^{i\\omega t}.\n$$\n\n也就是说，微分不会改变它的“形状”，只乘上一个常数。这使复指数成为线性微分系统天然的特征函数。\n\n因此正弦振动常写为\n\n$$\nA\\cos(\\omega t+\\phi)\n\\mathrel{=}\n\\Re\\{Ae^{i(\\omega t+\\phi)}\\}.\n$$\n\n计算时先在复数域做代数，最后取实部即可。\n","resources":[]},{"heading":"5. Euler 恒等式为什么著名？","line":106,"end":115,"text":"## 5. Euler 恒等式为什么著名？\n\n令 $\\theta=\\pi$：\n\n$$\ne^{i\\pi}+1=0.\n$$\n\n它把 $e,i,\\pi,1,0$ 放进一个极简关系。但其真正价值不是“审美投票”，而是它揭示了多个数学结构之间的统一。\n","resources":[]},{"heading":"6. 现实应用 › 交流电","line":118,"end":120,"text":"### 交流电\n电压和电流用 phasor 表示，把微分方程转成复数代数。\n","resources":[]},{"heading":"6. 现实应用 › 通信","line":121,"end":123,"text":"### 通信\n载波、调制、相位、频谱几乎都以复指数为自然语言。\n","resources":[]},{"heading":"6. 现实应用 › 控制理论","line":124,"end":126,"text":"### 控制理论\n线性系统的特征值可以是复数；实部决定增长/衰减，虚部决定振荡频率。\n","resources":[]},{"heading":"6. 现实应用 › 量子力学","line":127,"end":129,"text":"### 量子力学\n量子态相位和时间演化天然涉及复数 Hilbert space。\n","resources":[]},{"heading":"6. 现实应用 › Fourier","line":130,"end":136,"text":"### Fourier\nFourier transform 的核就是\n\n$$\ne^{-i\\omega t}.\n$$\n","resources":[]},{"heading":"7. 常见误解","line":137,"end":142,"text":"## 7. 常见误解\n\n- “虚数”不是“不真实的数”；它只是扩展了实数系统。\n- 工程中的复数通常不是声称测量量本身是“虚的”，而是把幅值和相位压缩进一个对象。\n- $e^{i\\pi}+1=0$ 很漂亮，但 Euler 公式的技术价值远远大于这一个特例。\n","resources":[]},{"heading":"8. 动手实验","line":143,"end":150,"text":"## 8. 动手实验\n\n\\`\\`\\`bash\npython labs/03_euler_phasor.py\n\\`\\`\\`\n\n观察单位复数 $e^{i\\theta}$ 在复平面旋转，同时比较它在实轴上的投影 $\\cos\\theta$。\n","resources":[]},{"heading":"参考","line":151,"end":155,"text":"## 参考\n\n- MacTutor, Leonhard Euler: https://mathshistory.st-andrews.ac.uk/Biographies/Euler/\n- Needham, *Visual Complex Analysis*.\n- Stein & Shakarchi, *Complex Analysis*.","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Euler/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Euler/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/core/03-euler.md"},{"path":"mathematics-changed-the-world/docs/core/04-fourier.md","module":"九个核心专题","role":"数学专题","title":"04｜Fourier 变换：把“看起来复杂”改写成“由哪些频率组成”","sections":[{"heading":"04｜Fourier 变换：把“看起来复杂”改写成“由哪些频率组成”","line":1,"end":4,"text":"# 04｜Fourier 变换：把“看起来复杂”改写成“由哪些频率组成”\n\n> **一句话**：Fourier 的革命不是“正弦函数很多”，而是发现换到频率坐标后，大量微分、卷积、滤波和传播问题会显著简化。\n","resources":[]},{"heading":"1. 起点其实是热","line":5,"end":18,"text":"## 1. 起点其实是热\n\nJoseph Fourier 研究一根金属杆如何传热，得到热方程\n\n$$\n\\frac{\\partial u}{\\partial t}\n\\mathrel{=}\n\\alpha\\frac{\\partial^2u}{\\partial x^2}.\n$$\n\n为了求解，他把初始温度分布写成正弦/余弦的叠加。今天看来这是“标准方法”，当时却极具争议：**一个带尖角、甚至不连续的函数，怎么能由光滑三角波叠加出来？**\n\n这个问题反过来推动了函数概念、收敛理论、Riemann 积分和 Lebesgue 积分的发展。\n","resources":[]},{"heading":"2. Fourier 级数","line":19,"end":39,"text":"## 2. Fourier 级数\n\n对周期 $2\\pi$ 的函数，可尝试\n\n$$\nf(x)\n\\sim\n\\frac{a_0}{2}\n+\n\\sum_{n=1}^{\\infty}\n(a_n\\cos nx+b_n\\sin nx).\n$$\n\n系数来自正交性，例如\n\n$$\na_n=\\frac1\\pi\\int_{-\\pi}^{\\pi}f(x)\\cos(nx)\\,dx.\n$$\n\n本质上是在无限维函数空间里做“投影”。\n","resources":[]},{"heading":"3. Fourier 变换","line":40,"end":62,"text":"## 3. Fourier 变换\n\n非周期情形下，离散频率变为连续频率：\n\n$$\nF(\\omega)\n\\mathrel{=}\n\\int_{-\\infty}^{\\infty}\nf(t)e^{-i\\omega t}\\,dt.\n$$\n\n逆变换在一种常见归一化下：\n\n$$\nf(t)\n\\mathrel{=}\n\\frac{1}{2\\pi}\n\\int_{-\\infty}^{\\infty}\nF(\\omega)e^{i\\omega t}\\,d\\omega.\n$$\n\n不同教材会把 $2\\pi$ 放在不同位置，思想不变。\n","resources":[]},{"heading":"4. Fourier、Laplace 与 Z：同一族复指数变换","line":63,"end":66,"text":"## 4. Fourier、Laplace 与 Z：同一族复指数变换\n\n这三种变换确实有统一结构，但“同源”要说得更精确：它们都利用复指数把信号或系统改写到更适合分析的坐标中；真正区分它们的是**连续/离散时间、复变量所在的平面，以及收敛域（ROC）**。下面统一使用数学记号 $i=\\sqrt{-1}$；电气工程教材常写 $j$。\n","resources":[]},{"heading":"4. Fourier、Laplace 与 Z：同一族复指数变换 › Fourier：沿实频率轴观察连续时间信号","line":67,"end":77,"text":"### Fourier：沿实频率轴观察连续时间信号\n\n$$\nX_F(\\omega)\n\\mathrel{=}\n\\int_{-\\infty}^{\\infty}\nx(t)e^{-i\\omega t}\\,dt.\n$$\n\n这里 $\\omega\\in\\mathbb R$。Fourier 变换直接描述频率组成，但普通积分形式要求相应的收敛条件；更一般的信号还可以在 $L^2$ 或分布意义下讨论。\n","resources":[]},{"heading":"4. Fourier、Laplace 与 Z：同一族复指数变换 › Laplace：把频率轴扩展到复 $s$ 平面","line":78,"end":108,"text":"### Laplace：把频率轴扩展到复 $s$ 平面\n\n双边 Laplace 变换写作\n\n$$\nX_L(s)\n\\mathrel{=}\n\\int_{-\\infty}^{\\infty}\nx(t)e^{-st}\\,dt,\n\\qquad\ns=\\sigma+i\\omega.\n$$\n\n因为\n\n$$\ne^{-st}\n=\ne^{-\\sigma t}e^{-i\\omega t},\n$$\n\n所以对固定的 $\\sigma$，Laplace 变换可以看成对指数加权信号 $x(t)e^{-\\sigma t}$ 做 Fourier 变换。只有当 Laplace 的收敛域包含虚轴 $\\sigma=0$ 时，才可以写\n\n$$\nX_F(\\omega)\n=\nX_L(i\\omega).\n$$\n\n因此“Fourier 是 Laplace 在虚轴上的切片”是一个**带 ROC 条件的关系**，不是无条件恒等式。\n","resources":[]},{"heading":"4. Fourier、Laplace 与 Z：同一族复指数变换 › Z：把离散时间 Fourier 从单位圆扩展到整个复 $z$ 平面","line":109,"end":139,"text":"### Z：把离散时间 Fourier 从单位圆扩展到整个复 $z$ 平面\n\n双边 Z 变换为\n\n$$\nX_Z(z)\n\\mathrel{=}\n\\sum_{n=-\\infty}^{\\infty}\nx[n]z^{-n},\n\\qquad\nz=re^{i\\Omega}.\n$$\n\n由于\n\n$$\nz^{-n}\n=\nr^{-n}e^{-i\\Omega n},\n$$\n\nZ 变换可以看成对指数加权序列 $x[n]r^{-n}$ 做离散时间 Fourier 分析。当 Z 变换的 ROC 包含单位圆 $|z|=1$ 时，\n\n$$\nX_{\\mathrm{DTFT}}(\\Omega)\n=\nX_Z(e^{i\\Omega}).\n$$\n\n这也是为什么单位圆在数字信号处理中如此重要。注意 **Z 变换不是 DFT**：DFT 处理有限长度数据并只取有限个离散频率点，而 Z 变换的自变量 $z$ 是复数，通常还必须连同 ROC 一起指定。\n","resources":[]},{"heading":"4. Fourier、Laplace 与 Z：同一族复指数变换 › 连续系统与离散系统之间：$z=e^{sT}$","line":140,"end":165,"text":"### 连续系统与离散系统之间：$z=e^{sT}$\n\n若以采样周期 $T$ 观察连续时间模态 $e^{st}$，采样后得到\n\n$$\ne^{snT}\n=\n\\left(e^{sT}\\right)^n.\n$$\n\n因此连续时间极点/指数模态与离散时间极点之间自然出现映射\n\n$$\nz=e^{sT}\n=\ne^{\\sigma T}e^{i\\omega T}.\n$$\n\n它把：\n\n- $s$ 平面的虚轴 $\\sigma=0$ 映到 $z$ 平面的单位圆；\n- 左半平面 $\\sigma\u003c0$ 映到单位圆内部；\n- 右半平面 $\\sigma>0$ 映到单位圆外部。\n\n但这不意味着“Z 变换就是把 Laplace 变换简单采样一下”。从连续系统构造离散系统还涉及具体离散化方法；而且 $e^{i(\\omega+2\\pi/T)T}=e^{i\\omega T}$，所以该映射在虚部方向是周期的，采样频率与混叠仍必须单独处理。\n","resources":[]},{"heading":"4. Fourier、Laplace 与 Z：同一族复指数变换 › ROC 为什么不能省略？","line":166,"end":182,"text":"### ROC 为什么不能省略？\n\n对 Laplace 与 Z 变换，同一个代数表达式可能对应不同的时域信号，区别就在 ROC。对 LTI 系统的冲激响应而言：\n\n- 连续时间系统稳定时，其 Laplace ROC 必须包含虚轴；对因果有理系统，这等价于全部极点位于左半平面；\n- 离散时间系统稳定时，其 Z 变换 ROC 必须包含单位圆；对因果有理系统，这等价于全部极点位于单位圆内部。\n\n所以极点图、ROC、频率响应并不是三件互不相关的工具，而是同一变换结构的不同视角。\n\n| 变换 | 时间变量 | 变换变量 | Fourier 关系 | 常见工程用途 |\n|---|---|---|---|---|\n| Fourier | 连续 $t$ | $\\omega\\in\\mathbb R$ | 本体 | 频谱、滤波、PDE、成像 |\n| Laplace | 连续 $t$ | $s=\\sigma+i\\omega$ | ROC 含虚轴时取 $s=i\\omega$ | 微分方程、连续控制、极点稳定性 |\n| Z | 离散 $n$ | $z=re^{i\\Omega}$ | ROC 含单位圆时取 $z=e^{i\\Omega}$ 得 DTFT | 数字滤波、差分方程、离散控制 |\n\n更系统的双边/单边变换、同一代数式的不同 ROC、采样脉冲列、ZOH、impulse invariance、bilinear/Tustin、生成函数和概率论连接，见 [Fourier–Laplace–Z 专题桥梁](../bridges/01-transform-family.md)。\n","resources":[]},{"heading":"5. 为什么变换之后更好算？ › 微分变乘法","line":185,"end":194,"text":"### 微分变乘法\n\n$$\n\\mathcal F\\{f'(t)\\}\n\\mathrel{=}\ni\\omega F(\\omega).\n$$\n\n原本的微分运算变成乘法。\n","resources":[]},{"heading":"5. 为什么变换之后更好算？ › 卷积变乘法","line":195,"end":204,"text":"### 卷积变乘法\n\n$$\n\\mathcal F\\{f*g\\}\n\\mathrel{=}\nF(\\omega)G(\\omega).\n$$\n\n因此线性时不变系统、滤波、模糊、响应都可以在频域中高效分析。\n","resources":[]},{"heading":"6. DFT 与 FFT 不要混 › DFT","line":207,"end":217,"text":"### DFT\n对有限序列 $x_0,\\dots,x_{N-1}$ 定义\n\n$$\nX_k=\n\\sum_{n=0}^{N-1}\nx_n e^{-2\\pi i kn/N}.\n$$\n\n直接计算约需 $O(N^2)$ 运算。\n","resources":[]},{"heading":"6. DFT 与 FFT 不要混 › FFT","line":218,"end":226,"text":"### FFT\nFFT 是一族快速计算 DFT 的算法，把典型复杂度降到约\n\n$$\nO(N\\log N).\n$$\n\n**Fourier transform 是数学对象，DFT 是离散版本，FFT 是算法。**\n","resources":[]},{"heading":"7. 现实应用 › 音频","line":229,"end":231,"text":"### 音频\n频谱分析、均衡器、去噪、声纹。\n","resources":[]},{"heading":"7. 现实应用 › 通信","line":232,"end":234,"text":"### 通信\nOFDM、频谱分配、调制解调、信道估计。\n","resources":[]},{"heading":"7. 现实应用 › 图像","line":235,"end":237,"text":"### 图像\n低频常描述大尺度结构，高频常包含边缘和细节。\n","resources":[]},{"heading":"7. 现实应用 › MRI","line":238,"end":240,"text":"### MRI\nMRI 采集的数据天然处于 k-space；图像重建与 Fourier 变换紧密相关。\n","resources":[]},{"heading":"7. 现实应用 › 光学与晶体学","line":241,"end":243,"text":"### 光学与晶体学\n衍射图样与空间结构之间具有 Fourier 关系。\n","resources":[]},{"heading":"7. 现实应用 › PDE","line":244,"end":246,"text":"### PDE\n频域把某些偏微分方程化成代数方程或常微分方程。\n","resources":[]},{"heading":"8. 从 Fourier 到现代 AI","line":247,"end":252,"text":"## 8. 从 Fourier 到现代 AI\n\n卷积神经网络背后的 convolution theorem、spectral convolution、位置编码中的不同频率、神经场的 frequency bias，都能看到 Fourier 思想的影子。\n\n不过“Transformer 就是 Fourier”并不准确：Transformer 的核心是基于数据的 token-to-token 加权交互，而不是固定正弦基分解。\n","resources":[]},{"heading":"9. 动手实验","line":253,"end":260,"text":"## 9. 动手实验\n\n\\`\\`\\`bash\npython labs/04_fourier_decomposition.py\n\\`\\`\\`\n\n程序构造多频率信号，并比较时域波形与 FFT 频谱。\n","resources":[]},{"heading":"10. 向外延伸","line":261,"end":264,"text":"## 10. 向外延伸\n\nFourier → Lebesgue → $L^2$ Hilbert space → 泛函分析 → 小波 → 现代信号处理。\n","resources":[]},{"heading":"参考","line":265,"end":272,"text":"## 参考\n\n- MacTutor, Joseph Fourier: https://mathshistory.st-andrews.ac.uk/Biographies/Fourier/\n- Stanford EE261: https://see.stanford.edu/Course/EE261\n- MIT OpenCourseWare RES.6-007, Lecture 20 — The Laplace Transform: https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-20-the-laplace-transform/\n- MIT OpenCourseWare RES.6-007, Lecture 22 — The z-Transform: https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-22-the-z-transform/\n- MIT OpenCourseWare RES.6-007, Lecture 23 — Mapping Continuous-Time Filters to Discrete-Time Filters: https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-23-mapping-continuous-time-filters-to-discrete-time-filters/\n- Oppenheim & Willsky, *Signals and Systems*.","resources":[{"label":"https://mathshistory.st-andrews.ac.uk/Biographies/Fourier/","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Fourier/"},{"label":"https://see.stanford.edu/Course/EE261","url":"https://see.stanford.edu/Course/EE261"},{"label":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-20-the-laplace-transform/","url":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-20-the-laplace-transform/"},{"label":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-22-the-z-transform/","url":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-22-the-z-transform/"},{"label":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-23-mapping-continuous-time-filters-to-discrete-time-filters/","url":"https://ocw.mit.edu/courses/res-6-007-signals-and-systems-spring-2011/resources/lecture-23-mapping-continuous-time-filters-to-discrete-time-filters/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/core/04-fourier.md"},{"path":"mathematics-changed-the-world/docs/core/05-divergence.md","module":"九个核心专题","role":"数学专题","title":"05｜散度定理：内部发生了什么，可以从边界看出来","sections":[{"heading":"05｜散度定理：内部发生了什么，可以从边界看出来","line":1,"end":4,"text":"# 05｜散度定理：内部发生了什么，可以从边界看出来\n\n> **一句话**：一个区域里所有微小“源和汇”的总和，等于穿过这个区域边界的净通量。\n","resources":[]},{"heading":"1. 核心公式","line":5,"end":19,"text":"## 1. 核心公式\n\n设 $\\Omega\\subset\\mathbb R^3$，边界为 $\\partial\\Omega$，向量场 $\\mathbf F$ 足够光滑：\n\n$$\n\\iiint_{\\Omega}\n\\nabla\\cdot\\mathbf F\\,dV\n\\mathrel{=}\n\\iint_{\\partial\\Omega}\n\\mathbf F\\cdot\\mathbf n\\,dS.\n$$\n\n左边：内部每一点的散度累积。  \n右边：穿过外边界的净流量。\n","resources":[]},{"heading":"2. 散度到底是什么？","line":20,"end":45,"text":"## 2. 散度到底是什么？\n\n若\n\n$$\n\\mathbf F=(F_x,F_y,F_z),\n$$\n\n则\n\n$$\n\\nabla\\cdot\\mathbf F\n\\mathrel{=}\n\\frac{\\partial F_x}{\\partial x}\n+\n\\frac{\\partial F_y}{\\partial y}\n+\n\\frac{\\partial F_z}{\\partial z}.\n$$\n\n它衡量一个极小体积附近是“净流出”还是“净流入”。\n\n- 正散度：像源；\n- 负散度：像汇；\n- 零散度：局部没有净产生或消失。\n","resources":[]},{"heading":"3. 为什么定理会成立？","line":46,"end":58,"te
