n同一个现实问题经过不同建模，可能落入完全不同的类别，因此问题分类本身就是算法选择的一部分。\n","resources":[]},{"heading":"3. 第二层：凸集","line":57,"end":66,"text":"## 3. 第二层：凸集\n\n集合 $C$ 是凸集，如果对任意 $x,y\\in C$ 与 $0\\le\\theta\\le1$，\n\n$$\n\\theta x+(1-\\theta)y\\in C.\n$$\n\n几何直觉：集合中任意两点之间的整条线段仍留在集合内。\n","resources":[]},{"heading":"3. 第二层：凸集 › 必会例子","line":67,"end":82,"text":"### 必会例子\n\n通常是凸集：\n\n- 仿射空间；\n- 半空间；\n- 范数球；\n- 多面体；\n- 半正定锥。\n\n典型非凸结构：\n\n- 两个彼此分离区域的并集；\n- 单位球面 $\\{x:\\|x\\|_2=1\\}$；\n- 一般整数点集合。\n","resources":[]},{"heading":"3. 第二层：凸集 › 自检","line":83,"end":86,"text":"### 自检\n\n不要把“边界弯曲”与“非凸”等同。圆盘是凸的，圆周不是凸的。\n","resources":[]},{"heading":"4. 第三层：凸函数","line":87,"end":98,"text":"## 4. 第三层：凸函数\n\n函数 $f$ 在凸定义域上是凸函数，如果\n\n$$\nf(\\theta x+(1-\\theta)y)\n\\le\n\\theta f(x)+(1-\\theta)f(y).\n$$\n\n直观上，弦在函数图像之上。\n","resources":[]},{"heading":"4. 第三层：凸函数 › 可微函数的一阶判别","line":99,"end":108,"text":"### 可微函数的一阶判别\n\n对可微凸函数，\n\n$$\nf(y)\\ge f(x)+\\nabla f(x)^T(y-x).\n$$\n\n因此切平面是一个全局下界，这也是许多一阶算法能够工作的几何基础。\n","resources":[]},{"heading":"4. 第三层：凸函数 › 二阶判别","line":109,"end":120,"text":"### 二阶判别\n\n在相应可微性与凸定义域条件下，\n\n$$\n\\nabla^2 f(x)\\succeq 0\n$$\n\n是凸性的核心二阶判据。\n\n需要特别记住：Hessian 判据有前提。不要把“某一点 Hessian 半正定”误写成“函数全局凸”。\n","resources":[]},{"heading":"5. 第四层：范数、梯度、Hessian › 范数","line":123,"end":132,"text":"### 范数\n\n范数用于表达“大小”或“距离尺度”。优化中高频出现：\n\n- $\\ell_1$：稀疏建模；\n- $\\ell_2$：欧氏几何、least squares；\n- $\\ell_\\infty$：最大偏差；\n- Frobenius norm：矩阵误差；\n- nuclear norm：低秩凸松弛。\n","resources":[]},{"heading":"5. 第四层：范数、梯度、Hessian › 梯度","line":133,"end":138,"text":"### 梯度\n\n梯度回答：在当前点附近，哪个方向让函数增长最快？\n\n负梯度因此给出最基本的下降方向。\n","resources":[]},{"heading":"5. 第四层：范数、梯度、Hessian › Hessian","line":139,"end":149,"text":"### Hessian\n\nHessian 描述局部曲率。它同时进入：\n\n- 凸性判断；\n- Newton 法；\n- conditioning；\n- 二阶 Taylor 模型。\n\n这也是本知识库 [Taylor 展开](../../core/02-taylor.md) 与 [凸优化](../../branches/19-convex-optimization.md) 的直接连接点。\n","resources":[]},{"heading":"6. 第五层：为什么要学数值代数？","line":150,"end":153,"text":"## 6. 第五层：为什么要学数值代数？\n\n优化算法的“数学公式”最终要变成矩阵计算。\n","resources":[]},{"heading":"6. 第五层：为什么要学数值代数？ › 线性方程组","line":154,"end":163,"text":"### 线性方程组\n\nNewton 类算法的核心步骤常形如\n\n$$\nH_k p_k=-g_k.\n$$\n\n这里不是“求逆矩阵”三个字就结束了：实际计算需要选择合适的线性系统求解方法。\n","resources":[]},{"heading":"6. 第五层：为什么要学数值代数？ › 矩阵分解","line":164,"end":173,"text":"### 矩阵分解\n\n需要建立以下基本对应：\n\n- LU：一般线性系统；\n- Cholesky：对称正定系统；\n- QR：least squares；\n- eigen-decomposition：谱结构；\n- SVD：秩、伪逆、低秩近似、conditioning。\n","resources":[]},{"heading":"6. 第五层：为什么要学数值代数？ › 条件数","line":174,"end":189,"text":"### 条件数\n\n同一个数学问题，数值条件差时可能出现：\n\n- 小输入误差被放大；\n- 迭代显著变慢；\n- 理论上合理的停止准则在浮点计算中表现不佳。\n\n所以优化学习必须同时问：\n\n> 这个算法收敛吗？\n\n以及：\n\n> 这个线性代数步骤算得稳吗？\n","resources":[]},{"heading":"7. 本单元实验","line":190,"end":204,"text":"## 7. 本单元实验\n\n运行：\n\n```bash\npython labs/13_optimization_convexity.py\n```\n\n实验包含两个部分：\n\n1. 对 PSD 二次函数与不定二次函数随机检查凸性不等式；\n2. 比较不同条件数二次问题上的梯度下降收敛。\n\n实验不是凸性的证明。它的用途是把“凸性”和“conditioning”变成可观察现象。\n","resources":[]},{"heading":"7. 本单元实验 › 故意破坏条件","line":205,"end":214,"text":"### 故意破坏条件\n\n至少改一次：\n\n- 把 PSD 矩阵改成含负特征值；\n- 把梯度下降步长改大到超过稳定范围；\n- 把条件数从 $10$ 提高到 $10^4$。\n\n观察“理论条件变化 → 数值行为变化”。\n","resources":[]},{"heading":"8. 练习 › 练习 1｜分类","line":217,"end":220,"text":"### 练习 1｜分类\n\n分别判断 least squares、LASSO、0-1 整数规划、神经网络训练属于哪些类别。不要只写“凸/非凸”，至少从三个分类维度回答。\n","resources":[]},{"heading":"8. 练习 › 练习 2｜凸集","line":221,"end":230,"text":"### 练习 2｜凸集\n\n证明半空间\n\n$$\nC=\\{x:a^Tx\\le b\\}\n$$\n\n是凸集。\n","resources":[]},{"heading":"8. 练习 › 练习 3｜非例","line":231,"end":240,"text":"### 练习 3｜非例\n\n证明单位球面\n\n$$\nS=\\{x:\\|x\\|_2=1\\}\n$$\n\n一般不是凸集。\n","resources":[]},{"heading":"8. 练习 › 练习 4｜一阶条件","line":241,"end":250,"text":"### 练习 4｜一阶条件\n\n对\n\n$$\nf(x)=\\frac12 x^TQx+b^Tx+c\n$$\n\n计算梯度，并说明 $Q\\succeq0$ 时一阶凸性条件为什么成立。\n","resources":[]},{"heading":"8. 练习 › 练习 5｜数值代数选择","line":251,"end":258,"text":"### 练习 5｜数值代数选择\n\n给出以下任务更自然的分解/工具，并解释原因：\n\n- 对称正定 Newton 系统；\n- 过定线性 least-squares；\n- 低秩矩阵近似。\n","resources":[]},{"heading":"8. 练习 › 练习 6｜概念边界","line":259,"end":265,"text":"### 练习 6｜概念边界\n\n解释下面两句话为什么不同：\n\n1. “这个算法理论上收敛。”\n2. “这个实现数值稳定而且收敛得快。”\n","resources":[]},{"heading":"9. 完成检查","line":266,"end":278,"text":"## 9. 完成检查\n\n能不看资料回答以下问题，才进入 Unit 02：\n\n- 什么是可行域？\n- 凸集和仿射集有什么关系？\n- 可微凸函数的一阶条件是什么？\n- Hessian 半正定的结论需要哪些限定？\n- 为什么 LASSO 常出现 $\\ell_1$？\n- 为什么 Newton 法离不开数值线性代数？\n- condition number 对优化计算意味着什么？\n\n下一单元：[Unit 02｜优化建模与典型问题](02-modeling.md)","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/01-foundations.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/02-modeling.md","module":"最优化课程","role":"课程与讲义","title":"Unit 02｜优化建模与典型优化问题","sections":[{"heading":"Unit 02｜优化建模与典型优化问题","line":1,"end":8,"text":"# Unit 02｜优化建模与典型优化问题\n\n> 对应电子讲义：05 优化建模、06 典型优化问题。\n>\n> 对应教材：第 3 章“优化建模”、第 4 章“典型优化问题”。\n>\n> 本页依据教材的建模框架重新组织为学习单元，不复刻教材正文。\n","resources":[]},{"heading":"1. 本单元的核心问题","line":9,"end":23,"text":"## 1. 本单元的核心问题\n\nUnit 01 解决“什么是优化问题、什么是凸性”。Unit 02 要回答更实际的问题：\n\n> 一个现实问题，怎样变成一个值得求解的优化模型？\n\n教材把建模看成从现实需求到数学对象的过程。真正需要决定的不是“套哪个公式”，而是：\n\n1. 决策变量是什么；\n2. 什么量应该被最小化或最大化；\n3. 哪些条件必须满足；\n4. 是否需要正则化、松弛或变量变换；\n5. 得到的模型属于哪一类优化问题；\n6. 这种模型是否保留了原问题真正重要的结构。\n","resources":[]},{"heading":"2. 建模语法","line":24,"end":52,"text":"## 2. 建模语法\n\n把一个模型拆成四层：\n\n```text\n现实问题\n→ 决策变量\n→ 目标函数\n→ 可行域 / 约束\n→ 问题类别\n```\n\n一个常见形式是\n\n$$\n\\min_x \\; L(x)+\\lambda R(x)\n\\quad\n\\text{s.t. }x\\in X.\n$$\n\n其中：\n\n- $L(x)$：数据误差、代价、负收益或其他任务损失；\n- $R(x)$：先验结构或正则项；\n- $\\lambda$：平衡任务拟合与结构偏好的参数；\n- $X$：物理、几何、逻辑或资源约束。\n\n学习任何模型时都要逐项解释这四个部分，而不是只记最终公式。\n","resources":[]},{"heading":"3. 目标函数的六种常见设计思路","line":53,"end":56,"text":"## 3. 目标函数的六种常见设计思路\n\n教材第 3.1 节依次讨论了多种目标函数设计方式。\n","resources":[]},{"heading":"3. 目标函数的六种常见设计思路 › 3.1 最小二乘","line":57,"end":86,"text":"### 3.1 最小二乘\n\n当观测关系近似为\n\n$$\nb_i=\\phi_i(x)+\\varepsilon_i,\n$$\n\n最小二乘模型为\n\n$$\n\\min_x \\sum_i \\bigl(b_i-\\phi_i(x)\\bigr)^2.\n$$\n\n关键点不是“平方”本身，而是你选择了 $\\ell_2$ 型误差度量。\n\n如果换成\n\n$$\n\\sum_i |b_i-\\phi_i(x)|,\n$$\n\n或者\n\n$$\n\\max_i |b_i-\\phi_i(x)|,\n$$\n\n得到的是不同的建模假设与不同的问题结构。\n","resources":[]},{"heading":"3. 目标函数的六种常见设计思路 › 3.2 正则化","line":87,"end":106,"text":"### 3.2 正则化\n\n正则化把“希望解具有某种结构”写进目标函数。\n\n典型例子：\n\n$$\n\\frac12\\|Ax-b\\|_2^2+\\mu\\|x\\|_2^2\n$$\n\n偏向较小的参数范数；而\n\n$$\n\\frac12\\|Ax-b\\|_2^2+\\mu\\|x\\|_1\n$$\n\n对应 LASSO，利用 $\\ell_1$ 项鼓励稀疏结构。\n\n对于矩阵变量，核范数常用于低秩结构的凸松弛。\n","resources":[]},{"heading":"3. 目标函数的六种常见设计思路 › 3.3 最大似然估计","line":107,"end":116,"text":"### 3.3 最大似然估计\n\n当数据被认为来自参数化概率模型 $p(a;x)$ 时，可通过最大化似然或对数似然估计参数。\n\n教材明确给出一个重要的条件化关系：\n\n> 在线性回归中，当误差假设为高斯白噪声时，最小二乘解与最大似然解对应。\n\n这个结论依赖噪声模型，不能无条件推广为“最小二乘总是最大似然”。\n","resources":[]},{"heading":"3. 目标函数的六种常见设计思路 › 3.4 代价、损失与收益","line":117,"end":126,"text":"### 3.4 代价、损失与收益\n\n运筹、机器学习和强化学习中，目标函数常直接来自：\n\n- cost；\n- loss；\n- reward。\n\n这类模型最重要的是确认“目标函数数值变好”是否真的等价于现实任务变好。\n","resources":[]},{"heading":"3. 目标函数的六种常见设计思路 › 3.5 泛函与变分","line":127,"end":132,"text":"### 3.5 泛函与变分\n\n物理和工程中的能量极小化问题常首先定义在函数空间上，再通过离散化转化为有限维优化问题。\n\n因此“离散化”不只是数值实现细节：不同离散方式可能产生不同的有限维目标函数。\n","resources":[]},{"heading":"3. 目标函数的六种常见设计思路 › 3.6 松弛","line":133,"end":147,"text":"### 3.6 松弛\n\n原问题难以求解时，可以用更容易处理的对象替代困难结构。\n\n教材的典型例子包括：\n\n- $\\ell_0 \\rightarrow \\ell_1$；\n- rank $\\rightarrow$ nuclear norm。\n\n必须保留的边界是：\n\n> 松弛后的问题一般不与原问题自动等价；等价或恢复原解通常需要额外条件。\n\n这条规则对后面的稀疏恢复、低秩恢复和 phase lift 都很重要。\n","resources":[]},{"heading":"4. 约束的三种来源 › 4.1 问题本身的物理或结构性质","line":150,"end":161,"text":"### 4.1 问题本身的物理或结构性质\n\n例如：\n\n- 非负性；\n- 预算/资源限制；\n- 正交性；\n- 微分方程约束；\n- 正定/半正定约束。\n\n这类约束来自问题本身，不能为了算法方便随意删除。\n","resources":[]},{"heading":"4. 约束的三种来源 › 4.2 等价转换","line":162,"end":181,"text":"### 4.2 等价转换\n\n通过引入辅助变量，把一个复杂表达拆开。\n\n例如\n\n$$\n\\min_x h(x)+r(x)\n$$\n\n可引入 $y$ 与约束 $x=y$，写成\n\n$$\n\\min_{x,y} h(x)+r(y)\n\\quad\n\\text{s.t. }x=y.\n$$\n\n后面的 ADMM 就会大量使用这种结构。\n","resources":[]},{"heading":"4. 约束的三种来源 › 4.3 约束松弛","line":182,"end":191,"text":"### 4.3 约束松弛\n\n把难约束替换为更容易处理、但可行域更大的约束。\n\n此时必须问：\n\n- 新可行域扩大了多少？\n- 是否丢失关键结构？\n- 松弛解怎样映射回原问题？\n","resources":[]},{"heading":"5. 教材中的模型地图","line":192,"end":211,"text":"## 5. 教材中的模型地图\n\n教材第 3 章把建模方法放进多类实际问题。\n\n| 模型 | 主要建模思想 | 典型结构 |\n|---|---|---|\n| 线性回归 | least squares / MLE / regularization | $Ax\\approx b$ |\n| LASSO | 数据拟合 + $\\ell_1$ 正则 | 稀疏参数 |\n| logistic regression | 最大似然 + 正则化 | 分类概率 |\n| SVM | margin / loss + 约束或罚函数 | 二分类 |\n| 概率图模型 | likelihood + 稀疏精度矩阵 | 正定矩阵 |\n| phase retrieval | least squares / lifting / relaxation | 二次观测 |\n| PCA | 最大投影方差或最小重构误差 | 正交约束 |\n| matrix separation | low-rank + sparse | 核范数 + $\\ell_1$ |\n| dictionary learning | reconstruction + sparsity | 双变量矩阵模型 |\n| K-means | 组内距离平方和 | 离散分配 |\n| TV imaging | data fidelity + TV regularization | 非光滑复合模型 |\n| wavelet model | 变换域稀疏 | $\\ell_1$ 小波系数 |\n| reinforcement learning | 累积 reward / MDP | 随机动态决策 |\n","resources":[]},{"heading":"6. 几个必须真正理解的模型 › 6.1 线性回归：误差模型决定损失","line":214,"end":235,"text":"### 6.1 线性回归：误差模型决定损失\n\n线性观测\n\n$$\nb=Ax+\\varepsilon\n$$\n\n并不能唯一决定损失函数。\n\n若使用平方误差：\n\n$$\n\\min_x \\frac12\\|Ax-b\\|_2^2.\n$$\n\n如果误差分布或鲁棒性要求改变，可以得到 $\\ell_1$ 残差等其他模型。\n\n因此：\n\n> “数据相同”并不意味着“优化模型唯一”。\n","resources":[]},{"heading":"6. 几个必须真正理解的模型 › 6.2 LASSO：把稀疏性写进模型","line":236,"end":246,"text":"### 6.2 LASSO：把稀疏性写进模型\n\n$$\n\\min_x\n\\frac12\\|Ax-b\\|_2^2+\\mu\\|x\\|_1.\n$$\n\n第一项要求拟合数据；第二项要求参数具有稀疏结构。\n\n$\\mu$ 不是纯算法参数，而是**模型权衡参数**。改变它，就是改变对“拟合”和“稀疏”的相对重视程度。\n","resources":[]},{"heading":"6. 几个必须真正理解的模型 › 6.3 Logistic regression：概率模型变成凸优化","line":247,"end":261,"text":"### 6.3 Logistic regression：概率模型变成凸优化\n\n对于二分类，教材由条件概率模型构造对数似然，并得到 logistic loss。\n\n需要能解释：\n\n```text\n概率假设\n→ likelihood\n→ log-likelihood\n→ optimization objective\n```\n\n这是“统计建模 → 优化”的经典桥梁。\n","resources":[]},{"heading":"6. 几个必须真正理解的模型 › 6.4 SVM：几何间隔变成优化约束","line":262,"end":271,"text":"### 6.4 SVM：几何间隔变成优化约束\n\nSVM 从“找到分类超平面，并让样本离超平面尽量远”出发，经缩放和等价转换得到二次目标 + 线性约束的模型。\n\n软间隔版本再通过松弛变量允许部分分类违反。\n\n因此 SVM 展示的是：\n\n> 几何需求 → margin → 约束 → penalty。\n","resources":[]},{"heading":"6. 几个必须真正理解的模型 › 6.5 Phase retrieval：提升与松弛","line":272,"end":280,"text":"### 6.5 Phase retrieval：提升与松弛\n\n相位恢复原始观测含二次关系。教材展示两条路线：\n\n- 非线性 least-squares；\n- lifting：令 $X=xx^*$，把二次关系转成矩阵上的线性关系，再处理 rank-1 结构。\n\n进一步用核范数/迹等凸结构做松弛时，必须保留“恢复需要条件”的限定。\n","resources":[]},{"heading":"6. 几个必须真正理解的模型 › 6.6 PCA：两个表面不同的目标可等价","line":281,"end":293,"text":"### 6.6 PCA：两个表面不同的目标可等价\n\nPCA 可以从：\n\n- 最大化投影后的方差；\n- 最小化重构误差；\n\n两个角度建立模型。\n\n这是非常重要的建模经验：\n\n> 两个不同的现实解释，可能导出等价优化问题。\n","resources":[]},{"heading":"6. 几个必须真正理解的模型 › 6.7 低秩 + 稀疏分解","line":294,"end":313,"text":"### 6.7 低秩 + 稀疏分解\n\n矩阵分离把观测矩阵表示成：\n\n$$\nM=X+S,\n$$\n\n其中 $X$ 希望低秩，$S$ 希望稀疏。\n\n困难的 rank 与 $\\ell_0$ 结构可分别用核范数和 $\\ell_1$ 做凸松弛。\n\n这里要同时看懂：\n\n- 模型结构；\n- 松弛结构；\n- 算法结构。\n\n三者不是同一个层次。\n","resources":[]},{"heading":"7. 第 4 章：建模后要做“问题归类”","line":314,"end":340,"text":"## 7. 第 4 章：建模后要做“问题归类”\n\n建立模型后，还必须判断它属于哪一类优化问题。\n\n教材第 4 章的主要分类包括：\n\n- linear programming；\n- least-squares；\n- composite optimization；\n- stochastic optimization；\n- semidefinite programming；\n- matrix optimization；\n- integer programming；\n- optimization software / modeling languages。\n\n为什么归类重要？\n\n因为算法通常不是针对“应用名称”设计，而是针对数学结构设计。\n\n例如，“图像恢复”和“稀疏回归”应用领域不同，却可能同时落入\n\n$$\n\\min_x f(x)+g(x)\n$$\n\n这样的复合优化结构，于是可以共享 proximal 类算法。\n","resources":[]},{"heading":"8. 本单元实验：模型选择会改变答案","line":341,"end":350,"text":"## 8. 本单元实验：模型选择会改变答案\n\n运行：\n\n```bash\npython labs/14_optimization_modeling.py\n```\n\n实验包含两部分。\n","resources":[]},{"heading":"8. 本单元实验：模型选择会改变答案 › 实验 A｜同一组回归数据，不同残差模型","line":351,"end":370,"text":"### 实验 A｜同一组回归数据，不同残差模型\n\n比较：\n\n$$\n\\min_x \\|Ax-b\\|_2^2\n$$\n\n与\n\n$$\n\\min_x \\|Ax-b\\|_1.\n$$\n\n在加入少量大离群点后，观察估计直线如何变化。\n\n重点不是宣布某个模型“总是更好”，而是回答：\n\n> 哪种残差结构更符合你对噪声的假设？\n","resources":[]},{"heading":"8. 本单元实验：模型选择会改变答案 › 实验 B｜同一线性模型，不同正则项","line":371,"end":392,"text":"### 实验 B｜同一线性模型，不同正则项\n\n比较 ridge 与 LASSO：\n\n$$\n\\frac12\\|Ax-b\\|_2^2+\\lambda\\|x\\|_2^2\n$$\n\n和\n\n$$\n\\frac12\\|Ax-b\\|_2^2+\\lambda\\|x\\|_1.\n$$\n\n观察：\n\n- ridge 倾向于整体收缩；\n- LASSO 可以产生精确为零的系数；\n- 正则项实际上编码了对解结构的偏好。\n\n实验中的 ISTA 只是用来得到 LASSO 数值解；proximal 算法本身会在 Unit 06 系统学习。\n","resources":[]},{"heading":"9. 建模检查表","line":393,"end":408,"text":"## 9. 建模检查表\n\n以后遇到任何实际问题，都按下面顺序写一遍：\n\n1. **数据/状态是什么？**\n2. **决策变量是什么？**\n3. **目标是什么？**\n4. **损失函数为什么这样选？**\n5. **有没有先验结构？**\n6. **正则项表达的是什么？**\n7. **哪些约束来自现实，哪些只是数学变换？**\n8. **有没有做松弛？**\n9. **松弛是否等价？若不是，丢了什么？**\n10. **模型属于哪类优化问题？**\n11. **后续算法应该利用什么结构？**\n","resources":[]},{"heading":"10. 练习 › 练习 1｜同一数据，不同模型","line":411,"end":421,"text":"### 练习 1｜同一数据，不同模型\n\n给定 $b=Ax+\\varepsilon$，分别写出：\n\n- least-squares；\n- least-absolute-deviation；\n- ridge；\n- LASSO。\n\n逐项解释每个新增项改变了什么假设。\n","resources":[]},{"heading":"10. 练习 › 练习 2｜从需求写模型","line":422,"end":427,"text":"### 练习 2｜从需求写模型\n\n“希望预测准确，同时只使用少量特征。”\n\n写出一个合理模型，并解释为什么不是只最小化训练误差。\n","resources":[]},{"heading":"10. 练习 › 练习 3｜等价变换与松弛","line":428,"end":434,"text":"### 练习 3｜等价变换与松弛\n\n解释下面两件事的本质区别：\n\n- 引入 $y=Ax+b$ 做等价变量替换；\n- 用 $\\ell_1$ 代替 $\\ell_0$。\n","resources":[]},{"heading":"10. 练习 › 练习 4｜模型分类","line":435,"end":446,"text":"### 练习 4｜模型分类\n\n把以下模型分别归入第 4 章的问题类别：\n\n- ordinary least squares；\n- LASSO；\n- phase-lift SDP；\n- K-means；\n- logistic regression 的期望风险形式。\n\n允许一个模型具有多个结构标签，但要说明你关注哪一种结构来选算法。\n","resources":[]},{"heading":"10. 练习 › 练习 5｜PCA 的双重解释","line":447,"end":450,"text":"### 练习 5｜PCA 的双重解释\n\n说明“最大投影方差”和“最小重构误差”为何可以描述同一任务。\n","resources":[]},{"heading":"10. 练习 › 练习 6｜失败案例","line":451,"end":457,"text":"### 练习 6｜失败案例\n\n举一个正则化参数过大导致模型偏离原任务的例子，并解释这属于：\n\n- 算法失败；\n- 还是模型选择失败。\n","resources":[]},{"heading":"11. 完成检查","line":458,"end":471,"text":"## 11. 完成检查\n\n进入 Unit 03 前，应当能不看资料回答：\n\n- 为什么最小二乘不是唯一合理的误差模型？\n- 正则化和约束有什么联系与区别？\n- 最大似然如何产生优化目标？\n- 等价变换和松弛有什么根本不同？\n- $\\ell_0\\rightarrow\\ell_1$ 为什么需要额外恢复条件？\n- LASSO 中 $\\lambda$ 为什么是模型参数，而不只是算法参数？\n- 为什么“问题分类”会决定算法路线？\n- 一个应用问题为什么可能对应多个不同的优化模型？\n\n下一单元：[Unit 03｜最优性理论](03-optimality.md)","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/02-modeling.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/03-optimality.md","module":"最优化课程","role":"课程与讲义","title":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？","sections":[{"heading":"Unit 03｜最优性理论：什么时候可以说“这个点是解”？","line":1,"end":8,"text":"# Unit 03｜最优性理论：什么时候可以说“这个点是解”？\n\n> 对应电子讲义：凸优化最优性理论、非凸优化最优性理论。\n>\n> 对应教材：第 5 章“最优性理论”。\n>\n> 本页以第二版教材第 5 章为依据，保留“必要 / 充分 / 充要”“约束品性”“强对偶”等条件边界。\n","resources":[]},{"heading":"1. 本单元的主线","line":9,"end":28,"text":"## 1. 本单元的主线\n\nUnit 02 解决“怎样建立优化模型”。Unit 03 解决：\n\n> 给定一个候选点，凭什么说它是局部最优点、全局最优点，或者仅仅是驻点？\n\n教材第 5 章依次讨论：\n\n```text\n解的存在性与唯一性\n→ 无约束可微问题\n→ 无约束不可微 / 复合问题\n→ Lagrangian 与对偶\n→ 一般约束问题的 KKT\n→ 约束问题的二阶条件\n→ 凸约束问题 + Slater + 强对偶\n```\n\n学习时，每一个条件都必须同时标明：**必要、充分还是充要，以及它依赖哪些假设。**\n","resources":[]},{"heading":"2. 解的存在性与唯一性","line":29,"end":52,"text":"## 2. 解的存在性与唯一性\n\n考虑\n\n$$\n\\min_{x\\in X} f(x).\n$$\n\n教材的 Weierstrass 型存在性定理针对适当且闭的函数：如果以下三类条件之一成立，则最小值点集非空且紧：\n\n1. $\\operatorname{dom} f$ 有界；\n2. 存在一个非空且有界的下水平集；\n3. $f$ 是强制的，即 $\\|x^k\\|\\to\\infty$ 时 $f(x^k)\\to+\\infty$。\n\n直觉是防止“最小值跑向无穷远”。\n\n教材随后用强拟凸给出唯一性结果：若 $X$ 非空、紧、凸，而 $f$ 适当、闭且强拟凸，则最优解唯一。\n\n需要区分：\n\n- 存在最优点；\n- 最优点唯一；\n- 多个最优点共享同一个最优值。\n","resources":[]},{"heading":"3. 无约束可微问题：驻点不是最优点","line":53,"end":78,"text":"## 3. 无约束可微问题：驻点不是最优点\n\n考虑\n\n$$\n\\min_{x\\in\\mathbb R^n} f(x).\n$$\n\n如果存在方向 $d$ 满足\n\n$$\n\\nabla f(x)^T d\u003c0,\n$$\n\n则 $d$ 是下降方向。\n\n所以局部极小点必须满足一阶必要条件\n\n$$\n\\nabla f(x^*)=0.\n$$\n\n教材把满足该式的点称为稳定点，也可称驻点或临界点。\n\n但这只是必要条件。比如 $f(x)=x^3$ 在 $x=0$ 处导数为零，$0$ 却不是局部极小点。\n","resources":[]},{"heading":"4. 二阶最优性条件","line":79,"end":82,"text":"## 4. 二阶最优性条件\n\n若 $f$ 在 $x^*$ 附近二阶连续可微，教材定理 5.4 给出：\n","resources":[]},{"heading":"4. 二阶最优性条件 › 二阶必要条件","line":83,"end":92,"text":"### 二阶必要条件\n\n若 $x^*$ 是局部极小点，则\n\n$$\n\\nabla f(x^*)=0,\n\\qquad\n\\nabla^2 f(x^*)\\succeq0.\n$$\n","resources":[]},{"heading":"4. 二阶最优性条件 › 二阶充分条件","line":93,"end":111,"text":"### 二阶充分条件\n\n若\n\n$$\n\\nabla f(x^*)=0,\n\\qquad\n\\nabla^2 f(x^*)\\succ0,\n$$\n\n则 $x^*$ 是局部极小点。\n\n边界必须保留：\n\n- 二阶必要条件不是充分条件；\n- 二阶充分条件不是必要条件。\n\n例如 $x^3$ 在 0 处梯度和 Hessian 都为 0，但不是极小点；$x^4$ 在 0 处是全局极小点，但 Hessian 仍为 0。\n","resources":[]},{"heading":"5. 不可微与复合问题 › 5.1 凸问题","line":114,"end":125,"text":"### 5.1 凸问题\n\n对适当凸函数，教材定理 5.5：\n\n$$\nx^* \\text{ 是全局极小点}\n\\quad\\Longleftrightarrow\\quad\n0\\in\\partial f(x^*).\n$$\n\n这是全局最优的充要条件。\n","resources":[]},{"heading":"5. 不可微与复合问题 › 5.2 复合优化","line":126,"end":149,"text":"### 5.2 复合优化\n\n考虑\n\n$$\n\\psi(x)=f(x)+h(x),\n$$\n\n其中 $f$ 光滑（可以非凸），$h$ 凸（可以不可微）。\n\n教材定理 5.6 给出局部最优必要条件\n\n$$\n-\\nabla f(x^*)\\in\\partial h(x^*),\n$$\n\n即\n\n$$\n0\\in\\nabla f(x^*)+\\partial h(x^*).\n$$\n\n如果整个目标是凸的，这个条件也可用于刻画全局最优。\n","resources":[]},{"heading":"6. Lagrangian 与对偶","line":150,"end":202,"text":"## 6. Lagrangian 与对偶\n\n一般约束问题写成\n\n$$\n\\begin{aligned}\n\\min_x\\quad & f(x)\\\\\n\\text{s.t.}\\quad\n& c_i(x)\\le0,\\quad i\\in I,\\\\\n& c_i(x)=0,\\quad i\\in E.\n\\end{aligned}\n$$\n\n给不等式约束乘子 $\\lambda_i\\ge0$，等式约束乘子 $\\nu_i\\in\\mathbb R$，构造\n\n$$\nL(x,\\lambda,\\nu)\n=\nf(x)\n+\n\\sum_{i\\in I}\\lambda_i c_i(x)\n+\n\\sum_{i\\in E}\\nu_i c_i(x).\n$$\n\n对偶函数：\n\n$$\ng(\\lambda,\\nu)=\\inf_x L(x,\\lambda,\\nu).\n$$\n\n对偶问题：\n\n$$\n\\max_{\\lambda\\ge0,\\nu} g(\\lambda,\\nu).\n$$\n\n教材指出，对偶函数给原始最优值的下界，而且拉格朗日对偶问题本身是凸优化问题。\n\n若原始最优值为 $p^*$，对偶最优值为 $d^*$，则对偶间隙为\n\n$$\np^*-d^*\\ge0.\n$$\n\n若\n\n$$\np^*=d^*,\n$$\n\n则强对偶成立。\n","resources":[]},{"heading":"7. 约束品性：为什么 KKT 不能无条件使用？","line":203,"end":217,"text":"## 7. 约束品性：为什么 KKT 不能无条件使用？\n\n教材先比较：\n\n- 切锥 $T_X(x)$；\n- 线性化可行方向锥 $F(x)$。\n\n许多约束品性的作用就是保证\n\n$$\nT_X(x^*)=F(x^*).\n$$\n\n这样才能用容易计算的线性化方向代表真实可行方向。\n","resources":[]},{"heading":"7. 约束品性：为什么 KKT 不能无条件使用？ › LICQ","line":218,"end":228,"text":"### LICQ\n\n若可行点处积极约束的梯度线性无关，则 LICQ 成立。\n\n教材还讨论：\n\n- MFCQ：LICQ 的弱化版本；\n- 线性约束品性：所有约束函数本身是线性的。\n\n这些条件在相应情形下可帮助保证 $T_X=F$。\n","resources":[]},{"heading":"8. KKT：一般约束问题的一阶必要条件","line":229,"end":240,"text":"## 8. KKT：一般约束问题的一阶必要条件\n\n教材定理 5.9：如果 $x^*$ 是局部最优点，并且\n\n$$\nT_X(x^*)=F(x^*),\n$$\n\n则存在乘子使 KKT 成立。\n\nKKT 四部分：\n","resources":[]},{"heading":"8. KKT：一般约束问题的一阶必要条件 › 稳定性","line":241,"end":246,"text":"### 稳定性\n\n$$\n\\nabla_xL(x^*,\\lambda^*,\\nu^*)=0.\n$$\n","resources":[]},{"heading":"8. KKT：一般约束问题的一阶必要条件 › 原始可行性","line":247,"end":256,"text":"### 原始可行性\n\n$$\nc_i(x^*)\\le0,\\quad i\\in I,\n$$\n\n$$\nc_i(x^*)=0,\\quad i\\in E.\n$$\n","resources":[]},{"heading":"8. KKT：一般约束问题的一阶必要条件 › 对偶可行性","line":257,"end":262,"text":"### 对偶可行性\n\n$$\n\\lambda_i^*\\ge0,\\quad i\\in I.\n$$\n","resources":[]},{"heading":"8. KKT：一般约束问题的一阶必要条件 › 互补松弛","line":263,"end":270,"text":"### 互补松弛\n\n$$\n\\lambda_i^*c_i(x^*)=0,\\quad i\\in I.\n$$\n\n一般非凸约束问题中，KKT 是必要条件，不是充分条件，因此 KKT 点不自动等于局部最优点。\n","resources":[]},{"heading":"9. 约束问题的二阶条件","line":271,"end":274,"text":"## 9. 约束问题的二阶条件\n\n教材用临界锥 $C(x^*,\\lambda^*)$ 收集“一阶信息无法判定”的线性化可行方向。\n","resources":[]},{"heading":"9. 约束问题的二阶条件 › 二阶必要条件","line":275,"end":284,"text":"### 二阶必要条件\n\n在局部最优点、相应约束品性以及 KKT 乘子存在时，\n\n$$\nd^T\\nabla^2_{xx}L(x^*,\\lambda^*)d\\ge0,\n\\qquad\n\\forall d\\in C(x^*,\\lambda^*).\n$$\n","resources":[]},{"heading":"9. 约束问题的二阶条件 › 二阶充分条件","line":285,"end":296,"text":"### 二阶充分条件\n\n如果 KKT 成立，而且\n\n$$\nd^T\\nabla^2_{xx}L(x^*,\\lambda^*)d>0\n$$\n\n对所有非零临界方向成立，则 $x^*$ 是严格局部极小点。\n\n和无约束问题相比，关键变化是：只需要沿临界锥检查二阶曲率，而不是要求整个空间上的正定性。\n","resources":[]},{"heading":"10. Slater：凸约束问题中的关键条件","line":297,"end":319,"text":"## 10. Slater：凸约束问题中的关键条件\n\n教材第 5.6 节定义 Slater 条件：在自然定义域的相对内点中，存在点使非仿射不等式严格成立并满足等式约束。对仿射不等式，严格性要求可以适当放宽。\n\n教材定理 5.12：\n\n> 凸优化问题满足 Slater 条件时，强对偶成立。\n\n所以\n\n$$\np^*=d^*.\n$$\n\n教材定理 5.13：\n\n> 对凸问题，在 Slater 条件下，KKT 条件成为原始/对偶全局最优的充要条件。\n\n| 问题 | 条件 | KKT 角色 |\n|---|---|---|\n| 一般约束问题 | 相应约束品性 | 局部最优的必要条件 |\n| 凸约束问题 | Slater | 原始/对偶全局最优的充要条件 |\n","resources":[]},{"heading":"11. 同一个可行域，不同约束表达","line":320,"end":325,"text":"## 11. 同一个可行域，不同约束表达\n\n教材习题 5.8 提醒：约束的代数表达会影响 KKT 分析。\n\n考虑可行域 $X=\\{0\\}$。\n","resources":[]},{"heading":"11. 同一个可行域，不同约束表达 › 表示 A","line":326,"end":347,"text":"### 表示 A\n\n$$\nc(x)=x=0.\n$$\n\n此时 $c'(0)=1$，约束梯度不退化。\n\n对\n\n$$\n\\min_x x\\quad\\text{s.t. }x=0,\n$$\n\nstationarity 为\n\n$$\n1+\\nu=0,\n$$\n\n存在 $\\nu=-1$。\n","resources":[]},{"heading":"11. 同一个可行域，不同约束表达 › 表示 B","line":348,"end":373,"text":"### 表示 B\n\n把同一个可行域写成\n\n$$\nc(x)=x^2=0.\n$$\n\n此时\n\n$$\nc'(0)=0.\n$$\n\nstationarity 变成\n\n$$\n1+\\nu\\cdot0=0,\n$$\n\n不存在任何乘子使它成立。\n\n但 $x=0$ 仍然是唯一可行点，也是全局最优点。\n\n这说明：如果约束品性失败，局部/全局最优点不一定是 KKT 点。\n","resources":[]},{"heading":"12. 本单元实验","line":374,"end":405,"text":"## 12. 本单元实验\n\n运行：\n\n```bash\npython labs/15_optimization_optimality.py\n```\n\n实验有三部分：\n\n1. $x^3$ 与 $x^4$：展示“驻点 ≠ 最优点”以及二阶条件边界；\n2. $x=0$ 与 $x^2=0$：展示同一可行域的不同表达如何影响 KKT；\n3. 凸问题\n   $$\n   \\min_x (x-2)^2\\quad\\text{s.t. }x\\le1\n   $$\n   展示 Slater、KKT 与强对偶。\n\n第三个问题有严格可行点 $x=0$。其最优点和乘子为\n\n$$\nx^*=1,\\qquad \\lambda^*=2,\n$$\n\n原始最优值 $p^*=1$。对偶函数为\n\n$$\ng(\\lambda)=\\lambda-\\frac{\\lambda^2}{4},\\qquad \\lambda\\ge0,\n$$\n\n最大值也为 $1$，所以对偶间隙为 0。\n","resources":[]},{"heading":"13. 最优性条件速查表","line":406,"end":418,"text":"## 13. 最优性条件速查表\n\n| 问题 | 条件 | 结论性质 |\n|---|---|---|\n| 无约束光滑 | $\\nabla f(x^*)=0$ | 局部最优必要 |\n| 无约束光滑 | $\\nabla f=0,\\nabla^2f\\succeq0$ | 二阶必要 |\n| 无约束光滑 | $\\nabla f=0,\\nabla^2f\\succ0$ | 局部最优充分 |\n| 无约束凸 | $0\\in\\partial f(x^*)$ | 全局最优充要 |\n| 复合 $f+h$ | $-\\nabla f(x^*)\\in\\partial h(x^*)$ | 局部最优必要 |\n| 一般约束 | KKT + 相应约束品性 | 局部最优必要 |\n| 一般约束 | Lagrangian Hessian 在临界锥上正定 | 严格局部最优充分 |\n| 凸约束 | Slater + KKT | 原始/对偶全局最优充要 |\n","resources":[]},{"heading":"14. 练习","line":419,"end":433,"text":"## 14. 练习\n\n1. 对 $f(x)=x^4-2x^2$ 求所有驻点，并分类。\n2. 分别举例说明二阶必要条件不是充分条件、二阶充分条件不是必要条件。\n3. 对 $f(x)=|x|+\\frac12(x-1)^2$ 写出 $0\\in\\partial f(x)$ 并求最优解。\n4. 对 $\\min x_1^2+x_2^2$，约束 $x_1+x_2=1,x_1\\ge0$，写出完整 KKT。\n5. 解释为什么互补松弛不意味着所有不等式约束都必须取等号。\n6. 解释 $x=0$ 与 $x^2=0$ 在 KKT 分析中的差别。\n7. 判断 $\\min x^2$ s.t. $x\\le1$ 是否有明显 Slater 点，并说明 Slater 支持什么结论。\n8. 判断并补条件：\n   - $\\nabla f(x)=0$，所以 $x$ 是局部极小点；\n   - 一个点满足 KKT，所以它是局部最优点；\n   - 凸问题满足 KKT，所以它一定是全局最优；\n   - Slater 成立，所以原始问题一定存在唯一最优解。\n","resources":[]},{"heading":"15. 完成检查","line":434,"end":450,"text":"## 15. 完成检查\n\n进入 Unit 04 前，应能回答：\n\n- 什么条件可以防止最优点跑向无穷远？\n- 驻点与局部极小点有什么区别？\n- 一阶必要、二阶必要、二阶充分分别是什么？\n- 为什么凸问题的 $0\\in\\partial f(x^*)$ 特别强？\n- Lagrangian、对偶函数、对偶间隙分别是什么？\n- KKT 四部分是什么？\n- LICQ / MFCQ / 线性约束品性的共同作用是什么？\n- 为什么一般非凸问题的 KKT 只是必要条件？\n- 临界锥为什么出现在约束二阶条件中？\n- Slater 如何连接强对偶与凸问题 KKT 的充要性？\n- 为什么相同可行域的不同表达可能导致不同 KKT 行为？\n\n下一单元：[Unit 04｜无约束优化算法](04-unconstrained.md)","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/03-optimality.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/04-unconstrained.md","module":"最优化课程","role":"课程与讲义","title":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度","sections":[{"heading":"Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度","line":1,"end":8,"text":"# Unit 04｜无约束优化算法：从局部模型到全局化与收敛速度\n\n> 对应电子讲义：梯度下降算法、牛顿类算法、拟牛顿算法、信赖域算法、非线性最小二乘问题。\n>\n> 对应教材：第 6 章“无约束优化算法”，重点覆盖 6.1、6.2、6.4、6.5、6.6、6.7。\n>\n> 第 6.3 节“次梯度算法”属于本章，但本路线把它放到后续非光滑/随机单元集中学习。本页不删除这一章节，只是暂不展开。\n","resources":[]},{"heading":"1. 一条统一主线","line":9,"end":41,"text":"## 1. 一条统一主线\n\n本单元不把算法看成互不相关的配方，而统一成四个问题：\n\n```text\n局部模型\n→ 搜索方向 / 子问题\n→ 全局化策略\n→ 收敛速度\n```\n\n对当前点 $x_k$，记\n\n$$\ng_k=\\nabla f(x_k),\\qquad B_k\\approx\\nabla^2 f(x_k).\n$$\n\n一个常见的二阶局部模型是\n\n$$\nm_k(d)\n=\nf(x_k)+g_k^Td+\\frac12d^TB_kd.\n$$\n\n不同算法的差别，往往就是：\n\n- $B_k$ 取什么；\n- 怎样从 $m_k$ 得到方向 $d_k$；\n- 是否需要额外选择步长；\n- 如何防止局部模型在远离当前点时失真；\n- 在什么条件下能证明收敛，以及局部速度有多快。\n","resources":[]},{"heading":"2. 两种全局化哲学 › 2.1 线搜索：先选方向，再决定走多远","line":44,"end":66,"text":"### 2.1 线搜索：先选方向，再决定走多远\n\n教材的基本格式是\n\n$$\nx_{k+1}=x_k+\\alpha_k d_k,\n$$\n\n其中 $d_k$ 是搜索方向，$\\alpha_k>0$ 是步长。\n\n如果\n\n$$\ng_k^Td_k\u003c0,\n$$\n\n则 $d_k$ 是下降方向。\n\n线搜索方法的核心是：\n\n1. 先通过梯度、Newton、BFGS 等规则得到 $d_k$；\n2. 再沿射线 $x_k+\\alpha d_k$ 选择一个合适的 $\\alpha_k$。\n","resources":[]},{"heading":"2. 两种全局化哲学 › 2.2 信赖域：限制局部模型“可信”的范围","line":67,"end":86,"text":"### 2.2 信赖域：限制局部模型“可信”的范围\n\n信赖域直接求\n\n$$\n\\min_d\\;\nm_k(d)\n\\quad\n\\text{s.t. }\\|d\\|\\le\\Delta_k.\n$$\n\n它不是先定方向再定步长，而是在半径 $\\Delta_k$ 内同时选择方向和步长。\n\n因此可以把两者对照为：\n\n| 思路 | 方向 | 步长/尺度 |\n|---|---|---|\n| 线搜索 | 先确定 $d_k$ | 再选 $\\alpha_k$ |\n| 信赖域 | 在子问题里共同确定 | 由 $\\Delta_k$ 限制 |\n","resources":[]},{"heading":"3. 线搜索：下降还不够，必须“充分下降”","line":87,"end":98,"text":"## 3. 线搜索：下降还不够，必须“充分下降”\n\n教材用一个一维例子说明：仅要求\n\n$$\nf(x_{k+1})\u003cf(x_k)\n$$\n\n仍可能收敛到错误位置，甚至迭代点振荡。\n\n所以需要更强的步长准则。\n","resources":[]},{"heading":"3. 线搜索：下降还不够，必须“充分下降” › 3.1 Armijo 准则","line":99,"end":121,"text":"### 3.1 Armijo 准则\n\n若\n\n$$\nf(x_k+\\alpha d_k)\n\\le\nf(x_k)+c_1\\alpha g_k^Td_k,\n\\qquad 0\u003cc_1\u003c1,\n$$\n\n则步长满足 Armijo 准则。\n\n它要求的不只是“下降”，而是相对于局部线性模型有**充分下降**。\n\n最常用的实现是回退法：\n\n```text\n从一个较大候选步长开始\n→ 若 Armijo 不满足则乘一个 0\u003cβ\u003c1\n→ 直到满足\n```\n","resources":[]},{"heading":"3. 线搜索：下降还不够，必须“充分下降” › 3.2 Wolfe 准则","line":122,"end":127,"text":"### 3.2 Wolfe 准则\n\nWolfe 在充分下降之外增加曲率条件，防止步长过小。\n\n教材后面的 BFGS / L-BFGS 全局收敛分析会显式使用 Wolfe 线搜索，因此不能把“任意能下降的步长”与 Wolfe 混为一谈。\n","resources":[]},{"heading":"3. 线搜索：下降还不够，必须“充分下降” › 3.3 非单调线搜索","line":128,"end":141,"text":"### 3.3 非单调线搜索\n\n教材还介绍 Grippo 以及 Zhang–Hager 类型的非单调准则。\n\n这类规则允许\n\n$$\nf(x_{k+1})>f(x_k)\n$$\n\n在某些迭代出现，只要相对于一个历史参考值仍满足控制条件。\n\n这一点和 BB 方法非常契合，因为 BB 本身就是非单调方法。\n","resources":[]},{"heading":"3. 线搜索：下降还不够，必须“充分下降” › 3.4 Zoutendijk 条件","line":142,"end":155,"text":"### 3.4 Zoutendijk 条件\n\n教材定理 6.1 给出一般线搜索框架下的重要收敛工具：当目标函数下有界、连续可微、梯度 Lipschitz，方向为下降方向且步长满足 Wolfe 时，有\n\n$$\n\\sum_{k=0}^{\\infty}\n\\cos^2\\theta_k\\|\\nabla f(x_k)\\|^2\n\u003c\\infty,\n$$\n\n其中 $\\theta_k$ 是负梯度与搜索方向之间的夹角。\n\n这条结论揭示了“方向质量 + 步长规则”共同决定全局收敛性的思想。\n","resources":[]},{"heading":"4. 梯度下降：一阶局部模型","line":156,"end":177,"text":"## 4. 梯度下降：一阶局部模型\n\n如果只看一阶近似\n\n$$\nf(x_k+d)\\approx f(x_k)+g_k^Td,\n$$\n\n在单位长度约束下，最陡下降方向就是\n\n$$\nd_k=-g_k.\n$$\n\n于是\n\n$$\nx_{k+1}\n=\nx_k-\\alpha_k\\nabla f(x_k).\n$$\n","resources":[]},{"heading":"4. 梯度下降：一阶局部模型 › 4.1 全局化策略","line":178,"end":186,"text":"### 4.1 全局化策略\n\n步长可以：\n\n- 固定；\n- 精确线搜索；\n- Armijo/Wolfe；\n- 由其他谱步长规则产生。\n","resources":[]},{"heading":"4. 梯度下降：一阶局部模型 › 4.2 收敛速度","line":187,"end":190,"text":"### 4.2 收敛速度\n\n教材给出几类重要结论。\n","resources":[]},{"heading":"4. 梯度下降：一阶局部模型 › 4.2 收敛速度 › 正定二次函数","line":191,"end":196,"text":"#### 正定二次函数\n\n精确线搜索的梯度法是 Q-线性收敛的，而且速度显式依赖 Hessian 的条件数。\n\n因此病态问题会出现典型“之字形”。\n","resources":[]},{"heading":"4. 梯度下降：一阶局部模型 › 4.2 收敛速度 › 凸 + 梯度 Lipschitz","line":197,"end":206,"text":"#### 凸 + 梯度 Lipschitz\n\n若 $f$ 凸且梯度 $L$-Lipschitz，固定步长满足相应条件时，教材给出函数值\n\n$$\nO(1/k)\n$$\n\n的收敛速度。\n","resources":[]},{"heading":"4. 梯度下降：一阶局部模型 › 4.2 收敛速度 › 强凸 + 梯度 Lipschitz","line":207,"end":214,"text":"#### 强凸 + 梯度 Lipschitz\n\n若进一步 $m$-强凸，则固定合适步长后，迭代点 Q-线性收敛。\n\n所以梯度法的定位是：\n\n> 每步便宜、结构简单、全局行为容易控制，但对条件数较大的问题可能很慢。\n","resources":[]},{"heading":"5. Barzilai–Borwein：用两步信息估计曲率尺度","line":215,"end":252,"text":"## 5. Barzilai–Borwein：用两步信息估计曲率尺度\n\n梯度法可写成\n\n$$\nx_{k+1}=x_k-D_k g_k,\n\\qquad\nD_k=\\alpha_k I.\n$$\n\nBB 的关键不是换方向，而是用前后两步的变化估计一个“标量逆 Hessian”。\n\n定义\n\n$$\ns_{k-1}=x_k-x_{k-1},\n\\qquad\ny_{k-1}=g_k-g_{k-1}.\n$$\n\n按教材记号，两种步长为\n\n$$\n\\alpha_k^{\\mathrm{BB1}}\n=\n\\frac{s_{k-1}^Ty_{k-1}}\n{y_{k-1}^Ty_{k-1}},\n$$\n\n以及\n\n$$\n\\alpha_k^{\\mathrm{BB2}}\n=\n\\frac{s_{k-1}^Ts_{k-1}}\n{s_{k-1}^Ty_{k-1}}.\n$$\n","resources":[]},{"heading":"5. Barzilai–Borwein：用两步信息估计曲率尺度 › 5.1 为什么它常比普通梯度快？","line":253,"end":256,"text":"### 5.1 为什么它常比普通梯度快？\n\n它把相邻迭代产生的曲率信息压缩进一个标量步长，不需要显式 Hessian，也不要求每次做完整线搜索。\n","resources":[]},{"heading":"5. Barzilai–Borwein：用两步信息估计曲率尺度 › 5.2 但它不是“单调下降法”","line":257,"end":265,"text":"### 5.2 但它不是“单调下降法”\n\n教材明确指出 BB 本身是非单调方法，实践中常：\n\n- 给 $\\alpha_k$ 设置上下界；\n- 搭配非单调线搜索。\n\n教材给出的正定二次函数结果是 R-线性收敛；一般非线性问题需要更多条件，不能把该速度直接推广。\n","resources":[]},{"heading":"6. Newton：直接最小化二阶局部模型","line":266,"end":287,"text":"## 6. Newton：直接最小化二阶局部模型\n\n令\n\n$$\nB_k=\\nabla^2f(x_k).\n$$\n\n忽略 Taylor 高阶项后，二阶模型的稳定点满足 Newton 方程\n\n$$\n\\nabla^2f(x_k)d_k=-\\nabla f(x_k).\n$$\n\n经典 Newton 更新是\n\n$$\nx_{k+1}=x_k+d_k.\n$$\n\n即步长固定为 1。\n","resources":[]},{"heading":"6. Newton：直接最小化二阶局部模型 › 6.1 局部速度","line":288,"end":299,"text":"### 6.1 局部速度\n\n教材定理 6.6 的条件包括：\n\n- $f$ 二阶连续可微；\n- 最优点附近 Hessian Lipschitz；\n- $\\nabla f(x^*)=0$；\n- $\\nabla^2 f(x^*)\\succ0$；\n- 初值离 $x^*$ 足够近。\n\n在这些条件下，经典 Newton 的迭代点以及梯度范数都具有 Q-二次局部收敛性质。\n","resources":[]},{"heading":"6. Newton：直接最小化二阶局部模型 › 6.2 为什么经典 Newton 不能直接当全局算法？","line":300,"end":307,"text":"### 6.2 为什么经典 Newton 不能直接当全局算法？\n\n教材列出三个核心问题：\n\n1. Hessian 计算、存储以及线性系统求解昂贵；\n2. Hessian 不正定时 Newton 方向未必是下降方向；\n3. 距最优点较远时，直接取 $\\alpha=1$ 可能不稳定甚至发散。\n","resources":[]},{"heading":"6. Newton：直接最小化二阶局部模型 › 6.3 修正 Newton","line":308,"end":336,"text":"### 6.3 修正 Newton\n\n教材的修正框架是\n\n$$\nB_k\n=\n\\nabla^2f(x_k)+E_k\n\\succ0,\n$$\n\n再解\n\n$$\nB_kd_k=-g_k,\n$$\n\n并配线搜索选择 $\\alpha_k$。\n\n常见思路是 $E_k=\\tau_kI$，把 Hessian 修正到正定且条件数可接受。\n\n所以修正 Newton 可以概括为：\n\n```text\n准确二阶局部模型\n+ 正定化\n+ 线搜索全局化\n```\n","resources":[]},{"heading":"7. BFGS：不用真正 Hessian，也学习二阶几何","line":337,"end":372,"text":"## 7. BFGS：不用真正 Hessian，也学习二阶几何\n\n拟 Newton 的核心是构造\n\n$$\nB_k\\approx\\nabla^2f(x_k)\n$$\n\n或\n\n$$\nH_k\\approx\\nabla^2f(x_k)^{-1}.\n$$\n\n使用\n\n$$\ns_k=x_{k+1}-x_k,\n\\qquad\ny_k=g_{k+1}-g_k,\n$$\n\n并要求满足割线方程\n\n$$\nB_{k+1}s_k=y_k\n$$\n\n或\n\n$$\nH_{k+1}y_k=s_k.\n$$\n\nBFGS 用秩二更新完成这一点，同时尽量不让新矩阵偏离旧近似矩阵。\n","resources":[]},{"heading":"7. BFGS：不用真正 Hessian，也学习二阶几何 › 7.1 全局化","line":373,"end":380,"text":"### 7.1 全局化\n\n教材定理 6.8 的 BFGS 全局收敛结论显式要求 Wolfe 线搜索，并对目标函数/下水平集上的 Hessian 给出正定有界条件。\n\n因此：\n\n> BFGS 的好性质不是“更新公式单独保证”的；线搜索和函数结构也是证明的一部分。\n","resources":[]},{"heading":"7. BFGS：不用真正 Hessian，也学习二阶几何 › 7.2 局部速度","line":381,"end":386,"text":"### 7.2 局部速度\n\n教材定理 6.9 在给定收敛及附加条件下得到 Q-超线性速度。\n\n它比 Newton 的 Q-二次慢，但避免了每一步显式计算 Hessian。\n","resources":[]},{"heading":"7. BFGS：不用真正 Hessian，也学习二阶几何 › 7.3 L-BFGS","line":387,"end":400,"text":"### 7.3 L-BFGS\n\n完整 $B_k/H_k$ 是稠密矩阵，存储成本 $O(n^2)$。\n\nL-BFGS 只保留最近 $m$ 对\n\n$$\n(s_i,y_i),\n$$\n\n并用双循环递归计算 $H_kg_k$，因此适合大规模问题。\n\n教材的 L-BFGS 框架同样配 Wolfe 线搜索。\n","resources":[]},{"heading":"8. 信赖域：让局部模型自己证明“可信”","line":401,"end":430,"text":"## 8. 信赖域：让局部模型自己证明“可信”\n\n考虑二次模型\n\n$$\nm_k(d)\n=\nf(x_k)+g_k^Td+\\frac12d^TB_kd\n$$\n\n以及约束\n\n$$\n\\|d\\|\\le\\Delta_k.\n$$\n\n求出候选步 $d_k$ 后，比较：\n\n- 实际下降；\n- 模型预测下降。\n\n定义比值\n\n$$\n\\rho_k\n=\n\\frac{f(x_k)-f(x_k+d_k)}\n{m_k(0)-m_k(d_k)}.\n$$\n","resources":[]},{"heading":"8. 信赖域：让局部模型自己证明“可信” › 8.1 半径更新逻辑","line":431,"end":439,"text":"### 8.1 半径更新逻辑\n\n- $\\rho_k\\approx1$：模型可信，可以扩大 $\\Delta_k$；\n- $\\rho_k$ 很小或为负：模型失真，应缩小 $\\Delta_k$；\n- $\\rho_k$ 足够大：接受步长；\n- 否则拒绝，保持当前点。\n\n教材常用参数示例为 $0.25$、$0.75$ 等阈值，但这些是算法参数，不是数学常数。\n","resources":[]},{"heading":"8. 信赖域：让局部模型自己证明“可信” › 8.2 子问题不一定要精确求解","line":440,"end":447,"text":"### 8.2 子问题不一定要精确求解\n\n教材介绍 Cauchy 点和截断共轭梯度等方法。\n\n真正重要的是：\n\n> 子问题只需达到足够的模型下降质量，就可以支撑整个信赖域算法的收敛分析。\n","resources":[]},{"heading":"9. 线搜索与信赖域：同一局部模型的两种全局化","line":448,"end":451,"text":"## 9. 线搜索与信赖域：同一局部模型的两种全局化\n\n可以把 Newton 类方法统一看成：\n","resources":[]},{"heading":"9. 线搜索与信赖域：同一局部模型的两种全局化 › 线搜索 Newton","line":452,"end":463,"text":"### 线搜索 Newton\n\n$$\n\\nabla^2f(x_k)d_k=-g_k,\n$$\n\n然后寻找 $\\alpha_k$：\n\n$$\nx_{k+1}=x_k+\\alpha_kd_k.\n$$\n","resources":[]},{"heading":"9. 线搜索与信赖域：同一局部模型的两种全局化 › 信赖域 Newton","line":464,"end":476,"text":"### 信赖域 Newton\n\n直接求\n\n$$\n\\min_{\\|d\\|\\le\\Delta_k}\ng_k^Td+\\frac12d^T\\nabla^2f(x_k)d.\n$$\n\n因此两者不是“有没有二阶信息”的区别，而是：\n\n> 如何限制二阶模型在远离当前点时造成的误导。\n","resources":[]},{"heading":"10. 非线性最小二乘：利用残差结构，不要把它当普通黑箱","line":477,"end":511,"text":"## 10. 非线性最小二乘：利用残差结构，不要把它当普通黑箱\n\n考虑\n\n$$\nf(x)\n=\n\\frac12\\sum_{i=1}^{m}r_i(x)^2\n=\n\\frac12\\|r(x)\\|_2^2.\n$$\n\n记 $J(x)$ 为残差向量 $r(x)$ 的 Jacobian，则教材给出\n\n$$\n\\nabla f(x)\n=\nJ(x)^Tr(x),\n$$\n\n以及\n\n$$\n\\nabla^2f(x)\n=\nJ(x)^TJ(x)\n+\n\\sum_{i=1}^{m}\nr_i(x)\\nabla^2r_i(x).\n$$\n\n这说明 Hessian 自然分成两部分。\n\n第一部分 $J^TJ$ 在计算梯度时已经“顺带”获得；第二部分需要每个残差的 Hessian，代价更高。\n","resources":[]},{"heading":"11. Gauss–Newton：舍掉难算的二阶残差项","line":512,"end":540,"text":"## 11. Gauss–Newton：舍掉难算的二阶残差项\n\nGauss–Newton 用\n\n$$\nJ_k^TJ_k\n$$\n\n近似真正 Hessian，于是方向满足\n\n$$\nJ_k^TJ_kd_k=-J_k^Tr_k.\n$$\n\n这等价于线性最小二乘子问题\n\n$$\n\\min_d\n\\frac12\\|J_kd+r_k\\|_2^2.\n$$\n\n教材把 Gauss–Newton 主要放在**小残量问题**中讨论。\n\n其局部速度结论不能简化成“永远二次收敛”：\n\n- 某个反映被舍弃 Hessian 项大小的量足够小时，可得到 Q-线性；\n- 当该项在解处为零时，可以达到 Q-二次；\n- 若被舍弃部分较大，Gauss–Newton 可能失效。\n","resources":[]},{"heading":"12. Levenberg–Marquardt：Gauss–Newton 的信赖域化","line":541,"end":569,"text":"## 12. Levenberg–Marquardt：Gauss–Newton 的信赖域化\n\n教材把 LM 描述为信赖域型方法，考虑\n\n$$\n\\min_d\n\\frac12\\|J_kd+r_k\\|_2^2\n\\quad\n\\text{s.t. }\\|d\\|\\le\\Delta_k.\n$$\n\n相应最优性条件可以写为\n\n$$\n(J_k^TJ_k+\\lambda I)d\n=\n-J_k^Tr_k,\n\\qquad\n\\lambda\\ge0,\n$$\n\n并满足相应互补条件。\n\n这条式子揭示了 LM 的核心：\n\n- 当 $\\lambda$ 小，行为接近 Gauss–Newton；\n- 当 $\\lambda$ 大，步子更保守、更接近梯度型方向；\n- 即使 $J^TJ$ 奇异，加入正则项后仍可能得到稳定方向。\n","resources":[]},{"heading":"13. “局部模型 → 方向 → 全局化 → 速度”总表","line":570,"end":586,"text":"## 13. “局部模型 → 方向 → 全局化 → 速度”总表\n\n| 方法 | 局部模型/曲率 | 方向或子问题 | 全局化 | 教材中的代表速度/性质 |\n|---|---|---|---|---|\n| Gradient | 一阶 | $-g_k$ | fixed / Armijo / Wolfe | 凸光滑函数值 $O(1/k)$；强凸时 Q-线性 |\n| BB | 标量谱曲率 | $-\\alpha_k g_k$ | 截断 + 非单调线搜索 | 正定二次情形 R-线性 |\n| Newton | 真 Hessian | $H_kd=-g_k$ | 经典版无；实用版线搜索/修正 | 合适局部条件下 Q-二次 |\n| BFGS | 拟 Hessian | $B_kd=-g_k$ 或 $-H_kg_k$ | Wolfe | 给定相应条件时 Q-超线性 |\n| L-BFGS | 最近若干割线对 | 双循环递归 | Wolfe | 降低内存，面向大规模 |\n| Trust region | 二阶模型 | $\\min m_k(d),\\|d\\|\\le\\Delta_k$ | $\\rho_k$ + 半径更新 | 全局化通过模型可信度控制 |\n| Gauss–Newton | $J^TJ$ | 线性 least-squares | 通常配线搜索 | 小残量；特定条件下 Q-线性/二次 |\n| LM | $J^TJ+\\lambda I$ | 正则化 least-squares / TR | 信赖域 | 对奇异/近奇异 $J^TJ$ 更稳健 |\n\n这张表不能理解成“速度排名”。\n\n局部收敛阶数、每步计算代价、内存、全局收敛前提以及问题结构不同，不能只看 Q-二次、Q-超线性、Q-线性几个词就判断实际耗时。\n","resources":[]},{"heading":"14. 一个实用的算法选择视角 › 梯度 / BB","line":589,"end":597,"text":"### 梯度 / BB\n\n适合：\n\n- 维度高；\n- Hessian 昂贵；\n- 中低精度阶段；\n- 希望每一步非常便宜。\n","resources":[]},{"heading":"14. 一个实用的算法选择视角 › Newton / 修正 Newton","line":598,"end":605,"text":"### Newton / 修正 Newton\n\n适合：\n\n- Hessian 可获得或可高效作用到向量；\n- 需要高精度；\n- 已进入较好的局部区域。\n","resources":[]},{"heading":"14. 一个实用的算法选择视角 › BFGS / L-BFGS","line":606,"end":614,"text":"### BFGS / L-BFGS\n\n适合：\n\n- Hessian 不易计算；\n- 梯度可计算；\n- 希望利用曲率；\n- L-BFGS 尤其适合大规模变量。\n","resources":[]},{"heading":"14. 一个实用的算法选择视角 › Trust region","line":615,"end":622,"text":"### Trust region\n\n适合：\n\n- 二阶局部模型可能在远处不可靠；\n- Hessian 可能不定；\n- 希望通过“模型预测 vs 实际下降”自动调节尺度。\n","resources":[]},{"heading":"14. 一个实用的算法选择视角 › Gauss–Newton / LM","line":623,"end":632,"text":"### Gauss–Newton / LM\n\n只有当目标确实具有\n\n$$\n\\frac12\\|r(x)\\|^2\n$$\n\n结构时才应优先考虑，因为它们的优势来自**利用问题结构**，而不是作为任意无约束问题的通用替代。\n","resources":[]},{"heading":"15. 本单元实验","line":633,"end":642,"text":"## 15. 本单元实验\n\n运行：\n\n```bash\npython labs/16_optimization_unconstrained.py\n```\n\n实验分两组。\n","resources":[]},{"heading":"15. 本单元实验 › A｜Rosenbrock：比较五种无约束策略","line":643,"end":668,"text":"### A｜Rosenbrock：比较五种无约束策略\n\n从同一个初始点出发，比较：\n\n- gradient + Armijo；\n- BB + 非单调 Armijo；\n- modified Newton + Armijo；\n- BFGS + Armijo；\n- trust-region Newton model。\n\n记录：\n\n- $\\|\\nabla f(x_k)\\|$；\n- 迭代次数；\n- 最终函数值。\n\n观察重点：\n\n1. 一阶方法为什么会慢；\n2. BB 如何用谱步长改善梯度迭代；\n3. Newton 靠近解后为什么非常快；\n4. BFGS 如何在不显式使用真 Hessian 的情况下获得二阶加速；\n5. trust region 如何根据模型可信度接受/拒绝步长。\n\n> 这个实验只比较一个二维非凸函数，不能据此给算法做普遍排名。\n","resources":[]},{"heading":"15. 本单元实验 › B｜非线性曲线拟合：Gauss–Newton vs LM","line":669,"end":685,"text":"### B｜非线性曲线拟合：Gauss–Newton vs LM\n\n生成指数衰减模型\n\n$$\ny(t)=a\\exp(bt)+\\varepsilon,\n$$\n\n并比较：\n\n- Gauss–Newton；\n- LM 型阻尼更新。\n\n记录残差范数以及参数恢复结果。\n\n这里的目标是观察“利用 residual/Jacobian 结构”与普通通用算法的不同。\n","resources":[]},{"heading":"16. 练习","line":686,"end":703,"text":"## 16. 练习\n\n1. 写出 Armijo 准则，并解释“只要求函数下降”为何不足。\n2. 在正定二次函数上推导精确线搜索的梯度步长。\n3. 解释梯度法的条件数依赖为什么会产生之字形。\n4. 写出教材的 BB1/BB2，并说明 $s_k,y_k$ 各代表什么。\n5. 为什么经典 Newton 不是一个可靠的全局算法？\n6. 修正 Newton 为什么要让 $B_k$ 正定且条件数不要太差？\n7. 什么是拟 Newton 的割线方程？\n8. 为什么 BFGS 的全局收敛定理不能脱离 Wolfe 条件来复述？\n9. L-BFGS 为什么可以节省内存？\n10. 信赖域的 $\\rho_k$ 接近 1、很小、为负分别意味着什么？\n11. 推导非线性 least-squares 的梯度与 Hessian 分解。\n12. Gauss–Newton 丢掉了 Hessian 的哪一部分？\n13. 为什么“小残量”会让 Gauss–Newton 的近似更合理？\n14. LM 中 $\\lambda$ 增大时，为什么步骤通常会更保守？\n15. “Newton Q-二次，所以永远比 BFGS 快”为什么是错误说法？\n","resources":[]},{"heading":"17. 完成检查","line":704,"end":721,"text":"## 17. 完成检查\n\n进入 Unit 05 前，应能不看资料回答：\n\n- 线搜索与信赖域在全局化哲学上有什么区别？\n- Armijo 与 Wolfe 各控制什么？\n- 梯度法、BB、Newton、BFGS 各自用了多少曲率信息？\n- 为什么 BB 可以非单调？\n- Newton 的 Q-二次结论需要哪些局部条件？\n- 修正 Newton 怎样解决 Hessian 不正定？\n- BFGS 的割线方程是什么？\n- L-BFGS 为什么适合大规模问题？\n- 信赖域中的 actual reduction / predicted reduction 是什么？\n- Gauss–Newton 为什么能省掉一部分二阶导数？\n- LM 和 trust region 的关系是什么？\n- 为什么不能仅按“Q-二次 > Q-超线性 > Q-线性”给算法排优劣？\n\n下一单元：[Unit 05｜约束优化算法](05-constrained.md)","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/04-unconstrained.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/05-constrained.md","module":"最优化课程","role":"课程与讲义","title":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法","sections":[{"heading":"Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法","line":1,"end":8,"text":"# Unit 05｜约束优化算法：罚函数、增广 Lagrangian、原始–对偶与内点法\n\n> 对应电子讲义：罚函数法、增广拉格朗日函数法、线性规划内点法。\n>\n> 对应教材：第 7 章“约束优化算法”，本单元重点覆盖 7.1、7.2、7.3。\n>\n> 第二版第 7.4 节“流形约束优化算法”保留到 Unit 08 单独展开，不在本单元重复。\n","resources":[]},{"heading":"1. 一条统一主线","line":9,"end":41,"text":"## 1. 一条统一主线\n\nUnit 03 已经给出了 KKT、乘子、对偶和约束品性。Unit 05 开始问：\n\n> 算法怎样逐步同时降低目标值、降低约束违反、逼近正确乘子，并最终满足 KKT？\n\n本单元把三类策略统一为：\n\n```text\n外点罚函数：把不可行性变成越来越重的代价\n→ 增广 Lagrangian：罚函数 + 乘子更新\n→ 原始–对偶内点：同时更新原始变量、对偶变量和互补条件\n```\n\n对一般问题\n\n$$\n\\begin{aligned}\n\\min_x\\quad & f(x)\\\\\n\\text{s.t.}\\quad\n& c_i(x)=0,\\quad i\\in E,\\\\\n& c_i(x)\\le0,\\quad i\\in I,\n\\end{aligned}\n$$\n\n算法真正要同时控制的是：\n\n- stationarity；\n- equality feasibility；\n- inequality feasibility；\n- dual feasibility；\n- complementary slackness。\n","resources":[]},{"heading":"2. 二次罚函数：把约束变成目标的一部分 › 2.1 等式约束","line":44,"end":76,"text":"### 2.1 等式约束\n\n对\n\n$$\nc_i(x)=0,\n$$\n\n教材定义二次罚函数\n\n$$\nP_E(x,\\sigma)\n=\nf(x)\n+\n\\frac{\\sigma}{2}\n\\sum_{i\\in E}c_i(x)^2.\n$$\n\n罚因子 $\\sigma>0$ 越大，不可行点受到的惩罚越强。\n\n典型外迭代是：\n\n```text\n选择 σ_0\n→ 近似求解 min P_E(x,σ_k)\n→ 增大 σ_k\n→ 用上一子问题的解 warm start\n→ 重复\n```\n\n这也是 continuation 思想的一种形式。\n","resources":[]},{"heading":"2. 二次罚函数：把约束变成目标的一部分 › 2.2 不等式约束","line":77,"end":109,"text":"### 2.2 不等式约束\n\n对\n\n$$\nc_i(x)\\le0,\n$$\n\n不能直接罚 $c_i(x)^2$，否则严格可行的 $c_i(x)\u003c0$ 也会被惩罚。\n\n教材采用\n\n$$\n[c_i(x)]_+\n=\n\\max\\{c_i(x),0\\},\n$$\n\n并构造\n\n$$\nP_I(x,\\sigma)\n=\nf(x)\n+\n\\frac{\\sigma}{2}\n\\sum_{i\\in I}[c_i(x)]_+^2.\n$$\n\n这只惩罚违反约束的部分。\n\n教材指出：该平方正部函数可导，但一般不是二阶可导，因此不能简单把普通光滑 Newton 理论原样套上去。\n","resources":[]},{"heading":"3. 二次罚函数为什么会数值变难？","line":110,"end":143,"text":"## 3. 二次罚函数为什么会数值变难？\n\n二次罚函数法为了逼近严格可行性，通常需要\n\n$$\n\\sigma_k\\to+\\infty.\n$$\n\n教材对等式约束给出的 Hessian 结构可写成\n\n$$\n\\nabla^2_{xx}P_E(x,\\sigma)\n=\n\\nabla^2f(x)\n+\n\\sigma\\sum_i c_i(x)\\nabla^2c_i(x)\n+\n\\sigma\\nabla c(x)\\nabla c(x)^T.\n$$\n\n在接近解时，最后一项随 $\\sigma$ 放大，而它通常只在约束法向方向上强化曲率。\n\n结果是：\n\n> 约束违反越来越小，但子问题条件数可能越来越差。\n\n这就是罚函数的核心权衡：\n\n```text\n更大的 σ\n→ 更接近可行域\n→ 但子问题更病态\n```\n","resources":[]},{"heading":"4. 罚函数收敛：必须保留前提","line":144,"end":170,"text":"## 4. 罚函数收敛：必须保留前提\n\n教材定理 7.1 的结论不是无条件的。\n\n如果：\n\n- 每个二次罚函数子问题都取得全局极小解；\n- $\\sigma_k$ 单调趋于 $+\\infty$；\n\n那么这些子问题解序列的每个极限点都是原问题的全局极小解。\n\n实际中通常只能近似求子问题。教材定理 7.2进一步要求：\n\n- 子问题一阶残差趋于零；\n- $\\sigma_k\\to+\\infty$；\n- 极限点处等式约束梯度线性无关；\n\n此时极限点满足原问题 KKT，而且\n\n$$\n-\\sigma_k c_i(x_{k+1})\n\\to\n\\lambda_i^*.\n$$\n\n所以罚函数不仅在逼近可行性，还隐式地“制造”出乘子估计。\n","resources":[]},{"heading":"5. 精确罚函数：有限罚因子也可能够用","line":171,"end":203,"text":"## 5. 精确罚函数：有限罚因子也可能够用\n\n教材还介绍 $\\ell_1$ 精确罚函数：\n\n$$\nP(x,\\sigma)\n=\nf(x)\n+\n\\sigma\n\\left(\n\\sum_{i\\in E}|c_i(x)|\n+\n\\sum_{i\\in I}[c_i(x)]_+\n\\right).\n$$\n\n和二次罚函数不同，它是非光滑的。\n\n教材定理 7.3 给出一个局部精确性结论：若 $x^*$ 是严格局部极小点并满足 KKT，乘子为 $\\lambda^*$，则当\n\n$$\n\\sigma>\\|\\lambda^*\\|_\\infty\n$$\n\n时，$x^*$ 也是该 $\\ell_1$ 罚函数的局部极小点。\n\n所以“精确”指的是：\n\n> 不需要让罚因子趋于无穷，有限大的罚因子就可能保留原问题局部解。\n\n但代价是子问题变成非光滑问题，这会和 Unit 06 的 proximal 方法衔接。\n","resources":[]},{"heading":"6. 增广 Lagrangian：用乘子避免一味增大罚因子","line":204,"end":257,"text":"## 6. 增广 Lagrangian：用乘子避免一味增大罚因子\n\n对等式约束，教材定义\n\n$$\nL_\\sigma(x,\\lambda)\n=\nf(x)\n+\n\\sum_{i\\in E}\\lambda_i c_i(x)\n+\n\\frac{\\sigma}{2}\n\\sum_{i\\in E}c_i(x)^2.\n$$\n\n给定 $(\\lambda_k,\\sigma_k)$，先近似求\n\n$$\nx_{k+1}\n\\approx\n\\arg\\min_x\nL_{\\sigma_k}(x,\\lambda_k),\n$$\n\n再更新乘子\n\n$$\n\\lambda_{k+1}\n=\n\\lambda_k\n+\n\\sigma_k c(x_{k+1}).\n$$\n\n这里的关键不是“多加了一项”，而是：\n\n```text\n二次罚函数\n只靠 σ 压约束\n\n增广 Lagrangian\n靠 σ + λ_k 一起控制约束\n```\n\n教材由\n\n$$\nc_i(x_{k+1})\n\\approx\n\\frac{\\lambda_i^*-\\lambda_i^k}{\\sigma_k}\n$$\n\n解释了这一点：当乘子已经接近真实乘子时，即使 $\\sigma_k$ 不是极端大，约束违反也可以很小。\n","resources":[]},{"heading":"7. 增广 Lagrangian 的局部精确性","line":258,"end":284,"text":"## 7. 增广 Lagrangian 的局部精确性\n\n教材定理 7.4 的条件包括：\n\n- $x^*$ 是等式约束问题局部极小点；\n- 对应乘子为 $\\lambda^*$；\n- LICQ 成立；\n- 二阶充分条件成立。\n\n则存在有限的 $\\bar\\sigma$，使得对\n\n$$\n\\sigma\\ge\\bar\\sigma,\n$$\n\n$x^*$ 是\n\n$$\nL_\\sigma(x,\\lambda^*)\n$$\n\n的严格局部极小点。\n\n这正是 ALM 相比纯二次罚函数的重要优势之一：\n\n> 在乘子正确或足够接近时，不必靠 $\\sigma\\to\\infty$ 才能锁定局部解。\n","resources":[]},{"heading":"8. 一般不等式约束的 ALM","line":285,"end":310,"text":"## 8. 一般不等式约束的 ALM\n\n教材通过松弛变量把\n\n$$\nc_i(x)\\le0\n$$\n\n改写成\n\n$$\nc_i(x)+s_i=0,\n\\qquad\ns_i\\ge0.\n$$\n\n消去 $s_i$ 后，增广 Lagrangian 中出现\n\n$$\n\\max\\left\\{\n\\frac{\\mu_i}{\\sigma}+c_i(x),0\n\\right\\}.\n$$\n\n对应乘子更新为：\n","resources":[]},{"heading":"8. 一般不等式约束的 ALM › 等式约束","line":311,"end":320,"text":"### 等式约束\n\n$$\n\\lambda_i^{k+1}\n=\n\\lambda_i^k\n+\n\\sigma_k c_i(x_{k+1}).\n$$\n","resources":[]},{"heading":"8. 一般不等式约束的 ALM › 不等式约束","line":321,"end":349,"text":"### 不等式约束\n\n$$\n\\mu_i^{k+1}\n=\n\\max\\{\n\\mu_i^k+\\sigma_k c_i(x_{k+1}),\n0\n\\}.\n$$\n\n这个投影式更新直接维护\n\n$$\n\\mu_i^{k+1}\\ge0.\n$$\n\n教材的算法 7.6 还把“约束违反是否已经足够小”作为参数更新逻辑的一部分：\n\n- 若违反度下降得足够好：更新乘子、提高子问题精度，罚因子可保持；\n- 若违反度不够好：暂缓乘子更新并增大罚因子。\n\n所以实际 ALM 是一个双层控制系统：\n\n```text\n内层：近似最小化增广 Lagrangian\n外层：看约束违反 → 更新 multiplier 或 penalty\n```\n","resources":[]},{"heading":"9. 凸问题中的 ALM：原始与对偶同时出现","line":350,"end":367,"text":"## 9. 凸问题中的 ALM：原始与对偶同时出现\n\n教材第 7.2.3 对凸问题给出 ALM 收敛结论。\n\n在相应不精确子问题条件下，如果 Slater 成立，则：\n\n- 乘子序列有界并收敛；\n- 乘子极限是对偶问题的最优解。\n\n如果再有一个非空有界的适当下水平集，则：\n\n- 原始迭代点序列有界；\n- 所有聚点都是原问题最优解。\n\n所以在凸问题中，ALM 的乘子更新不是一个“辅助变量技巧”，而是实实在在地在逼近**对偶最优解**。\n\n教材在基追踪和半定规划中都进一步展示了原始问题与对偶问题两侧的 ALM 结构。\n","resources":[]},{"heading":"10. 原始–对偶结构：从 KKT 到算法","line":368,"end":371,"text":"## 10. 原始–对偶结构：从 KKT 到算法\n\n线性规划写成：\n","resources":[]},{"heading":"10. 原始–对偶结构：从 KKT 到算法 › 原始问题","line":372,"end":382,"text":"### 原始问题\n\n$$\n\\begin{aligned}\n\\min_x\\quad & c^Tx\\\\\n\\text{s.t.}\\quad\n& Ax=b,\\\\\n& x\\ge0.\n\\end{aligned}\n$$\n","resources":[]},{"heading":"10. 原始–对偶结构：从 KKT 到算法 › 对偶问题","line":383,"end":421,"text":"### 对偶问题\n\n$$\n\\begin{aligned}\n\\max_y\\quad & b^Ty\\\\\n\\text{s.t.}\\quad\n& A^Ty+s=c,\\\\\n& s\\ge0.\n\\end{aligned}\n$$\n\nKKT 为：\n\n$$\nAx=b,\n$$\n\n$$\nA^Ty+s=c,\n$$\n\n$$\nx_i s_i=0,\n$$\n\n$$\nx\\ge0,\\quad s\\ge0.\n$$\n\n这里：\n\n- $x$ 是原始变量；\n- $y,s$ 是对偶侧变量；\n- $x_i s_i=0$ 是互补松弛。\n\n**原始–对偶算法**的含义就是：\n\n> 不只更新 $x$，而是把原始可行性、对偶可行性和互补性放进同一套方程一起处理。\n","resources":[]},{"heading":"11. 内点法：先不碰边界，再逐渐逼近互补条件","line":422,"end":483,"text":"## 11. 内点法：先不碰边界，再逐渐逼近互补条件\n\n在线性规划最优解处通常有某些分量\n\n$$\nx_i=0\n$$\n\n或\n\n$$\ns_i=0.\n$$\n\n而内点法在迭代期间保持\n\n$$\nx>0,\n\\qquad\ns>0.\n$$\n\n它不能立即满足\n\n$$\nx_i s_i=0.\n$$\n\n所以教材把互补条件扰动为\n\n$$\nx_i s_i=\\tau,\n\\qquad\n\\tau>0.\n$$\n\n于是得到中心路径方程：\n\n$$\nAx=b,\n$$\n\n$$\nA^Ty+s=c,\n$$\n\n$$\nx_i s_i=\\tau,\n$$\n\n$$\nx>0,\\quad s>0.\n$$\n\n当\n\n$$\n\\tau\\downarrow0,\n$$\n\n这条路径逼近原始 KKT 系统。\n","resources":[]},{"heading":"12. Barrier 视角与中心路径","line":484,"end":515,"text":"## 12. Barrier 视角与中心路径\n\n教材指出中心路径也可以从对数 barrier 问题理解：\n\n$$\n\\begin{aligned}\n\\min_x\\quad\n& c^Tx\n-\n\\tau\\sum_{i=1}^n\\log x_i\\\\\n\\text{s.t.}\\quad\n& Ax=b.\n\\end{aligned}\n$$\n\n这里\n\n$$\n-\\log x_i\n$$\n\n在 $x_i\\downarrow0$ 时趋于 $+\\infty$，所以迭代点被留在严格内部。\n\n随着 $\\tau$ 变小，barrier 逐渐减弱，允许解越来越接近边界上的 LP 最优点。\n\n这和外点罚函数正好形成对照：\n\n| 方法 | 迭代位置 |\n|---|---|\n| 外点罚函数 | 通常在可行域外逐渐逼近 |\n| 内点/barrier | 始终在可行域严格内部移动 |\n","resources":[]},{"heading":"13. 原始–对偶 Newton 系统","line":516,"end":549,"text":"## 13. 原始–对偶 Newton 系统\n\n对扰动 KKT 方程做 Newton 线性化，可以同时求：\n\n$$\n(\\Delta x,\\Delta y,\\Delta s).\n$$\n\n然后更新\n\n$$\nx_{k+1}=x_k+\\alpha\\Delta x,\n$$\n\n$$\ny_{k+1}=y_k+\\alpha\\Delta y,\n$$\n\n$$\ns_{k+1}=s_k+\\alpha\\Delta s.\n$$\n\n步长 $\\alpha$ 必须保证\n\n$$\nx_{k+1}>0,\n\\qquad\ns_{k+1}>0.\n$$\n\n因此内点法虽然使用 Newton 型方向，但还要做“fraction-to-boundary”式的步长控制，防止走出严格内部。\n\n主要计算代价集中在原始–对偶 Newton 线性系统的求解。\n","resources":[]},{"heading":"14. 对偶间隙与中心路径","line":550,"end":577,"text":"## 14. 对偶间隙与中心路径\n\n若 $(x,y,s)$ 同时满足原始和对偶可行性，则\n\n$$\nc^Tx-b^Ty\n=\nx^Ts.\n$$\n\n在中心路径上\n\n$$\nx_i s_i=\\tau,\n$$\n\n因此\n\n$$\nx^Ts=n\\tau.\n$$\n\n这给出了非常直观的停止尺度：\n\n> 当互补乘积和对偶间隙都趋近于零时，原始–对偶对正在逼近 KKT 解。\n\n这里是由教材给出的原始/对偶可行方程与中心路径方程直接推得的代数结果。\n","resources":[]},{"heading":"15. 路径追踪：不是每次从头解 barrier 子问题","line":578,"end":597,"text":"## 15. 路径追踪：不是每次从头解 barrier 子问题\n\n实际算法不会为每一个更小的 $\\tau$ 完全从头求解。\n\n更常见的路径追踪逻辑是：\n\n```text\n选择当前中心参数\n→ Newton 校正到中心路径附近\n→ 降低中心参数\n→ 用当前点 warm start\n→ 重复\n```\n\n这和罚函数 continuation 在结构上有相似之处：\n\n- 都是一系列参数化子问题；\n- 都利用上一阶段解 warm start；\n- 但一个从外侧压向可行域，一个从内部沿中心路径走向边界。\n","resources":[]},{"heading":"16. 三类算法的统一比较","line":598,"end":606,"text":"## 16. 三类算法的统一比较\n\n| 方法 | 核心参数 | 原始可行性 | 对偶变量 | 主要数值问题 |\n|---|---|---|---|---|\n| 二次罚函数 | $\\sigma\\uparrow\\infty$ | 渐近逼近 | 隐式出现 | 大 $\\sigma$ 导致病态 |\n| 精确 $\\ell_1$ 罚函数 | 有限 $\\sigma$ | 可有限参数精确 | 阈值与乘子相关 | 非光滑子问题 |\n| 增广 Lagrangian | $\\sigma$ + $\\lambda_k$ | 通过乘子反馈逼近 | 显式更新 | 内层子问题与参数协调 |\n| 原始–对偶内点 | $\\tau\\downarrow0$ | 维持严格内部 | 显式同时更新 | Newton/KKT 线性系统 |\n","resources":[]},{"heading":"17. 和前后单元的关系 › 来自 Unit 03","line":609,"end":619,"text":"### 来自 Unit 03\n\n本单元算法的终点几乎都在逼近：\n\n- stationarity；\n- primal feasibility；\n- dual feasibility；\n- complementary slackness。\n\n也就是 KKT。\n","resources":[]},{"heading":"17. 和前后单元的关系 › 通往 Unit 06","line":620,"end":630,"text":"### 通往 Unit 06\n\nALM 的很多子问题会包含：\n\n- $\\ell_1$；\n- 投影；\n- indicator function；\n- 非光滑复合结构。\n\n这正是 proximal / splitting / ADMM 的入口。\n","resources":[]},{"heading":"17. 和前后单元的关系 › 通往 Unit 08","line":631,"end":641,"text":"### 通往 Unit 08\n\n第二版第 7.4 节把约束几何推进到流形：\n\n- tangent space；\n- Riemannian gradient；\n- retraction；\n- manifold Newton / trust-region。\n\n这些内容会作为 Unit 08 单独处理。\n","resources":[]},{"heading":"18. 本单元实验","line":642,"end":651,"text":"## 18. 本单元实验\n\n运行：\n\n```bash\npython labs/17_optimization_constrained.py\n```\n\n实验分两组。\n","resources":[]},{"heading":"18. 本单元实验 › A｜二次罚函数 vs 增广 Lagrangian","line":652,"end":667,"text":"### A｜二次罚函数 vs 增广 Lagrangian\n\n问题：\n\n$$\n\\min_x\n\\frac12\\|x-q\\|_2^2\n\\quad\n\\text{s.t. }\na^Tx=b.\n$$\n\n这个问题可以显式求最优解。\n\n实验比较：\n","resources":[]},{"heading":"18. 本单元实验 › A｜二次罚函数 vs 增广 Lagrangian › 纯二次罚函数","line":668,"end":684,"text":"#### 纯二次罚函数\n\n$$\n\\frac12\\|x-q\\|^2\n+\n\\frac{\\sigma}{2}(a^Tx-b)^2.\n$$\n\n随着 $\\sigma$ 增大：\n\n- 约束违反减小；\n- 子问题 Hessian\n  $$\n  I+\\sigma aa^T\n  $$\n  的条件数增大。\n","resources":[]},{"heading":"18. 本单元实验 › A｜二次罚函数 vs 增广 Lagrangian › ALM","line":685,"end":711,"text":"#### ALM\n\n固定一个有限 $\\sigma$，重复：\n\n$$\nx_{k+1}\n=\n\\arg\\min_x\nL_\\sigma(x,\\lambda_k),\n$$\n\n$$\n\\lambda_{k+1}\n=\n\\lambda_k\n+\n\\sigma(a^Tx_{k+1}-b).\n$$\n\n观察：\n\n- 约束违反快速下降；\n- $\\lambda_k$ 逼近真实 KKT 乘子；\n- 内层 Hessian 条件数保持固定。\n\n这正好展示“为什么要从 penalty 走向 ALM”。\n","resources":[]},{"heading":"18. 本单元实验 › B｜原始–对偶中心路径","line":712,"end":753,"text":"### B｜原始–对偶中心路径\n\n线性规划：\n\n$$\n\\begin{aligned}\n\\min_{x_1,x_2}\\quad & x_1+2x_2\\\\\n\\text{s.t.}\\quad\n& x_1+x_2=1,\\\\\n& x_1,x_2\\ge0.\n\\end{aligned}\n$$\n\n最优点在边界：\n\n$$\nx^*=(1,0).\n$$\n\n实验直接解一系列中心路径方程：\n\n$$\nAx=b,\n$$\n\n$$\nA^Ty+s=c,\n$$\n\n$$\nx_i s_i=\\tau,\n$$\n\n并逐步减小 $\\tau$。\n\n观察：\n\n- $x_2\\to0$；\n- $s_1\\to0$；\n- $x^Ts=2\\tau\\to0$；\n- 原始目标和对偶目标逐渐靠拢。\n","resources":[]},{"heading":"19. 练习","line":754,"end":784,"text":"## 19. 练习\n\n1. 对等式约束问题写出二次罚函数，并解释为什么需要逐步增大 $\\sigma$。\n2. 为什么不等式罚函数必须使用 $[c_i(x)]_+$，而不是直接 $c_i(x)^2$？\n3. 教材定理 7.1 为什么在实际中较强？它对子问题解要求了什么？\n4. 解释\n   $$\n   -\\sigma_k c_i(x_{k+1})\\to\\lambda_i^*\n   $$\n   的意义。\n5. 为什么二次罚函数在 $\\sigma\\to\\infty$ 时容易病态？\n6. 精确 $\\ell_1$ 罚函数中的“精确”是什么意思？\n7. 推导等式 ALM 的乘子更新\n   $$\n   \\lambda_{k+1}=\\lambda_k+\\sigma_kc(x_{k+1}).\n   $$\n8. 不等式 ALM 为什么要做\n   $$\n   \\max\\{\\mu_i^k+\\sigma c_i(x),0\\}?\n   $$\n9. 在凸问题中，ALM 的乘子极限为什么可以解释为对偶最优解？\n10. 写出 LP 的原始、对偶和四类 KKT 条件。\n11. 为什么内点法在迭代中不能直接满足 $x_is_i=0$？\n12. 中心路径为什么使用 $x_is_i=\\tau$？\n13. 推导可行原始–对偶点的 gap：\n    $$\n    c^Tx-b^Ty=x^Ts.\n    $$\n14. 外点罚函数和 log-barrier 在“从哪一侧逼近”上有什么根本区别？\n15. 为什么路径追踪和 penalty continuation 都需要 warm start？\n","resources":[]},{"heading":"20. 完成检查","line":785,"end":800,"text":"## 20. 完成检查\n\n进入 Unit 06 前，应能回答：\n\n- 二次罚函数、精确罚函数、ALM 的差别是什么？\n- 为什么 penalty parameter 太大会造成数值困难？\n- ALM 的乘子更新在控制什么？\n- 一般不等式 ALM 怎样保持乘子非负？\n- 原始与对偶变量为什么应该联合看？\n- LP 的 KKT 条件是什么？\n- 内点法为什么维护 $x>0,s>0$？\n- 中心路径和 barrier 子问题是什么关系？\n- 原始–对偶 gap 为什么等于 $x^Ts$？\n- 为什么 ALM 与内点法都可以看成“直接逼近 KKT”，但采用了完全不同的路径？\n\n下一单元：[Unit 06｜复合优化：proximal、加速与分裂](06-composite.md)","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/05-constrained.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/06-composite.md","module":"最优化课程","role":"课程与讲义","title":"Unit 06｜复合优化：近似点、加速与变量分裂","sections":[{"heading":"Unit 06｜复合优化：近似点、加速与变量分裂","line":1,"end":8,"text":"# Unit 06｜复合优化：近似点、加速与变量分裂\n\n> 对应资源：[电子讲义索引的主题 19–25](../optimization-pku-wenzw-lectures.md)；教材第二版第 8.1–8.6 节。这里是独立导学与可复现实验，不替代教材中的定理及其证明。\n>\n> 前置：[Unit 02 的 LASSO 建模](02-modeling.md)、[Unit 03 的复合最优性条件](03-optimality.md)、[Unit 05 的 ALM 与对偶变量](05-constrained.md)。实验：`labs/18_optimization_composite.py`。\n\n> PPA 与 ALM 对偶近似点关系可配合 Unit 05 的 `labs/17_optimization_constrained.py` 中等式约束实验观察；本单元的四算法实验聚焦 LASSO。\n","resources":[]},{"heading":"1. 问题与适用边界","line":9,"end":26,"text":"## 1. 问题与适用边界\n\n考虑\n\n$$\n\\min_{x\\in\\mathbb R^n}\\ \\psi(x)=f(x)+h(x),\n$$\n\n其中本单元的**基本凸情形**是：$f$ 凸且可微、$\\nabla f$ 为 $L$-Lipschitz 连续；$h$ 是适当、闭、凸函数，其 proximal 子问题容易求解；最优解存在。$h$ 可以非光滑，甚至取集合 $C$ 的指示函数 $\\delta_C$。若 $f$ 或 $h$ 非凸，以下凸情形的全局最优和函数值速度结论不可直接搬用。\n\n最优性条件是\n\n$$\n0\\in\\nabla f(x^*)+\\partial h(x^*).\n$$\n\n这个条件同时覆盖 LASSO 的稀疏解和凸约束问题的投影解。它说明算法不必对整个 $f+h$ 求普通梯度。\n","resources":[]},{"heading":"2. Proximal operator：把非光滑项做成一个步骤","line":27,"end":54,"text":"## 2. Proximal operator：把非光滑项做成一个步骤\n\n对 $t>0$，定义\n\n$$\n\\operatorname{prox}_{th}(v)\n=\\arg\\min_u\\left\\{h(u)+\\frac{1}{2t}\\|u-v\\|_2^2\\right\\}.\n$$\n\n在上述闭凸假设下，二次项使子问题强凸，因此 prox 单值。其一阶条件为\n\n$$\n\\frac{v-u}{t}\\in\\partial h(u),\\qquad u=\\operatorname{prox}_{th}(v).\n$$\n\n两个必须手推的例子：\n\n- $h=\\delta_C$ 且 $C$ 非空闭凸时，$\\operatorname{prox}_{t\\delta_C}(v)=\\Pi_C(v)$。\n- $h(u)=\\lambda\\|u\\|_1$ 时，$\\operatorname{prox}_{th}(v)_j=\\operatorname{sign}(v_j)(|v_j|-t\\lambda)_+$，即 soft threshold。\n\n**非例与边界。** 对非凸集合做投影可能多值；一般非凸 $h$ 的 prox 也可能多值。此时不能沿用“单值且非扩张”的闭凸理论。Moreau envelope\n\n$$\nh_t(v)=\\min_u\\left\\{h(u)+\\frac{1}{2t}\\|u-v\\|^2\\right\\}\n$$\n\n在闭凸情形下可微，且 $\\nabla h_t(v)=(v-\\operatorname{prox}_{th}(v))/t$。它把一个非光滑凸函数关联到平滑近似，但改变 $t$ 会改变该近似。\n","resources":[]},{"heading":"3. ISTA：线性化 $f$，保留 $h$","line":55,"end":84,"text":"## 3. ISTA：线性化 $f$，保留 $h$\n\n在 $x_k$ 处把 $f$ 用一阶模型加二次项近似，取 $0\u003ct\\le 1/L$：\n\n$$\nx_{k+1}=\\operatorname{prox}_{th}\\bigl(x_k-t\\nabla f(x_k)\\bigr).\n$$\n\n这是 proximal gradient；用于 LASSO 时常称 ISTA。对\n\n$$\nf(x)=\\tfrac12\\|Ax-b\\|_2^2,\\quad h(x)=\\lambda\\|x\\|_1,\n$$\n\n有 $L=\\|A\\|_2^2$，因此一步是\n\n$$\nx_{k+1}=S_{t\\lambda}\\bigl(x_k-tA^T(Ax_k-b)\\bigr).\n$$\n\n实际不知道 $L$ 时，可用检查复合目标充分下降的回溯线搜索；不能任意增大步长并仍声称收敛。在上述凸、光滑及存在最优解的条件下，固定 $t=1/L$ 的标准函数值界为 $\\psi(x_k)-\\psi^*=O(1/k)$。这不是每一步目标都以固定比例下降的断言。\n\n**停止准则。** 采用 proximal gradient mapping\n\n$$\nG_t(x)=\\frac{x-\\operatorname{prox}_{th}(x-t\\nabla f(x))}{t}.\n$$\n\n在本节凸假设下，$G_t(x)=0$ 等价于复合一阶最优性；记录 $\\|G_t(x_k)\\|$ 比只记录 $\\|x_{k+1}-x_k\\|$ 更有可解释性。小残差是数值证据，不等于证明已找到精确解。\n","resources":[]},{"heading":"4. FISTA：外推与它的条件","line":85,"end":98,"text":"## 4. FISTA：外推与它的条件\n\n取 $t=1/L$，$x_0=y_0$，$q_0=1$：\n\n$$\n\\begin{aligned}\nx_{k+1}&=\\operatorname{prox}_{th}(y_k-t\\nabla f(y_k)),\\\\\nq_{k+1}&=\\frac{1+\\sqrt{1+4q_k^2}}{2},\\\\\ny_{k+1}&=x_{k+1}+\\frac{q_k-1}{q_{k+1}}(x_{k+1}-x_k).\n\\end{aligned}\n$$\n\n在本节凸问题、正确步长及精确 prox 的条件下，函数值有 $O(1/k^2)$ 的标准上界；相同条件下 ISTA 是 $O(1/k)$。这比较的是理论上界，不能据一次实验断言 FISTA 在所有数据或所有迭代上更快。基础 FISTA 的目标值也**不要求逐步单调**。重启、单调变体及回溯需要各自的更新与分析，不能把它们混作上式的无条件性质。\n","resources":[]},{"heading":"5. Proximal point 与 Unit 05 的 ALM","line":99,"end":124,"text":"## 5. Proximal point 与 Unit 05 的 ALM\n\n对适当闭凸函数 $F$，proximal point algorithm (PPA) 为\n\n$$\nx_{k+1}=\\operatorname{prox}_{t_kF}(x_k).\n$$\n\n每步求解的是带二次正则的完整子问题；这和 ISTA 仅对 $h$ 做 prox、对 $f$ 做梯度步不同。精确 PPA 的收敛需要最优解存在及适当的正步长条件；实际内层子问题不精确时还需控制误差。\n\n对 Unit 05 的等式约束问题，取 $L_\\rho(x,\\lambda)=f(x)+\\lambda^T(Ax-b)+(\\rho/2)\\|Ax-b\\|^2$，精确 ALM 更新为\n\n$$\nx_{k+1}\\in\\arg\\min_x L_\\rho(x,\\lambda_k),\\qquad\n\\lambda_{k+1}=\\lambda_k+\\rho(Ax_{k+1}-b).\n$$\n\n在凸性、对偶最优解存在以及适当强对偶条件下，该乘子更新可解释为在**凹对偶函数** $d$ 上做 proximal point：\n\n$$\n\\lambda_{k+1}\\in\\arg\\max_\\lambda\n\\left\\{d(\\lambda)-\\frac{1}{2\\rho}\\|\\lambda-\\lambda_k\\|^2\\right\\}.\n$$\n\n符号方向取决于 Unit 05 的约定 $L=f+\\lambda^T(Ax-b)$。这一关系解释乘子为何也可被视为优化变量；它并不表示有限精度内层求解时上述等式仍无误差成立。\n","resources":[]},{"heading":"6. BCD：利用块结构","line":125,"end":142,"text":"## 6. BCD：利用块结构\n\n将 $x=(x_1,\\ldots,x_p)$，循环 BCD 每步只更新一块：\n\n$$\nx_i^{k+1}\\in\\arg\\min_{u_i}\n\\psi(x_1^{k+1},\\ldots,x_{i-1}^{k+1},u_i,x_{i+1}^{k},\\ldots,x_p^k).\n$$\n\n顺序可循环或随机；收敛断言必须同时说明凸性、块子问题可解性、更新精度与选块规则。LASSO 的坐标子问题有 soft threshold 闭式解。若 $a_j$ 是 $A$ 的第 $j$ 列、$r=Ax-b$，则\n\n$$\nx_j^{\\rm new}=S_{\\lambda/\\|a_j\\|^2}\n\\left(x_j-\\frac{a_j^Tr}{\\|a_j\\|^2}\\right),\\quad a_j\\ne0.\n$$\n\n每次只改一个坐标后同步更新残差，避免重复计算 $Ax$。对于非凸字典学习等问题，“每块目标下降”不能推出全局最优；块最优、驻点和全局解须区分。\n","resources":[]},{"heading":"7. 对偶分解与 ADMM","line":143,"end":166,"text":"## 7. 对偶分解与 ADMM\n\n对 $\\min f(x)+g(z)$ 且 $Ax+Bz=c$，Lagrangian 为\n\n$$\n\\mathcal L(x,z,\\lambda)=f(x)+g(z)+\\lambda^T(Ax+Bz-c).\n$$\n\n当固定 $\\lambda$ 时的两个内层极小化可以分开，对偶函数由此构造。对偶可行和对偶目标进展并不自动给出原始可行解；还须检查 $Ax+Bz-c$ 并说明原始解恢复方式。\n\nADMM 将 Unit 05 的 ALM 内层联合求解改成交替步骤。用 scaled dual variable $u=\\lambda/\\rho$，$\\rho>0$：\n\n$$\n\\begin{aligned}\nx^{k+1}&\\in\\arg\\min_x f(x)+\\frac\\rho2\\|Ax+Bz^k-c+u^k\\|^2,\\\\\nz^{k+1}&\\in\\arg\\min_z g(z)+\\frac\\rho2\\|Ax^{k+1}+Bz-c+u^k\\|^2,\\\\\nu^{k+1}&=u^k+Ax^{k+1}+Bz^{k+1}-c.\n\\end{aligned}\n$$\n\nLASSO 采用 $x=z$ 分裂：$f(x)=\\tfrac12\\|Ax-b\\|^2$、$g(z)=\\lambda\\|z\\|_1$。此时 $x$ 步解正定线性系统，$z$ 步为 $S_{\\lambda/\\rho}(x^{k+1}+u^k)$。应同时记录原始残差 $r^{k+1}=x^{k+1}-z^{k+1}$ 与对偶残差 $s^{k+1}=\\rho(z^{k+1}-z^k)$ 的范数；后者符号对范数无影响。仅看目标值不足以证明分裂约束满足。\n\n经典两块凸 ADMM 的收敛还要求适当的闭凸性、鞍点存在和子问题可解/足够精确等前提；非凸、多块直接推广或任意调节 $\\rho$ 均不由该结论保证。\n","resources":[]},{"heading":"8. 同题实验与失败案例","line":167,"end":180,"text":"## 8. 同题实验与失败案例\n\n运行：\n\n```bash\npython labs/18_optimization_composite.py --iterations 250 --csv unit06-history.csv\n```\n\n脚本固定随机种子生成 $80\\times24$ 的 LASSO 问题，对同一 $A,b,\\lambda$ 运行 ISTA、FISTA、cyclic coordinate descent 和 ADMM。每轮输出到 CSV 的指标是目标值、$\\|G_{1/L}(x)\\|$；ADMM 另记录原始及对偶残差。坐标下降的一轮是一个完整 sweep，其他算法的一轮是各自一次更新，因此**迭代数不是等计算量比较**。ADMM 在 $x\\ne z$ 时以稀疏候选 $z$ 计算原目标，仍须结合分裂残差判断。\n\n脚本还展示一个明确失败案例：对 $f(x)=x^2/2$，普通梯度法若用 $t=2.2>2/L$，有 $x_{k+1}=-1.2x_k$，从 $x_0=1$ 出发绝对值增长。它说明步长前提的重要性；不代表所有超出 $1/L$ 的步长都必然发散。\n\n实验能验证实现和观察机制，不能代替凸收敛定理，也不能给这四种算法作普遍速度排名。\n","resources":[]},{"heading":"9. 完成检查","line":181,"end":192,"text":"## 9. 完成检查\n\n1. 从 prox 子问题的一阶条件推导 soft threshold 与投影；说明非凸投影可能多值。\n2. 写出 LASSO 的复合最优性条件与 $G_t(x)$，解释为什么 $G_t(x)=0$。\n3. 说明 ISTA 与 FISTA 的两个函数值上界各依赖什么条件；解释 FISTA 目标为何可能不单调。\n4. 说明 PPA 与 ISTA 的 prox 对象有什么不同，以及 ALM 的对偶 PPA 解释依赖哪些条件。\n5. 手推 LASSO 一个坐标的更新，并说明零列为何需要特殊处理。\n6. 写出 $x=z$ 分裂下 ADMM 的三个步骤，分别解释 $r$ 和 $s$。\n7. 运行实验并检查四种方法的目标与 proximal gradient 残差；改变 $\\lambda$ 或 $\\rho$ 后重新解释结果。\n8. 解释为什么非凸问题的块下降或单次 LASSO 数值实验，都不能推出全局收敛。\n\n下一单元：[Unit 07｜随机与非光滑高级算法](../optimization-pku-wenzw-study-roadmap.md)。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/06-composite.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/07-stochastic-nonsmooth.md","module":"最优化课程","role":"课程与讲义","title":"Unit 07｜随机与非光滑优化","sections":[{"heading":"Unit 07｜随机与非光滑优化","line":1,"end":4,"text":"# Unit 07｜随机与非光滑优化\n\n> **状态：内容草稿，未核验。** 本页依据现有[电子讲义索引](../optimization-pku-wenzw-lectures.md)中的主题 10、11、26、27，以及课程总览所登记的教材第二版第 6.3、8.7–8.8 节组织。尚未逐页核对 PDF 或教材原文；下面的公式是待审教学推导，不应归称为某一讲义的原文结论。\n","resources":[]},{"heading":"1. 四类问题与算法边界","line":5,"end":13,"text":"## 1. 四类问题与算法边界\n\n| 情形 | 基本模型 | 本页方法 | 不应混淆的性质 |\n|---|---|---|---|\n| 凸非光滑 | $\\min f(x)$，$g\\in\\partial f(x)$ | 次梯度法 | 不要求逐步下降 |\n| 有限和 | $F(x)=N^{-1}\\sum_i f_i(x)$ | SGD、方差减小 | 单样本梯度不是全梯度 |\n| 复合目标 | $\\min f(x)+h(x)$ | 近端梯度，见 [Unit 06](06-composite.md) | 次梯度更新不利用可计算 prox |\n| 非光滑方程 | $H(x)=0$ | 半光滑 Newton | 局部快收敛需正则性，不能推广为全局保证 |\n","resources":[]},{"heading":"1. 四类问题与算法边界 › 1.1 次梯度","line":14,"end":21,"text":"### 1.1 次梯度\n\n对凸函数 $f$，$g\\in\\partial f(x)$ 意味着对任意 $y$，有 $f(y)\\ge f(x)+\\langle g,y-x\\rangle$。一个基本迭代为\n\n$$x_{k+1}=x_k-\\alpha_k g_k,\\qquad g_k\\in\\partial f(x_k).$$\n\n常见的递减步长分析需要 $\\alpha_k>0$、$\\sum_k\\alpha_k=\\infty$ 与 $\\sum_k\\alpha_k^2\u003c\\infty$，同时还需最优解存在、次梯度有界等前提。固定步长通常只能给出与步长有关的邻域界；函数值可上下波动。对 LASSO，若 $\\ell_1$ 的 prox 易算，应先解释为何仍要选普通次梯度法。\n","resources":[]},{"heading":"1. 四类问题与算法边界 › 1.2 SGD 与方差减小","line":22,"end":31,"text":"### 1.2 SGD 与方差减小\n\n若 $i_k$ 在 $\\{1,\\ldots,N\\}$ 均匀抽取且抽样独立于当前状态，$\\nabla f_{i_k}(x_k)$ 是 $\\nabla F(x_k)$ 的无偏估计。由此不能推出单步下降；学习率、噪声方差、凸性和光滑性决定可声明的收敛性质。mini-batch 改变每步计算量与估计方差，比较时应同时报告数据遍历次数与计算成本。\n\n以 snapshot $\\tilde x$ 和全梯度 $\\mu=\\nabla F(\\tilde x)$ 为例，SVRG 型修正方向为\n\n$$v_k=\\nabla f_{i_k}(x_k)-\\nabla f_{i_k}(\\tilde x)+\\mu.$$\n\n在上述均匀抽样条件下，$\\mathbb E[v_k\\mid x_k]=\\nabla F(x_k)$。形成 $\\mu$ 要遍历数据，因此不能只比较每个内循环步骤。具体速度结论还依赖强凸性、光滑性及步长/epoch 长度。\n","resources":[]},{"heading":"1. 四类问题与算法边界 › 1.3 半光滑 Newton","line":32,"end":43,"text":"### 1.3 半光滑 Newton\n\n对局部 Lipschitz 的映射 $H$，可从广义 Jacobian 中选取 $V_k$，求解 $V_kd_k=-H(x_k)$ 并更新 $x_{k+1}=x_k+d_k$。典型例子是互补或 proximal 最优性方程；$\\max(0,x)$ 的广义导数在零点是一个集合。所选矩阵可解、解附近半光滑和适当非奇异性是局部快收敛论证的关键。初值远离解时还需 merit function、线搜索或信赖域等全局化机制。本页不宣称这些条件已经对具体应用证明。\n\n**可手推的标量例子。** 取 $f(x)=\\tfrac12(2x-1)^2$、$h(x)=0.3|x|$、$t=0.1$，将复合最优性写成 fixed-point 方程\n\n$$H(x)=x-\\operatorname{prox}_{th}\\bigl(x-tf'(x)\\bigr)=x-S_{0.03}(0.6x+0.2)=0.$$\n\n$S_\\tau$ 为 soft threshold。这个 $H$ 是分段仿射的；在 $|0.6x+0.2|>0.03$ 的活动区，广义导数可取 $0.4$，在非活动区取 $1$，在折点可取 $[0.4,1]$ 中的元素。最优点 $x^*=0.425$ 可由正半轴上的一阶条件 $4x-2+0.3=0$ 直接核对。实验从 $x_0=-1$ 对照普通 proximal fixed-point 迭代与 $x_{k+1}=x_k-H(x_k)/V_k$；这里只展示一个低维、分段仿射情形，不能推出一般半光滑 Newton 的速度。\n\n另设不同方程 $Q(x)=\\max(x,0)-1$。从 $x_0=-1$ 出发，$Q(x_0)=-1$ 而该点的导数为零，Newton 线性方程无法求解。这说明非奇异性前提的作用；它不是上述 LASSO 方程的失败结果。\n","resources":[]},{"heading":"2. 教学实验设计与失败案例","line":44,"end":51,"text":"## 2. 教学实验设计与失败案例\n\n[实验脚本](https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/labs/19_optimization_stochastic_nonsmooth.py)包含三组：LASSO 次梯度与近端梯度；有限和 logistic 损失的全梯度、SGD 与 snapshot 方差减小；上述标量方程的 proximal fixed-point 与半光滑 Newton 对照，以及奇异导数停止例。新增部分尚未运行，没有数值结果可报告。\n\n[运行记录模板](../optimization-pku-wenzw-unit07-run-log.md)预留环境、逐步残差、停止行为和来源页码；当前只有解析基准，尚无实测输出。\n\n预设失败情形：固定较大学习率的 SGD 可能在最优点附近持续波动；高方差或未标准化特征可能放大该现象。实际表现需以运行记录为准，不能把预设失败写成已观察结果。\n","resources":[{"label":"https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/labs/19_optimization_stochastic_nonsmooth.py)包含三组：LASSO","url":"https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/labs/19_optimization_stochastic_nonsmooth.py)包含三组：LASSO"}]},{"heading":"3. 来源到主张的审阅表","line":52,"end":60,"text":"## 3. 来源到主张的审阅表\n\n| 待审主张 | 登记来源 | 后续核对 |\n|---|---|\n| 次梯度定义、步长前提 | 主题 10–11；教材 6.3 | 逐页核对符号、定理前提与结论 |\n| SGD、mini-batch、方差减小 | 主题 26；教材 8.7 | 区分凸、强凸、非凸结论 |\n| 半光滑与广义 Jacobian | 主题 27；教材 8.8；本页标量例子为独立教学构造 | 核对讲义中的定义、局部正则性与全局化条件；运行并保存脚本原始输出 |\n\n完成本单元的依据应是来源页码、手推、可复跑运行记录与失败说明；目前仅形成待审内容和实验入口。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/07-stochastic-nonsmooth.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/08-manifold.md","module":"最优化课程","role":"课程与讲义","title":"Unit 08｜流形约束优化","sections":[{"heading":"Unit 08｜流形约束优化","line":1,"end":4,"text":"# Unit 08｜流形约束优化\n\n> **状态：内容草稿，未核验。** 来源入口为课程总览登记的教材第二版第 7.4 节，以及 [ARNT](https://github.com/optsuite/ARNT)、[OptM](https://github.com/optsuite/OptM) 两个代码仓库。现有 optbook 讲义索引没有独立的流形优化 PDF；这里没有推测其 URL。教材正文与代码未在本批阅读或运行。\n","resources":[{"label":"https://github.com/optsuite/ARNT)、[OptM](https://github.com/optsuite/OptM","url":"https://github.com/optsuite/ARNT)、[OptM](https://github.com/optsuite/OptM"}]},{"heading":"1. 从正交约束到切空间","line":5,"end":14,"text":"## 1. 从正交约束到切空间\n\n球面 $\\mathcal S^{n-1}=\\{x\\in\\mathbb R^n:\\|x\\|_2=1\\}$ 的切空间是 $T_x\\mathcal S^{n-1}=\\{\\xi:x^T\\xi=0\\}$。在欧氏诱导度量下，欧氏梯度 $\\nabla f(x)$ 的切向投影为\n\n$$\\operatorname{grad}f(x)=(I-xx^T)\\nabla f(x).$$\n\nStiefel 集合 $\\mathrm{St}(n,p)=\\{X:X^TX=I_p\\}$ 的切向条件为 $X^T\\Xi+\\Xi^TX=0$。对欧氏诱导度量，可用 $\\nabla f(X)-X\\operatorname{sym}(X^T\\nabla f(X))$ 表示 Riemannian gradient。不同度量会改变梯度表达式，因此引用实现时必须记录其度量约定。\n\n**非例。** 直接作 $x-\\alpha\\nabla f(x)$ 通常离开球面；把该点归一化是一次回到流形的操作，不能把原始欧氏步长当成流形上的向量。\n","resources":[]},{"heading":"2. Retraction 与一阶算法","line":15,"end":22,"text":"## 2. Retraction 与一阶算法\n\n在球面上取 $R_x(\\xi)=(x+\\xi)/\\|x+\\xi\\|$（在分母非零的局部定义域内）。它满足 $R_x(0)=x$，且沿切向量的一阶导数为恒等。Riemannian gradient descent 可写作\n\n$$x_{k+1}=R_{x_k}\\bigl(-\\alpha_k\\operatorname{grad}f(x_k)\\bigr).$$\n\nRetraction 是局部几何近似；它不等同于一般情况下的指数映射。若使用 Armijo 条件或非单调搜索，应说明比较的是 retraction 曲线上的函数值。向量传输用于在不同切空间比较方向，不能直接将两个切向量当作处于同一线性空间。\n","resources":[]},{"heading":"3. 可手推的特征向量模型","line":23,"end":32,"text":"## 3. 可手推的特征向量模型\n\n令 $A=A^T$，考虑 $\\min_{\\|x\\|=1}f(x)=x^TAx$。有 $\\nabla f(x)=2Ax$，故\n\n$$\\operatorname{grad}f(x)=2\\bigl(Ax-(x^TAx)x\\bigr).$$\n\n驻点满足 $Ax=(x^TAx)x$，即为特征向量；全局最小值是 $A$ 的最小特征值。**驻点并不都对应全局最小值**，最大特征向量也是驻点。这一模型可把 [Unit 03](03-optimality.md) 的一阶必要条件与流形几何联系起来。\n\n[实验脚本](https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/labs/20_optimization_manifold.py)拟从不同初值比较 Riemannian gradient 与最小特征值，并记录切向残差。它尚未运行；若初始化在其他特征向量，梯度为零却不对应全局最小值，这是预设的失败案例，不是已观测结果。\n","resources":[{"label":"https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/labs/20_optimization_manifold.py)拟从不同初值比较","url":"https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/labs/20_optimization_manifold.py)拟从不同初值比较"}]},{"heading":"3. 可手推的特征向量模型 › 3.1 Stiefel 上的两个特征向量","line":33,"end":42,"text":"### 3.1 Stiefel 上的两个特征向量\n\n将球面例子扩展为 $X\\in\\mathrm{St}(n,p)$ 上的\n\n$$\\min_{X^TX=I_p} F(X)=\\operatorname{tr}(X^TAX),\\qquad A=A^T.$$\n\n在欧氏诱导度量下，$\\nabla F(X)=2AX$，所以 $\\operatorname{grad}F(X)=2AX-X\\operatorname{sym}(2X^TAX)=2(AX-XX^TAX)$。全局最小目标值是 $A$ 最小的 $p$ 个特征值之和。若最小 $p$ 维子空间与其余谱分离，可以用投影矩阵距离 $\\|XX^T-U_{\\min}U_{\\min}^T\\|_F$ 度量所求**子空间**；直接比较 $X$ 和 $U_{\\min}$ 的元素会把同一子空间的不同正交基误判为误差。\n\n教学脚本增加 $p=2$ 的例子，用带列符号校正的 thin QR 将切向步映回 Stiefel，并同时记录目标、切向梯度范数、$\\|X^TX-I\\|_F$ 及子空间距离。以最大特征值对应的二维子空间初始化时，它也是驻点，但不对应全局最小值；这是**预设**的非最优驻点例，仍待运行记录。QR retraction 的实现与教材/ARNT/OptM 的具体约定未逐项对照。\n","resources":[]},{"heading":"4. 来源与待核对项","line":43,"end":51,"text":"## 4. 来源与待核对项\n\n| 概念或主张 | 登记来源 | 待核对 |\n|---|---|---|\n| 流形、切空间、retraction、向量传输、一二阶方法 | 教材第二版 7.4 目录 | 逐页核对定义、符号、算法假设与收敛论证 |\n| ARNT、OptM 的实现与适用范围 | 上述代码仓库 | 版本、许可证、实际接口与数值结果；不能推断独立讲义存在 |\n| 球面与 Stiefel Rayleigh quotient 教学模型 | 本页手推 | 脚本复跑、驻点分类、QR retraction 与不同初值边界 |\n\n本页只建立独立学习入口；[运行记录模板](../optimization-pku-wenzw-unit08-run-log.md)尚未填入实测结果，教材、代码和数值验收均待完成。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/08-manifold.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/09-applications.md","module":"最优化课程","role":"课程与讲义","title":"Unit 09｜三个端到端优化应用","sections":[{"heading":"Unit 09｜三个端到端优化应用","line":1,"end":6,"text":"# Unit 09｜三个端到端优化应用\n\n> **状态：三个教学合成数据项目已完成单一种子的基线与压力运行。** 本页给出来源页码、模型差异和实测失败案例；[完整运行记录](../optimization-pku-wenzw-unit09-run-log.md)与[原始 CSV](https://github.com/Jaycob-jh/math-atlas/tree/math-changed-world/mathematics-changed-the-world/labs/records/unit09)保留逐步证据。运行成功不等于现实数据验证。\n\n来源为文再文等《最优化：建模、算法与理论》第二版[官方草稿 PDF](http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/opt2.pdf)。下文先列正文印刷页码，再列 PDF 文件页码；两者相差 18 页。\n","resources":[{"label":"https://github.com/Jaycob-jh/math-atlas/tree/math-changed-world/mathematics-changed-the-world/labs/records/unit09)保留逐步证据。运行成功不等于现实数据验证","url":"https://github.com/Jaycob-jh/math-atlas/tree/math-changed-world/mathematics-changed-the-world/labs/records/unit09)保留逐步证据。运行成功不等于现实数据验证"},{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/opt2.pdf)。下文先列正文印刷页码，再列","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/opt2.pdf)。下文先列正文印刷页码，再列"}]},{"heading":"A. 稀疏重建：LASSO","line":7,"end":16,"text":"## A. 稀疏重建：LASSO\n\n**来源。** §3.2.3，书页 90–92／PDF 108–110；近端梯度 §8.1.2，384／402；FISTA §8.2，394／412。\n\n教学脚本从 $m\u003cn$ 的线性观测 $b=Ax^\\star+\\varepsilon$ 估计稀疏信号，使用高斯合成测量矩阵、列归一化和固定种子。目标是\n\n$$\\min_x \\frac{1}{2m}\\|Ax-b\\|_2^2+\\lambda\\|x\\|_1.$$\n\n书中的平方损失未除以 $m$；本实验的 $\\lambda=0.002$ 不能脱离损失缩放直接和书中参数比较。比较 ISTA 与 FISTA，固定 250 步。基线两法相对恢复误差均约 0.116，支持集差异为 0，proximal gradient mapping 约为 $10^{-14}$–$10^{-12}$。压力条件只使第二列近乎第一列，保留同一原始观测噪声；两法误差升至 0.655、0.692，支持集差异仍为 0。这说明支持集正确和最优性残差小均不足以保证系数幅值恢复。早期 $\\lambda=0.015$ 探索的基线误差约 0.779，也记录了模型参数选择失败。代码：[项目 A](https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/labs/21_optimization_sparse_recovery.py)。\n","resources":[{"label":"项目 A","url":"https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/labs/21_optimization_sparse_recovery.py"}]},{"heading":"B. 二值分类：正则化 logistic regression","line":17,"end":26,"text":"## B. 二值分类：正则化 logistic regression\n\n**来源。** §3.3，书页 93–94／PDF 111–112；SGD §8.7.1，498／516；应用 §8.7.2，505／523。\n\n脚本在合成二分类数据上比较全批量梯度法与 SGD。标签 $y_i\\in\\{-1,1\\}$，目标为\n\n$$\\min_{w,c}\\;\\frac1N\\sum_{i=1}^N\\log(1+e^{-y_i(x_i^Tw+c)})+\\frac\\lambda2\\|w\\|_2^2.$$\n\n脚本采用平均损失、额外的不正则化截距，和教材模型的求和及参数约定有别。固定划分、种子及 40 epoch 后，基线测试准确率两法均为 0.842。压力条件将一列特征乘以 100：全梯度准确率降至 0.517；SGD 仍为 0.842，但测试损失约 0.707、全梯度范数约 6.24，不可视为已收敛。放大特征既改变优化几何，也改变固定 $\\ell_2$ 正则项在原始特征尺度上的相对作用，因此不能仅归因于条件数。代码：[项目 B](https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/labs/22_optimization_logistic.py)。\n","resources":[{"label":"项目 B","url":"https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/labs/22_optimization_logistic.py"}]},{"heading":"C. 相位恢复：幅值平方观测","line":27,"end":36,"text":"## C. 相位恢复：幅值平方观测\n\n**来源。** §3.6，书页 100–102／PDF 118–120；实数模型见式 (3.6.4)，书页 102／PDF 120。谱初始化仅借鉴 [Candès 等的原始论文](https://arxiv.org/abs/1407.1065)思路，本脚本并非该论文理论算法的复现。\n\n脚本在实数高斯测量下生成 $b_i=(a_i^Tx^\\star)^2+\\varepsilon_i$，优化\n\n$$\\min_x\\;\\frac{1}{4m}\\sum_i\\bigl((a_i^Tx)^2-b_i\\bigr)^2.$$\n\n教材式 (3.6.4) 使用无噪声强度 $b_i^2$；脚本在**平方观测值**上加高斯噪声，并另行缩放目标。比较谱初始化和随机初始化后的同一回溯梯度下降。由于 $x^\\star$ 与 $-x^\\star$ 不可区分，报告符号不变误差。基线 250 步后两者均约 0.00216。压力条件同时将样本数 240 降至 24、噪声标准差 0.02 升至 0.3；谱/随机误差分别为 1.048/1.075，均未恢复真值。随机初始化的目标值反而更低（0.0553 对 0.0676），表明目标值和真值误差不可混同；这次联合压力不能分离欠采样与噪声的贡献。代码：[项目 C](https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/labs/23_optimization_phase_retrieval.py)。\n","resources":[{"label":"https://arxiv.org/abs/1407.1065)思路，本脚本并非该论文理论算法的复现","url":"https://arxiv.org/abs/1407.1065)思路，本脚本并非该论文理论算法的复现"},{"label":"项目 C","url":"https://github.com/Jaycob-jh/math-atlas/blob/math-changed-world/mathematics-changed-the-world/labs/23_optimization_phase_retrieval.py"}]},{"heading":"证据范围","line":37,"end":39,"text":"## 证据范围\n\n六次运行均使用种子 20260927，Python 3.12.14、NumPy 2.3.5，退出码均为 0。原始 CSV、命令、脚本与 CSV 哈希以及逐方法末行见[运行记录](../optimization-pku-wenzw-unit09-run-log.md)。这些是单一种子、固定预算的合成数据观察；尚无跨种子不确定性估计或真实数据外部验证。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/09-applications.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/10-formalization.md","module":"最优化课程","role":"课程与讲义","title":"Unit 10｜Lean4 形式化验证入口","sections":[{"heading":"Unit 10｜Lean4 形式化验证入口","line":1,"end":4,"text":"# Unit 10｜Lean4 形式化验证入口\n\n> **状态：学习与证明义务草稿。** 现有资源入口：[Optlib](https://github.com/optsuite/optlib)、[ReasLab](https://reaslab.io/)、[ReasBook](https://github.com/optpku/ReasBook)、[中文教学页](http://faculty.bicmr.pku.edu.cn/~wenzw/formal/index.html)。本批未读取其当前代码版本、未安装工具链、未编译 Lean 文件，因此不列出“已机器证明”的命题。\n","resources":[{"label":"https://github.com/optsuite/optlib)、[ReasLab](https://reaslab.io/)、[ReasBook](https://github.com/optpku/ReasBook)、[中文教学页](http://faculty.bicmr.pku.edu.cn/~wenzw/formal/index.html)。本批未读取其当前代码版本、未安装工具链、未编译","url":"https://github.com/optsuite/optlib)、[ReasLab](https://reaslab.io/)、[ReasBook](https://github.com/optpku/ReasBook)、[中文教学页](http://faculty.bicmr.pku.edu.cn/~wenzw/formal/index.html)。本批未读取其当前代码版本、未安装工具链、未编译"}]},{"heading":"1. 从纸笔陈述到机器命题","line":5,"end":12,"text":"## 1. 从纸笔陈述到机器命题\n\n优先选一个范围小而条件清楚的命题。例：对非空闭凸集 $C\\subseteq\\mathbb R^n$，欧氏投影 $p=\\Pi_C(x)$ 满足\n\n$$\\langle x-p,y-p\\rangle\\le 0\\quad(\\forall y\\in C).$$\n\n形式化前须固定：空间与内积的类型、闭性和凸性的定义、投影存在唯一性的前提、投影记号及量词范围。只把纸笔公式改写成 theorem statement，仍不是证明；依赖库引理时应说明其确切版本与导入路径。\n","resources":[]},{"heading":"2. 建议顺序","line":13,"end":19,"text":"## 2. 建议顺序\n\n1. 在已固定 Lean/toolchain 版本的项目里重现一个库中现成的凸集或投影例子，并保存编译日志。\n2. 手推上面的投影变分不等式，列出每个使用的假设；在 Lean 中分别写 definition、statement、proof。\n3. 对照 [Unit 03](03-optimality.md) 的一阶最优性条件，说明纸笔与形式化陈述是否完全一致。\n4. 仅在简单命题真正编译后扩展到梯度下降、proximal gradient、BCD 或 ADMM 的局部引理。不同算法的收敛定理不共用一套未声明的假设。\n","resources":[]},{"heading":"3. 逐项验收记录","line":20,"end":29,"text":"## 3. 逐项验收记录\n\n| 项 | 需要保存的证据 | 当前状态 |\n|---|---|---|\n| 数学命题与假设 | 来源章节/页码、纸笔证明 | 待阅读、待编写 |\n| Lean definition / theorem | 文件路径、精确 import、工具链版本 | 待编写 |\n| 机器检查 | `lake env lean` 或项目指定命令的退出码与完整日志 | **未运行** |\n| 语义一致性 | 纸笔与 Lean 的量词、条件、结论逐项对照 | 待核对 |\n\n不允许为使证明通过而静默加强假设、弱化结论，或把 `sorry`/外部自动生成的未检查文本记为 machine-checked proof。形式化资源目前是学习入口，不是本仓库内容已获形式化验收的证据。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-study-units/10-formalization.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-unit07-10-source-map.md","module":"最优化课程","role":"课程与讲义","title":"Unit 07–10｜资料、页面与验证队列","sections":[{"heading":"Unit 07–10｜资料、页面与验证队列","line":1,"end":15,"text":"# Unit 07–10｜资料、页面与验证队列\n\n> 2026-09-27 建立初版，随后补入 Unit 09 来源页码与实测证据。按已有 [optbook 讲义索引](optimization-pku-wenzw-lectures.md)、[课程资源页](optimization-pku-wenzw.md)和[学习路线](optimization-pku-wenzw-study-roadmap.md)建立映射；各行分别记录已阅读与待验证状态。总库此前的 [120 行覆盖基线](../coverage-matrix.md)仍为当时快照，不代表全部资料已审读。\n\n| 资料或模型入口 | 已阅读证据 | 对应页面/实验 | 待验证项 |\n|---|---|---|---|\n| [次梯度](optimization-pku-wenzw-lectures.md)、[次梯度算法](optimization-pku-wenzw-lectures.md)，教材第二版 6.3 | 仅有既有目录和索引；本批未逐页阅读 | [Unit 07](optimization-pku-wenzw-study-units/07-stochastic-nonsmooth.md)、`labs/19_optimization_stochastic_nonsmooth.py` | 具体 PDF 页码、步长条件、定理适用范围；运行输出 |\n| [随机优化、半光滑 Newton](optimization-pku-wenzw-lectures.md)，教材第二版 8.7–8.8 | 仅有既有目录和索引；本批未逐页阅读 | Unit 07；脚本包含随机优化比较和独立构造的标量半光滑 Newton 例 | 有限和抽样假设、方差减小速度前提、讲义中广义 Jacobian 与局部正则性；新例尚未运行 |\n| 教材第二版 7.4 流形约束优化；[ARNT](https://github.com/optsuite/ARNT)、[OptM](https://github.com/optsuite/OptM) | 章节与仓库入口已由既有资源页登记；本批未读正文/代码 | [Unit 08](optimization-pku-wenzw-study-units/08-manifold.md)、`labs/20_optimization_manifold.py` 的球面和 Stiefel 例 | 度量、QR retraction 约定、数值结果、代码版本；独立 PDF 仍未发现 |\n| [教材第二版 PDF](http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/opt2.pdf) §3.2.3 LASSO、§8.1.2 近端梯度、§8.2 FISTA | 已核正文书页 90–92／PDF 108–110、384／402、394／412；脚本损失另除以样本数 | [Unit 09 项目 A](optimization-pku-wenzw-study-units/09-applications.md)、[六组原始记录](https://github.com/Jaycob-jh/math-atlas/tree/math-changed-world/mathematics-changed-the-world/labs/records/unit09) | 单一种子近共线时系数幅值恢复差；跨种子稳定性与真实数据待验证 |\n| 同 PDF §3.3 logistic、§8.7.1 SGD、§8.7.2 应用 | 已核书页 93–94／PDF 111–112、498／516、505／523；脚本加截距、取平均损失 | [Unit 09 项目 B](optimization-pku-wenzw-study-units/09-applications.md)、同批原始记录 | 特征放大联合改变条件与相对正则作用；一般化结论待验证 |\n| 同 PDF §3.6 相位恢复 | 已核书页 100–102／PDF 118–120，式 (3.6.4)；脚本噪声与目标缩放另定 | [Unit 09 项目 C](optimization-pku-wenzw-study-units/09-applications.md)、同批原始记录 | 欠采样与高噪声联合压力失效；各因素贡献与跨种子稳定性待验证 |\n| [Optlib](https://github.com/optsuite/optlib)、[ReasBook](https://github.com/optpku/ReasBook)、[ReasLab](https://reaslab.io/) | 仅有既有资源登记；本批未读取当前代码 | [Unit 10](optimization-pku-wenzw-study-units/10-formalization.md) | Lean/toolchain 版本、精确导入、编译日志、纸笔与机器命题一致性 |\n\nUnit 07–08 页面与脚本仍待来源和运行核验；Unit 09 项目 A–C 已有[来源页码、实际运行与失败案例](optimization-pku-wenzw-unit09-run-log.md)，但仅覆盖单一种子的合成数据；Unit 10 尚无机器编译证据。","resources":[{"label":"https://github.com/optsuite/ARNT)、[OptM](https://github.com/optsuite/OptM","url":"https://github.com/optsuite/ARNT)、[OptM](https://github.com/optsuite/OptM"},{"label":"教材第二版 PDF","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/opt2.pdf"},{"label":"六组原始记录","url":"https://github.com/Jaycob-jh/math-atlas/tree/math-changed-world/mathematics-changed-the-world/labs/records/unit09"},{"label":"https://github.com/optsuite/optlib)、[ReasBook](https://github.com/optpku/ReasBook)、[ReasLab](https://reaslab.io/","url":"https://github.com/optsuite/optlib)、[ReasBook](https://github.com/optpku/ReasBook)、[ReasLab](https://reaslab.io/"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-unit07-10-source-map.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-unit07-run-log.md","module":"最优化课程","role":"课程与讲义","title":"Unit 07｜半光滑 Newton 数值例运行记录","sections":[{"heading":"Unit 07｜半光滑 Newton 数值例运行记录","line":1,"end":4,"text":"# Unit 07｜半光滑 Newton 数值例运行记录\n\n> 本文件是待填记录，不包含脚本运行结果。教学构造见 [Unit 07](optimization-pku-wenzw-study-units/07-stochastic-nonsmooth.md)；脚本为 `labs/19_optimization_stochastic_nonsmooth.py`。参考范围为既有讲义索引主题 27 与教材第二版 8.8，尚未逐页核对。\n","resources":[]},{"heading":"解析基准","line":5,"end":10,"text":"## 解析基准\n\n标量 LASSO 目标 $\\tfrac12(2x-1)^2+0.3|x|$ 的正半轴候选点为 $x=0.425$。方程 $H(x)=x-S_{0.03}(0.6x+0.2)=0$ 的活动区 Jacobian 为 $0.4$。这些数值由本页代数定义直接推导，**不是脚本输出**。\n\n独立失败例 $Q(x)=\\max(x,0)-1$ 在 $x_0=-1$ 处有 $Q(x_0)=-1$、导数 $0$，因此经典 Newton 线性步骤不可解。这是事先构造的退化情形，实际脚本是否按预期记录仍待检查。\n","resources":[]},{"heading":"运行时填写","line":11,"end":24,"text":"## 运行时填写\n\n| 项目 | 待填内容 |\n|---|---|\n| 日期、commit、Python/NumPy 版本 | 待运行 |\n| 命令 | `python labs/19_optimization_stochastic_nonsmooth.py --iterations 120 --csv \u003coutput.csv>` |\n| 随机种子与全部参数 | 待运行 |\n| 标量 proximal 与半光滑 Newton 的逐步 $x,|H(x)|,V_k$ | 待运行；CSV 预留 `state`、`metric` 和 `generalized_jacobian` 列 |\n| 是否到达解析基准及所需步数 | 待运行 |\n| 奇异导数例的实际停止行为 | 待运行 |\n| 原始 CSV 路径、失败日志、解释 | 待运行 |\n| 来源页码与讲义定理条件 | 待逐页核对 |\n\n本例只演示分段仿射的低维机制；不能用于比较一般半光滑 Newton 与随机优化方法的速度。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-unit07-run-log.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-unit08-run-log.md","module":"最优化课程","role":"课程与讲义","title":"Unit 08｜球面与 Stiefel 运行记录","sections":[{"heading":"Unit 08｜球面与 Stiefel 运行记录","line":1,"end":4,"text":"# Unit 08｜球面与 Stiefel 运行记录\n\n> 本文件为待填模板；本批未执行 `labs/20_optimization_manifold.py`。例子由 [Unit 08](optimization-pku-wenzw-study-units/08-manifold.md)给出；教材第二版 7.4 与 ARNT/OptM 的具体实现尚未逐项核对。以下谱值只来自脚本预设矩阵的代数结构，不是实测输出。\n","resources":[]},{"heading":"解析参考与预设失败","line":5,"end":8,"text":"## 解析参考与预设失败\n\n脚本使用 $8\\times8$ 对称矩阵，其预设特征值从 $0.5$ 到 $8.0$。球面最小值为 $0.5$；Stiefel 的 $p=2$ 最小值是最小两个特征值之和。最大特征子空间是驻点但不是最小子空间，因此固定在该点的切向梯度可能为零而目标非最小。此判断需要用实际输出检查，而不能由脚本存在代替。\n","resources":[]},{"heading":"运行时填写","line":9,"end":22,"text":"## 运行时填写\n\n| 项目 | 待填内容 |\n|---|---|\n| 日期、commit、Python/NumPy 版本 | 待运行 |\n| 命令 | `python labs/20_optimization_manifold.py --iterations 120 --csv \u003coutput.csv>` |\n| 随机种子、谱、维度、步长、QR 约定 | 待运行 |\n| 球面：目标、梯度、范数约束误差 | 待运行 |\n| Stiefel：目标、梯度、正交误差、投影矩阵距离 | 待运行 |\n| 随机初值与最大特征子空间初值对照 | 待运行 |\n| 原始 CSV、失败日志、解释 | 待运行 |\n| 教材/代码来源页码与实现差异 | 待核对 |\n\n本例观察有限维对称特征问题；不推断一般流形优化算法的全局速度或 ARNT/OptM 的运行效果。","resources":[]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-unit08-run-log.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-unit09-run-log.md","module":"最优化课程","role":"课程与讲义","title":"Unit 09｜三个项目实际运行记录","sections":[{"heading":"Unit 09｜三个项目实际运行记录","line":1,"end":13,"text":"# Unit 09｜三个项目实际运行记录\n\n2026-09-27，固定种子 20260927，对项目 A、B、C 各运行基线与压力条件一次，共六个进程，退出码均为 0。运行环境：Python 3.12.14、NumPy 2.3.5；运行时脚本提交 `bda2dbb6c2d15238234df2b9dbe72d6dc7bad69e`。原始逐步 CSV 与详细来源页码见 [Unit 09 证据目录](https://github.com/Jaycob-jh/math-atlas/tree/math-changed-world/mathematics-changed-the-world/labs/records/unit09)；完整命令、stdout/stderr、脚本和 CSV 的 SHA-256、末行 JSON 另保存在本地 `I:\\Agents-workspace\\Outputs\\文再文最优化学习单元\\Unit09-runs-controlled-2026-09-27\\run-manifest.json`。下表数字均取各 CSV 最后一个记录点。\n\n| 项目 | 基线结果 | 压力结果与失败现象 |\n|---|---|---|\n| A：LASSO，250 步 | ISTA/FISTA 目标均 0.010830，相对恢复误差均 0.116，支持集差异 0 | 近共线后相对误差 0.655/0.692，支持集差异仍为 0；prox mapping 约 $1.4$–$1.5\\times10^{-6}$，小残差没有保证系数幅值恢复。早期 $\\lambda=0.015$ 探索的基线误差约 0.779。 |\n| B：logistic，40 epoch | 全梯度/SGD 训练损失 0.413843/0.413942，测试准确率均 0.842 | 一列特征放大 100 倍后，全梯度准确率 0.517，SGD 仍为 0.842；测试损失 0.704/0.707，全梯度范数 0.343/6.239，二者不能据准确率判为收敛。 |\n| C：相位恢复，250 步 | 谱/随机初值的符号不变误差均约 0.00216，目标均约 $9.87\\times10^{-5}$ | 样本数 240→24 且噪声标准差 0.02→0.3 后，误差 1.048/1.075；随机初值目标更低（0.0553 vs 0.0676），但恢复误差更高。 |\n\n**解释边界。** A 的最终近共线压力保留同一原始矩阵与观测噪声，只扰动一列；支持集指标不能衡量非零系数幅值。B 的特征放大同时改变优化几何和正则项的相对作用。C 同时改变采样数与噪声，不能拆分原因。以上均为单一种子、固定迭代预算的合成数据观察，没有跨种子不确定性估计，也没有真实数据外部验证。脚本成功退出只证明该配置完成运行。\n\n来源为文再文等《最优化：建模、算法与理论》第二版[官方草稿 PDF](http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/opt2.pdf)：A 的 LASSO 书页 90–92／PDF 108–110，近端梯度 384／402、FISTA 394／412；B 的 logistic 93–94／111–112，SGD 498／516、应用 505／523；C 的相位恢复 100–102／118–120。教材与脚本的损失缩放、截距及噪声约定差异详见[项目页](optimization-pku-wenzw-study-units/09-applications.md)。","resources":[{"label":"https://github.com/Jaycob-jh/math-atlas/tree/math-changed-world/mathematics-changed-the-world/labs/records/unit09)；完整命令、stdout/stderr、脚本和","url":"https://github.com/Jaycob-jh/math-atlas/tree/math-changed-world/mathematics-changed-the-world/labs/records/unit09)；完整命令、stdout/stderr、脚本和"},{"label":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/opt2.pdf)：A","url":"http://faculty.bicmr.pku.edu.cn/~wenzw/optbook/opt2.pdf)：A"}]}],"url":"https://github.com/Jaycob-jh/math-atlas/blob/1f12cee723e562f37f31b3cb13e06c1adfa59ca3/mathematics-changed-the-world/docs/courses/optimization-pku-wenzw-unit09-run-log.md"},{"path":"mathematics-changed-the-world/docs/courses/optimization-pku-wenzw.md","module":"最优化课程","role":"课程与讲义","title":"北大文再文最优化学习体系：教材、课程、代码与形式化","sections":[{"heading":"北大文再文最优化学习体系：教材、课程、代码与形式化","line":1,"end":8,"text":"# 北大文再文最优化学习体系：教材、课程、代码与形式化\n\n> 采集状态：2026-09-26（UTC+8）。\n>\n> 原始入口 `http://faculty.bicmr.pku.edu.cn/~wenzw/optbook.html` 在本次抓取中返回 502 / 暂不可访问。这里将**原站
